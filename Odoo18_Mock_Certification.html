keting/surveys/create.html"}, {"set": 1, "subject": "Website", "question": "A page's URL is changed from /services to /our-services. How do you avoid broken links and keep its search engine ranking?", "options": ["Unpublish the old page and keep the new one", "Duplicate the page so that both URLs exist", "Create a 301 redirect from /services to /our-services", "Create a custom 404 page for /services pointing to the new URL"], "answer": 2, "explanation": "Redirect 301 báo cho trình duyệt và search engine rằng trang đã chuyển vĩnh viễn, giữ thứ hạng SEO; khi đổi URL trong page properties Odoo có tùy chọn tạo redirect. Nhân bản trang tạo nội dung trùng lặp, hại SEO.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages/url_redirection.html"}, {"set": 1, "subject": "Website", "question": "A company runs two websites in one database and wants customers to use a single login on both. Which setting controls this?", "options": ["Multi-Companies", "Shared Customer Accounts", "Sign in/up at checkout", "Language selector"], "answer": 1, "explanation": "\"Shared Customer Accounts\" trong Website settings quyết định tài khoản khách hàng dùng chung cho mọi website hay riêng từng website. Multi-Companies là cấu hình công ty, không phải tài khoản khách.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/multi_website.html"}, {"set": 1, "subject": "Website", "question": "How do you make your website available in French in addition to English?", "options": ["Add French in the Website settings' Languages, then translate", "Create a second website with a French domain and copy the pages", "Change the admin user's language to French and publish the pages", "Install a French theme"], "answer": 0, "explanation": "Thêm ngôn ngữ trong mục Languages của Website settings, sau đó dịch nội dung bằng nút Translate trên website. Đổi ngôn ngữ của user chỉ ảnh hưởng giao diện backend của user đó.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/translate.html"}, {"set": 1, "subject": "Website", "question": "Where can you define a page's meta title, meta description and keywords in Odoo 18?", "options": ["In the HTML editor of the page footer", "In Website ‣ Configuration ‣ Settings, Default Meta field", "On the page, via Site ‣ Optimize SEO", "In the robots.txt file of the website"], "answer": 2, "explanation": "Hộp thoại Optimize SEO (menu Site) cho phép đặt meta title, description, keywords và ảnh chia sẻ cho từng trang. robots.txt chỉ điều khiển việc bot được crawl, không chứa meta.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages/seo.html"}, {"set": 1, "subject": "Website", "question": "A form building block must create a record instead of only sending an email. Where do you change this?", "options": ["In the Form Builder app", "Change the form's Action field in the website editor", "In Website ‣ Configuration ‣ Settings, Forms section", "In Settings ‣ Technical ‣ Email Templates, on the form's template"], "answer": 1, "explanation": "Khi chọn form trong editor, panel tùy chỉnh có field Action (Send an E-mail, Create an Opportunity, Create a Customer…) quyết định dữ liệu gửi đi đâu. Không có app Form Builder riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/web_design/building_blocks/form.html"}, {"set": 1, "subject": "Website", "question": "To comply with privacy regulations, a company needs a consent banner for cookies on its website. What should it do?", "options": ["Add a Text building block at the top of each page", "Enable \"Shared Customer Accounts\"", "Install the Social Marketing app", "Enable the \"Cookies Bar\" option in Website settings"], "answer": 3, "explanation": "Bật \"Cookies Bar\" trong Website settings để hiển thị banner xin chấp thuận cookie và có thể tùy chỉnh trong editor. Building block Text không có chức năng ghi nhận lựa chọn của người dùng.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/cookies_bar.html"}, {"set": 1, "subject": "Website", "question": "In a multi-website database, how does Odoo know which website to display to a visitor?", "options": ["From the requested domain, matched with each website's Domain", "From the visitor's IP country", "From the visitor's browser language", "It always shows the first website; others are reached through a menu"], "answer": 0, "explanation": "Mỗi website có field Domain; Odoo dựa vào domain trong request để chọn website tương ứng. Ngôn ngữ trình duyệt chỉ ảnh hưởng ngôn ngữ hiển thị.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/multi_website.html"}, {"set": 1, "subject": "eCommerce", "question": "A product exists in the Sales app but does not appear in the online shop. What is the most common reason?", "options": ["The product is not published on the website", "The product is not in any pricelist", "The product type is Service", "The product has no internal reference"], "answer": 0, "explanation": "Sản phẩm phải được Publish (nút Unpublished/Published trên trang sản phẩm hoặc field Is Published) mới hiển thị trên shop. Sản phẩm dịch vụ vẫn bán online được.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products.html"}, {"set": 1, "subject": "eCommerce", "question": "A B2B webshop wants customers to always log in before they can complete a purchase. Which Customer Accounts option should be selected?", "options": ["Shared Customer Accounts", "Mandatory (no guest checkout)", "Optional", "Disabled (buy as guest)"], "answer": 1, "explanation": "Customer Accounts có 3 lựa chọn: Optional, Disabled (buy as guest), Mandatory (no guest checkout); Mandatory bắt buộc đăng nhập để checkout. Shared Customer Accounts là tùy chọn multi-website, không liên quan checkout.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/checkout.html"}, {"set": 1, "subject": "eCommerce", "question": "Odoo can automatically email customers who left products in their cart. Which condition applies to these abandoned cart emails?", "options": ["It only works for carts above a minimum amount set in the settings", "The customer must have paid at least one previous order on the website", "It requires the Marketing Automation app and an active campaign", "It must be enabled with a delay, and the customer's email known"], "answer": 3, "explanation": "Bật \"Automatically send abandoned checkout emails\" và đặt thời gian \"Send after\" (mặc định 10 giờ); chỉ gửi được cho khách đã biết email (đăng nhập hoặc đã nhập email). Không cần Marketing Automation.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/performance.html"}, {"set": 1, "subject": "eCommerce", "question": "When a customer adds a laptop to the cart, the shop should propose a warranty extension in a pop-up. Where is the warranty configured?", "options": ["As an Optional Product on the laptop's product form", "In a pricelist rule", "As a product variant of the laptop", "As an Alternative Product"], "answer": 0, "explanation": "Optional Products hiển thị trong pop-up khi thêm sản phẩm vào giỏ. Alternative Products chỉ gợi ý sản phẩm thay thế ở cuối trang sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/cross_upselling.html"}, {"set": 1, "subject": "eCommerce", "question": "A B2C shop must display product prices including taxes. Where is this set in Odoo 18?", "options": ["In the fiscal position of the website", "On each product, in the Sales Price field", "Website ‣ Configuration ‣ Settings, Display Product Prices: Tax Included", "In Accounting ‣ Configuration ‣ Taxes, by ticking \"Included in Price\" on every tax"], "answer": 2, "explanation": "Cài đặt \"Display Product Prices\" (Tax Included/Tax Excluded) trong Website settings quyết định cách hiển thị giá trên shop. Tick \"Included in Price\" trên thuế thay đổi cách tính giá chứ không chỉ là hiển thị.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/checkout.html"}, {"set": 1, "subject": "eCommerce", "question": "A shop wants to test the Stripe checkout flow without charging real cards. What should be done?", "options": ["Use the Wire Transfer provider instead of Stripe while testing", "Create a pricelist with 0 prices for the test customers", "Set the provider's State to \"Test Mode\" with test credentials", "Disable \"Prevent Sale of Zero Priced Product\" and order at 0"], "answer": 2, "explanation": "Payment provider có State: Disabled, Enabled, Test Mode; Test Mode dùng thông tin test để thử thanh toán mà không trừ tiền thật. Wire Transfer không mô phỏng luồng thanh toán Stripe.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/payment_providers.html"}, {"set": 1, "subject": "eCommerce", "question": "Customers on the website should be able to choose between a \"Retail\" and a \"Wholesale\" pricelist. What is needed?", "options": ["Set a different fiscal position for each customer group on the website", "Enable Pricelists; make both \"Selectable\" on the website", "Create two product variants with different prices", "Create two websites"], "answer": 1, "explanation": "Khi bật Pricelists, mỗi pricelist có field Website và tùy chọn Selectable để khách tự chọn trên shop. Tạo hai website hay biến thể là không cần thiết.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/price_management.html"}, {"set": 1, "subject": "Project", "question": "In the Odoo 18 'My Tasks' view, each user can organize the tasks assigned to them in columns such as Inbox, Today, This Week and Later, without affecting how the tasks are staged in their project. What are these columns called?", "options": ["Project stages", "Task states", "Personal stages", "Kanban states"], "answer": 2, "explanation": "Personal stages là các cột riêng của từng user trong My Tasks, không làm thay đổi stage của task trong project. Project stages là stage của chính dự án, không phải của task.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 1, "subject": "Project", "question": "A project manager wants task B to be shown as blocked until task A is finished. What must be activated first?", "options": ["The Task Dependencies setting in Project ‣ Configuration ‣ Settings", "The Milestones setting", "The Sub-tasks tab on the project form", "The Recurring Tasks setting"], "answer": 0, "explanation": "Phải bật Task Dependencies trong Project ‣ Configuration ‣ Settings thì task mới có tab 'Blocked By'. Milestones dùng để đánh dấu mốc tiến độ chứ không chặn task.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 1, "subject": "Project", "question": "When is the next occurrence of a recurring task created in Odoo 18?", "options": ["Immediately when the recurring task is saved, for all future occurrences", "Every night by a scheduled action, whatever the state of the current task", "Only when a user clicks a 'Create next occurrence' button", "When the current occurrence is set to Done or Cancelled"], "answer": 3, "explanation": "Từ Odoo 17/18, lần lặp tiếp theo chỉ được tạo khi task hiện tại chuyển sang trạng thái đóng (Done hoặc Cancelled). Odoo không tạo sẵn tất cả các lần lặp tương lai.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 1, "subject": "Project", "question": "A customer should be able to see the tasks of a shared project in the portal, but must not be able to modify them. Which access mode should be chosen for this collaborator in the Share Project wizard?", "options": ["Edit", "Read", "Edit with limited access", "Invited internal users (private)"], "answer": 1, "explanation": "Chế độ Read cho phép collaborator xem task nhưng không được sửa. Edit và Edit with limited access đều cho phép chỉnh sửa task; 'Invited internal users (private)' là giá trị Visibility, không phải access mode.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/project_management/project_sharing.html"}, {"set": 1, "subject": "Project", "question": "When posting a project update in Odoo 18, which list contains only valid status values?", "options": ["Draft, In Progress, Done, Cancelled", "New, Blocked, Ready, Done", "On Track, At Risk, Off Track, On Hold, Done", "Green, Orange, Red"], "answer": 2, "explanation": "Project update trong Odoo 18 có các status On Track, At Risk, Off Track, On Hold và Done. Các phương án khác là trạng thái của task/đơn hàng hoặc màu sắc, không phải status của project update.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 1, "subject": "Project", "question": "A company wants customers to automatically receive a satisfaction rating request when one of their tasks reaches the 'Delivered' stage. Besides enabling Customer Ratings in the settings, what must be configured?", "options": ["A Rating Email Template on that stage, with ratings sent at a given stage", "A satisfaction survey linked to the project in its Settings tab, sent at that stage", "An automation rule with the 'On UI change' trigger that sends a rating email", "A milestone linked to the 'Delivered' stage, with Customer Ratings on milestones"], "answer": 0, "explanation": "Rating request được gửi khi task tới stage có cấu hình Rating Email Template, và project phải chọn gửi rating 'when reaching a given stage'. Không cần Survey hay automation rule.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 1, "subject": "Project", "question": "A service product 'Website Implementation' must, when its sales order is confirmed, create a new project and one task in it for each order line. Which value should the product's 'Create on Order' field have?", "options": ["Task", "Project & Task", "Project", "Nothing"], "answer": 1, "explanation": "'Project & Task' tạo một project cho đơn hàng và một task cho mỗi dòng SO. 'Project' chỉ tạo project (không tạo task), còn 'Task' tạo task trong một project có sẵn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 1, "subject": "Timesheets", "question": "A consulting firm wants its employees to record their time in days instead of hours. Where is this configured?", "options": ["In the employee's Working Schedule, by setting the work time in days", "Timesheets settings, Time Encoding: Encoding Method = Days", "On each project, in a Unit of Measure field of the Timesheets tab", "Inventory ‣ Configuration ‣ Units of Measure, setting Days as reference"], "answer": 1, "explanation": "Encoding Method (Hours/Days) được cấu hình trong Timesheets ‣ Configuration ‣ Settings, mục Time Encoding. Working Schedules định nghĩa giờ làm việc, không đổi đơn vị nhập timesheet.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 1, "subject": "Timesheets", "question": "In the Timesheets settings, 'Minimal Duration' is 15 minutes and 'Round up' is 15 minutes. An employee starts the timer on a task and stops it after 7 minutes. How much time is recorded?", "options": ["7 minutes", "Nothing: the entry is discarded", "10 minutes", "15 minutes"], "answer": 3, "explanation": "Thời gian dưới Minimal Duration được nâng lên mức tối thiểu (15 phút) rồi làm tròn lên theo bội số Round up, nên ghi nhận 15 phút. Timer không bỏ qua bản ghi ngắn.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 1, "subject": "Timesheets", "question": "A service product is sold with the invoicing policy 'Based on Timesheets'. Which quantity of the sales order line is invoiced?", "options": ["The delivered quantity, computed from the timesheets on the linked tasks", "The ordered quantity, invoiced in full as soon as the sales order is confirmed", "The allocated time of the related task, as planned by the project manager", "A quantity entered manually on the invoice by the accountant for each period"], "answer": 0, "explanation": "Với Based on Timesheets, delivered quantity của dòng SO được tính từ timesheet ghi trên task liên kết và đó là số lượng được xuất hóa đơn. Ordered quantity chỉ áp dụng cho Prepaid/Fixed Price.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 1, "subject": "Timesheets", "question": "What is the main consequence for an employee once their timesheets have been validated?", "options": ["They are automatically invoiced to the customer", "They disappear from the employee's grid view", "The employee can no longer modify them", "They are converted into time off requests"], "answer": 2, "explanation": "Sau khi validate, timesheet bị khóa với nhân viên thường; chỉ người có quyền cao hơn (ví dụ Administrator) mới sửa được. Validate không tự tạo hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 1, "subject": "Timesheets", "question": "Which automatic reminders can be enabled in Timesheets ‣ Configuration ‣ Settings?", "options": ["Customer Reminder and Invoice Reminder for projects", "Employee Reminder and Approver Reminder", "Project Deadline Reminder and Task Reminder", "Only an overtime reminder sent to managers"], "answer": 1, "explanation": "Timesheets có Employee Reminder (nhắc nhân viên nhập timesheet) và Approver Reminder (nhắc người duyệt validate), mỗi loại có tần suất và số ngày riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 1, "subject": "Timesheets", "question": "Time Off and Timesheets are both installed. What happens when an employee's time off request is validated?", "options": ["Nothing: the absence must be logged manually in Timesheets by the employee", "A negative timesheet is created on each of the employee's ongoing projects", "An activity is created for the manager to encode the absence in Timesheets", "Timesheets are generated on the configured time off task"], "answer": 3, "explanation": "Khi time off được duyệt, Odoo tự tạo timesheet trên task Time Off của project Internal (cấu hình trong Timesheets settings), giúp bảng chấm công đầy đủ mà không cần nhập tay.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 1, "subject": "HR", "question": "An employee is assigned to a department that has a manager. What happens to the employee's Manager field?", "options": ["Nothing: the Manager field must always be filled in manually", "The department manager is set as the employee's Coach only, not Manager", "It is filled with the department's manager, and can be changed", "The employee becomes the department manager in place of the current one"], "answer": 2, "explanation": "Khi chọn Department, Manager của nhân viên tự lấy theo manager của phòng ban và vẫn có thể sửa. Coach là trường riêng, không tự điền theo cách này.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 1, "subject": "HR", "question": "In Odoo 18, an employee has no fixed start and end times but must work 40 hours per week. How should their working schedule be configured?", "options": ["Enable 'Flexible Hours' and set 40 hours per week", "Remove the working schedule from the employee's Work Information tab", "Create a dedicated time off type for the hours not worked", "Set the schedule's Average Hour per Day to 0 and the week to 40 hours"], "answer": 0, "explanation": "Odoo 18 có tùy chọn Flexible Hours trên working schedule, chỉ cần định nghĩa tổng số giờ thay vì khung giờ cố định. Bỏ trống working schedule sẽ làm sai tính toán time off/attendance.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 1, "subject": "HR", "question": "A company wants employees to automatically earn 1.5 days of paid leave for each month worked. What should be used?", "options": ["A regular allocation renewed manually every month", "A time off type with 'Requires allocation: No Limit'", "Public holidays", "An accrual plan, used in an allocation of type Accrual"], "answer": 3, "explanation": "Accrual plan (Time Off ‣ Configuration ‣ Accrual Plans) tự cộng dồn ngày phép theo chu kỳ khi dùng trong allocation loại Accrual. Allocation thường phải cấp tay, còn No Limit thì không theo dõi số dư.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 1, "subject": "HR", "question": "A time off type must first be approved by the employee's manager and then by HR. Which 'Time Off Validation' value should be selected?", "options": ["By Time Off Officer", "By Employee's Approver and Time Off Officer", "By Employee's Approver", "No Validation"], "answer": 1, "explanation": "'By Employee's Approver and Time Off Officer' yêu cầu hai cấp duyệt: người duyệt của nhân viên rồi đến Time Off Officer. Các lựa chọn khác chỉ có một cấp hoặc không duyệt.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 1, "subject": "HR", "question": "Recruiters want a standard interview questionnaire to be used for a given job position. What should they do?", "options": ["Enable 360 Feedback in the Appraisals settings and link it to the job", "Configure skills on the job position and rate them in each interview", "Enable 'Interview Forms' and select a form on the job position", "Publish an eLearning course"], "answer": 2, "explanation": "Setting Interview Forms (dùng app Surveys) cho phép gắn form phỏng vấn vào job position để dùng cho applicant. 360 Feedback thuộc Appraisals, không phải Recruitment.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/recruitment.html"}, {"set": 1, "subject": "HR", "question": "An employee pays a business expense with the company's credit card. Which value should the expense's 'Paid By' field have?", "options": ["Company", "Employee (to reimburse)", "Customer", "Vendor"], "answer": 0, "explanation": "Chi phí trả bằng thẻ công ty chọn Paid By = Company nên không cần hoàn tiền cho nhân viên. 'Employee (to reimburse)' dùng khi nhân viên tự trả và cần được hoàn lại.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/expenses.html"}, {"set": 1, "subject": "HR", "question": "Which of the following is NOT an available Attendance Mode for the Attendances kiosk in Odoo 18?", "options": ["Barcode / RFID", "Barcode / RFID and Manual Selection", "Manual Selection", "Facial Recognition"], "answer": 3, "explanation": "Kiosk Odoo 18 có ba chế độ: Barcode / RFID, Barcode / RFID and Manual Selection và Manual Selection. Không có chế độ nhận diện khuôn mặt.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/attendances.html"}, {"set": 1, "subject": "HR", "question": "HR wants appraisals to be scheduled automatically a few months after an employee's arrival and then periodically (for example every 12 months). Where is this configured?", "options": ["Only manually, through each employee's next appraisal date", "In the Appraisals settings, Appraisals Plans section", "In a Time Off accrual plan", "On the job position in Recruitment"], "answer": 1, "explanation": "Mục Appraisals Plans trong Appraisals settings định nghĩa số tháng sau khi tuyển dụng và chu kỳ đánh giá tiếp theo để tự động lên lịch appraisal. Không cần nhập tay từng nhân viên.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/appraisals.html"}, {"set": 1, "subject": "Studio", "question": "On the sales order form, you want to display the customer's phone number (stored on the contact) without duplicating the data. Which kind of field should be added with Studio?", "options": ["A Text field filled by an automation rule", "A related field (Customer > Phone)", "A new Many2one field to Contact", "An Html field"], "answer": 1, "explanation": "Related field hiển thị giá trị từ bản ghi liên kết (Customer ‣ Phone) và luôn đồng bộ, không nhân bản dữ liệu. Field Text cập nhật bằng automation sẽ bị lệch khi dữ liệu gốc thay đổi.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 1, "subject": "Studio", "question": "An email must be sent 3 days before the 'End Date' of a custom contract record. Which automation rule trigger should be used?", "options": ["On save", "On UI change of the End Date field", "After last update, with a delay of 3 days on the record", "Based on date field (End Date), 3 days before"], "answer": 3, "explanation": "Trigger 'Based on date field' chạy theo một trường ngày với delay trước/sau. 'After last update' tính từ lần sửa cuối, không phải từ End Date.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 1, "subject": "Studio", "question": "The 'Confirm' button on purchase orders must require approval from a manager group before it is executed. Which Studio feature should be used?", "options": ["Approval rules on the button (button properties)", "'Allow visibility to groups' on the button, limited to managers", "An automation rule with the 'On deletion' trigger", "The PDF report editor"], "answer": 0, "explanation": "Studio cho phép đặt approval rules trên button; hành động chỉ chạy khi đủ phê duyệt. Giới hạn visibility chỉ ẩn nút chứ không tạo quy trình phê duyệt.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/approval_rules.html"}, {"set": 1, "subject": "Studio", "question": "When creating a new PDF report with Studio, which report types can be chosen?", "options": ["Standard, Custom, Empty", "PDF, HTML, Text", "External, Internal, Blank", "Header, Body, Footer"], "answer": 2, "explanation": "Studio tạo report mới theo ba loại: External (có header/footer công ty), Internal (header tối giản) và Blank (trống).", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/pdf_reports.html"}, {"set": 1, "subject": "Studio", "question": "When creating a new app with Studio, which suggested feature adds stages so that records can be managed in a kanban pipeline?", "options": ["Tags", "Pipeline stages", "Date range & Gantt", "Lines"], "answer": 1, "explanation": "Tùy chọn 'Pipeline stages' tạo trường stage và kanban theo stage. 'Date range & Gantt' thêm ngày bắt đầu/kết thúc cho Gantt, không tạo stage.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 1, "subject": "Studio", "question": "Each record of a custom model must be linked to several existing 'Skill' records, displayed as tags. Which field type should be added?", "options": ["Many2one", "One2many", "Selection", "Many2many (tags)"], "answer": 3, "explanation": "Many2many cho phép liên kết nhiều bản ghi và hiển thị dạng tags. Many2one chỉ chọn được một bản ghi.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 1, "subject": "Studio", "question": "With Studio, a field on a form view must be visible only to members of the Sales Manager group. Which property should be used?", "options": ["Allow visibility to groups", "Readonly", "Required", "Invisible, without any condition"], "answer": 0, "explanation": "Thuộc tính 'Allow visibility to groups' giới hạn phần tử view cho các group được chọn. Invisible không điều kiện sẽ ẩn với tất cả mọi người.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 1, "subject": "Studio", "question": "How can Studio customizations made in a test database be moved to another database?", "options": ["By copying each modified view's XML into the other database manually", "By duplicating the production database after each change", "By using Studio's Export (zip module) and importing it", "They are transferred automatically between all databases of the same company"], "answer": 2, "explanation": "Studio có chức năng Export tạo file zip module chứa customization, sau đó Import vào database khác. Customization không tự đồng bộ giữa các database.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 1, "subject": "Studio", "question": "What prefix does Odoo give by default to the technical name of a field created with Studio?", "options": ["studio_", "x_studio_", "custom_", "o_"], "answer": 1, "explanation": "Field tạo bằng Studio có tên kỹ thuật bắt đầu bằng x_studio_ (custom field luôn bắt đầu bằng x_).", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 2, "subject": "Accounting", "question": "The Lock Everything date is set to 31/12. An auditor finds an error and the accountant must post a correction dated 15/12. What is possible in Odoo 18?", "options": ["An accounting Administrator can create a lock date exception", "Any user with Invoicing rights can post the entry after confirming a warning", "Nothing: unlike the tax lock date, the Lock Everything date can never be changed", "The entry is automatically re-dated to the next fiscal year without notice"], "answer": 0, "explanation": "Lock Everything date có thể được Administrator tạo exception (được ghi lại trong chatter của công ty) hoặc gỡ bỏ. Chỉ Hard Lock date mới là không thể thay đổi.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/year_end.html"}, {"set": 2, "subject": "Accounting", "question": "A payment term offers a 2% early payment discount. The company's country requires the tax base to be reduced only if the customer actually pays early. Which 'Reduced tax' option must be selected on the payment term?", "options": ["Always (upon invoice)", "Never", "On early payment", "Based on Payment"], "answer": 2, "explanation": "'On early payment' chỉ giảm cơ sở tính thuế khi khách hàng thực sự thanh toán sớm. 'Always (upon invoice)' giảm thuế ngay trên hóa đơn bất kể khách trả lúc nào.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/cash_discounts.html"}, {"set": 2, "subject": "Accounting", "question": "An auditor requires credit notes to use a numbering sequence separate from invoices in the same Sales journal. Where is this set?", "options": ["On each credit note, edit the Reference field", "On the journal, enable 'Dedicated Credit Note Sequence'", "Create a second company dedicated to credit notes", "In Accounting settings, enable 'Credit Note Lock Date'"], "answer": 1, "explanation": "Tùy chọn Dedicated Credit Note Sequence trên journal (Advanced Settings) tạo dãy số riêng cho credit note. Sửa tay trường Reference không tạo được dãy số độc lập.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/credit_notes.html"}, {"set": 2, "subject": "Accounting", "question": "A company does not want one deferral entry per invoice. It prefers to generate deferred revenue entries in bulk at month end from the deferred revenue report. Which 'Generate Entries' option should be selected?", "options": ["On invoice/bill validation", "Manually & Grouped", "Based on Days", "Auto-post: Monthly"], "answer": 1, "explanation": "'Manually & Grouped' cho phép tạo bút toán deferral gộp, thủ công (từ báo cáo deferred). 'On invoice/bill validation' (mặc định) tạo bút toán ngay khi xác nhận từng hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/deferred_revenues.html"}, {"set": 2, "subject": "Accounting", "question": "Each time a bill from vendor 'CleanCo' is recorded, the 'Facilities' analytic account should be pre-filled automatically. What is the best way?", "options": ["A reconciliation model for CleanCo's bills", "An analytic distribution model with Partner = CleanCo", "Set the analytic plan's Applicability to 'Mandatory' for bills", "A fiscal position on CleanCo mapping accounts to Facilities"], "answer": 1, "explanation": "Analytic Distribution Models (Accounting ‣ Configuration) tự áp dụng phân bổ analytic khi thỏa điều kiện như partner, sản phẩm, tài khoản. Đặt plan là Mandatory chỉ bắt buộc nhập, không tự điền.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/analytic_accounting.html"}, {"set": 2, "subject": "Accounting", "question": "An invoice of USD 1,000 is posted when 1 USD = 0.90 EUR and paid when 1 USD = 0.92 EUR (company currency EUR). What does Odoo do at reconciliation?", "options": ["It refuses the reconciliation until the rates match", "It changes the original invoice amount to EUR 920", "It posts an exchange difference entry", "It records the difference as a tax adjustment"], "answer": 2, "explanation": "Khi đối soát hóa đơn và thanh toán ngoại tệ với tỷ giá khác nhau, Odoo tự tạo bút toán chênh lệch tỷ giá vào journal và tài khoản lãi/lỗ cấu hình ở Settings. Hóa đơn gốc không bị sửa.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/get_started/multi_currency.html"}, {"set": 2, "subject": "Accounting", "question": "Which set lists the depreciation methods available for assets in Odoo 18?", "options": ["Straight Line, Declining, Declining Then Straight Line", "Straight Line, Double Declining, Annuity", "Linear, Degressive, Manual", "Straight Line, Sum of Years' Digits, Units of Production"], "answer": 0, "explanation": "Odoo 18 hỗ trợ ba phương pháp khấu hao: Straight Line, Declining và Declining Then Straight Line. Các phương pháp như Units of Production hay Sum of Years' Digits không có sẵn.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/vendor_bills/assets.html"}, {"set": 2, "subject": "Accounting", "question": "A Belgian company wants to send structured e-invoices to its customers through the Peppol network directly from Odoo. What is needed?", "options": ["Enable Bank Synchronization and send invoices as bank transfers", "Activate 'Send by Post' (Snailmail) in the Send & Print wizard", "Export invoices as UBL XML files and upload them to the Peppol directory", "Register on Peppol in Accounting settings, then send via 'Send & Print'"], "answer": 3, "explanation": "Odoo hoạt động như access point Peppol: công ty đăng ký (Peppol EAS, Endpoint) rồi gửi hóa đơn qua tùy chọn Peppol trong 'Send & Print'. Snailmail là gửi thư giấy, không phải hóa đơn điện tử.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/electronic_invoicing.html"}, {"set": 2, "subject": "Accounting", "question": "In a follow-up level, the 'Send a Letter' and 'Send SMS Message' actions are enabled. What is required for these actions to work?", "options": ["A Peppol registration", "A dedicated follow-up journal", "In-App Purchase (IAP) credits", "The Hard Lock date"], "answer": 2, "explanation": "Gửi thư bưu điện và SMS là dịch vụ IAP nên cần có credits. Peppol dùng cho hóa đơn điện tử, không liên quan đến nhắc nợ.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments/follow_up.html"}, {"set": 2, "subject": "Accounting", "question": "A newly founded company has a first fiscal period of 18 months, after which it uses normal calendar years. How do you configure this?", "options": ["Create a new company after 18 months", "Set the Last Day of the fiscal year in Accounting settings to an 18-month date", "Set a Lock Everything date 18 months ahead", "Enable 'Fiscal Years' and create an 18-month fiscal year record"], "answer": 3, "explanation": "Với kỳ khác 12 tháng, bật Fiscal Years và tạo bản ghi fiscal year với ngày bắt đầu/kết thúc; sau đó Odoo quay lại chu kỳ mặc định theo Last Day. Last Day chỉ là ngày/tháng kết thúc năm, không định nghĩa được kỳ 18 tháng.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/year_end.html"}, {"set": 2, "subject": "Sales", "question": "A quotation template is configured with 'Online Payment' and a prepayment of 40%. What happens when a customer accepts a quotation built from this template?", "options": ["The order is confirmed and 40% is invoiced at delivery", "A vendor bill of 40% is generated", "The customer receives a 40% discount", "The customer is asked to pay 40% online to confirm the order"], "answer": 3, "explanation": "Với Online Payment và prepayment %, khách phải thanh toán trước phần trăm đó trên portal để xác nhận đơn. Không có giảm giá hay hóa đơn mua nào được tạo.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/get_paid_to_validate.html"}, {"set": 2, "subject": "Sales", "question": "On a product attribute, the 'Multi-checkbox' display type is selected. Which Variant Creation Mode is required?", "options": ["Dynamically", "Instantly", "Any mode works", "Never"], "answer": 3, "explanation": "Display type Multi-checkbox yêu cầu Variant Creation Mode = Never vì nhiều giá trị có thể được chọn cùng lúc và không tạo variant. Instantly/Dynamically tạo variant cho một giá trị mỗi thuộc tính.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/products/variants.html"}, {"set": 2, "subject": "Sales", "question": "An eCommerce company wants invoices to be created automatically when online payments are confirmed. Its products use the 'delivered quantities' invoicing policy. What is the issue?", "options": ["Automatic Invoice requires the ordered quantities policy", "Online payments require the Purchase app", "Automatic Invoice only works for orders created from quotation templates", "There is no issue; it works out of the box"], "answer": 0, "explanation": "Tài liệu Odoo 18 nêu rõ không thể dùng Automatic Invoice với chính sách lập hóa đơn theo số lượng giao. Cần chuyển sang chính sách theo số lượng đặt.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/invoicing_policy.html"}, {"set": 2, "subject": "Sales", "question": "A 20% down payment was invoiced and paid on a sales order. What happens when the final invoice is created?", "options": ["The final invoice is blocked until the down payment is cancelled", "A separate credit note for the 20% is created and must be sent", "The down payment is ignored and must be refunded to the customer", "It is deducted on the final invoice as a separate line"], "answer": 3, "explanation": "Hóa đơn cuối sẽ có dòng trừ khoản down payment đã lập hóa đơn trước đó. Không cần hoàn tiền hay tạo credit note riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/down_payment.html"}, {"set": 2, "subject": "Sales", "question": "A customer has unpaid debts and the accountant wants to completely prevent new sales orders for this customer from being created. What can be configured?", "options": ["Set the customer's fiscal position to 'Blocked'", "Remove the customer's payment term", "Enable Sale Warnings and set a 'Blocking Message' on the customer", "Archive the customer's pricelist"], "answer": 2, "explanation": "Sale Warnings cho phép đặt cảnh báo hoặc 'Blocking Message' trên khách hàng/sản phẩm; blocking chặn tiếp tục tạo đơn. Xóa payment term không ngăn được việc bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 2, "subject": "Sales", "question": "Pricelists are enabled. How can a specific pricelist be applied automatically whenever a quotation is created for a given customer?", "options": ["Set it on the customer's Sales & Purchase tab", "Set the pricelist on the sales team the customer belongs to", "Add the customer to the pricelist's Optional Products", "Pricelists can only be selected manually on each quotation"], "answer": 0, "explanation": "Pricelist gán trên form khách hàng (tab Sales & Purchase) sẽ được tự động áp dụng khi tạo báo giá cho khách đó. Optional products không liên quan đến pricelist.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/prices/pricing.html"}, {"set": 2, "subject": "Sales", "question": "A sales manager wants each team's dashboard card to show progress against a monthly revenue goal. Where is this target defined?", "options": ["In Accounting ‣ Budgets, with a budget per team", "On the sales team form, in the Invoicing Target field", "In the quotation template, as a revenue goal", "On each salesperson's employee form, in the HR Settings tab"], "answer": 1, "explanation": "Trường Invoicing Target trên Sales Team dùng để hiển thị tiến độ doanh thu trên dashboard của team. Quotation template không chứa mục tiêu doanh thu.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 2, "subject": "Sales", "question": "Salespeople need to give a percentage discount on individual quotation lines. What must be enabled?", "options": ["A pricelist with Fixed Price rules", "The 'Discounts' setting in Sales", "The 'Margins' setting, which adds a Margin column", "A Loyalty program of type Promotion"], "answer": 1, "explanation": "Bật Discounts trong Sales settings sẽ hiện cột Disc.% để giảm giá từng dòng. Margins chỉ hiển thị biên lợi nhuận, không cho phép giảm giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/prices.html"}, {"set": 2, "subject": "Sales", "question": "Which setting must be enabled in Sales to use coupons, promotions, loyalty cards and gift cards on quotations?", "options": ["Online Payment", "Pricelists", "Discounts, Loyalty & Gift Card", "Quotation Templates"], "answer": 2, "explanation": "Các chương trình coupon, promotion, loyalty, gift card và eWallet trong Sales yêu cầu bật 'Discounts, Loyalty & Gift Card'. Pricelists chỉ quản lý giá theo quy tắc.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/loyalty_discount.html"}, {"set": 2, "subject": "Purchase", "question": "3-way matching is enabled. With which Bill Control policy is it designed to work?", "options": ["Ordered quantities", "Received quantities", "Neither; it requires Purchase Agreements", "Both, without difference"], "answer": 1, "explanation": "3-way matching đảm bảo chỉ thanh toán khi đã nhận hàng nên chỉ hoạt động với chính sách Received quantities. Với Ordered quantities, hóa đơn có thể tạo trước khi nhận hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 2, "subject": "Purchase", "question": "With 3-way matching enabled, an accountant edits the quantity and price on a draft vendor bill. What does Odoo set in 'Should Be Paid'?", "options": ["Yes", "No", "Exception", "To Approve"], "answer": 2, "explanation": "Khi hóa đơn nháp bị chỉnh sửa (số lượng, giá, sản phẩm), Odoo đặt 'Exception' để cảnh báo nhưng không chặn. 'Yes' là giá trị mặc định cho hóa đơn mới, 'No' sau khi đã thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 2, "subject": "Purchase", "question": "A buyer confirms one of three alternative RFQs. A pop-up asks what to do with the others. Which choice cancels the remaining alternatives?", "options": ["Discard", "Keep Alternatives", "Lock", "Cancel Alternatives"], "answer": 3, "explanation": "'Cancel Alternatives' tự động hủy các RFQ thay thế còn lại; 'Keep Alternatives' giữ chúng mở; 'Discard' dừng việc xác nhận.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/calls_for_tenders.html"}, {"set": 2, "subject": "Purchase", "question": "A confirmed blanket order covers 1,000 units. The buyer clicks 'New Quotation' on it and confirms an order of 200 units. What is updated on the blanket order?", "options": ["The agreement quantity is reduced to 800 and a new agreement is created", "The blanket order is closed", "Nothing; blanket orders are not linked to RFQs", "The Ordered quantity on the agreement line increases by 200"], "answer": 3, "explanation": "RFQ tạo từ blanket order được liên kết với thỏa thuận và số lượng đặt sẽ cập nhật cột Ordered. Thỏa thuận vẫn mở cho các lần đặt tiếp theo.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/blanket_orders.html"}, {"set": 2, "subject": "Purchase", "question": "Which Purchase setting must be enabled to use blanket orders and to create alternative RFQs?", "options": ["Vendor Pricelists", "Purchase Order Approval", "Purchase Agreements", "Lock Confirmed Orders"], "answer": 2, "explanation": "Bật Purchase Agreements (Purchase ‣ Configuration ‣ Settings, mục Orders) cho phép dùng blanket order và tạo RFQ thay thế. Purchase Order Approval chỉ liên quan đến duyệt đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/agreements.html"}, {"set": 2, "subject": "Purchase", "question": "A company wants purchase orders to be automatically locked after confirmation so that they cannot be modified anymore. Which setting should be enabled?", "options": ["Lock Confirmed Orders", "Purchase Order Approval", "3-way matching", "Receipt Reminder"], "answer": 0, "explanation": "Lock Confirmed Orders khóa PO sau khi xác nhận (vẫn có thể Unlock nếu có quyền). Purchase Order Approval chỉ yêu cầu duyệt trước khi xác nhận.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/manage.html"}, {"set": 2, "subject": "Purchase", "question": "An accountant creates a vendor bill manually and wants to fill its lines from an existing purchase order. Which field on the draft bill is used?", "options": ["Auto-Complete", "Payment Reference", "Incoterm", "Source Document only"], "answer": 0, "explanation": "Trường Auto-Complete trên hóa đơn mua nháp cho phép chọn PO (hoặc hóa đơn cũ) để tự điền các dòng. Source Document chỉ là trường tham chiếu văn bản.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 2, "subject": "Purchase", "question": "In the Replenishment report (Inventory ‣ Operations ‣ Replenishment), what does the 'Order Once' button do?", "options": ["It confirms all draft RFQs of the line's preferred vendor", "It orders once for that line, without keeping the rule", "It sets the reordering rule to Manual trigger forever", "It creates a blanket order"], "answer": 1, "explanation": "Order Once thực hiện bổ sung hàng một lần (tạo RFQ/MO) cho dòng đó mà không lưu thành quy tắc vĩnh viễn. Không tạo blanket order.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment.html"}, {"set": 2, "subject": "Spreadsheet", "question": "From a pivot view in the Sales app, a user clicks 'Insert in Spreadsheet' and chooses an existing spreadsheet. Where is the pivot placed?", "options": ["In a new dashboard in the Dashboards app", "In a separate .xlsx file attached to the spreadsheet", "On the currently selected cell of the first sheet", "On a new sheet of that spreadsheet"], "answer": 3, "explanation": "Pivot được chèn vào một sheet mới và panel thuộc tính pivot mở ở bên phải. Không tạo dashboard hay file xlsx.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 2, "subject": "Spreadsheet", "question": "A list of 80 customers was inserted into a spreadsheet. Next week, 15 new customers are created in Odoo. What happens in the spreadsheet?", "options": ["The list does not grow; rows must be added manually", "The list automatically grows to 95 rows on next refresh", "The 15 new customers replace the 15 oldest rows of the list", "The spreadsheet shows an error until it is re-inserted"], "answer": 0, "explanation": "List đã chèn có số dòng cố định và không tự mở rộng khi có bản ghi mới; cần thêm dòng thủ công hoặc chèn dư dòng từ đầu.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 2, "subject": "Spreadsheet", "question": "A date global filter was added to a spreadsheet that contains two pivots and a list, but only one pivot reacts to it. What is the most likely cause?", "options": ["Its field matching is missing for the other data sources", "Global filters only apply to the first sheet of a spreadsheet", "Lists and pivots cannot share a filter", "The spreadsheet must be saved as a template first"], "answer": 0, "explanation": "Mỗi data source phải được 'field matching' với một trường phù hợp thì global filter mới áp dụng; thiếu matching thì data source đó không được lọc. Global filter áp dụng cho mọi sheet.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/global_filters.html"}, {"set": 2, "subject": "Spreadsheet", "question": "An editor wants to mark the state of a budget spreadsheet before major changes so it can be restored later. Which feature should be used?", "options": ["Data ‣ Refresh all data", "File ‣ See version history, then name the version", "File ‣ Save as template, then restore it from the template list", "Freeze and share"], "answer": 1, "explanation": "Version history cho phép xem các phiên bản trước, đặt tên phiên bản quan trọng, khôi phục hoặc tạo bản sao. Save as template tạo mẫu mới, không theo dõi lịch sử.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/get_started.html"}, {"set": 2, "subject": "Spreadsheet", "question": "A user selects File ‣ Add to dashboard on a spreadsheet. What happens?", "options": ["The spreadsheet is frozen and shared publicly", "It becomes a dashboard in the Dashboards app and leaves Documents", "Only the charts are copied to the dashboard", "A link to the spreadsheet is pinned on the user's home screen; the spreadsheet stays in Documents"], "answer": 1, "explanation": "Add to dashboard chuyển spreadsheet thành dashboard (chọn tên, section, access groups), tab đầu tiên là giao diện chính và spreadsheet bị gỡ khỏi Documents.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/get_started.html"}, {"set": 2, "subject": "Spreadsheet", "question": "Which Odoo spreadsheet function returns the total balance of given accounts over a period, e.g. for a custom P&L?", "options": ["ODOO.CURRENCY.RATE", "ODOO.LIST", "ODOO.BALANCE", "PIVOT.HEADER"], "answer": 2, "explanation": "ODOO.BALANCE(account_codes, date_range, ...) trả về số dư của các tài khoản trong kỳ. ODOO.CURRENCY.RATE chỉ trả về tỷ giá giữa hai tiền tệ.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/functions.html"}, {"set": 2, "subject": "Inventory", "question": "A warehouse is configured with Outgoing Shipments = 'Pick, Pack, then Deliver (3 steps)'. What is the flow of goods?", "options": ["Stock → Quality Control → Output → Customer", "Packing Zone → Stock → Output → Customer", "Stock → Packing Zone → Output → Customer", "Stock → Output → Packing Zone → Customer"], "answer": 2, "explanation": "Giao hàng 3 bước: Pick (Stock → Packing Zone), Pack (Packing Zone → Output), rồi Delivery (Output → Customer). Thứ tự Output trước Packing là sai.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "Where can a removal strategy be defined in Odoo 18?", "options": ["On the product category and on the location", "Only on the product form", "On the operation type", "Only on the warehouse form"], "answer": 0, "explanation": "Removal strategy được cấu hình trên Product Category (Force Removal Strategy) và trên Location. Product form và Warehouse không có trường này.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "A company wants every confirmed sales order of a custom product to trigger a purchase, regardless of stock. The 'Replenish on Order (MTO)' route cannot be selected on the product. What is the most likely reason?", "options": ["MTO can only be set on the product category, not on the product", "The MTO route is archived by default and must be unarchived", "The MTO route only exists when the Manufacturing app is installed", "The Dropshipping setting must be enabled first in Purchase settings"], "answer": 1, "explanation": "Trong Odoo 18, route 'Replenish on Order (MTO)' bị archive mặc định; cần bật Multi-Step Routes để thấy menu Routes rồi unarchive nó. MTO không phụ thuộc Manufacturing hay Dropshipping.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "A pharmaceutical company receives 500 units of a medicine produced in the same production batch and must be able to recall that batch. Which tracking is most appropriate?", "options": ["By Lots", "By Unique Serial Number", "Consignment (owner on stock)", "By Quantity, using packages"], "answer": 0, "explanation": "Lot dùng để nhóm nhiều đơn vị cùng một batch sản xuất, phù hợp cho thu hồi theo lô. Serial number yêu cầu mã riêng cho từng đơn vị, không cần thiết và rất nặng nề cho 500 đơn vị.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "With the FEFO removal strategy, which date of a lot determines which lot is picked first?", "options": ["The lot creation date", "Best Before Date", "Alert Date", "Removal Date"], "answer": 3, "explanation": "FEFO sắp xếp lot theo Removal Date (ngày phải rút hàng khỏi kho). Alert Date chỉ dùng để cảnh báo, không quyết định thứ tự lấy hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "A product uses AVCO. You have 10 units in stock at $10 each, then receive 10 more units at $20 each. What is the new unit cost?", "options": ["$10", "$20", "$15", "$12.50"], "answer": 2, "explanation": "AVCO tính bình quân gia quyền: (10×10 + 10×20) / 20 = $15. $20 là giá lần nhập cuối, không phải giá bình quân.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "Which Inventory setting must be enabled so operators can use the 'Put in Pack' button on transfers?", "options": ["Packages", "Product Packagings", "Batch, Wave & Cluster Transfers", "Consignment"], "answer": 0, "explanation": "Setting Packages cho phép đóng gói hàng vào package vật lý bằng nút Put in Pack. Product Packagings chỉ định nghĩa quy cách đóng gói (ví dụ thùng 12 cái) cho mua/bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "In Inventory ‣ Operations ‣ Physical Inventory, the counted quantity of a product is lower than the on-hand quantity. What happens when you apply the count?", "options": ["The on-hand quantity is overwritten without creating any stock move", "A stock move to the Inventory adjustment location is created", "A return picking to the main vendor is generated for the difference", "A scrap order is created automatically for the missing quantity"], "answer": 1, "explanation": "Khi Apply, Odoo tạo stock move giữa location kho và virtual location Inventory adjustment cho phần chênh lệch, giữ được lịch sử. Không tạo scrap hay trả hàng nhà cung cấp.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "In Odoo 18, what distinguishes a wave transfer from a batch transfer?", "options": ["Wave transfers can only be used for receipts", "Wave transfers can only group transfers from different warehouses", "Batch transfers require the Barcode app, wave transfers do not", "Waves group individual lines; batches group whole transfers"], "answer": 3, "explanation": "Wave transfer gom các dòng sản phẩm (move lines) từ nhiều phiếu, còn batch transfer gom nguyên phiếu. Cả hai đều thuộc setting Batch, Wave & Cluster Transfers và không bắt buộc dùng Barcode.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "A warehouse scans barcodes that encode the product, lot number and expiration date in a single barcode. Which barcode nomenclature should be selected in the Barcode settings?", "options": ["Code 39 Nomenclature", "GS1 Nomenclature", "EAN-8 Nomenclature", "Default Nomenclature"], "answer": 1, "explanation": "GS1 dùng Application Identifiers để mã hóa nhiều thông tin (sản phẩm, lot, hạn dùng, số lượng) trong một mã vạch. Default Nomenclature chỉ nhận dạng đơn giản theo pattern, không tách được nhiều trường.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Manufacturing", "question": "A vendor assembles one of your products using components that you send to them. How do you model this in Odoo 18?", "options": ["Create a work center named after the vendor in a regular BoM", "Put the Dropship route on the components and buy the product", "Create a Kit BoM and buy the finished product from the vendor", "A 'Subcontracting' BoM with the vendor as subcontractor"], "answer": 3, "explanation": "BoM loại Subcontracting với subcontractor giúp Odoo theo dõi component gửi đi và thành phẩm nhận về. Kit BoM không có khái niệm gia công thuê ngoài.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "A T-shirt template has Red and Blue variants. You want a single BoM where only the Red variant uses red fabric. What should you use?", "options": ["A second BoM, of type Kit, for the Red variant", "'Apply on Variants' on the BoM component line", "A separate product category for each color of the T-shirt", "An engineering change order (ECO) for each variant"], "answer": 1, "explanation": "Trường Apply on Variants trên dòng component cho phép một BoM dùng chung cho template nhưng component khác nhau theo biến thể. ECO dùng để quản lý thay đổi phiên bản BoM, không để phân biệt biến thể.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "When a work center is fully booked, Odoo should plan work orders on another, equivalent work center. Where is this configured?", "options": ["The Manufacturing Readiness field on the BoM", "The Time Efficiency field on the work center", "The 'Alternative Workcenters' field on the work center", "The Work Order Dependencies setting"], "answer": 2, "explanation": "Alternative Workcenters cho phép Odoo dời work order sang work center thay thế khi work center chính bận. Time Efficiency chỉ điều chỉnh thời lượng dự kiến.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "Only managers should be able to close a manufacturing order when the consumed component quantities differ from the BoM. How do you configure the BoM?", "options": ["Set 'Flexible Consumption' to 'Allowed with warning'", "Set 'Manufacturing Readiness' to 'When all components are available'", "Set 'Flexible Consumption' to 'Blocked'", "Tick 'Highlight Consumption' on the components"], "answer": 2, "explanation": "Flexible Consumption = Blocked chỉ cho manager đóng MO khi lượng tiêu thụ khác BoM. 'Allowed with warning' vẫn cho mọi user đóng MO, chỉ hiện cảnh báo.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "In the PLM app, what happens when an ECO that revises a BoM is applied?", "options": ["The previous BoM is permanently deleted", "The new BoM version becomes active and the previous version is archived", "Both BoM versions remain active and are used alternately", "All ongoing manufacturing orders are updated with the new components"], "answer": 1, "explanation": "Khi Apply Changes, phiên bản BoM mới được kích hoạt và bản cũ bị archive để giữ lịch sử. Các MO đang chạy không tự động đổi component.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "A quality check must be performed at a specific step of production. Where do you create it?", "options": ["On the BoM, in the By-products tab", "On the product form, in the Inventory tab", "On the work center form, in the Capacity and Efficiency section", "In Quality ‣ Control Points, on a manufacturing operation"], "answer": 3, "explanation": "Control Point định nghĩa khi nào và ở đâu tạo quality check (operation type, operation trên work order). Product form và work center không có cấu hình kiểm tra chất lượng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "On a BoM, operation 2 must wait until operation 1 is finished, while operation 3 can run in parallel. How do you configure this?", "options": ["Enable Work Order Dependencies and set 'Blocked By' on operations", "Set Manufacturing Readiness to 'When components for 1st operation are available'", "Create three separate manufacturing orders", "Simply order the operations by sequence; Odoo always runs them in parallel otherwise"], "answer": 0, "explanation": "Work Order Dependencies cho phép khai báo Blocked By giữa các operation, nên có thể có cả bước tuần tự lẫn song song. Manufacturing Readiness chỉ quyết định khi nào MO ở trạng thái sẵn sàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "A reordering rule should automatically create manufacturing orders instead of purchase orders. What is required?", "options": ["The product must have a BoM and use the Manufacture route", "The product must have a Kit BoM", "The Master Production Schedule must be enabled for the product", "The product must have a vendor and the Buy route"], "answer": 0, "explanation": "Để reordering rule tạo MO, sản phẩm cần có BoM và route Manufacture. BoM loại Kit không bao giờ tạo MO.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Point of Sale", "question": "A manager wants to prevent cashiers from closing a session when the counted cash differs too much from the expected amount. Which setting should be used?", "options": ["Restrict Price Modifications to Managers", "Set Maximum Difference", "Cash Rounding", "Flexible Taxes"], "answer": 1, "explanation": "Set Maximum Difference quy định mức chênh lệch tiền mặt tối đa khi đóng session; vượt quá thì chỉ manager mới đóng được. Cash Rounding chỉ làm tròn số tiền thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "A shop wants VIP customers to automatically get special prices in the PoS. What should be configured?", "options": ["Flexible Taxes, with a VIP fiscal position set on VIP customers", "Use a Gift Card program for VIP customers", "Create a second Point of Sale reserved for VIP customers", "Flexible Pricelists, with a VIP pricelist on VIP customers"], "answer": 3, "explanation": "Flexible Pricelists cho phép dùng nhiều bảng giá trong PoS; pricelist gán trên khách hàng sẽ được áp dụng khi chọn khách đó. Fiscal position thay đổi thuế, không thay đổi giá bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "In a restaurant PoS, guests at the same table want to pay separately for their own dishes. Which setting must be enabled?", "options": ["Share Open Orders", "Flexible Taxes", "Allow Bill Splitting", "Tips"], "answer": 2, "explanation": "Allow Bill Splitting cho phép tách đơn theo dòng món để thanh toán riêng. Tips chỉ dùng để nhận tiền tip.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "Which PoS setting lets the cashier accept a tip, or convert the customer's change into a tip?", "options": ["Cash Rounding", "Global Discounts", "Tips", "Customer Account"], "answer": 2, "explanation": "Setting Tips (dùng một tip product) cho phép thêm tiền tip hoặc chuyển tiền thừa thành tip. Global Discounts dùng để giảm giá toàn đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "A restaurant wants customers to scan a QR code at their table to see the menu AND place orders from their phone. Which Self Ordering mode should be selected?", "options": ["Disable", "QR menu + Ordering", "Kiosk", "QR menu"], "answer": 1, "explanation": "QR menu + Ordering cho phép khách xem menu và đặt món bằng điện thoại. QR menu chỉ cho xem menu, không đặt món được.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "A shop sells non-reloadable prepaid cards that customers offer as presents and that can be used as payment until the balance is used up. Which program type should be used?", "options": ["Gift Card", "Discount Code", "Promotions", "eWallet"], "answer": 0, "explanation": "Gift Card là thẻ quà tặng trả trước, dùng thanh toán đến khi hết số dư. eWallet là ví có thể nạp lại nhiều lần nên không đúng nhu cầu thẻ quà tặng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "Fruit is sold by weight using a scale connected through an IoT box. What must be set on the product?", "options": ["Set the product type to Service and the unit to kg", "Add a product packaging of 1 kg", "Create one variant per weight (0.5 kg, 1 kg, ...)", "Tick 'To Weigh With Scale' on the product"], "answer": 3, "explanation": "Tick To Weigh With Scale để PoS lấy trọng lượng từ cân (kết nối qua IoT box) khi bán sản phẩm. Variant hay packaging không đọc được trọng lượng thực tế.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "In Odoo 18, a shop wants to show the customer display on a separate tablet, without an IoT box. Which Customer Facing Display option should be selected?", "options": ["Another device", "None", "The same device", "An IOT-connected screen"], "answer": 0, "explanation": "Tùy chọn Another device cho phép mở customer display trên một thiết bị/trình duyệt khác mà không cần IoT box. 'An IOT-connected screen' bắt buộc có IoT box.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "CRM", "question": "A salesperson needs to belong to two different sales teams at the same time. What is required?", "options": ["Create a second user account for the salesperson", "Nothing; a user can always be in several teams by default", "Enable the \"Multi Teams\" option in CRM ‣ Configuration ‣ Settings", "Give the user the \"Administrator\" access right on Sales"], "answer": 2, "explanation": "Mặc định một salesperson chỉ thuộc một Sales Team; muốn thuộc nhiều team phải bật \"Multi Teams\". Không cần tạo thêm user hay quyền admin.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 2, "subject": "CRM", "question": "What happens when an opportunity is dragged into a pipeline stage that has \"Is Won Stage\" checked?", "options": ["The opportunity is archived", "A quotation is created automatically", "Nothing changes until the salesperson clicks \"Won\"", "The opportunity is considered won and its probability is set to 100%"], "answer": 3, "explanation": "Stage có \"Is Won Stage\" đánh dấu opportunity là thắng và đặt probability = 100%. Việc tạo báo giá là thao tác riêng (New Quotation), không tự động.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 2, "subject": "CRM", "question": "An opportunity marked as lost last month is now active again. How can the salesperson bring it back into the pipeline?", "options": ["Use the \"Lost\" filter to find it, open it, and click \"Restore\"", "Ask an administrator to restore it from the database backup", "Change its lost reason to \"Reopened\"", "Recreate it; lost opportunities cannot be recovered"], "answer": 0, "explanation": "Opportunity Lost chỉ bị archive nên có thể tìm bằng bộ lọc Lost rồi bấm Restore để đưa lại vào pipeline. Đổi Lost Reason không khôi phục bản ghi.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lost_opportunities.html"}, {"set": 2, "subject": "CRM", "question": "A company wants to generate new B2B leads from a database by choosing country, industry and company size. Which feature should be used?", "options": ["Mailing lists in Email Marketing", "Lead Mining (Lead Generation)", "Predictive Lead Scoring on the CRM pipeline", "Rule-Based Assignment of the sales teams"], "answer": 1, "explanation": "Lead Mining tạo lead mới từ cơ sở dữ liệu doanh nghiệp theo tiêu chí quốc gia, ngành, quy mô… và trừ IAP credits. Predictive Lead Scoring chỉ chấm điểm lead đã có.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/lead_mining.html"}, {"set": 2, "subject": "CRM", "question": "On a lead form, how does Odoo help a salesperson spot potential duplicates?", "options": ["Duplicates are blocked by a database constraint on the email field", "A red banner appears only after the lead is converted", "Duplicates are only detectable through the Lead Mining report", "A \"Similar Leads\" smart button lists matching records"], "answer": 3, "explanation": "Odoo hiển thị smart button \"Similar Leads\" khi phát hiện bản ghi trùng email/điện thoại/công ty để người dùng xem và merge. Odoo không chặn tạo trùng bằng constraint.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/convert.html"}, {"set": 2, "subject": "CRM", "question": "A company wants emails sent to sales@company.com to create opportunities in its \"Direct Sales\" team. Where is this configured?", "options": ["In the Email Alias field of the \"Direct Sales\" sales team", "In CRM ‣ Configuration ‣ Lost Reasons", "In Email Marketing ‣ Mailing Lists", "On each salesperson's user form"], "answer": 0, "explanation": "Mỗi Sales Team có Email Alias; email gửi đến alias sẽ tạo lead/opportunity thuộc team đó. Mailing Lists phục vụ gửi email marketing, không nhận email vào CRM.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/generate_from_email.html"}, {"set": 2, "subject": "CRM", "question": "Where does a manager choose which fields (e.g. country, source, tags) Predictive Lead Scoring uses, and from which date historical data is analysed?", "options": ["On each pipeline stage form, next to its Requirements", "In CRM settings, via \"Update Probabilities\"", "On the Sales Team form, in the Assignment Rules tab", "In Settings ‣ Technical ‣ Scheduled Actions, on the scoring cron"], "answer": 1, "explanation": "Trong CRM Settings, mục Predictive Lead Scoring có nút \"Update Probabilities\" để chọn các field dùng tính xác suất và ngày bắt đầu lấy dữ liệu. Stage không có cấu hình này.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lead_scoring.html"}, {"set": 2, "subject": "CRM", "question": "A company wants to automatically create leads from companies browsing its website, identified by their IP address. Which feature is used?", "options": ["Lead Mining (Lead Generation)", "The website Contact Us form", "Visits to Leads", "Rule-Based Assignment"], "answer": 2, "explanation": "\"Visits to Leads\" nhận diện công ty từ IP của khách truy cập website theo các rule cấu hình và tạo lead (tốn IAP credits). Lead Mining tìm lead từ cơ sở dữ liệu theo tiêu chí, không dựa trên lượt truy cập.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/lead_mining.html"}, {"set": 2, "subject": "Marketing", "question": "A marketer wants to email all CRM opportunities tagged \"Trade Show\" without creating a mailing list. How?", "options": ["Export the opportunities and import them into a new mailing list", "Use the \"Send message\" button in the pipeline Kanban", "Set the mailing's Recipients to \"Lead/Opportunity\" and filter on that tag", "This is impossible; mailings can only target mailing lists"], "answer": 2, "explanation": "Field Recipients của mailing cho phép chọn model khác ngoài Mailing List (Contact, Lead/Opportunity, Event Registration…) kèm bộ lọc domain. Không bắt buộc phải tạo mailing list.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 2, "subject": "Marketing", "question": "How can website visitors subscribe themselves to a newsletter mailing list?", "options": ["A Newsletter building block linked to the list", "Visitors must first create a portal account to subscribe", "Enable \"Blacklist Option when Unsubscribing\"", "Use the \"Visits to Leads\" feature in CRM"], "answer": 0, "explanation": "Building block Newsletter trên website gắn với một mailing list, khách truy cập nhập email để tự đăng ký. Blacklist Option liên quan đến việc hủy đăng ký, không phải đăng ký.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing/mailing_lists.html"}, {"set": 2, "subject": "Marketing", "question": "Which Email Marketing setting lets you group mailings, SMS and social posts into campaigns with consolidated statistics?", "options": ["Split First and Last Name", "Mailing Campaigns", "24H Stat Mailing Reports", "Dedicated Server"], "answer": 1, "explanation": "Bật \"Mailing Campaigns\" để quản lý campaign (UTM) gom nhiều mailing/SMS/bài social và xem thống kê chung. Dedicated Server chỉ chọn mail server riêng để gửi email.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 2, "subject": "Marketing", "question": "In a Marketing Automation campaign targeting contacts, what is the purpose of the \"Unicity based on\" field?", "options": ["It defines which activity of the workflow runs first", "It selects the mail server used for sending", "It sets the UTM source used to track the campaign", "It stops a person from entering the workflow twice"], "answer": 3, "explanation": "\"Unicity based on\" xác định field (vd. email) dùng để tránh một participant bị thêm vào campaign nhiều lần. Thứ tự activity do trigger và delay quyết định, không phải field này.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation/getting_started.html"}, {"set": 2, "subject": "Marketing", "question": "In a Marketing Automation workflow, which activity type should be used to update a field (e.g. add a tag) on the participant's record?", "options": ["Email", "SMS", "Server Action", "Mail: clicked"], "answer": 2, "explanation": "Activity loại Server Action chạy một hành động server (cập nhật field, thêm tag…) trên bản ghi. \"Mail: clicked\" là trigger, không phải loại activity.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation/workflow_activities.html"}, {"set": 2, "subject": "Marketing", "question": "An organiser runs the same type of workshop every month with identical tickets and reminder emails. What saves the most configuration time?", "options": ["Create an Event Template with tickets and communications", "Create a recurring calendar event for the workshop", "Configure a Marketing Automation campaign for each new workshop", "Duplicate the previous month's registrations"], "answer": 0, "explanation": "Event Template (Events ‣ Configuration ‣ Event Templates) lưu sẵn vé, lịch gửi email… và tự điền khi chọn trên event mới. Calendar recurring event không tạo vé hay đăng ký sự kiện.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/events/create_events.html"}, {"set": 2, "subject": "Marketing", "question": "A trade fair organiser wants exhibitors to book and pay for stands on the event website. Which setting should be enabled?", "options": ["Schedule & Tracks", "Community Chat Rooms", "Online Ticketing", "Booth Management"], "answer": 3, "explanation": "Booth Management cho phép định nghĩa gian hàng (booth) và bán/đặt chúng trên website. Online Ticketing bán vé cho người tham dự, không phải gian hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/events/event_booths.html"}, {"set": 2, "subject": "Marketing", "question": "When creating an SMS mailing, how do you allow recipients to stop receiving future SMS campaigns?", "options": ["Set the mailing list as private", "Tick \"Include opt-out link\" on the SMS mailing", "Enable \"Blacklist Option when Unsubscribing\" in Email Marketing", "Add \"STOP\" manually at the end of the text; Odoo has no option for this"], "answer": 1, "explanation": "SMS mailing có tùy chọn \"Include opt-out link\" để thêm link hủy đăng ký vào tin nhắn. Tùy chọn Blacklist trong Email Marketing chỉ áp dụng cho trang hủy đăng ký email.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/sms_marketing.html"}, {"set": 2, "subject": "Survey", "question": "Where do you set a time limit (in minutes) that participants have to complete a survey?", "options": ["In the survey's Options tab, by enabling the survey time limit", "On each question, in the Description tab", "In Surveys ‣ Configuration ‣ Settings", "On the invitation wizard"], "answer": 0, "explanation": "Giới hạn thời gian làm bài được bật trong tab Options của survey và nhập số phút. Từng câu hỏi không có field giới hạn thời gian (trừ chế độ live session).", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 2, "subject": "Survey", "question": "A manager wants to limit each participant to 2 attempts, but the option to limit the number of attempts is not available. Which configuration explains this?", "options": ["The survey is a certification", "The survey uses the Matrix question type on several pages", "Access is \"Anyone with the link\" without \"Require Login\"", "The survey layout is \"One page with all the questions\""], "answer": 2, "explanation": "Giới hạn số lần làm chỉ khả dụng khi Odoo nhận diện được người làm (Invited people only hoặc Require Login). Certification vẫn dùng được giới hạn attempts.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 2, "subject": "Survey", "question": "A trainer wants each participant to get a different random subset of questions from each section. Which option is used?", "options": ["Pagination: \"One page per question\"", "Scoring: \"Scoring without answers\" for each section", "Enable \"Users can go back\"", "Question Selection: \"Randomized per Section\""], "answer": 3, "explanation": "\"Randomized per Section\" chọn ngẫu nhiên số câu hỏi đã định cho từng section. Pagination chỉ thay đổi cách chia trang, không xáo trộn câu hỏi.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 2, "subject": "Survey", "question": "Which pagination options are available for a survey i
