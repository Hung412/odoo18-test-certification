<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Odoo 18 Mock Certification</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: exam-hall console — top status bar with timer, question pane + navigator rail; results as a scorecard then review list */
:root{
  --bg:#f6f4f6; --surface:#ffffff; --sunk:#efeaee; --line:#ddd3db;
  --fg:#231a21; --muted:#6c5f69;
  --accent:#6d3f63; --accent-fg:#ffffff; --accent-soft:#f1e5ee;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --bad:#b4332b; --bad-soft:#f8e2df; --warn:#a86a00; --warn-soft:#fbefd6;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17121a; --surface:#211a24; --sunk:#1b151e; --line:#3a2f3d;
  --fg:#f1eaf0; --muted:#ab9daa; --accent:#d29bc3; --accent-fg:#23141e; --accent-soft:#3a2636;
  --ok:#5fcf93; --ok-soft:#173326; --bad:#f2837a; --bad-soft:#3d1c1a; --warn:#f0b54a; --warn-soft:#3a2c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121a; --surface:#211a24; --sunk:#1b151e; --line:#3a2f3d;
  --fg:#f1eaf0; --muted:#ab9daa; --accent:#d29bc3; --accent-fg:#23141e; --accent-soft:#3a2636;
  --ok:#5fcf93; --ok-soft:#173326; --bad:#f2837a; --bad-soft:#3d1c1a; --warn:#f0b54a; --warn-soft:#3a2c12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent)}

/* ---------- Start ---------- */
.start{padding-block:40px 64px;display:grid;gap:32px}
.hero{display:grid;gap:14px;max-width:760px}
.hero h1{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rules div{background:var(--surface);padding:16px 18px;display:grid;gap:4px}
.rules b{font-family:var(--f-mono);font-size:22px}
.rules .plus{color:var(--ok)} .rules .minus{color:var(--bad)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;align-content:start}
.set h2{font-size:24px}
.set .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.set .hist{font-size:13px;color:var(--muted);min-height:20px}
.set .hist .pass{color:var(--ok);font-weight:600}.set .hist .fail{color:var(--bad);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.subjects{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--fg);border:1px solid transparent}
.resume{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.foot{color:var(--muted);font-size:12px}

/* ---------- Exam ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.bar .title{font-weight:700;font-family:var(--f-display);font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:700;padding:4px 12px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.progress{height:4px;background:var(--sunk)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-block:24px 48px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:18px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.qtext{font-size:18px;line-height:1.5;font-weight:500;margin:0}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.choice:hover{border-color:var(--accent)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice .key{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--muted)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .key{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qnav .grp{display:flex;gap:8px;flex-wrap:wrap}
.flagbtn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.counts div{background:var(--sunk);border-radius:8px;padding:8px 4px}
.counts b{display:block;font-family:var(--f-mono);font-size:18px}
.counts span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-height:46vh;overflow:auto;padding:2px}
.grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:5px;font:600 10px var(--f-mono);padding:0;position:relative}
.grid button.ans{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.grid button.cur{outline:2px solid var(--fg);outline-offset:1px}
.grid button.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:1.5px solid var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--muted)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:440px;width:100%;display:grid;gap:14px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Results ---------- */
.res{padding-block:28px 64px;display:grid;gap:28px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.verdict{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;text-align:center;border:10px solid var(--line);position:relative}
.verdict.pass{border-color:var(--ok)} .verdict.fail{border-color:var(--bad)}
.verdict b{font:800 34px var(--f-display);display:block}
.verdict span{font-size:12px;font-weight:700;letter-spacing:.1em}
.verdict.pass span{color:var(--ok)} .verdict.fail span{color:var(--bad)}
.score h2{font-size:28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px}
.stat b{font:700 20px var(--f-mono);display:block}
.stat.c b{color:var(--ok)} .stat.w b{color:var(--bad)} .stat.u b{color:var(--muted)}
.formula{font-size:13px;color:var(--muted);margin-top:10px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);margin-top:14px}
.stack i{display:block;height:100%}
.stack .c{background:var(--ok)} .stack .w{background:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
th.n{text-align:right}
tr:last-child td{border-bottom:none}
td .stack{margin:0;width:140px}
.pct.ok{color:var(--ok);font-weight:700}.pct.bad{color:var(--bad);font-weight:700}
.sec{display:grid;gap:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:999px;font-size:13px}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters select{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:12px;min-width:0}
.rv.c{border-left-color:var(--ok)} .rv.w{border-left-color:var(--bad)} .rv.u{border-left-color:var(--muted)}
.rv .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.pill.c{background:var(--ok-soft);color:var(--ok)} .pill.w{background:var(--bad-soft);color:var(--bad)} .pill.u{background:var(--sunk);color:var(--muted)}
.rv p.q{margin:0;font-weight:500}
.rv ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rv li{padding:8px 12px;border-radius:6px;border:1px solid var(--line);display:grid;grid-template-columns:24px 1fr auto;gap:8px;font-size:14px}
.rv li.right{background:var(--ok-soft);border-color:var(--ok)}
.rv li.picked{background:var(--bad-soft);border-color:var(--bad)}
.rv li small{font-weight:700;font-size:11px;align-self:center}
.rv li.right small{color:var(--ok)} .rv li.picked small{color:var(--bad)}
.explain{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:14px}
.explain b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.empty{color:var(--muted);padding:20px;text-align:center}

/* ---------- Ảnh chụp giao diện mô phỏng (câu hỏi có hình) ----------
   Luôn hiển thị như ảnh chụp màn hình Odoo sáng, không đổi theo theme trang. */
.shot{margin:0;display:grid;gap:6px;min-width:0}
.shot-in{border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.shot figcaption{font-size:12px;color:var(--muted)}
.ox{--p:#714b67;--t:#017e84;--tx:#374151;--mu:#6b7280;--bd:#d8dadd;--bg:#f9fafb;color:var(--tx);background:#fff;font:13px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-width:520px;position:relative;color-scheme:light}
.ox *{box-sizing:border-box}
.ox-nav{display:flex;align-items:center;gap:18px;padding:8px 14px;background:#f1f2f4;border-bottom:1px solid var(--bd)}
.ox-nav .ox-app{font-weight:700}
.ox-nav span{color:var(--tx)}
.ox-cp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ox-cp>div{display:flex;align-items:center;gap:8px}
.ox-bc{font-size:15px}.ox-bc a{color:var(--t);text-decoration:none}.ox-bc b{font-weight:600}
.ox-search{border:1px solid var(--bd);border-radius:4px;padding:4px 8px;min-width:200px;color:var(--mu);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ox-facet{background:#e7e9ed;border-radius:3px;padding:0 6px;color:var(--tx);font-size:12px}
.ox-views{display:flex;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.ox-views span{padding:3px 8px;color:var(--mu);border-left:1px solid var(--bd)}.ox-views span:first-child{border-left:0}
.ox-views .on{background:#e7e9ed;color:var(--tx)}
.ox-pager{color:var(--mu);font-size:12px}
.ox-btn{display:inline-block;border:1px solid var(--bd);background:#f3f4f6;color:var(--tx);border-radius:4px;padding:4px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.ox-btn.ox-primary{background:var(--p);border-color:var(--p);color:#fff}
.ox-btn.ox-link{background:none;border-color:transparent;color:var(--t)}
.ox-btn.ox-danger{background:#fff;border-color:#d44c59;color:#d44c59}
.ox-body{padding:14px;background:var(--bg)}
.ox-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ox-bar>div{display:flex;gap:6px;flex-wrap:wrap}
.ox-status{display:flex;border:1px solid var(--bd);border-radius:4px;overflow:hidden;background:#fff}
.ox-status span{padding:4px 12px 4px 16px;color:var(--mu);font-size:12px;position:relative;border-left:1px solid var(--bd)}
.ox-status span:first-child{border-left:0;padding-left:12px}
.ox-status .on{background:#e6f2f3;color:var(--t);font-weight:600}
.ox-sheet{background:#fff;border:1px solid var(--bd);border-radius:4px;padding:16px 20px;position:relative;overflow:hidden}
.ox-smarts{display:flex;justify-content:flex-end;flex-wrap:wrap;margin:-16px -20px 12px;border-bottom:1px solid var(--bd)}
.ox-smart{padding:6px 14px;border-left:1px solid var(--bd);display:flex;flex-direction:column;line-height:1.2;font-size:12px;color:var(--mu)}
.ox-smart b{color:var(--tx);font-size:14px}
.ox-title{font-size:24px;font-weight:600;margin:0 0 12px}
.ox-title small{display:block;font-size:12px;color:var(--mu);font-weight:400}
.ox-fields{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.ox-f{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:3px 0;align-items:baseline}
.ox-f .l{font-weight:600}
.ox-f .v{border-bottom:1px solid var(--bd);min-height:20px;padding-bottom:1px}
.ox-f .v.ro{border-bottom-color:transparent}
.ox-f .v.req{background:#fffbe6}
.ox-tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:14px 0 8px}
.ox-tabs span{padding:5px 12px;color:var(--mu);border:1px solid transparent;border-bottom:0;border-radius:4px 4px 0 0}
.ox-tabs .on{color:var(--tx);border-color:var(--bd);background:#fff;margin-bottom:-1px}
.ox-ribbon{position:absolute;top:18px;right:-34px;transform:rotate(45deg);width:140px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;background:#d44c59;padding:3px 0;text-transform:uppercase}
.ox-ribbon.ok{background:#28a745}.ox-ribbon.info{background:#17a2b8}
.ox-chatter{border-top:1px solid var(--bd);margin-top:12px;padding-top:10px;display:grid;gap:8px}
.ox-chatter .ox-cbar{display:flex;gap:6px;flex-wrap:wrap}
.ox-msg{display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:12px}
.ox-msg .who{font-weight:600}.ox-msg .when{color:var(--mu);margin-left:6px}
.ox-note{background:#f5f0f3;border-radius:4px;padding:4px 8px}
table.ox-list{border-collapse:collapse;width:100%;background:#fff;font-size:13px}
.ox table{min-width:0}
.ox th,.ox td{text-transform:none;letter-spacing:normal;font-family:inherit;font-size:13px;color:var(--tx)}
.ox th{background:#fff}
.ox-list th{text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--bd);background:#fff;white-space:nowrap}
.ox-list td{padding:5px 8px;border-bottom:1px solid #eef0f2}
.ox-list td.n,.ox-list th.n{text-align:right;font-variant-numeric:tabular-nums}
.ox-list tr.grp td{background:#f3f4f6;font-weight:600}
.ox-list tr.sel td{background:#e6f2f3}
.ox-list tr.muted td{color:#9ca3af}
.ox-list tfoot td{font-weight:600;border-top:1px solid var(--bd)}
.ox-cb{display:inline-block;width:14px;height:14px;border:1px solid #9ca3af;border-radius:3px;vertical-align:-2px;background:#fff}
.ox-cb.on{background:var(--t);border-color:var(--t);box-shadow:inset 0 0 0 2px #fff}
.ox-toggle{display:inline-block;width:28px;height:16px;border-radius:8px;background:#ced4da;position:relative;vertical-align:-3px}
.ox-toggle::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff}
.ox-toggle.on{background:var(--t)}.ox-toggle.on::after{left:14px}
.ox-badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#e7e9ed;color:var(--tx)}
.ox-badge.ok{background:#d4edda;color:#1e6b31}.ox-badge.warn{background:#fff3cd;color:#8a6100}.ox-badge.bad{background:#f8d7da;color:#9b1c28}.ox-badge.info{background:#d1ecf1;color:#0c5460}
.ox-tag{display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;background:#e7e9ed;margin:1px 2px 1px 0}
.ox-tag.c1{background:#f8d7da}.ox-tag.c2{background:#ffe5cc}.ox-tag.c3{background:#fff3cd}.ox-tag.c4{background:#d4edda}.ox-tag.c5{background:#d1ecf1}.ox-tag.c6{background:#e2d9f3}
.ox-kanban{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--bg)}
.ox-col{width:200px;flex:none;display:grid;gap:8px}
.ox-colh{display:flex;justify-content:space-between;font-weight:600}
.ox-colh small{color:var(--mu);font-weight:400}
.ox-prog{display:flex;height:5px;border-radius:3px;overflow:hidden;background:#e7e9ed}
.ox-prog i{display:block;height:100%}.ox-prog .g{background:#28a745}.ox-prog .o{background:#f0ad4e}.ox-prog .r{background:#d44c59}.ox-prog .x{background:#adb5bd}
.ox-card{background:#fff;border:1px solid var(--bd);border-radius:4px;padding:8px 10px;display:grid;gap:4px;font-size:12px;position:relative}
.ox-card .t{font-weight:600;font-size:13px}
.ox-card .s{color:var(--mu)}
.ox-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.ox-card .foot>span{display:flex;gap:6px;align-items:center}
.ox-stars{color:#d1d5db;letter-spacing:1px}.ox-stars b{color:#f3c623;font-weight:400}
.ox-act{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #9ca3af;position:relative}
.ox-act::after{content:"";position:absolute;left:5px;top:2px;width:2px;height:5px;background:currentColor;box-shadow:2px 3px 0 -0px transparent}
.ox-act.late{border-color:#d44c59;color:#d44c59}.ox-act.today{border-color:#f0ad4e;color:#f0ad4e}.ox-act.planned{border-color:#28a745;color:#28a745}.ox-act.none{color:#9ca3af}
.ox-av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#a0789a;color:#fff;font-size:10px;font-weight:700}
.ox-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#adb5bd}
.ox-dot.ok{background:#28a745}.ox-dot.warn{background:#f0ad4e}.ox-dot.bad{background:#d44c59}
.ox-settings{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;padding:12px 14px;background:#fff}
.ox-sh{grid-column:1/-1;font-weight:700;background:#f3f4f6;padding:5px 10px;margin:8px -14px 4px}
.ox-set{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 0}
.ox-set .t{font-weight:600}.ox-set .d{color:var(--mu);font-size:12px}
.ox-set .sub{margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.ox-set .ox-btn.ox-link{padding:0}
.ox-dialog{max-width:460px;margin:20px auto;background:#fff;border:1px solid var(--bd);border-radius:6px;box-shadow:0 6px 24px rgb(0 0 0 / .15)}
.ox-dialog .h{padding:10px 14px;border-bottom:1px solid var(--bd);font-weight:600;display:flex;justify-content:space-between}
.ox-dialog .b{padding:14px;display:grid;gap:8px}
.ox-dialog .f{padding:10px 14px;border-top:1px solid var(--bd);display:flex;gap:6px}
.ox-mark{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e11d48;color:#fff;font-size:11px;font-weight:700;box-shadow:0 0 0 2px #fff;vertical-align:middle;margin:0 3px}
.ox-hl{outline:2px solid #e11d48;outline-offset:2px;border-radius:3px}
.ox-mu{color:var(--mu)}.ox-ok{color:#1e6b31}.ox-bad{color:#b4202f}.ox-teal{color:var(--t)}

@media (max-width:860px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .grid{max-height:none}
  .score{grid-template-columns:1fr;justify-items:start}
}
@media (max-width:480px){
  .qcard{padding:16px}.qtext{font-size:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .timer{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>

<script>
const QBANK = [{"set": 1, "subject": "Accounting", "question": "After closing the fiscal year, a company must guarantee that entries up to the year end can NEVER be modified again, not even by an administrator, to comply with local inalterability rules. Which lock date should be set in Accounting ‣ Accounting ‣ Lock Dates?", "options": ["Hard Lock date", "The 'Locked' checkbox on each journal", "Tax Return lock date", "Lock Everything date"], "answer": 0, "explanation": "Hard Lock date là khóa không thể đảo ngược, không ai (kể cả admin) có thể thay đổi hay tạo ngoại lệ. Lock Everything date vẫn cho phép Administrator tạo exception hoặc gỡ bỏ nên không đáp ứng yêu cầu bất biến.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/year_end.html"}, {"set": 1, "subject": "Accounting", "question": "A Belgian company sells to customers in other EU countries and wants Odoo to apply the correct fiscal position on invoices without the salesperson selecting it manually. What must be configured on the fiscal position?", "options": ["Enable 'Detect Automatically' with criteria such as country group", "Assign the fiscal position on each product's Accounting tab so it follows the product", "Create a tax group per country and link it to the customer's Accounting tab", "Set the fiscal position as the default on the Sales journal used for EU invoices"], "answer": 0, "explanation": "Khi bật Detect Automatically và khai báo điều kiện (quốc gia/nhóm quốc gia, VAT Required...), Odoo tự chọn fiscal position theo địa chỉ khách hàng. Fiscal position không được gán trên sản phẩm hay journal.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes/fiscal_positions.html"}, {"set": 1, "subject": "Accounting", "question": "A company must declare VAT only when customer invoices are actually paid. Which tax configuration achieves this in Odoo?", "options": ["Create a fiscal position mapping the tax to a 0% tax until the invoice is paid", "Set the tax's computation to 'Fixed' and use a payment term of 'Immediate Payment'", "Enable Cash Basis and set the tax's Tax Exigibility to 'Based on Payment'", "Mark the tax as 'Included in Price'"], "answer": 2, "explanation": "Thuế cash basis (Tax Exigibility = Based on Payment) chỉ ghi nhận vào tài khoản thuế thực tế khi hóa đơn được thanh toán/đối soát, trước đó nằm ở tài khoản chuyển tiếp. Thuế 'Included in Price' chỉ ảnh hưởng cách tính giá, không ảnh hưởng thời điểm kê khai.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes/cash_basis.html"}, {"set": 1, "subject": "Accounting", "question": "A customer is invoiced once for a 12-month maintenance contract. The revenue must be recognized month by month. In Odoo 18, what do you fill on the invoice line to trigger the deferred revenue entries?", "options": ["A recurring 'Auto-post' value of Monthly on the invoice", "An analytic distribution with 12 analytic accounts", "A payment term with 12 monthly installments", "The Start Date and End Date of the line"], "answer": 3, "explanation": "Odoo tạo bút toán deferred revenue dựa trên Start Date và End Date trên dòng hóa đơn (tài khoản/journal deferred cấu hình trong Accounting ‣ Configuration ‣ Settings). Payment term nhiều đợt chỉ chia hạn thanh toán, không phân bổ doanh thu.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/deferred_revenues.html"}, {"set": 1, "subject": "Accounting", "question": "The controller wants every vendor bill line to carry a value for the 'Departments' analytic plan, and Odoo must refuse to post a bill without it. How is this configured?", "options": ["Create an analytic distribution model with no conditions for vendor bills", "Set the plan's Applicability to 'Mandatory' for the Vendor Bill domain", "On the expense accounts, tick 'Allow Reconciliation' so lines need a plan", "On the purchase journal, enable 'Analytic required' in Advanced Settings"], "answer": 1, "explanation": "Applicability của analytic plan (Optional/Mandatory/Unavailable) theo từng domain như Vendor Bill quyết định có bắt buộc phân tích hay không. Analytic distribution model chỉ tự điền gợi ý, không chặn việc post.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/analytic_accounting.html"}, {"set": 1, "subject": "Accounting", "question": "A company's terms are '30% due on the invoice date, the balance 60 days later'. How is this handled in Odoo?", "options": ["A payment term with two lines: 30% at 0 days and 70% at 60 days", "Use a down payment product for 30% on the invoice, then a second invoice", "Set a follow-up level at 60 days for the remaining 70%", "Create two separate invoices with different payment terms"], "answer": 0, "explanation": "Payment term có thể gồm nhiều dòng phần trăm với số ngày khác nhau, Odoo sẽ tạo nhiều dòng phải thu với các ngày đến hạn tương ứng. Follow-up level chỉ dùng để nhắc nợ, không chia hạn thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/payment_terms.html"}, {"set": 1, "subject": "Accounting", "question": "A posted customer invoice contains a wrong unit price. The accountant wants to cancel it and immediately get a new draft invoice to correct, in one step. Which option of the Credit Note wizard should be used?", "options": ["Reset to Draft on the posted invoice and delete it", "Reverse and Create Invoice", "Register Payment with a write-off", "Reverse"], "answer": 1, "explanation": "'Reverse and Create Invoice' tạo credit note đối trừ toàn bộ hóa đơn gốc và đồng thời tạo một hóa đơn nháp mới để sửa. 'Reverse' chỉ tạo credit note mà không tạo hóa đơn mới.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/credit_notes.html"}, {"set": 1, "subject": "Accounting", "question": "Where do you configure the number of days after the due date at which a payment reminder is sent, and whether it is sent by email, SMS or post?", "options": ["Accounting ‣ Configuration ‣ Payment Terms", "Accounting ‣ Configuration ‣ Journals ‣ Advanced Settings", "Contacts ‣ Configuration ‣ Tags", "Accounting ‣ Configuration ‣ Follow-up Levels"], "answer": 3, "explanation": "Follow-up Levels định nghĩa số ngày so với hạn thanh toán và các hành động (Email, SMS, Letter...). Payment Terms chỉ xác định ngày đến hạn chứ không gửi nhắc nợ.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments/follow_up.html"}, {"set": 1, "subject": "Accounting", "question": "A company invoices in EUR and USD and wants exchange rates updated daily without manual entry. What should be done?", "options": ["Install the Peppol module", "Enable Automatic Currency Rates with a Daily interval", "Activate the USD currency only; Odoo then updates its rate on each invoice", "Create a scheduled action on each journal to copy the latest rates"], "answer": 1, "explanation": "Automatic Currency Rates trong Accounting ‣ Configuration ‣ Settings cho phép chọn nhà cung cấp tỷ giá và tần suất cập nhật (Daily...). Chỉ kích hoạt tiền tệ thì không tự lấy tỷ giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/get_started/multi_currency.html"}, {"set": 1, "subject": "Accounting", "question": "On a 'Fixed Assets' account, the 'Automate Assets' field is set to 'Create and validate'. What is required for this to work?", "options": ["A dedicated asset journal of type Bank", "The Analytic Accounting setting on the account", "An asset model linked to the account", "A lock date on the purchase journal of the asset"], "answer": 2, "explanation": "Tùy chọn 'Create and validate' cần có Asset Model để Odoo tự tạo và xác nhận tài sản khi bút toán được ghi vào tài khoản. Với 'Create in draft', tài sản chỉ được tạo nháp và người dùng phải xác nhận thủ công.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/vendor_bills/assets.html"}, {"set": 1, "subject": "Sales", "question": "A sales manager wants reusable quotations with predefined products, validity duration and terms. Where are these created after enabling the right setting?", "options": ["Sales ‣ Products ‣ Pricelists", "Sales ‣ Configuration ‣ Quotation Templates", "Sales ‣ Orders ‣ Quotations ‣ Duplicate", "Sales ‣ Configuration ‣ Sales Teams"], "answer": 1, "explanation": "Sau khi bật Quotation Templates trong Sales settings, menu Sales ‣ Configuration ‣ Quotation Templates xuất hiện để tạo mẫu báo giá. Duplicate một báo giá không phải là mẫu tái sử dụng chính thức.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/quote_template.html"}, {"set": 1, "subject": "Sales", "question": "A company sells laptops and wants to propose a carrying case and an extended warranty as suggestions the customer can add from the online quotation. What should be used?", "options": ["Product variants with a Price Extra", "A Buy X Get Y promotion", "A kit Bill of Materials", "Optional products"], "answer": 3, "explanation": "Optional products được đề xuất trên báo giá và khách có thể tự thêm khi xem báo giá online. Variant là phiên bản của cùng một sản phẩm, không phải sản phẩm bổ sung.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/optional_products.html"}, {"set": 1, "subject": "Sales", "question": "A product uses the 'delivered quantities' invoicing policy. The order is confirmed but nothing has been delivered. What happens when the salesperson tries to create a regular invoice?", "options": ["Odoo invoices the full ordered quantity", "Odoo creates an invoice with zero lines and posts it", "Odoo creates a down payment automatically", "Odoo raises an error because there is nothing to invoice yet"], "answer": 3, "explanation": "Với chính sách theo số lượng giao, chỉ số lượng đã giao mới được xuất hóa đơn; chưa giao thì Odoo báo lỗi không có gì để lập hóa đơn. Lập hóa đơn toàn bộ số lượng đặt là hành vi của chính sách 'ordered'.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/invoicing_policy.html"}, {"set": 1, "subject": "Sales", "question": "A customer must pay 30% upfront before production starts on a confirmed sales order. What is the standard way to invoice this?", "options": ["Create a 30% pricelist for this customer and invoice the order", "Apply a 30% discount on all lines, then invoice the order", "Click Create Invoice and choose a 30% down payment", "Split the order into two sales orders of 30% and 70%"], "answer": 2, "explanation": "Wizard Create Invoice cho phép tạo down payment theo phần trăm hoặc số tiền cố định; khoản này sẽ được trừ vào hóa đơn cuối. Discount 30% làm giảm giá bán, không phải tạm ứng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/down_payment.html"}, {"set": 1, "subject": "Sales", "question": "What does enabling 'Online Signature' in the Sales settings allow?", "options": ["Customers can sign quotations online in the portal to confirm them", "Salespeople must sign each customer invoice before it can be posted", "Quotations are locked until a sales manager signs them in the backend", "Vendor bills are signed automatically with the Sign app when received"], "answer": 0, "explanation": "Online Signature cho phép khách hàng ký điện tử trên portal để xác nhận báo giá, chuyển nó thành đơn bán. Không liên quan đến việc ký hóa đơn nội bộ.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/get_signature_to_validate.html"}, {"set": 1, "subject": "Sales", "question": "A furniture company offers a desk in 10 colors × 5 sizes × 4 finishes but does not want 200 variants created in advance. Which 'Variant Creation Mode' should the attributes use so that variants are only created when they are added to a sales order?", "options": ["Never", "Instantly", "Dynamically", "On demand from the Inventory app"], "answer": 2, "explanation": "Dynamically chỉ tạo variant khi tổ hợp thuộc tính được thêm vào đơn bán. Instantly tạo ngay tất cả tổ hợp; Never không tạo variant mua bán được.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/products/variants.html"}, {"set": 1, "subject": "Sales", "question": "A prepaid service of 10 hours was invoiced on ordered quantities, but 14 hours were actually delivered. What invoice status does Odoo show on the sales order?", "options": ["Upselling Opportunity", "To Invoice", "Fully Invoiced", "Nothing to Invoice"], "answer": 0, "explanation": "Khi số lượng giao vượt số lượng đặt với sản phẩm lập hóa đơn theo ordered, Odoo đánh dấu 'Upselling Opportunity' để nhân viên bán hàng đề xuất bán thêm. 'Fully Invoiced' không phản ánh phần vượt này.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/invoicing_policy.html"}, {"set": 1, "subject": "Sales", "question": "A wholesaler wants prices automatically computed as 'cost + 20%, rounded to .99' for one customer category. Which pricelist rule computation fits best?", "options": ["Discount of -20% on the Sales Price", "Optional products on the template", "Formula based on Cost (markup + rounding)", "Fixed Price, entered manually for each product"], "answer": 2, "explanation": "Quy tắc dạng Formula cho phép dựa trên giá vốn (Cost), cộng tỷ lệ markup và làm tròn giá (vd .99). Fixed Price yêu cầu nhập giá cố định cho từng sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/prices/pricing.html"}, {"set": 1, "subject": "Sales", "question": "A company wants confirmed sales orders to be automatically locked so they can no longer be edited. Which Sales setting is used?", "options": ["Online Signature", "Lock Confirmed Sales", "Pro-Forma Invoice", "Sale Warnings"], "answer": 1, "explanation": "Lock Confirmed Sales tự khóa đơn bán sau khi xác nhận, tránh sửa đổi. Sale Warnings chỉ hiển thị cảnh báo khi chọn khách hàng/sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 1, "subject": "Purchase", "question": "A company trusts its vendor and wants to be able to create the vendor bill as soon as the purchase order is confirmed, without waiting for the receipt. Which Bill Control policy should be used?", "options": ["Ordered quantities", "Received quantities", "3-way matching", "Purchase Order Approval"], "answer": 0, "explanation": "Với Ordered quantities, hóa đơn mua có thể tạo ngay khi PO được xác nhận. Received quantities yêu cầu phải nhận hàng trước.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 1, "subject": "Purchase", "question": "When 3-way matching is enabled, which field appears on vendor bills (Other Info tab) to indicate whether the bill can be paid?", "options": ["Should Be Paid", "To Approve", "Payment Reference", "Bill Status"], "answer": 0, "explanation": "3-way matching thêm trường 'Should Be Paid' (Yes/No/Exception) trên hóa đơn mua để biết hóa đơn có nên thanh toán hay không. 'To Approve' là trạng thái của PO cần duyệt.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 1, "subject": "Purchase", "question": "A blanket order with fixed unit prices for 3 products is confirmed. What does Odoo create on those products?", "options": ["A reordering rule for each product, using the blanket order's vendor", "A sales pricelist with the same prices", "A vendor line (price, agreement) in each product's Purchase tab", "A draft purchase order for the whole agreed quantity"], "answer": 2, "explanation": "Khi xác nhận blanket order, mỗi sản phẩm có thêm dòng vendor (giá, nhà cung cấp, thỏa thuận) trong tab Purchase, phục vụ cho replenishment. Odoo không tự tạo PO cho toàn bộ số lượng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/blanket_orders.html"}, {"set": 1, "subject": "Purchase", "question": "A buyer sent RFQs for the same items to three vendors as alternatives. Which tool lets her compare offers per product and pick the best one for each line?", "options": ["The Replenishment report", "The vendor's pricelist list view", "The Purchase Analysis report", "Compare Product Lines (from the Alternatives tab)"], "answer": 3, "explanation": "Từ tab Alternatives, 'Compare Product Lines' nhóm các báo giá theo sản phẩm và cho phép Choose/Clear từng dòng. Purchase Analysis là báo cáo thống kê, không dùng để chọn báo giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/calls_for_tenders.html"}, {"set": 1, "subject": "Purchase", "question": "Purchase Order Approval is enabled with a minimum amount of 5,000. A purchase user confirms an RFQ of 7,000. What happens?", "options": ["The confirmation is refused with an error about the minimum amount", "It goes to 'To Approve' until a Purchase administrator approves it", "The RFQ is automatically split into two orders below 5,000 each", "The order is confirmed and the purchase manager receives an email"], "answer": 1, "explanation": "Với Purchase Order Approval, đơn vượt Minimum Amount chuyển sang trạng thái 'To Approve' và cần người có quyền quản trị Purchase duyệt. Đơn không bị tách hay báo lỗi.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/manage.html"}, {"set": 1, "subject": "Purchase", "question": "A company sells products shipped directly from the vendor to the customer, without passing through its warehouse. What is needed?", "options": ["Use a blanket order with the vendor", "Use the Make To Order route only, with the vendor set on the product", "Create a reordering rule with a 0 minimum on the customer location", "Enable Dropshipping and use the Dropship route on the product"], "answer": 3, "explanation": "Dropship route khiến việc xác nhận đơn bán tạo RFQ cho nhà cung cấp, hàng được giao thẳng từ vendor đến khách. MTO thuần sẽ nhập hàng về kho trước.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/dropshipping.html"}, {"set": 1, "subject": "Purchase", "question": "A product has a reordering rule with Min = 20 and Max = 100 and the Buy route. Forecasted stock drops to 15. What does Odoo propose?", "options": ["An RFQ for 5 units", "A manufacturing order for 100 units", "An RFQ for 85 units", "An RFQ for 100 units"], "answer": 2, "explanation": "Khi tồn dự báo xuống dưới Min, Odoo đặt hàng đủ để đạt Max: 100 - 15 = 85. Route Buy tạo RFQ chứ không tạo lệnh sản xuất.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/reordering_rules.html"}, {"set": 1, "subject": "Purchase", "question": "A vendor gives 10 €/unit for orders under 100 units and 8 €/unit from 100 units. How do you make Odoo pick the right price automatically on RFQs?", "options": ["Use a call for tenders with the vendor for each RFQ", "Two vendor price lines, the second with a minimum quantity of 100", "Create a pricelist with two quantity-based rules and set it on the vendor", "Apply a 20% discount manually on RFQs of 100 units or more"], "answer": 1, "explanation": "Vendor pricelist (tab Purchase của sản phẩm) hỗ trợ Quantity tối thiểu; Odoo chọn giá phù hợp theo số lượng trên RFQ. Pricelist bán hàng không áp dụng cho mua hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/products/pricelist.html"}, {"set": 1, "subject": "Spreadsheet", "question": "A user wants to insert the records of a list view into an Odoo spreadsheet. Where is this option?", "options": ["Via Documents ‣ Configuration ‣ Spreadsheet Templates, adding the list", "Via the Export button, choosing the XLSX format and opening it in Documents", "Via the Data ‣ Refresh all data menu", "Via the gear icon ‣ Spreadsheet ‣ Insert list in spreadsheet"], "answer": 3, "explanation": "Từ list view, biểu tượng Actions (bánh răng) cạnh tên view có Spreadsheet ‣ Insert list in spreadsheet. Export XLSX tạo file tĩnh, không liên kết dữ liệu Odoo.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 1, "subject": "Spreadsheet", "question": "A spreadsheet with an inserted pivot is open while new sales orders are confirmed. How can the user update the figures without leaving the spreadsheet?", "options": ["File ‣ Save as template", "Insert ‣ Link", "Data ‣ Refresh all data", "File ‣ Make a copy"], "answer": 2, "explanation": "Dữ liệu Odoo cập nhật khi mở spreadsheet, khi tải lại trang hoặc khi chọn Data ‣ Refresh all data. Make a copy chỉ nhân bản file.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 1, "subject": "Spreadsheet", "question": "Which global filter types can be added to an Odoo 18 spreadsheet?", "options": ["Date, Relation and Text", "Date, Number and Boolean", "Only Date", "Relation, Formula and Selection"], "answer": 0, "explanation": "Odoo 18 hỗ trợ ba loại global filter: Date, Relation và Text. Không có loại Formula hay Boolean.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/global_filters.html"}, {"set": 1, "subject": "Spreadsheet", "question": "A finance team built a monthly reporting spreadsheet and wants every user to start future reports from it. What should they do?", "options": ["Use File ‣ Save as template", "Download it as .xlsx and re-upload it each month", "Share it with a public link so others can copy it", "Add it to a dashboard in the Dashboards app"], "answer": 0, "explanation": "File ‣ Save as template lưu spreadsheet thành mẫu (quản lý ở Documents ‣ Configuration ‣ Spreadsheet Templates), có thể chọn khi tạo New ‣ Spreadsheet. Add to dashboard biến nó thành dashboard, không phải mẫu.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/get_started.html"}, {"set": 1, "subject": "Spreadsheet", "question": "A user wants to share a spreadsheet containing live Odoo data with an external accountant who has no Odoo account. What should be used?", "options": ["Share the spreadsheet directly; external users see live data", "Freeze and share (read-only snapshot with values)", "Use File ‣ See version history and share the latest version", "Add the spreadsheet to a dashboard and share the dashboard"], "answer": 1, "explanation": "Spreadsheet chứa dữ liệu động không thể truy cập bởi người dùng bên ngoài; 'Freeze and share' tạo bản sao chỉ đọc với giá trị tĩnh. Chia sẻ trực tiếp không hiển thị dữ liệu live cho người ngoài.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/share_collaborate.html"}, {"set": 1, "subject": "Spreadsheet", "question": "In an Odoo 18 spreadsheet, which function returns a single value from an inserted pivot table for a given measure and dimension values?", "options": ["ODOO.FILTER.VALUE", "PIVOT.HEADER", "ODOO.LIST", "PIVOT.VALUE"], "answer": 3, "explanation": "PIVOT.VALUE(pivot_id, measure_name, ...) trả về một giá trị của pivot. PIVOT.HEADER trả về tiêu đề; ODOO.LIST lấy giá trị từ list.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/functions.html"}, {"set": 1, "subject": "Inventory", "question": "A company wants its receipts to go through an input area, then a quality control area, before products are stored. What must be configured in Odoo 18?", "options": ["Enable Multi-Step Routes, then set Incoming Shipments to 3 steps on the warehouse", "Enable only the Storage Locations setting and create a Quality Control sub-location", "Create a putaway rule from WH/Input to WH/Quality Control, then to WH/Stock", "Install the Quality app; 3-step receipts are then activated automatically on every warehouse"], "answer": 0, "explanation": "Phải bật Multi-Step Routes trước, sau đó chọn Incoming Shipments = 3 steps trên form Warehouse (Inventory ‣ Configuration ‣ Warehouses). Putaway rule chỉ chuyển hướng vị trí lưu kho, không tạo thêm bước transfer.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "A food distributor has enabled Expiration Dates and wants the lots that expire soonest to be picked first for deliveries. Which removal strategy should be used?", "options": ["First Expiry, First Out (FEFO)", "First In, First Out (FIFO)", "Closest Location", "Last In, First Out (LIFO)"], "answer": 0, "explanation": "FEFO chọn lot có ngày Removal Date sớm nhất để xuất trước, dùng cho hàng có hạn sử dụng. FIFO chỉ dựa trên ngày nhập kho, không quan tâm hạn dùng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "A reordering rule has Min = 10 and Max = 50 (no packaging, multiple quantity of 1). The forecasted quantity drops to 8. How many units will Odoo propose to order?", "options": ["50", "2", "42", "10"], "answer": 2, "explanation": "Khi tồn dự báo xuống dưới Min, Odoo đặt hàng để đưa tồn dự báo lên Max: 50 − 8 = 42. Đáp án 2 chỉ đưa tồn về Min, không đúng logic min/max.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "Each laptop sold must be traceable individually (one identifier per unit). How should the product be configured?", "options": ["Enable Consignment and set a different owner for each unit received", "Set tracking to 'By Lots' and create a new lot for each receipt from the vendor", "Enable Packages and put each laptop in its own package", "Track the product 'By Unique Serial Number' (Lots & Serial Numbers enabled)"], "answer": 3, "explanation": "Serial number gắn một mã duy nhất cho từng đơn vị sản phẩm. Lot dùng cho một nhóm/batch nhiều đơn vị nên không truy xuất được từng chiếc.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "What is the effect of setting a product category's Inventory Valuation to 'Automated'?", "options": ["Receipts are blocked until the matching vendor bill has been posted", "Stock moves that affect valuation automatically generate journal entries", "Stock valuation is only recorded by a manual journal entry at the end of each period", "The costing method is automatically switched to AVCO for the category"], "answer": 1, "explanation": "Với Automated (perpetual), mỗi stock move ảnh hưởng giá trị kho sẽ tự sinh bút toán kế toán theo thời gian thực. Ghi nhận thủ công cuối kỳ là đặc điểm của chế độ Manual (periodic).", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "Products of the category 'Fasteners' received in WH/Stock must automatically be stored in WH/Stock/Shelf 2. Which feature should be used?", "options": ["A putaway rule, with Storage Locations enabled", "A reordering rule with location WH/Stock/Shelf 2", "Setting Incoming Shipments to 2 steps on the warehouse", "A removal strategy on the 'Fasteners' category"], "answer": 0, "explanation": "Putaway rule tự động chuyển hướng sản phẩm/nhóm sản phẩm vào sub-location cụ thể khi nhập kho. Removal strategy dùng cho việc lấy hàng ra (xuất kho), không phải cất hàng vào.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "What happens when you validate a scrap order for 2 units taken from WH/Stock?", "options": ["The 2 units are deleted from the database without creating any stock move", "The 2 units are moved to the virtual scrap location, out of on-hand stock", "A vendor credit note is created automatically for the 2 scrapped units", "The 2 units are moved to WH/Output so they can be returned to the vendor"], "answer": 1, "explanation": "Scrap tạo stock move từ vị trí nội bộ sang virtual location Scrap, nên số lượng không còn tính vào tồn kho nhưng vẫn truy vết được. Odoo không tự tạo trả hàng hay credit note cho nhà cung cấp.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "Landed costs (freight, customs duties) are validated on a receipt. For products using which costing method will the landed cost NOT be added to the inventory valuation?", "options": ["FIFO", "Average Cost (AVCO)", "It is added for all costing methods", "Standard Price"], "answer": 3, "explanation": "Landed costs chỉ được phân bổ vào giá trị tồn kho của sản phẩm dùng FIFO hoặc AVCO; với Standard Price giá vốn cố định nên không bị điều chỉnh. Vì vậy 'tất cả phương pháp' là sai.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "Dropshipping is enabled. A product has the Dropship route and a vendor set on its Purchase tab. What happens when a sales order for this product is confirmed?", "options": ["The vendor delivers to WH/Stock, then a delivery order ships to the customer", "An RFQ is created for the vendor, who ships directly to the customer", "A delivery order is created from WH/Stock and a PO replenishes the stock afterwards", "A manufacturing order is created to produce the product in the warehouse"], "answer": 1, "explanation": "Dropship tạo RFQ cho nhà cung cấp và hàng đi thẳng từ vendor đến khách hàng, không qua kho của công ty. Phương án giao từ WH/Stock là luồng bán hàng thông thường.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "In Odoo 18, how do you make sure the on-hand stock of a product is tracked?", "options": ["Set the Product Type to 'Storable Product'", "Set the Product Type to 'Combo'", "Set the Product Type to 'Goods' and tick 'Track Inventory'", "Set the Product Type to 'Service' and add a reordering rule"], "answer": 2, "explanation": "Từ Odoo 18, loại 'Storable Product' không còn; sản phẩm là Goods và tick Track Inventory để quản lý tồn kho. 'Storable Product' là thuật ngữ của các phiên bản cũ.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Manufacturing", "question": "A 'Gift Box' product has a BoM of type 'Kit'. What happens when a sales order for it is confirmed?", "options": ["The Gift Box is delivered from stock as a single finished product", "An RFQ is created to buy the Gift Box", "A manufacturing order is created to assemble the Gift Box before delivery", "The delivery lists the kit's components; no MO is created"], "answer": 3, "explanation": "BoM loại Kit không tạo MO; khi giao hàng Odoo thay sản phẩm kit bằng các component. Tạo MO là hành vi của BoM loại Manufacture this product.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "On a bill of materials, the Operations tab is not visible. What is the most likely reason?", "options": ["The Work Orders setting is not enabled", "The finished product is not tracked by serial number", "The Master Production Schedule setting is disabled", "The BoM type is 'Manufacture this product'"], "answer": 0, "explanation": "Tab Operations và work center chỉ xuất hiện khi bật setting Work Orders. MPS không liên quan đến việc hiển thị operations trên BoM.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "In Odoo 18, which app do operators use on a tablet at their workstation to process work orders and follow instructions?", "options": ["IoT", "Shop Floor", "Quality", "Planning"], "answer": 1, "explanation": "Odoo 18 có app Shop Floor riêng để nhân viên xưởng xử lý work order, ghi thời gian và thực hiện các bước kiểm tra. IoT chỉ dùng kết nối thiết bị phần cứng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "A sawmill produces planks and also wants to record the sawdust generated as a secondary product. Which setting must be enabled?", "options": ["By-Products", "Subcontracting", "Unlock Manufacturing Orders", "Work Order Dependencies"], "answer": 0, "explanation": "Setting By-Products thêm tab By-products trên BoM để khai báo sản phẩm phụ sinh ra trong quá trình sản xuất. Subcontracting dùng khi thuê ngoài gia công.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "A finished product was assembled by mistake and you want to dismantle it and put its components back in stock. What should you use?", "options": ["A scrap order for the finished product", "Cancel the done manufacturing order", "An unbuild order", "A return to vendor for the components"], "answer": 2, "explanation": "Unbuild order đảo ngược MO: tiêu thụ thành phẩm và trả component về kho. MO đã Done không thể hủy, còn scrap sẽ làm mất cả thành phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "A warehouse is set to 'Pick components, manufacture, then store products (3 steps)'. What does this mean?", "options": ["The MO is processed, then a quality check is done, then finished products are stored", "Components are received from the vendor, manufactured, then delivered to the customer", "Components are picked to pre-production, the MO is done, then products are stored", "Components are picked, then packed, and only then is the MO processed"], "answer": 2, "explanation": "Sản xuất 3 bước gồm: lấy component (Pick Components), sản xuất (MO), rồi chuyển thành phẩm về kho (Store Finished Product). Bước quality check không phải bước mặc định của luồng này.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "A planner wants to define, period by period, how many units to produce based on forecasted demand. Which feature should be used?", "options": ["Work center Gantt view of planned MOs", "Master Production Schedule", "Replenishment report with reordering rules", "Product Lifecycle Management (PLM)"], "answer": 1, "explanation": "Master Production Schedule (bật trong Manufacturing settings, menu Planning) cho phép lập kế hoạch sản xuất theo kỳ dựa trên dự báo nhu cầu. Replenishment report chỉ dựa trên reordering rule, không lập kế hoạch theo kỳ.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "A manufacturing order is for 10 units. The operator produces only 7 and validates. What does Odoo propose?", "options": ["To split the MO into 10 separate MOs", "Nothing; validation is blocked until all 10 units are produced", "To scrap the 3 missing units automatically and close the MO", "To create a backorder for the remaining 3 units (or none)"], "answer": 3, "explanation": "Khi sản xuất ít hơn kế hoạch, Odoo hỏi có tạo backorder cho phần còn lại hay không. Odoo không tự scrap và không chặn việc xác nhận.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Point of Sale", "question": "When are the accounting entries for non-invoiced Point of Sale orders posted?", "options": ["When the PoS session is closed", "At the end of each month by a scheduled action", "Immediately after each order is paid", "Only when an invoice is requested"], "answer": 0, "explanation": "Đơn PoS không xuất hóa đơn được gộp và ghi sổ khi đóng session. Đơn có invoice thì sinh hóa đơn riêng, nhưng không phải từng đơn đều ghi sổ ngay.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "A regular customer wants to take goods now and pay at the end of the month. Which payment method should the cashier use?", "options": ["Bank, with a delayed date", "Cash, with a negative amount", "Customer Account", "A gift card with zero balance"], "answer": 2, "explanation": "Payment method Customer Account ghi nhận công nợ vào tài khoản phải thu của khách và bắt buộc chọn khách hàng. Cash/Bank là thanh toán ngay.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "A café wants to manage floors and tables in its Point of Sale. What must be done?", "options": ["Enable 'Is a Bar/Restaurant' in the Point of Sale settings", "Install a separate Restaurant app from the Apps menu", "Enable the Preparation Display", "Enable Self Ordering in Kiosk mode"], "answer": 0, "explanation": "Bật Is a Bar/Restaurant sẽ kích hoạt tính năng floor/table cho PoS đó. Preparation Display chỉ hiển thị đơn ở bếp, không tạo sơ đồ bàn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "A restaurant wants its kitchen staff to see orders on a screen and mark them as done, instead of receiving paper tickets. Which feature should be used?", "options": ["Customer Display", "Kiosk", "Preparation Display", "Preparation Printers"], "answer": 2, "explanation": "Preparation Display hiển thị đơn trên màn hình bếp và cho phép chuyển trạng thái món. Preparation Printers in phiếu giấy, không phải màn hình.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "A shop wants customers to top up a prepaid balance and spend it in later purchases. Which Discount & Loyalty program type fits?", "options": ["Gift Card", "Loyalty Cards", "Next Order Coupons", "eWallet"], "answer": 3, "explanation": "eWallet là ví điện tử có thể nạp thêm (top-up) và dùng thanh toán nhiều lần. Gift Card thường là thẻ quà tặng có giá trị cố định, không phải ví để nạp lại.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "A customer asks for an invoice while paying at the PoS. What should the cashier do?", "options": ["Invoices cannot be issued from PoS; they must be created in Accounting", "Select the customer and tick 'Invoice' on the payment screen", "Close the session, then create the invoice from the order in Accounting", "Nothing; every PoS order with a customer is invoiced automatically"], "answer": 1, "explanation": "Để xuất hóa đơn từ PoS, cần chọn khách hàng và bật nút Invoice trên màn hình thanh toán. Đơn không chọn Invoice sẽ không có hóa đơn riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "The internet connection drops while a PoS session is open and already loaded. What happens?", "options": ["Only cash orders are kept; card and other orders are deleted", "Orders are stored locally and synced once back online", "All orders taken offline are lost when the page is refreshed", "The PoS is blocked with an error until the connection returns"], "answer": 1, "explanation": "PoS có chế độ offline: đơn hàng lưu cục bộ trên trình duyệt và đồng bộ lên server khi có mạng lại. PoS không bị khóa ngay khi mất kết nối.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "Several cashiers share one PoS session and must each log in with a badge or PIN so that orders are tracked per employee. Which setting should be enabled?", "options": ["Multi-company", "Restrict Price Modifications to Managers", "Share Open Orders", "Log in with Employees"], "answer": 3, "explanation": "Log in with Employees (module pos_hr) cho phép nhiều nhân viên đăng nhập/chuyển đổi trong một session bằng badge hoặc PIN. Share Open Orders chỉ chia sẻ đơn đang mở giữa các PoS.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "CRM", "question": "A company wants incoming requests to be qualified before they appear in the sales pipeline. What must be done first?", "options": ["Activate \"Lead Mining\" in CRM settings", "Enable \"Rule-Based Assignment\" in CRM settings", "Enable the \"Leads\" option in CRM settings", "Create a first pipeline stage called \"Lead\""], "answer": 2, "explanation": "Mặc định CRM chỉ có Opportunity; phải bật tùy chọn \"Leads\" trong CRM ‣ Configuration ‣ Settings thì mới có menu Leads và bước chuyển đổi Lead → Opportunity. Tạo stage tên \"Lead\" chỉ là một cột trong pipeline, không tạo ra bước sàng lọc riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/convert.html"}, {"set": 1, "subject": "CRM", "question": "With Predictive Lead Scoring, how is the automated Probability of an opportunity computed?", "options": ["From the Expected Revenue compared to the average size of deals won by the sales team", "From the number of activities completed and overdue on the opportunity", "From the probability configured on each pipeline stage", "From the won/lost ratio of past leads sharing the same stage and scoring field values"], "answer": 3, "explanation": "Predictive Lead Scoring dùng thống kê Bayes trên dữ liệu won/lost trong quá khứ (stage và các field được chọn qua \"Update Probabilities\", tính từ ngày bắt đầu). Odoo 18 không còn khái niệm xác suất cố định theo stage.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lead_scoring.html"}, {"set": 1, "subject": "CRM", "question": "A salesperson clicks \"Lost\" on an opportunity and selects a lost reason. What happens to the record?", "options": ["It is archived, with 0% probability and the lost reason stored", "It is permanently deleted, and only the lost reason is kept in a log", "It is moved to a stage named \"Lost\" that must exist in the pipeline", "It is moved back to the first stage and reassigned to the team leader"], "answer": 0, "explanation": "Opportunity bị đánh dấu Lost sẽ được archive (active = False), probability về 0% và lưu Lost Reason; có thể tìm lại bằng bộ lọc Lost/Archived. Odoo không cần (và không dùng) một stage \"Lost\" riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lost_opportunities.html"}, {"set": 1, "subject": "CRM", "question": "How can a user merge several duplicate opportunities in Odoo 18 CRM?", "options": ["Archive all but one; archived duplicates are merged automatically by a scheduled action", "Select them in the list view and use Actions ‣ Merge", "Open CRM ‣ Configuration ‣ Duplicates and run the deduplication wizard", "Drag one opportunity card onto another in the Kanban view"], "answer": 1, "explanation": "Chọn các bản ghi trong list view rồi dùng Actions ‣ Merge để mở wizard gộp. Kéo thả thẻ Kanban chỉ đổi stage, không gộp bản ghi.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/convert.html"}, {"set": 1, "subject": "CRM", "question": "With Rule-Based Assignment enabled, where do you limit how many leads a specific salesperson can receive and which leads they get?", "options": ["On each team member's record: assignment domain and lead capacity", "On the UTM Source that generated the lead, with a maximum per user", "On each pipeline stage, using the Requirements field and a lead limit", "In the user's Preferences tab, under a Lead Assignment section"], "answer": 0, "explanation": "Mỗi thành viên trong Sales Team có domain phân công riêng và \"Average Leads Capacity (on 30 days)\"; Odoo dựa vào đó để chia lead. Field Requirements của stage chỉ là ghi chú hiển thị tooltip.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lead_scoring.html"}, {"set": 1, "subject": "CRM", "question": "An opportunity has no customer set. The salesperson clicks \"New Quotation\". What happens?", "options": ["The quotation is created with the salesperson's company as customer", "Odoo blocks the action with an error until a customer is set", "The opportunity is automatically marked as won", "A wizard asks whether to create, link to, or not link a customer"], "answer": 3, "explanation": "Khi opportunity chưa có khách hàng, Odoo mở wizard cho chọn Create a new customer / Link to an existing customer / Do not link. Opportunity chỉ được đánh dấu Won khi báo giá được xác nhận hoặc bấm Won, không phải khi tạo báo giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 1, "subject": "CRM", "question": "A SaaS company wants to track Monthly Recurring Revenue (MRR) on its opportunities. What should be done?", "options": ["Set the Expected Revenue field and tick \"Is Won Stage\" on a monthly stage", "Enable \"Recurring Revenues\" and set a Recurring Plan on each opportunity", "Install the Subscriptions app; CRM cannot track recurring revenue", "Create a custom field \"MRR\" with Studio"], "answer": 1, "explanation": "Bật \"Recurring Revenues\" trong CRM ‣ Configuration ‣ Settings sẽ thêm field doanh thu định kỳ và Recurring Plan (Monthly, Yearly…) trên opportunity. Không cần app Subscriptions để theo dõi MRR trong pipeline.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 1, "subject": "CRM", "question": "A sales manager wants a \"Send follow-up email\" activity to be scheduled automatically as soon as a \"Call\" activity is marked as done. How is this configured?", "options": ["Set Chaining Type to \"Suggest Next Activity\" on the \"Call\" activity type", "Enable \"Rule-Based Assignment\" with a follow-up delay", "Set the \"Call\" type's Chaining Type to \"Trigger Next Activity\"", "Create an automated action on the CRM stage reached after the call"], "answer": 2, "explanation": "\"Trigger Next Activity\" tự động tạo activity tiếp theo khi activity hiện tại được Mark Done. \"Suggest Next Activity\" chỉ gợi ý để người dùng chọn, không tự động tạo.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/optimize/utilize_activities.html"}, {"set": 1, "subject": "Marketing", "question": "A contact's email address has been added to the blacklist. What is the effect?", "options": ["All emails to this address are blocked, including invoices and quotations", "The address only stops receiving emails from the mailing list it unsubscribed from", "It no longer receives any mass mailing, from any mailing list", "The contact is archived and can no longer be used on sales orders"], "answer": 2, "explanation": "Blacklist chặn mọi email marketing (mass mailing) tới địa chỉ đó trên tất cả danh sách; email giao dịch (hóa đơn, báo giá) vẫn gửi được. Hủy đăng ký một mailing list thì chỉ ảnh hưởng danh sách đó.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 1, "subject": "Marketing", "question": "When configuring an A/B test on a mailing in Email Marketing, which winner selection criterion is NOT available by default?", "options": ["Highest Reply Rate", "Lowest Bounce Rate", "Highest Click Rate", "Highest Open Rate"], "answer": 1, "explanation": "Các tiêu chí chọn winner mặc định gồm Manual, Highest Open Rate, Highest Click Rate, Highest Reply Rate (thêm tiêu chí theo doanh số/báo giá khi có app Sales/CRM). Không có tiêu chí Bounce Rate.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 1, "subject": "Marketing", "question": "Before launching a Marketing Automation campaign, a marketer wants to check the workflow on one record without waiting for the real delays. What should be used?", "options": ["Launch a Test: choose a record and run the activities manually", "Send the first email as a mass mailing test", "Enable developer mode and run the scheduled action", "Duplicate the campaign and set all intervals to 0"], "answer": 0, "explanation": "Nút \"Launch a Test\" cho phép chọn một bản ghi và chạy từng activity thủ công để kiểm tra workflow mà không ảnh hưởng chiến dịch thật. Đặt delay = 0 vẫn chạy trên toàn bộ participant thật.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation/testing_running.html"}, {"set": 1, "subject": "Marketing", "question": "In a Marketing Automation workflow, a reminder email must be sent 2 days after the welcome email only if the welcome email was not opened. How do you configure the reminder?", "options": ["Add it as a child of the welcome email with the trigger \"Mail: bounced\"", "Add it at the beginning of the workflow with a 2-day interval and no trigger", "Create a separate campaign filtered on unopened emails", "Add it as a child of the welcome email, trigger \"Mail: not opened\", 2 days"], "answer": 3, "explanation": "Activity con với trigger \"Mail: not opened\" và delay 2 ngày sẽ chỉ chạy cho những người chưa mở email cha. Đặt ở đầu workflow thì gửi cho tất cả participant bất kể đã mở hay chưa.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation/workflow_activities.html"}, {"set": 1, "subject": "Marketing", "question": "What is required to send SMS campaigns with the SMS Marketing app?", "options": ["A connected social media account", "A dedicated outgoing mail server", "The Marketing Automation app", "Prepaid IAP credits for the SMS service"], "answer": 3, "explanation": "SMS gửi qua dịch vụ IAP của Odoo nên cần mua SMS credits. Mail server chỉ dùng cho email, không dùng cho SMS.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/sms_marketing.html"}, {"set": 1, "subject": "Marketing", "question": "An event organiser wants attendees to buy paid tickets directly on the website. Which Events setting must be enabled?", "options": ["Schedule & Tracks", "Online Ticketing", "Use Event Barcode", "Booth Management"], "answer": 1, "explanation": "\"Online Ticketing\" (website_event_sale) cho phép bán vé có phí qua eCommerce trên website. Booth Management dùng cho việc bán gian hàng (booth), không phải vé cho người tham dự.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/events/sell_tickets.html"}, {"set": 1, "subject": "Marketing", "question": "Which three UTM parameters does Odoo use to track where traffic and leads come from?", "options": ["Campaign, Medium and Source", "Channel, Category and Tag", "Source, Country and Language", "Campaign, Team and Salesperson"], "answer": 0, "explanation": "Odoo theo dõi theo ba tham số UTM: utm_campaign, utm_medium, utm_source. Sales Team hay Salesperson không phải tham số UTM.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing.html"}, {"set": 1, "subject": "Marketing", "question": "With Social Marketing, a marketer wants a post to be published automatically next Monday at 9:00 on several accounts. What should they do?", "options": ["Create a mailing with the social accounts as recipients, scheduled for Monday", "Create one post per account and publish them manually on Monday", "Create one post for all accounts and choose \"Schedule later\"", "Use a Marketing Automation workflow with a Social activity"], "answer": 2, "explanation": "Một bài đăng Social Marketing có thể chọn nhiều tài khoản và dùng \"Schedule later\" để đăng tự động vào thời điểm đã định. Không cần tạo bài riêng cho từng tài khoản.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/social_marketing.html"}, {"set": 1, "subject": "Survey", "question": "A company wants respondents to rate a service on a 0 to 10 scale. Which question type is designed for this in Odoo 18?", "options": ["Matrix", "Multiple choice: only one answer", "Scale", "Numerical Value"], "answer": 2, "explanation": "Odoo 18 có loại câu hỏi Scale cho phép chọn điểm trên thang (tối đa 0–10) với nhãn hai đầu. Numerical Value chỉ là ô nhập số tự do, không hiển thị thang điểm.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/questions.html"}, {"set": 1, "subject": "Survey", "question": "A trainer wants participants to see the correct answers right after completing each page of a quiz. Which Scoring option should be selected?", "options": ["Scoring with answers after each page", "No scoring", "Scoring without answers", "Scoring with answers at the end"], "answer": 0, "explanation": "\"Scoring with answers after each page\" hiển thị đáp án đúng sau mỗi trang. \"Scoring with answers at the end\" chỉ hiển thị đáp án khi hoàn thành toàn bộ bài.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/scoring.html"}, {"set": 1, "subject": "Survey", "question": "What is required to turn a survey into a certification that participants pass or fail?", "options": ["Publish the survey as the final step of an eLearning course", "Enable a time limit", "Set the access mode to \"Invited people only\" and require login to answer", "Tick \"Is a Certification\" with scoring and a Required Score (%)"], "answer": 3, "explanation": "Certification cần bật chấm điểm, tick \"Is a Certification\" và đặt Required Score (%) để xác định đậu/rớt. Access mode hay time limit là tùy chọn, không bắt buộc.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/scoring.html"}, {"set": 1, "subject": "Survey", "question": "The \"Create Live Session\" button does not appear on a survey. What is the most likely reason?", "options": ["The survey access mode is \"Anyone with the link\"", "The survey is configured as a certification", "The survey uses at least one \"Scale\" question", "The survey has more than 10 questions on one page"], "answer": 1, "explanation": "Live session chỉ khả dụng khi survey type là Live session/Custom và survey không phải certification. Số câu hỏi hay access mode không ảnh hưởng.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/live_session.html"}, {"set": 1, "subject": "Survey", "question": "A survey should ask \"Which competitor do you use?\" only if the respondent answered \"Yes\" to \"Do you use a competitor?\". How is this configured?", "options": ["Create two separate surveys", "Place both questions on the same page; Odoo hides those left unanswered", "Make the second question mandatory", "Use \"Conditional display\" on the second question with the answer \"Yes\""], "answer": 3, "explanation": "Conditional display cho phép chọn một hoặc nhiều triggering answer; câu hỏi chỉ hiện khi người trả lời chọn một trong các đáp án đó. Mandatory chỉ bắt buộc trả lời, không ẩn/hiện câu hỏi.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/questions.html"}, {"set": 1, "subject": "Survey", "question": "A survey's Access Mode is set to \"Invited people only\". What does this mean?", "options": ["Only internal users invited by email can answer", "Only people with a personal invitation link can answer", "The survey is visible only on the website's survey page", "Anyone can answer, but they must log in first"], "answer": 1, "explanation": "\"Invited people only\" yêu cầu link mời cá nhân (có token) mới làm được survey. Yêu cầu đăng nhập là tùy chọn riêng \"Require Login\".", "ref": "https://www.odoo.com/documentation/18.0/applications/mar
