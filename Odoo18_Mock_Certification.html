trator wants to customize the standard Sales dashboard without losing the changes at the next Odoo upgrade. What is recommended?", "options": ["Edit the standard dashboard directly", "Download it as .xlsx and re-upload it", "Open it via Edit, use File ‣ Make a copy, rename the copy and customize the copy", "Save it as a template and delete it"], "answer": 2, "explanation": "Dashboard chuẩn được cài lại ở mỗi lần nâng cấp phiên bản nên sửa trực tiếp sẽ mất thay đổi; nên tạo bản sao (Make a copy) rồi tùy chỉnh.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/dashboards/build_and_customize_dashboards.html"}, {"set": 3, "subject": "Spreadsheet", "question": "In a dynamic pivot's properties panel, a manager wants a new measure 'Margin %' computed from two existing measures. What can be used?", "options": ["Add a calculated measure with a formula in the Measures section", "Use Flip axes", "Create a new field in the Sales model with Studio only", "Add a Text global filter"], "answer": 0, "explanation": "Trong mục Measures có thể Add calculated measure, nhập công thức bắt đầu bằng '=' và chọn cách tổng hợp. Flip axes chỉ hoán đổi hàng và cột.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/dynamic_pivot_tables.html"}, {"set": 1, "subject": "Inventory", "question": "A company wants its receipts to go through an input area, then a quality control area, before products are stored. What must be configured in Odoo 18?", "options": ["Enable Multi-Step Routes in Inventory ‣ Configuration ‣ Settings, then set Incoming Shipments to 'Receive, Quality Control, then Store (3 steps)' on the warehouse", "Enable only the Storage Locations setting and create a Quality Control sub-location", "Create a putaway rule from WH/Input to WH/Quality Control", "Install the Quality app; 3-step receipts are then activated automatically on every warehouse"], "answer": 0, "explanation": "Phải bật Multi-Step Routes trước, sau đó chọn Incoming Shipments = 3 steps trên form Warehouse (Inventory ‣ Configuration ‣ Warehouses). Putaway rule chỉ chuyển hướng vị trí lưu kho, không tạo thêm bước transfer.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "A food distributor has enabled Expiration Dates and wants the lots that expire soonest to be picked first for deliveries. Which removal strategy should be used?", "options": ["First Expiry, First Out (FEFO)", "First In, First Out (FIFO)", "Closest Location", "Last In, First Out (LIFO)"], "answer": 0, "explanation": "FEFO chọn lot có ngày Removal Date sớm nhất để xuất trước, dùng cho hàng có hạn sử dụng. FIFO chỉ dựa trên ngày nhập kho, không quan tâm hạn dùng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "A reordering rule has Min = 10 and Max = 50 (no packaging, multiple quantity of 1). The forecasted quantity drops to 8. How many units will Odoo propose to order?", "options": ["50", "2", "42", "10"], "answer": 2, "explanation": "Khi tồn dự báo xuống dưới Min, Odoo đặt hàng để đưa tồn dự báo lên Max: 50 − 8 = 42. Đáp án 2 chỉ đưa tồn về Min, không đúng logic min/max.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "Each laptop sold must be traceable individually (one identifier per unit). How should the product be configured?", "options": ["Enable Consignment and set a different owner for each unit", "Set tracking to 'By Lots' and create one lot per receipt", "Enable Packages and put each laptop in its own package", "Enable Lots & Serial Numbers, then on the product (with Track Inventory ticked) set tracking to 'By Unique Serial Number'"], "answer": 3, "explanation": "Serial number gắn một mã duy nhất cho từng đơn vị sản phẩm. Lot dùng cho một nhóm/batch nhiều đơn vị nên không truy xuất được từng chiếc.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "What is the effect of setting a product category's Inventory Valuation to 'Automated'?", "options": ["Receipts are blocked until the vendor bill is posted", "Journal entries are generated automatically for stock moves that affect valuation (e.g. receipts and deliveries)", "Stock valuation is only recorded by a manual journal entry at period end", "The costing method is automatically switched to AVCO"], "answer": 1, "explanation": "Với Automated (perpetual), mỗi stock move ảnh hưởng giá trị kho sẽ tự sinh bút toán kế toán theo thời gian thực. Ghi nhận thủ công cuối kỳ là đặc điểm của chế độ Manual (periodic).", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "Products of the category 'Fasteners' received in WH/Stock must automatically be stored in WH/Stock/Shelf 2. Which feature should be used?", "options": ["A putaway rule (Inventory ‣ Configuration ‣ Putaway Rules), with Storage Locations enabled", "A reordering rule with location WH/Stock/Shelf 2", "Setting Incoming Shipments to 2 steps on the warehouse", "A removal strategy on the 'Fasteners' category"], "answer": 0, "explanation": "Putaway rule tự động chuyển hướng sản phẩm/nhóm sản phẩm vào sub-location cụ thể khi nhập kho. Removal strategy dùng cho việc lấy hàng ra (xuất kho), không phải cất hàng vào.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "What happens when you validate a scrap order for 2 units taken from WH/Stock?", "options": ["The 2 units are deleted from the database without any stock move", "The 2 units are moved to the virtual scrap location and are no longer counted in the on-hand quantity", "A vendor credit note is created automatically for the 2 units", "The 2 units are moved to WH/Output to be returned to the vendor"], "answer": 1, "explanation": "Scrap tạo stock move từ vị trí nội bộ sang virtual location Scrap, nên số lượng không còn tính vào tồn kho nhưng vẫn truy vết được. Odoo không tự tạo trả hàng hay credit note cho nhà cung cấp.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "Landed costs (freight, customs duties) are validated on a receipt. For products using which costing method will the landed cost NOT be added to the inventory valuation?", "options": ["FIFO", "Average Cost (AVCO)", "It is added for all costing methods", "Standard Price"], "answer": 3, "explanation": "Landed costs chỉ được phân bổ vào giá trị tồn kho của sản phẩm dùng FIFO hoặc AVCO; với Standard Price giá vốn cố định nên không bị điều chỉnh. Vì vậy 'tất cả phương pháp' là sai.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "Dropshipping is enabled. A product has the Dropship route and a vendor set on its Purchase tab. What happens when a sales order for this product is confirmed?", "options": ["The vendor delivers to WH/Stock, then a delivery order ships to the customer", "An RFQ is created for the vendor, and the dropship transfer goes directly from Partners/Vendors to Partners/Customers", "A delivery order is created from WH/Stock and a PO replenishes the stock afterwards", "A manufacturing order is created to produce the product"], "answer": 1, "explanation": "Dropship tạo RFQ cho nhà cung cấp và hàng đi thẳng từ vendor đến khách hàng, không qua kho của công ty. Phương án giao từ WH/Stock là luồng bán hàng thông thường.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Inventory", "question": "In Odoo 18, how do you make sure the on-hand stock of a product is tracked?", "options": ["Set the Product Type to 'Storable Product'", "Set the Product Type to 'Combo'", "Set the Product Type to 'Goods' and tick 'Track Inventory'", "Set the Product Type to 'Service' and add a reordering rule"], "answer": 2, "explanation": "Từ Odoo 18, loại 'Storable Product' không còn; sản phẩm là Goods và tick Track Inventory để quản lý tồn kho. 'Storable Product' là thuật ngữ của các phiên bản cũ.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 1, "subject": "Manufacturing", "question": "A 'Gift Box' product has a BoM of type 'Kit'. What happens when a sales order for it is confirmed?", "options": ["The Gift Box is delivered from stock as a single finished product", "An RFQ is created to buy the Gift Box", "A manufacturing order is created to assemble the Gift Box", "The delivery order lists the kit's components; no manufacturing order is created"], "answer": 3, "explanation": "BoM loại Kit không tạo MO; khi giao hàng Odoo thay sản phẩm kit bằng các component. Tạo MO là hành vi của BoM loại Manufacture this product.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "On a bill of materials, the Operations tab is not visible. What is the most likely reason?", "options": ["The Work Orders setting is not enabled in Manufacturing ‣ Configuration ‣ Settings", "The finished product is not tracked by serial number", "The Master Production Schedule setting is disabled", "The BoM type is 'Manufacture this product'"], "answer": 0, "explanation": "Tab Operations và work center chỉ xuất hiện khi bật setting Work Orders. MPS không liên quan đến việc hiển thị operations trên BoM.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "In Odoo 18, which app do operators use on a tablet at their workstation to process work orders and follow instructions?", "options": ["IoT", "Shop Floor", "Quality", "Planning"], "answer": 1, "explanation": "Odoo 18 có app Shop Floor riêng để nhân viên xưởng xử lý work order, ghi thời gian và thực hiện các bước kiểm tra. IoT chỉ dùng kết nối thiết bị phần cứng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "A sawmill produces planks and also wants to record the sawdust generated as a secondary product. Which setting must be enabled?", "options": ["By-Products", "Subcontracting", "Unlock Manufacturing Orders", "Work Order Dependencies"], "answer": 0, "explanation": "Setting By-Products thêm tab By-products trên BoM để khai báo sản phẩm phụ sinh ra trong quá trình sản xuất. Subcontracting dùng khi thuê ngoài gia công.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "A finished product was assembled by mistake and you want to dismantle it and put its components back in stock. What should you use?", "options": ["A scrap order for the finished product", "Cancel the done manufacturing order", "An unbuild order (Manufacturing ‣ Operations ‣ Unbuild Orders)", "A return to vendor for the components"], "answer": 2, "explanation": "Unbuild order đảo ngược MO: tiêu thụ thành phẩm và trả component về kho. MO đã Done không thể hủy, còn scrap sẽ làm mất cả thành phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "A warehouse is set to 'Pick components, manufacture, then store products (3 steps)'. What does this mean?", "options": ["The MO is processed, then a quality check, then finished products are stored", "Components are received from the vendor, manufactured, then delivered to the customer", "Components are picked to a pre-production location, the MO is processed, then finished products are moved to stock", "Components are picked, packed, and then the MO is processed"], "answer": 2, "explanation": "Sản xuất 3 bước gồm: lấy component (Pick Components), sản xuất (MO), rồi chuyển thành phẩm về kho (Store Finished Product). Bước quality check không phải bước mặc định của luồng này.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "A planner wants to define, period by period, how many units to produce based on forecasted demand. Which feature should be used?", "options": ["Work center Gantt view", "Master Production Schedule", "Replenishment report", "Product Lifecycle Management (PLM)"], "answer": 1, "explanation": "Master Production Schedule (bật trong Manufacturing settings, menu Planning) cho phép lập kế hoạch sản xuất theo kỳ dựa trên dự báo nhu cầu. Replenishment report chỉ dựa trên reordering rule, không lập kế hoạch theo kỳ.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Manufacturing", "question": "A manufacturing order is for 10 units. The operator produces only 7 and validates. What does Odoo propose?", "options": ["To split the MO into 10 separate MOs", "Nothing; validation is blocked until all 10 units are produced", "To scrap the 3 missing units automatically", "To create a backorder for the remaining 3 units, or to close the MO without a backorder"], "answer": 3, "explanation": "Khi sản xuất ít hơn kế hoạch, Odoo hỏi có tạo backorder cho phần còn lại hay không. Odoo không tự scrap và không chặn việc xác nhận.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 1, "subject": "Point of Sale", "question": "When are the accounting entries for non-invoiced Point of Sale orders posted?", "options": ["When the PoS session is closed", "At the end of each month by a scheduled action", "Immediately after each order is paid", "Only when an invoice is requested"], "answer": 0, "explanation": "Đơn PoS không xuất hóa đơn được gộp và ghi sổ khi đóng session. Đơn có invoice thì sinh hóa đơn riêng, nhưng không phải từng đơn đều ghi sổ ngay.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "A regular customer wants to take goods now and pay at the end of the month. Which payment method should the cashier use?", "options": ["Bank, with a delayed date", "Cash, with a negative amount", "Customer Account (the customer must be set on the order)", "A gift card with zero balance"], "answer": 2, "explanation": "Payment method Customer Account ghi nhận công nợ vào tài khoản phải thu của khách và bắt buộc chọn khách hàng. Cash/Bank là thanh toán ngay.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "A café wants to manage floors and tables in its Point of Sale. What must be done?", "options": ["Enable 'Is a Bar/Restaurant' in the Point of Sale settings", "Install a separate Restaurant app from the Apps menu", "Enable the Preparation Display", "Enable Self Ordering in Kiosk mode"], "answer": 0, "explanation": "Bật Is a Bar/Restaurant sẽ kích hoạt tính năng floor/table cho PoS đó. Preparation Display chỉ hiển thị đơn ở bếp, không tạo sơ đồ bàn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "A restaurant wants its kitchen staff to see orders on a screen and mark them as done, instead of receiving paper tickets. Which feature should be used?", "options": ["Customer Display", "Kiosk", "Preparation Display", "Preparation Printers"], "answer": 2, "explanation": "Preparation Display hiển thị đơn trên màn hình bếp và cho phép chuyển trạng thái món. Preparation Printers in phiếu giấy, không phải màn hình.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "A shop wants customers to top up a prepaid balance and spend it in later purchases. Which Discount & Loyalty program type fits?", "options": ["Gift Card", "Loyalty Cards", "Next Order Coupons", "eWallet"], "answer": 3, "explanation": "eWallet là ví điện tử có thể nạp thêm (top-up) và dùng thanh toán nhiều lần. Gift Card thường là thẻ quà tặng có giá trị cố định, không phải ví để nạp lại.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "A customer asks for an invoice while paying at the PoS. What should the cashier do?", "options": ["Invoices cannot be issued from the Point of Sale", "Select the customer and click 'Invoice' on the payment screen before validating", "Close the session, then create the invoice in Accounting", "Nothing; every PoS order is invoiced automatically"], "answer": 1, "explanation": "Để xuất hóa đơn từ PoS, cần chọn khách hàng và bật nút Invoice trên màn hình thanh toán. Đơn không chọn Invoice sẽ không có hóa đơn riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "The internet connection drops while a PoS session is open and already loaded. What happens?", "options": ["Only cash orders are kept, other orders are deleted", "Orders can still be recorded; they are stored locally and synchronised when the connection is restored", "All orders taken offline are lost", "The PoS is blocked until the connection returns"], "answer": 1, "explanation": "PoS có chế độ offline: đơn hàng lưu cục bộ trên trình duyệt và đồng bộ lên server khi có mạng lại. PoS không bị khóa ngay khi mất kết nối.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "Point of Sale", "question": "Several cashiers share one PoS session and must each log in with a badge or PIN so that orders are tracked per employee. Which setting should be enabled?", "options": ["Multi-company", "Restrict Price Modifications to Managers", "Share Open Orders", "Log in with Employees"], "answer": 3, "explanation": "Log in with Employees (module pos_hr) cho phép nhiều nhân viên đăng nhập/chuyển đổi trong một session bằng badge hoặc PIN. Share Open Orders chỉ chia sẻ đơn đang mở giữa các PoS.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Inventory", "question": "A warehouse is configured with Outgoing Shipments = 'Pick, Pack, then Deliver (3 steps)'. What is the flow of goods?", "options": ["Stock → Quality Control → Output → Customer", "Packing Zone → Stock → Output → Customer", "Stock → Packing Zone → Output → Customer", "Stock → Output → Packing Zone → Customer"], "answer": 2, "explanation": "Giao hàng 3 bước: Pick (Stock → Packing Zone), Pack (Packing Zone → Output), rồi Delivery (Output → Customer). Thứ tự Output trước Packing là sai.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "Where can a removal strategy be defined in Odoo 18?", "options": ["On the product category and on the location", "Only on the product form", "On the operation type", "Only on the warehouse form"], "answer": 0, "explanation": "Removal strategy được cấu hình trên Product Category (Force Removal Strategy) và trên Location. Product form và Warehouse không có trường này.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "A company wants every confirmed sales order of a custom product to trigger a purchase, regardless of stock. The 'Replenish on Order (MTO)' route cannot be selected on the product. What is the most likely reason?", "options": ["MTO can only be set on the product category, not on the product", "The MTO route is archived by default and must be unarchived (Inventory ‣ Configuration ‣ Routes)", "The MTO route only exists when the Manufacturing app is installed", "The Dropshipping setting must be enabled first"], "answer": 1, "explanation": "Trong Odoo 18, route 'Replenish on Order (MTO)' bị archive mặc định; cần bật Multi-Step Routes để thấy menu Routes rồi unarchive nó. MTO không phụ thuộc Manufacturing hay Dropshipping.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "A pharmaceutical company receives 500 units of a medicine produced in the same production batch and must be able to recall that batch. Which tracking is most appropriate?", "options": ["By Lots", "By Unique Serial Number", "Consignment (owner on stock)", "By Quantity, using packages"], "answer": 0, "explanation": "Lot dùng để nhóm nhiều đơn vị cùng một batch sản xuất, phù hợp cho thu hồi theo lô. Serial number yêu cầu mã riêng cho từng đơn vị, không cần thiết và rất nặng nề cho 500 đơn vị.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "With the FEFO removal strategy, which date of a lot determines which lot is picked first?", "options": ["The lot creation date", "Best Before Date", "Alert Date", "Removal Date"], "answer": 3, "explanation": "FEFO sắp xếp lot theo Removal Date (ngày phải rút hàng khỏi kho). Alert Date chỉ dùng để cảnh báo, không quyết định thứ tự lấy hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "A product uses AVCO. You have 10 units in stock at $10 each, then receive 10 more units at $20 each. What is the new unit cost?", "options": ["$10", "$20", "$15", "$12.50"], "answer": 2, "explanation": "AVCO tính bình quân gia quyền: (10×10 + 10×20) / 20 = $15. $20 là giá lần nhập cuối, không phải giá bình quân.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "Which Inventory setting must be enabled so operators can use the 'Put in Pack' button on transfers?", "options": ["Packages", "Product Packagings", "Batch, Wave & Cluster Transfers", "Consignment"], "answer": 0, "explanation": "Setting Packages cho phép đóng gói hàng vào package vật lý bằng nút Put in Pack. Product Packagings chỉ định nghĩa quy cách đóng gói (ví dụ thùng 12 cái) cho mua/bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "In Inventory ‣ Operations ‣ Physical Inventory, the counted quantity of a product is lower than the on-hand quantity. What happens when you apply the count?", "options": ["The on-hand quantity is overwritten without creating any stock move", "A stock move is created from the stock location to the Inventory adjustment virtual location for the difference", "A return to the vendor is generated", "A scrap order is created automatically for the difference"], "answer": 1, "explanation": "Khi Apply, Odoo tạo stock move giữa location kho và virtual location Inventory adjustment cho phần chênh lệch, giữ được lịch sử. Không tạo scrap hay trả hàng nhà cung cấp.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "In Odoo 18, what distinguishes a wave transfer from a batch transfer?", "options": ["Wave transfers can only be used for receipts", "Wave transfers can only group transfers from different warehouses", "Batch transfers require the Barcode app, wave transfers do not", "A wave transfer can group specific product lines from several transfers, while a batch transfer groups entire transfers"], "answer": 3, "explanation": "Wave transfer gom các dòng sản phẩm (move lines) từ nhiều phiếu, còn batch transfer gom nguyên phiếu. Cả hai đều thuộc setting Batch, Wave & Cluster Transfers và không bắt buộc dùng Barcode.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Inventory", "question": "A warehouse scans barcodes that encode the product, lot number and expiration date in a single barcode. Which barcode nomenclature should be selected in the Barcode settings?", "options": ["Code 39 Nomenclature", "GS1 Nomenclature", "EAN-8 Nomenclature", "Default Nomenclature"], "answer": 1, "explanation": "GS1 dùng Application Identifiers để mã hóa nhiều thông tin (sản phẩm, lot, hạn dùng, số lượng) trong một mã vạch. Default Nomenclature chỉ nhận dạng đơn giản theo pattern, không tách được nhiều trường.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 2, "subject": "Manufacturing", "question": "A vendor assembles one of your products using components that you send to them. How do you model this in Odoo 18?", "options": ["Create a work center named after the vendor in a regular BoM", "Put the Dropship route on the components", "Create a Kit BoM and buy the product from the vendor", "Enable Subcontracting and create a BoM of type 'Subcontracting' with the vendor as subcontractor"], "answer": 3, "explanation": "BoM loại Subcontracting với subcontractor giúp Odoo theo dõi component gửi đi và thành phẩm nhận về. Kit BoM không có khái niệm gia công thuê ngoài.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "A T-shirt template has Red and Blue variants. You want a single BoM where only the Red variant uses red fabric. What should you use?", "options": ["A Kit BoM for the Red variant", "The 'Apply on Variants' field on the component lines of the BoM", "A separate product category for each color", "An engineering change order (ECO) for each variant"], "answer": 1, "explanation": "Trường Apply on Variants trên dòng component cho phép một BoM dùng chung cho template nhưng component khác nhau theo biến thể. ECO dùng để quản lý thay đổi phiên bản BoM, không để phân biệt biến thể.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "When a work center is fully booked, Odoo should plan work orders on another, equivalent work center. Where is this configured?", "options": ["The Manufacturing Readiness field on the BoM", "The Time Efficiency field on the work center", "The 'Alternative Workcenters' field on the work center", "The Work Order Dependencies setting"], "answer": 2, "explanation": "Alternative Workcenters cho phép Odoo dời work order sang work center thay thế khi work center chính bận. Time Efficiency chỉ điều chỉnh thời lượng dự kiến.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "Only managers should be able to close a manufacturing order when the consumed component quantities differ from the BoM. How do you configure the BoM?", "options": ["Set 'Flexible Consumption' to 'Allowed with warning'", "Set 'Manufacturing Readiness' to 'When all components are available'", "Set 'Flexible Consumption' to 'Blocked'", "Tick 'Highlight Consumption' on the components"], "answer": 2, "explanation": "Flexible Consumption = Blocked chỉ cho manager đóng MO khi lượng tiêu thụ khác BoM. 'Allowed with warning' vẫn cho mọi user đóng MO, chỉ hiện cảnh báo.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "In the PLM app, what happens when an ECO that revises a BoM is applied?", "options": ["The previous BoM is permanently deleted", "The new BoM version becomes active and the previous version is archived", "Both BoM versions remain active and are used alternately", "All ongoing manufacturing orders are updated with the new components"], "answer": 1, "explanation": "Khi Apply Changes, phiên bản BoM mới được kích hoạt và bản cũ bị archive để giữ lịch sử. Các MO đang chạy không tự động đổi component.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "A quality check must be performed at a specific step of production. Where do you create it?", "options": ["On the BoM, in the By-products tab", "On the product form, in the Inventory tab", "On the work center form, in the Capacity section", "In Quality ‣ Quality Control ‣ Control Points, selecting a manufacturing operation type (and the work order operation if needed)"], "answer": 3, "explanation": "Control Point định nghĩa khi nào và ở đâu tạo quality check (operation type, operation trên work order). Product form và work center không có cấu hình kiểm tra chất lượng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "On a BoM, operation 2 must wait until operation 1 is finished, while operation 3 can run in parallel. How do you configure this?", "options": ["Enable the Work Order Dependencies setting, tick 'Operation Dependencies' on the BoM and set 'Blocked By' on operations", "Set Manufacturing Readiness to 'When components for 1st operation are available'", "Create three separate manufacturing orders", "Simply order the operations by sequence; Odoo always runs them in parallel otherwise"], "answer": 0, "explanation": "Work Order Dependencies cho phép khai báo Blocked By giữa các operation, nên có thể có cả bước tuần tự lẫn song song. Manufacturing Readiness chỉ quyết định khi nào MO ở trạng thái sẵn sàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Manufacturing", "question": "A reordering rule should automatically create manufacturing orders instead of purchase orders. What is required?", "options": ["The product must have a BoM and use the Manufacture route", "The product must have a Kit BoM", "The Master Production Schedule must be enabled", "The product must have a vendor and the Buy route"], "answer": 0, "explanation": "Để reordering rule tạo MO, sản phẩm cần có BoM và route Manufacture. BoM loại Kit không bao giờ tạo MO.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 2, "subject": "Point of Sale", "question": "A manager wants to prevent cashiers from closing a session when the counted cash differs too much from the expected amount. Which setting should be used?", "options": ["Restrict Price Modifications to Managers", "Set Maximum Difference (with an Authorized Difference amount)", "Cash Rounding", "Flexible Taxes"], "answer": 1, "explanation": "Set Maximum Difference quy định mức chênh lệch tiền mặt tối đa khi đóng session; vượt quá thì chỉ manager mới đóng được. Cash Rounding chỉ làm tròn số tiền thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "A shop wants VIP customers to automatically get special prices in the PoS. What should be configured?", "options": ["Enable Flexible Taxes with a VIP fiscal position", "Use a Gift Card program for VIP customers", "Create a second Point of Sale reserved for VIP customers", "Enable Flexible Pricelists, add the VIP pricelist to the available pricelists and assign it to the VIP customers"], "answer": 3, "explanation": "Flexible Pricelists cho phép dùng nhiều bảng giá trong PoS; pricelist gán trên khách hàng sẽ được áp dụng khi chọn khách đó. Fiscal position thay đổi thuế, không thay đổi giá bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "In a restaurant PoS, guests at the same table want to pay separately for their own dishes. Which setting must be enabled?", "options": ["Share Open Orders", "Flexible Taxes", "Allow Bill Splitting", "Tips"], "answer": 2, "explanation": "Allow Bill Splitting cho phép tách đơn theo dòng món để thanh toán riêng. Tips chỉ dùng để nhận tiền tip.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "Which PoS setting lets the cashier accept a tip, or convert the customer's change into a tip?", "options": ["Cash Rounding", "Global Discounts", "Tips", "Customer Account"], "answer": 2, "explanation": "Setting Tips (dùng một tip product) cho phép thêm tiền tip hoặc chuyển tiền thừa thành tip. Global Discounts dùng để giảm giá toàn đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "A restaurant wants customers to scan a QR code at their table to see the menu AND place orders from their phone. Which Self Ordering mode should be selected?", "options": ["Disable", "QR menu + Ordering", "Kiosk", "QR menu"], "answer": 1, "explanation": "QR menu + Ordering cho phép khách xem menu và đặt món bằng điện thoại. QR menu chỉ cho xem menu, không đặt món được.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "A shop sells non-reloadable prepaid cards that customers offer as presents and that can be used as payment until the balance is used up. Which program type should be used?", "options": ["Gift Card", "Discount Code", "Promotions", "eWallet"], "answer": 0, "explanation": "Gift Card là thẻ quà tặng trả trước, dùng thanh toán đến khi hết số dư. eWallet là ví có thể nạp lại nhiều lần nên không đúng nhu cầu thẻ quà tặng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "Fruit is sold by weight using a scale connected through an IoT box. What must be set on the product?", "options": ["Set the product type to Service", "Add a product packaging of 1 kg", "Create one variant per weight", "Tick 'To Weigh With Scale' in the product's Point of Sale settings"], "answer": 3, "explanation": "Tick To Weigh With Scale để PoS lấy trọng lượng từ cân (kết nối qua IoT box) khi bán sản phẩm. Variant hay packaging không đọc được trọng lượng thực tế.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 2, "subject": "Point of Sale", "question": "In Odoo 18, a shop wants to show the customer display on a separate tablet, without an IoT box. Which Customer Facing Display option should be selected?", "options": ["Another device", "None", "The same device", "An IOT-connected screen"], "answer": 0, "explanation": "Tùy chọn Another device cho phép mở customer display trên một thiết bị/trình duyệt khác mà không cần IoT box. 'An IOT-connected screen' bắt buộc có IoT box.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Inventory", "question": "You create a new warehouse with the Short Name 'SG'. What does Odoo create automatically?", "options": ["A location hierarchy (e.g. SG/Stock) together with the warehouse's operation types and routes", "Nothing until a route is assigned to the warehouse", "Only a view location; operation types must be created manually", "A new company named SG"], "answer": 0, "explanation": "Khi tạo warehouse, Odoo tự sinh view location SG, các sub-location như SG/Stock và các operation type/route tương ứng. Không cần tạo thủ công và không tạo company mới.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "Which location type is used only to structure the location hierarchy and cannot contain products?", "options": ["Internal Location", "Inventory Loss", "View", "Transit Location"], "answer": 2, "explanation": "Location loại View chỉ dùng để tổ chức cây vị trí (ví dụ WH), không chứa hàng. Internal Location là nơi chứa tồn kho thực.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "High-value shelves must be counted every 30 days, with count dates scheduled automatically. What should be configured?", "options": ["Create a reordering rule with a 30-day lead time", "Set the Annual Inventory Day and Month in the Inventory settings", "Set the Inventory Frequency (days) to 30 on those locations", "Set a removal strategy on the shelves"], "answer": 2, "explanation": "Inventory Frequency trên location tự động đặt ngày kiểm kê theo chu kỳ (cycle count). Annual Inventory Day and Month chỉ áp dụng cho kiểm kê hằng năm toàn công ty.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "Which removal strategy picks products from the location whose name comes first in alphanumeric order?", "options": ["Closest Location", "Least Packages", "First In, First Out (FIFO)", "Last In, First Out (LIFO)"], "answer": 0, "explanation": "Closest Location ưu tiên lấy hàng từ location có tên đứng trước theo thứ tự chữ-số. Least Packages ưu tiên lấy từ ít package nhất, không theo tên location.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "A reordering rule has its Trigger set to 'Manual'. What is the behaviour?", "options": ["An RFQ is created and confirmed immediately in real time", "The scheduler creates the order once a day as with an 'Auto' trigger", "The rule is ignored everywhere, including the Replenishment report", "No order is created automatically; the need appears in the Replenishment report and a user must order it"], "answer": 3, "explanation": "Trigger Manual nghĩa là scheduler không tự tạo RFQ/MO; người dùng xem nhu cầu ở Replenishment và bấm đặt hàng. Tự động chạy theo scheduler là hành vi của trigger Auto.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "A product uses FIFO. You receive 5 units at $8, then 5 units at $12. You then deliver 6 units. What is the value of the delivered goods?", "options": ["$72", "$52", "$48", "$60"], "answer": 1, "explanation": "FIFO xuất các đơn vị nhập trước: 5 × $8 + 1 × $12 = $52. $60 là cách tính bình quân (AVCO), không phải FIFO.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "A product category uses Inventory Valuation = 'Manual'. What does this mean?", "options": ["The costing method must be Standard Price", "Every stock move posts journal entries in real time", "Vendor bills cannot be created for these products", "Stock moves do not create journal entries; the accountant records inventory valuation manually/periodically"], "answer": 3, "explanation": "Manual (periodic) không sinh bút toán khi có stock move, kế toán tự ghi nhận giá trị tồn kho định kỳ. Ghi bút toán thời gian thực là chế độ Automated.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "Freight costs on a receipt must be distributed among the products according to how heavy each one is. Which split method should be used on the landed cost line?", "options": ["By Current Cost", "By Weight", "Equal", "By Quantity"], "answer": 1, "explanation": "Split method By Weight phân bổ chi phí theo trọng lượng sản phẩm. Equal chia đều cho các dòng bất kể khối lượng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "Warehouse B must be replenished from Warehouse A. What is the quickest way to set this up (Multi-Step Routes enabled)?", "options": ["On Warehouse B's form, set 'Resupply From' to Warehouse A, which creates a resupply route", "Create a putaway rule from Warehouse A to Warehouse B", "Enable the Dropship route on the products", "Create a vendor contact for Warehouse A and buy from it"], "answer": 0, "explanation": "Trường Resupply From trên warehouse tự tạo route tiếp hàng giữa các kho, dùng được trên sản phẩm hoặc reordering rule. Putaway rule chỉ hoạt động bên trong một kho khi nhập hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "Putaway rules must not store more than 500 kg on a given rack. What should be configured?", "options": ["A removal strategy on the rack location", "A Storage Category with a maximum weight, assigned to the rack location and used in the putaway rule", "A reordering rule with a maximum of 500 on the rack", "A Package Type with a maximum weight of 500 kg"], "answer": 1, "explanation": "Storage Category cho phép giới hạn tải trọng/sức chứa của location, và putaway rule sẽ bỏ qua location đã đầy. Package Type mô tả bao bì, không giới hạn sức chứa của kệ.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Manufacturing", "question": "A manufacturing order should be considered ready as soon as the components needed for its first operation are available. Which BoM field should be set?", "options": ["Operation Dependencies ticked", "Manufacturing Readiness = 'When components for 1st operation are available'", "Manufacturing Lead Time = 0", "Flexible Consumption = 'Allowed'"], "answer": 1, "explanation": "Manufacturing Readiness quyết định MO được coi là sẵn sàng khi đủ toàn bộ component hay chỉ cần đủ component cho operation đầu tiên. Flexible Consumption liên quan đến số lượng tiêu thụ, không phải tình trạng sẵn sàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "A confirmed manufacturing order contains work orders. Which button schedules these work orders on the work centers' calendars?", "options": ["Plan", "Check availability", "Produce All", "Unlock"], "answer": 0, "explanation": "Nút Plan lên lịch các work order theo công suất và lịch của work center. Check availability chỉ kiểm tra/giữ component.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "With subcontracting, components must automatically be sent from your warehouse to the subcontractor when you purchase the finished product. Which route should be set on the components?", "options": ["Resupply Subcontractor on Order", "Replenish on Order (MTO)", "Manufacture", "Dropship"], "answer": 0, "explanation": "Route Resupply Subcontractor on Order tạo phiếu xuất component từ kho đến subcontractor khi PO thành phẩm được xác nhận. Dropship dùng khi nhà cung cấp giao thẳng cho khách.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "You want to update a manufactured product's cost based on its components and operations. What can you use?", "options": ["Create an ECO on the BoM", "Validate a landed cost on the last receipt", "Change the costing method to AVCO", "The 'Compute Price from BoM' action on the product form"], "answer": 3, "explanation": "Compute Price from BoM tính lại giá vốn từ chi phí component và chi phí operation (work center). Đổi costing method hay landed cost không tính giá từ BoM.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "Which application must be installed to manage engineering change orders (ECOs) and BoM versions?", "options": ["Quality", "Documents", "PLM", "Approvals"], "answer": 2, "explanation": "PLM (Product Lifecycle Management) quản lý ECO và các phiên bản BoM/operation. Approvals là app phê duyệt chung, không quản lý phiên bản BoM.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "Expected operation durations should be updated automatically from the times actually recorded on past work orders. What should be set on the operation?", "options": ["Duration Computation = 'Set duration manually'", "Time Efficiency = 100% on the work center", "Capacity = 1 on the work center", "Duration Computation = 'Compute based on tracked time'"], "answer": 3, "explanation": "Compute based on tracked time tính thời lượng dự kiến từ thời gian thực tế của các work order trước. 'Set duration manually' giữ nguyên giá trị nhập tay.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "A by-product should absorb 10% of the production cost. Where do you configure this?", "options": ["In the cost per hour of the work center", "In the analytic distribution of the BoM", "In the 'Cost Share (%)' field of the by-product line on the BoM", "With a landed cost on the manufacturing order"], "answer": 2, "explanation": "Cost Share (%) trên dòng by-product phân bổ một phần chi phí sản xuất cho sản phẩm phụ. Chi phí work center chỉ tính chi phí vận hành, không phân bổ giữa các sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "During production, a component is damaged and cannot be used. How do you record it on the manufacturing order?", "options": ["Archive the component product", "Use the Scrap button on the manufacturing order and select the damaged component", "Create an unbuild order for the component", "Return the component to the vendor from the MO"], "answer": 1, "explanation": "Nút Scrap trên MO chuyển component hỏng sang scrap location và giữ liên kết với MO. Unbuild chỉ dùng để tháo dỡ thành phẩm đã sản xuất.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Point of Sale", "question": "During an open session, a cashier takes money from the drawer to pay a delivery person. How should this be recorded?", "options": ["Close the session and reopen it with a new opening balance", "Create a refund order for the amount", "Record it later as an expense in the Expenses app", "Use 'Cash In/Out' from the PoS menu and enter the reason"], "answer": 3, "explanation": "Cash In/Out ghi nhận tiền rút/nạp vào két trong phiên kèm lý do, giúp đối chiếu khi đóng session. Refund order là trả hàng cho khách, không phải chi tiền mặt.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "Where do you link a payment terminal (e.g. Adyen, Stripe) to a Point of Sale in Odoo 18?", "options": ["On the customer's contact form", "On the bank journal, in the Bank Account field", "On the payment method form, in the 'Use a Payment Terminal' field, after enabling the terminal in the PoS settings", "On the receipt header and footer settings"], "answer": 2, "explanation": "Sau khi bật terminal tương ứng trong PoS settings, chọn terminal ở trường Use a Payment Terminal trên payment method. Journal ngân hàng không chứa cấu hình thiết bị thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "A restaurant wants drinks to be printed at the bar and food at the kitchen. Which setting should be used?", "options": ["Use QR code on ticket", "Customer Display", "Preparation Printers, each printer linked to the relevant product categories", "Preparation Display with a single screen"], "answer": 2, "explanation": "Preparation Printers cho phép gán product category cho từng máy in để món in đúng nơi chế biến. Customer Display là màn hình cho khách xem.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "A shop runs a 'buy 2, get 1 free' offer on socks in the PoS. Which Discount & Loyalty program type is designed for this?", "options": ["Buy X Get Y", "eWallet", "Gift Card", "Next Order Coupons"], "answer": 0, "explanation": "Buy X Get Y tặng sản phẩm miễn phí khi mua đủ số lượng điều kiện. Next Order Coupons phát coupon dùng cho lần mua sau, không áp dụng ngay.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "A store wants customers who spend more than $100 to receive a coupon usable on their next purchase. Which program type should be used?", "options": ["Next Order Coupons", "Promotions", "Discount Code", "Loyalty Cards"], "answer": 0, "explanation": "Next Order Coupons phát coupon cho khách khi đơn đạt điều kiện, dùng ở lần mua tiếp theo. Promotions giảm giá ngay trên đơn hiện tại.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "Customers should be able to request an invoice themselves after purchase, using information printed on their receipt. Which setting enables this?", "options": ["Kiosk self-ordering mode", "Use QR code on ticket", "Flexible Pricelists", "Customer Account payment method"], "answer": 1, "explanation": "Use QR code on ticket in mã QR trên hóa đơn bán lẻ để khách tự yêu cầu invoice qua portal. Customer Account là phương thức ghi nợ, không liên quan đến tự xuất hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "'Log in with Employees' is enabled, but the 'Employees with basic access' and 'Employees with manager access' lists are left empty. Who can log in to the PoS?", "options": ["Only employees linked to a user account", "All employees", "Only the PoS managers", "Nobody"], "answer": 1, "explanation": "Theo cấu hình, nếu để trống danh sách nhân viên thì tất cả employee đều đăng nhập được vào PoS. Không có nghĩa là chặn toàn bộ.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "A restaurant applies different taxes for takeaway and eat-in orders. Which PoS setting should be used?", "options": ["Tax-included prices on products", "Flexible Pricelists", "Two separate products for each dish", "Flexible Taxes (fiscal positions selectable on the order)"], "answer": 3, "explanation": "Flexible Taxes cho phép chọn fiscal position trên đơn để ánh xạ sang thuế khác (mang đi/tại chỗ). Pricelist thay đổi giá, không thay đổi thuế.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 1, "subject": "CRM", "question": "A company wants incoming requests to be qualified before they appear in the sales pipeline. What must be done first?", "options": ["Activate \"Lead Mining\" in CRM settings", "Enable \"Rule-Based Assignment\" in CRM settings", "Enable the \"Leads\" option in CRM ‣ Configuration ‣ Settings", "Create a first pipeline stage called \"Lead\""], "answer": 2, "explanation": "Mặc định CRM chỉ có Opportunity; phải bật tùy chọn \"Leads\" trong CRM ‣ Configuration ‣ Settings thì mới có menu Leads và bước chuyển đổi Lead → Opportunity. Tạo stage tên \"Lead\" chỉ là một cột trong pipeline, không tạo ra bước sàng lọc riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/convert.html"}, {"set": 1, "subject": "CRM", "question": "With Predictive Lead Scoring, how is the automated Probability of an opportunity computed?", "options": ["From the Expected Revenue compared to the team's average deal size", "From the number of activities completed on the opportunity", "From the probability configured on each pipeline stage", "From the historical won/lost ratio of past leads that share the same values for the stage and the selected lead scoring fields"], "answer": 3, "explanation": "Predictive Lead Scoring dùng thống kê Bayes trên dữ liệu won/lost trong quá khứ (stage và các field được chọn qua \"Update Probabilities\", tính từ ngày bắt đầu). Odoo 18 không còn khái niệm xác suất cố định theo stage.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lead_scoring.html"}, {"set": 1, "subject": "CRM", "question": "A salesperson clicks \"Lost\" on an opportunity and selects a lost reason. What happens to the record?", "options": ["It is archived with a probability of 0% and the lost reason is stored on it", "It is permanently deleted from the database", "It is moved to a stage named \"Lost\" that must exist in the pipeline", "It is moved back to the first stage and reassigned to the team leader"], "answer": 0, "explanation": "Opportunity bị đánh dấu Lost sẽ được archive (active = False), probability về 0% và lưu Lost Reason; có thể tìm lại bằng bộ lọc Lost/Archived. Odoo không cần (và không dùng) một stage \"Lost\" riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lost_opportunities.html"}, {"set": 1, "subject": "CRM", "question": "How can a user merge several duplicate opportunities in Odoo 18 CRM?", "options": ["Archive all but one; archived duplicates are merged automatically by a scheduled action", "Select them in the list view and use Actions ‣ Merge", "Open CRM ‣ Configuration ‣ Duplicates and run the deduplication wizard", "Drag one opportunity card onto another in the Kanban view"], "answer": 1, "explanation": "Chọn các bản ghi trong list view rồi dùng Actions ‣ Merge để mở wizard gộp. Kéo thả thẻ Kanban chỉ đổi stage, không gộp bản ghi.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/convert.html"}, {"set": 1, "subject": "CRM", "question": "With Rule-Based Assignment enabled, where do you limit how many leads a specific salesperson can receive and which leads they get?", "options": ["On the salesperson's member record inside the sales team (assignment domain and average leads capacity on 30 days)", "On the UTM Source that generated the lead", "On each pipeline stage, using the Requirements field", "In the user's Preferences tab"], "answer": 0, "explanation": "Mỗi thành viên trong Sales Team có domain phân công riêng và \"Average Leads Capacity (on 30 days)\"; Odoo dựa vào đó để chia lead. Field Requirements của stage chỉ là ghi chú hiển thị tooltip.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lead_scoring.html"}, {"set": 1, "subject": "CRM", "question": "An opportunity has no customer set. The salesperson clicks \"New Quotation\". What happens?", "options": ["The quotation is created with the salesperson's company as customer", "Odoo blocks the action with an error until a customer is set", "The opportunity is automatically marked as won", "A dialog asks whether to create a new customer, link to an existing customer, or not link to a customer"], "answer": 3, "explanation": "Khi opportunity chưa có khách hàng, Odoo mở wizard cho chọn Create a new customer / Link to an existing customer / Do not link. Opportunity chỉ được đánh dấu Won khi báo giá được xác nhận hoặc bấm Won, không phải khi tạo báo giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 1, "subject": "CRM", "question": "A SaaS company wants to track Monthly Recurring Revenue (MRR) on its opportunities. What should be done?", "options": ["Set the Expected Revenue field and tick \"Is Won Stage\" on a monthly stage", "Enable \"Recurring Revenues\" in CRM settings, then set a Recurring Plan and recurring revenue on each opportunity", "Install the Subscriptions app; CRM cannot track recurring revenue", "Create a custom field \"MRR\" with Studio"], "answer": 1, "explanation": "Bật \"Recurring Revenues\" trong CRM ‣ Configuration ‣ Settings sẽ thêm field doanh thu định kỳ và Recurring Plan (Monthly, Yearly…) trên opportunity. Không cần app Subscriptions để theo dõi MRR trong pipeline.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 1, "subject": "CRM", "question": "A sales manager wants a \"Send follow-up email\" activity to be scheduled automatically as soon as a \"Call\" activity is marked as done. How is this configured?", "options": ["Set Chaining Type to \"Suggest Next Activity\" on the \"Call\" activity type", "Enable \"Rule-Based Assignment\" with a follow-up delay", "On the \"Call\" activity type, set Chaining Type to \"Trigger Next Activity\" and choose the follow-up activity type", "Create an automated action on the CRM stage"], "answer": 2, "explanation": "\"Trigger Next Activity\" tự động tạo activity tiếp theo khi activity hiện tại được Mark Done. \"Suggest Next Activity\" chỉ gợi ý để người dùng chọn, không tự động tạo.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/optimize/utilize_activities.html"}, {"set": 2, "subject": "CRM", "question": "A salesperson needs to belong to two different sales teams at the same time. What is required?", "options": ["Create a second user account for the salesperson", "Nothing; a user can always be in several teams by default", "Enable the \"Multi Teams\" option in CRM ‣ Configuration ‣ Settings", "Give the user the \"Administrator\" access right on Sales"], "answer": 2, "explanation": "Mặc định một salesperson chỉ thuộc một Sales Team; muốn thuộc nhiều team phải bật \"Multi Teams\". Không cần tạo thêm user hay quyền admin.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 2, "subject": "CRM", "question": "What happens when an opportunity is dragged into a pipeline stage that has \"Is Won Stage\" checked?", "options": ["The opportunity is archived", "A quotation is created automatically", "Nothing changes until the salesperson clicks \"Won\"", "The opportunity is considered won and its probability is set to 100%"], "answer": 3, "explanation": "Stage có \"Is Won Stage\" đánh dấu opportunity là thắng và đặt probability = 100%. Việc tạo báo giá là thao tác riêng (New Quotation), không tự động.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 2, "subject": "CRM", "question": "An opportunity marked as lost last month is now active again. How can the salesperson bring it back into the pipeline?", "options": ["Use the \"Lost\" filter to find it, open it, and click \"Restore\"", "Ask an administrator to restore it from the database backup", "Change its lost reason to \"Reopened\"", "Recreate it; lost opportunities cannot be recovered"], "answer": 0, "explanation": "Opportunity Lost chỉ bị archive nên có thể tìm bằng bộ lọc Lost rồi bấm Restore để đưa lại vào pipeline. Đổi Lost Reason không khôi phục bản ghi.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lost_opportunities.html"}, {"set": 2, "subject": "CRM", "question": "A company wants to generate new B2B leads from a database by choosing country, industry and company size. Which feature should be used?", "options": ["Mailing lists in Email Marketing", "Lead Mining (Lead Generation), which consumes IAP credits", "Predictive Lead Scoring", "Rule-Based Assignment"], "answer": 1, "explanation": "Lead Mining tạo lead mới từ cơ sở dữ liệu doanh nghiệp theo tiêu chí quốc gia, ngành, quy mô… và trừ IAP credits. Predictive Lead Scoring chỉ chấm điểm lead đã có.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/lead_mining.html"}, {"set": 2, "subject": "CRM", "question": "On a lead form, how does Odoo help a salesperson spot potential duplicates?", "options": ["Duplicates are blocked by a database constraint on the email field", "A red banner appears only after the lead is converted", "Duplicates are only detectable through the Lead Mining report", "A \"Similar Leads\" smart button shows other leads/opportunities with matching email, phone or company"], "answer": 3, "explanation": "Odoo hiển thị smart button \"Similar Leads\" khi phát hiện bản ghi trùng email/điện thoại/công ty để người dùng xem và merge. Odoo không chặn tạo trùng bằng constraint.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/convert.html"}, {"set": 2, "subject": "CRM", "question": "A company wants emails sent to sales@company.com to create opportunities in its \"Direct Sales\" team. Where is this configured?", "options": ["In the Email Alias field of the \"Direct Sales\" sales team", "In CRM ‣ Configuration ‣ Lost Reasons", "In Email Marketing ‣ Mailing Lists", "On each salesperson's user form"], "answer": 0, "explanation": "Mỗi Sales Team có Email Alias; email gửi đến alias sẽ tạo lead/opportunity thuộc team đó. Mailing Lists phục vụ gửi email marketing, không nhận email vào CRM.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/generate_from_email.html"}, {"set": 2, "subject": "CRM", "question": "Where does a manager choose which fields (e.g. country, source, tags) Predictive Lead Scoring uses, and from which date historical data is analysed?", "options": ["On each pipeline stage form", "CRM ‣ Configuration ‣ Settings, under Predictive Lead Scoring, via \"Update Probabilities\"", "On the Sales Team form, in the Assignment Rules tab", "In Settings ‣ Technical ‣ Scheduled Actions"], "answer": 1, "explanation": "Trong CRM Settings, mục Predictive Lead Scoring có nút \"Update Probabilities\" để chọn các field dùng tính xác suất và ngày bắt đầu lấy dữ liệu. Stage không có cấu hình này.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lead_scoring.html"}, {"set": 2, "subject": "CRM", "question": "A company wants to automatically create leads from companies browsing its website, identified by their IP address. Which feature is used?", "options": ["Lead Mining", "The website Contact Us form", "Visits to Leads (lead generation from website visits, using IAP credits)", "Rule-Based Assignment"], "answer": 2, "explanation": "\"Visits to Leads\" nhận diện công ty từ IP của khách truy cập website theo các rule cấu hình và tạo lead (tốn IAP credits). Lead Mining tìm lead từ cơ sở dữ liệu theo tiêu chí, không dựa trên lượt truy cập.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/lead_mining.html"}, {"set": 3, "subject": "CRM", "question": "When converting a lead into an opportunity, what extra option does the conversion wizard offer besides choosing the customer and salesperson?", "options": ["Create an invoice for the expected revenue", "Directly confirm a sales order", "Send a mass mailing to the lead", "Merge the lead with existing similar opportunities"], "answer": 3, "explanation": "Wizard Convert to Opportunity cho phép chọn \"Merge with existing opportunities\" khi có bản ghi tương tự, cùng với chọn team/salesperson và khách hàng. Wizard không tạo sales order hay hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/convert.html"}, {"set": 3, "subject": "CRM", "question": "A sales manager wants to see expected revenue grouped by expected closing month. Which report is designed for this?", "options": ["CRM ‣ Reporting ‣ Lead Mining Requests", "CRM ‣ Reporting ‣ Activities", "CRM ‣ Reporting ‣ Forecast", "CRM ‣ Configuration ‣ Sales Teams"], "answer": 2, "explanation": "Báo cáo Forecast hiển thị opportunity theo Expected Closing (theo tháng) để dự báo doanh thu. Báo cáo Activities phân tích hoạt động, không nhóm theo ngày đóng dự kiến.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/forecast.html"}, {"set": 3, "subject": "CRM", "question": "A salesperson manually changes the probability of an opportunity that uses Predictive Lead Scoring. What happens next?", "options": ["Odoo refuses the change; probability is read-only", "The probability stays at the manual value and is no longer updated automatically until the salesperson clicks the button to switch back to the automated probability", "The manual value is applied to all opportunities in the same stage", "The manual value is overwritten at the next stage change"], "answer": 1, "explanation": "Khi sửa tay, opportunity không còn dùng xác suất tự động; một nút (biểu tượng bánh răng) xuất hiện để quay về automated probability. Probability không phải read-only.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lead_scoring.html"}, {"set": 3, "subject": "CRM", "question": "Several duplicate opportunities are merged with the Merge wizard. What is the result?", "options": ["A single opportunity remains with the combined information and chatter history; the other records are removed", "All records are kept and linked together as \"siblings\"", "All records are archived and a new opportunity is created", "Only the chatter messages are copied; the duplicates stay active"], "answer": 0, "explanation": "Merge gộp thông tin và lịch sử chatter vào một bản ghi duy nhất, các bản ghi còn lại bị xóa. Odoo không giữ song song các bản trùng sau khi gộp.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/convert.html"}, {"set": 3, "subject": "CRM", "question": "In the pipeline Kanban view, the activity (clock) icon of an opportunity is red. What does it mean?", "options": ["The next scheduled activity is overdue", "The activity is due today", "The opportunity has no activity scheduled", "The opportunity's probability is below 10%"], "answer": 0, "explanation": "Màu biểu tượng activity: đỏ = quá hạn, cam = đến hạn hôm nay, xanh lá = trong tương lai. Không có activity thì biểu tượng màu xám.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/optimize/utilize_activities.html"}, {"set": 3, "subject": "CRM", "question": "A company has two sales teams and wants a pipeline stage that only one of them uses. How is this done?", "options": ["Archive the stage for the other team", "Fold the stage in the other team's Kanban view", "Set the Sales Team field on the stage (visible in developer mode); the stage then only appears in that team's pipeline", "Create the stage in CRM ‣ Configuration ‣ Settings"], "answer": 2, "explanation": "Stage có field Sales Team; nếu điền team thì stage chỉ hiển thị trong pipeline của team đó, để trống thì dùng chung. Fold chỉ thu gọn cột, stage vẫn tồn tại cho mọi team.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 3, "subject": "CRM", "question": "What is the purpose of the \"Requirements\" field on a CRM stage?", "options": ["It blocks moving an opportunity to the stage until the listed fields are filled", "It sets the default probability of the stage", "It defines which salespeople can see the stage", "It describes internal requirements for the stage and is displayed as a tooltip over the stage name in the pipeline"], "answer": 3, "explanation": "Requirements chỉ là ghi chú nội bộ, hiển thị dạng tooltip khi rê chuột lên tên stage; nó không ép buộc điều kiện nào. Odoo không chặn chuyển stage dựa vào field này.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 3, "subject": "CRM", "question": "A company wants each submission of its website \"Contact Us\" form to appear in the CRM. What should be configured?", "options": ["Enable Lead Mining in CRM settings", "Set the form's Action to \"Create an Opportunity\" in the website editor (CRM installed)", "Set the form's Action to \"Send an E-mail\" and add a mail filter", "Enable Predictive Lead Scoring"], "answer": 1, "explanation": "Trong website editor, form building block có field Action; chọn \"Create an Opportunity\" để mỗi lần gửi form tạo lead/opportunity trong CRM. \"Send an E-mail\" chỉ gửi email, không tạo bản ghi CRM.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/web_design/building_blocks/form.html"}, {"set": 1, "subject": "Marketing", "question": "A contact's email address has been added to the blacklist. What is the effect?", "options": ["All emails to this address, including invoices, are blocked", "The address only stops receiving emails from the mailing list it unsubscribed from", "The address no longer receives any mass mailing, whatever mailing list it belongs to", "The contact is archived and cannot be used on sales orders"], "answer": 2, "explanation": "Blacklist chặn mọi email marketing (mass mailing) tới địa chỉ đó trên tất cả danh sách; email giao dịch (hóa đơn, báo giá) vẫn gửi được. Hủy đăng ký một mailing list thì chỉ ảnh hưởng danh sách đó.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 1, "subject": "Marketing", "question": "When configuring an A/B test on a mailing in Email Marketing, which winner selection criterion is NOT available by default?", "options": ["Highest Reply Rate", "Lowest Bounce Rate", "Highest Click Rate", "Highest Open Rate"], "answer": 1, "explanation": "Các tiêu chí chọn winner mặc định gồm Manual, Highest Open Rate, Highest Click Rate, Highest Reply Rate (thêm tiêu chí theo doanh số/báo giá khi có app Sales/CRM). Không có tiêu chí Bounce Rate.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 1, "subject": "Marketing", "question": "Before launching a Marketing Automation campaign, a marketer wants to check the workflow on one record without waiting for the real delays. What should be used?", "options": ["Launch a Test: choose a record and run the activities manually", "Send the first email as a mass mailing test", "Enable developer mode and run the scheduled action", "Duplicate the campaign and set all intervals to 0"], "answer": 0, "explanation": "Nút \"Launch a Test\" cho phép chọn một bản ghi và chạy từng activity thủ công để kiểm tra workflow mà không ảnh hưởng chiến dịch thật. Đặt delay = 0 vẫn chạy trên toàn bộ participant thật.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation/testing_running.html"}, {"set": 1, "subject": "Marketing", "question": "In a Marketing Automation workflow, a reminder email must be sent 2 days after the welcome email only if the welcome email was not opened. How do you configure the reminder?", "options": ["Add it as a child with the trigger \"Mail: bounced\"", "Add it at the beginning of the workflow with a 2-day delay", "Create a separate campaign filtered on unopened emails", "Add it as a child activity of the welcome email with the trigger \"Mail: not opened\" and an interval of 2 days"], "answer": 3, "explanation": "Activity con với trigger \"Mail: not opened\" và delay 2 ngày sẽ chỉ chạy cho những người chưa mở email cha. Đặt ở đầu workflow thì gửi cho tất cả participant bất kể đã mở hay chưa.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation/workflow_activities.html"}, {"set": 1, "subject": "Marketing", "question": "What is required to send SMS campaigns with the SMS Marketing app?", "options": ["A connected social media account", "A dedicated outgoing mail server", "The Marketing Automation app", "Prepaid IAP credits for the SMS service"], "answer": 3, "explanation": "SMS gửi qua dịch vụ IAP của Odoo nên cần mua SMS credits. Mail server chỉ dùng cho email, không dùng cho SMS.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/sms_marketing.html"}, {"set": 1, "subject": "Marketing", "question": "An event organiser wants attendees to buy paid tickets directly on the website. Which Events setting must be enabled?", "options": ["Schedule & Tracks", "Online Ticketing", "Use Event Barcode", "Booth Management"], "answer": 1, "explanation": "\"Online Ticketing\" (website_event_sale) cho phép bán vé có phí qua eCommerce trên website. Booth Management dùng cho việc bán gian hàng (booth), không phải vé cho người tham dự.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/events/sell_tickets.html"}, {"set": 1, "subject": "Marketing", "question": "Which three UTM parameters does Odoo use to track where traffic and leads come from?", "options": ["Campaign, Medium and Source", "Channel, Category and Tag", "Source, Country and Language", "Campaign, Team and Salesperson"], "answer": 0, "explanation": "Odoo theo dõi theo ba tham số UTM: utm_campaign, utm_medium, utm_source. Sales Team hay Salesperson không phải tham số UTM.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing.html"}, {"set": 1, "subject": "Marketing", "question": "With Social Marketing, a marketer wants a post to be published automatically next Monday at 9:00 on several accounts. What should they do?", "options": ["Create a mailing with the social accounts as recipients", "Create one post per account and publish them manually on Monday", "Create one post, select the accounts, choose \"Schedule later\" and set the date and time", "Use a Marketing Automation workflow with a Social activity"], "answer": 2, "explanation": "Một bài đăng Social Marketing có thể chọn nhiều tài khoản và dùng \"Schedule later\" để đăng tự động vào thời điểm đã định. Không cần tạo bài riêng cho từng tài khoản.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/social_marketing.html"}, {"set": 2, "subject": "Marketing", "question": "A marketer wants to email all CRM opportunities tagged \"Trade Show\" without creating a mailing list. How?", "options": ["Export the opportunities and import them into a new mailing list", "Use the \"Send message\" button in the pipeline Kanban", "Set the mailing's Recipients to \"Lead/Opportunity\" and filter on that tag", "This is impossible; mailings can only target mailing lists"], "answer": 2, "explanation": "Field Recipients của mailing cho phép chọn model khác ngoài Mailing List (Contact, Lead/Opportunity, Event Registration…) kèm bộ lọc domain. Không bắt buộc phải tạo mailing list.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 2, "subject": "Marketing", "question": "How can website visitors subscribe themselves to a newsletter mailing list?", "options": ["Add a Newsletter building block to the website and link it to the mailing list", "Visitors must create a portal account first", "Enable \"Blacklist Option when Unsubscribing\"", "Use the \"Visits to Leads\" feature in CRM"], "answer": 0, "explanation": "Building block Newsletter trên website gắn với một mailing list, khách truy cập nhập email để tự đăng ký. Blacklist Option liên quan đến việc hủy đăng ký, không phải đăng ký.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing/mailing_lists.html"}, {"set": 2, "subject": "Marketing", "question": "Which Email Marketing setting lets you group mailings, SMS and social posts into campaigns with consolidated statistics?", "options": ["Split First and Last Name", "Mailing Campaigns", "24H Stat Mailing Reports", "Dedicated Server"], "answer": 1, "explanation": "Bật \"Mailing Campaigns\" để quản lý campaign (UTM) gom nhiều mailing/SMS/bài social và xem thống kê chung. Dedicated Server chỉ chọn mail server riêng để gửi email.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 2, "subject": "Marketing", "question": "In a Marketing Automation campaign targeting contacts, what is the purpose of the \"Unicity based on\" field?", "options": ["It defines which activity runs first", "It selects the mail server used for sending", "It sets the campaign's UTM source", "It prevents the same person (e.g. same email) from entering the workflow more than once"], "answer": 3, "explanation": "\"Unicity based on\" xác định field (vd. email) dùng để tránh một participant bị thêm vào campaign nhiều lần. Thứ tự activity do trigger và delay quyết định, không phải field này.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation/getting_started.html"}, {"set": 2, "subject": "Marketing", "question": "In a Marketing Automation workflow, which activity type should be used to update a field (e.g. add a tag) on the participant's record?", "options": ["Email", "SMS", "Server Action", "Mail: clicked"], "answer": 2, "explanation": "Activity loại Server Action chạy một hành động server (cập nhật field, thêm tag…) trên bản ghi. \"Mail: clicked\" là trigger, không phải loại activity.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation/workflow_activities.html"}, {"set": 2, "subject": "Marketing", "question": "An organiser runs the same type of workshop every month with identical tickets and reminder emails. What saves the most configuration time?", "options": ["Create an Event Template with the tickets and communications, then select it on each new event", "Create a recurring calendar event", "Configure a Marketing Automation campaign per workshop", "Duplicate the previous month's registrations"], "answer": 0, "explanation": "Event Template (Events ‣ Configuration ‣ Event Templates) lưu sẵn vé, lịch gửi email… và tự điền khi chọn trên event mới. Calendar recurring event không tạo vé hay đăng ký sự kiện.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/events/create_events.html"}, {"set": 2, "subject": "Marketing", "question": "A trade fair organiser wants exhibitors to book and pay for stands on the event website. Which setting should be enabled?", "options": ["Schedule & Tracks", "Community Chat Rooms", "Online Ticketing", "Booth Management"], "answer": 3, "explanation": "Booth Management cho phép định nghĩa gian hàng (booth) và bán/đặt chúng trên website. Online Ticketing bán vé cho người tham dự, không phải gian hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/events/event_booths.html"}, {"set": 2, "subject": "Marketing", "question": "When creating an SMS mailing, how do you allow recipients to stop receiving future SMS campaigns?", "options": ["Set the mailing list as private", "Tick \"Include opt-out link\" on the SMS mailing", "Enable \"Blacklist Option when Unsubscribing\" in Email Marketing", "Add \"STOP\" manually at the end of the text; Odoo has no option for this"], "answer": 1, "explanation": "SMS mailing có tùy chọn \"Include opt-out link\" để thêm link hủy đăng ký vào tin nhắn. Tùy chọn Blacklist trong Email Marketing chỉ áp dụng cho trang hủy đăng ký email.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/sms_marketing.html"}, {"set": 3, "subject": "Marketing", "question": "In Email Marketing, how can a marketer reuse the design of a successful past mailing for future mailings?", "options": ["Export the mailing as HTML and import it in Settings", "Save it as a Marketing Automation activity", "Mark the mailing as a favorite (star) so it appears among the templates when designing a new mailing", "Duplicate the mailing list"], "answer": 2, "explanation": "Mailing được đánh dấu Favorite (ngôi sao) sẽ xuất hiện trong danh sách
