n Odoo 18?", "options": ["One page per question, One page per section, One page with all the questions", "One page per question, One page per participant, One page per answer", "One page per section, One page per scoring level, One page with all the questions", "Only one page per question"], "answer": 0, "explanation": "Pagination có 3 lựa chọn: One page per question, One page per section, One page with all the questions. Các phương án khác không tồn tại.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 2, "subject": "Survey", "question": "An eLearning course must end with a certification exam. What is needed?", "options": ["Set the survey access mode to \"Anyone with the link\" and paste the link in the course description", "Enable Certifications in eLearning and add a Certification content", "Create a Live Session from the course", "Attach the survey PDF to the course"], "answer": 1, "explanation": "Khi bật Certifications trong eLearning, có thể thêm nội dung loại Certification gắn với survey certification vào khóa học. Dán link chỉ là liên kết ngoài, không ghi nhận tiến độ khóa học.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/scoring.html"}, {"set": 2, "subject": "Survey", "question": "In the survey results page, how can a manager analyse only the respondents who chose a specific answer to a question?", "options": ["Use the Scoring options", "Export results to Excel; filtering is not possible in Odoo", "Click the filter icon next to that answer to filter all results on it", "Create a new survey with only that question"], "answer": 2, "explanation": "Trang Results cho phép bấm biểu tượng lọc cạnh một đáp án để lọc toàn bộ kết quả theo những người đã chọn đáp án đó. Scoring chỉ liên quan chấm điểm.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/analysis.html"}, {"set": 2, "subject": "Website", "question": "A page must be accessible only to visitors who know a specific password. How is this configured?", "options": ["Set Visibility to \"Signed In\" and share a login", "Set its Visibility to \"With Password\"", "Unpublish the page and share a preview link", "Remove the page from the menu so only its URL works"], "answer": 1, "explanation": "Page properties có Visibility: All, Signed In, Restricted Group, With Password. \"Signed In\" yêu cầu đăng nhập chứ không phải mật khẩu riêng của trang.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages.html"}, {"set": 2, "subject": "Website", "question": "A company wants a menu item that opens a large dropdown with several columns of links and images. What should be created?", "options": ["A pop-up building block", "A sub-menu with many children", "A Mega Menu", "A new website"], "answer": 2, "explanation": "Mega Menu là dropdown lớn có thể thiết kế bằng building block (nhiều cột, ảnh). Sub-menu thông thường chỉ là danh sách link đơn giản.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages/menus.html"}, {"set": 2, "subject": "Website", "question": "Which statement about sitemap.xml and robots.txt in Odoo 18 is correct?", "options": ["Odoo does not support sitemaps", "The sitemap is regenerated only when a new theme is installed", "Both files must be uploaded manually by a developer through the Website settings", "sitemap.xml is generated automatically; robots.txt is editable in settings"], "answer": 3, "explanation": "Odoo tự sinh sitemap.xml từ các trang được index và cho phép chỉnh robots.txt trong Website settings (mục SEO). Không cần upload thủ công.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages/seo.html"}, {"set": 2, "subject": "Website", "question": "A company wants an automated chatbot to greet visitors on certain website pages. Where is the chatbot linked to those pages?", "options": ["In the CRM sales team form", "In the Live Chat channel rules (chatbot + URL regex)", "In Website ‣ Configuration ‣ Settings, Cookies Bar", "In the website editor, by adding a Chatbot building block"], "answer": 1, "explanation": "Chatbot tạo trong Live Chat ‣ Configuration ‣ Chatbots và được kích hoạt qua Channel Rules (chọn chatbot, URL regex, điều kiện hiển thị). Không có building block chatbot.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/livechat/chatbots.html"}, {"set": 2, "subject": "Website", "question": "How do you connect Google Analytics to an Odoo website?", "options": ["Enable Plausible and Google is added automatically", "Paste the tracking code in each page's meta description", "Install the Google Analytics app from the Apps menu", "Enable Google Analytics in Website settings and enter the Measurement ID"], "answer": 3, "explanation": "Trong Website ‣ Configuration ‣ Settings, bật Google Analytics và nhập Measurement ID (G-…). Plausible là công cụ phân tích riêng, không liên quan Google.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/reporting/analytics.html"}, {"set": 2, "subject": "Website", "question": "A company wants to change the theme of its existing website in Odoo 18. Where is this done?", "options": ["In the website editor's Theme tab, using \"Switch Theme\"", "In Apps, by uninstalling the website module", "In Website ‣ Configuration ‣ Settings, Default language", "It is not possible after the website is created"], "answer": 0, "explanation": "Tab Theme trong website editor có nút \"Switch Theme\" để đổi theme (lưu ý có thể mất các tùy chỉnh). Gỡ module website sẽ xóa toàn bộ website.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/web_design/themes.html"}, {"set": 2, "subject": "Website", "question": "What can be done from the record of a website visitor in Odoo?", "options": ["Change the website's theme for that visitor only", "See the passwords saved in their browser session", "See the pages they visited and contact them", "Assign them a pricelist for their next visit"], "answer": 2, "explanation": "Bản ghi Visitor cho thấy trang đã xem, quốc gia, lần truy cập cuối… và cho phép gửi email/SMS hoặc chat nếu đang online. Odoo không lưu mật khẩu người dùng dạng xem được.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/reporting/visitors.html"}, {"set": 2, "subject": "eCommerce", "question": "An attribute \"Material\" is used on products but must not appear as a filter in the shop sidebar. What should be changed?", "options": ["Set the attribute's eCommerce Filter Visibility to \"Hidden\"", "Delete the attribute from all products", "Unpublish the eCommerce category", "Set the attribute's Variants Creation Mode to \"Never\""], "answer": 0, "explanation": "Attribute có field eCommerce Filter Visibility (Visible/Hidden) quyết định có hiển thị trong bộ lọc shop hay không. Variants Creation Mode chỉ ảnh hưởng việc sinh biến thể.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/catalog.html"}, {"set": 2, "subject": "eCommerce", "question": "What is the difference between a Product Category and an eCommerce Category?", "options": ["They are the same model with different labels", "A product can belong to only one eCommerce Category, as for Product Categories", "eCommerce Categories control taxes on the website", "eCommerce Categories structure the shop; Product Categories are internal"], "answer": 3, "explanation": "eCommerce Category dùng để phân loại và lọc sản phẩm trên shop, một sản phẩm có thể thuộc nhiều category; Product Category là phân loại nội bộ cho kế toán/kho. Chúng là hai model khác nhau.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/catalog.html"}, {"set": 2, "subject": "eCommerce", "question": "A shop wants real-time shipping rates from a carrier displayed at checkout. What is required?", "options": ["Create a delivery method with a Fixed Price for each country", "Enter shipping costs as product variants", "The carrier's shipping connector as a delivery method", "Enable \"Extra Step During Checkout\""], "answer": 2, "explanation": "Shipping connector (FedEx, UPS, DHL, bpost, Easypost…) lấy giá vận chuyển thời gian thực từ hãng qua tài khoản hãng. Phương thức Fixed Price chỉ là giá cố định do mình tự nhập.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/setup_configuration.html"}, {"set": 2, "subject": "eCommerce", "question": "Where are Accessory Products shown to customers in an Odoo 18 shop?", "options": ["In a pop-up when the product is added to the cart", "At the bottom of the product page as alternatives", "Only in the customer portal after purchase", "In the cart review step, as suggested accessories before checkout"], "answer": 3, "explanation": "Accessory Products được gợi ý ở bước xem giỏ hàng (cart). Pop-up khi thêm vào giỏ là Optional Products, còn cuối trang sản phẩm là Alternative Products.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/cross_upselling.html"}, {"set": 2, "subject": "eCommerce", "question": "A shop wants customers to pay with Google Pay or Apple Pay directly from the cart, skipping the address forms. Which feature is used?", "options": ["Express Checkout on a compatible payment provider", "Extra Step During Checkout", "The \"Buy Now\" button on the product page", "Customer Accounts set to Disabled (guest checkout only)"], "answer": 0, "explanation": "Express Checkout dùng ví điện tử (Google Pay, Apple Pay) để lấy địa chỉ và thanh toán ngay, bật trên provider hỗ trợ bằng \"Allow Express Checkout\". Nút Buy Now chỉ bỏ qua giỏ hàng nhưng vẫn qua các bước checkout.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/payment_providers.html"}, {"set": 2, "subject": "eCommerce", "question": "Customers want to save products for later and compare technical specifications side by side. Which settings should be enabled?", "options": ["Product Variants and Pricelists", "Wishlists and Product Comparison Tool", "Shared Customer Accounts and Cookies Bar", "Optional Products and Accessory Products"], "answer": 1, "explanation": "Wishlists cho phép lưu sản phẩm yêu thích, Product Comparison Tool cho phép so sánh thuộc tính các sản phẩm. Optional/Accessory Products là tính năng bán kèm.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products.html"}, {"set": 2, "subject": "eCommerce", "question": "Which of the following is true about Alternative Products on an Odoo 18 product form?", "options": ["They are shown on the invoice and quotation as suggestions", "They replace the product automatically when it is out of stock", "They are suggested at the bottom of the product page", "They are added automatically to the cart with the main product"], "answer": 2, "explanation": "Alternative Products hiển thị ở cuối trang sản phẩm để khách cân nhắc sản phẩm khác (thường cao cấp hơn). Chúng không tự động thêm vào giỏ hay thay thế sản phẩm hết hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/cross_upselling.html"}, {"set": 2, "subject": "Project", "question": "In Odoo 18, how do you make sub-tasks available in a project?", "options": ["Enable 'Sub-tasks' in Project ‣ Configuration ‣ Settings", "Enable 'Task Dependencies' in the settings", "Convert the project into a project template", "Nothing, they are available by default"], "answer": 3, "explanation": "Từ Odoo 17, không còn setting Sub-tasks; sub-task luôn có sẵn trong tab Sub-tasks của task cha. Task Dependencies là tính năng khác (quan hệ chặn giữa các task).", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 2, "subject": "Project", "question": "Task B is blocked by task A through a task dependency, and task A is still in progress. Which state does Odoo 18 display on task B?", "options": ["Waiting", "Changes Requested", "Cancelled", "Approved"], "answer": 0, "explanation": "Khi task bị chặn bởi một task chưa đóng, Odoo tự đặt state là Waiting. Changes Requested và Approved là các state do người dùng chọn thủ công.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 2, "subject": "Project", "question": "Every time a 'Support Incident' service product is sold, a task must be created in the existing 'Support' project, without creating a new project. How should the product be configured?", "options": ["Create on Order: Project, with 'Support' as the project template", "Create on Order: Project & Task, with 'Support' as the project", "Create on Order: Task, with the 'Support' project selected on the product", "Create on Order: Nothing; tasks will come from the project's email alias"], "answer": 2, "explanation": "Giá trị 'Task' tạo task trong project được chọn sẵn trên product. 'Project' và 'Project & Task' đều tạo project mới khi xác nhận SO.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 2, "subject": "Project", "question": "The tasks of a project must be accessible to the customer through the portal. Which Visibility value must the project have?", "options": ["Invited internal users (private)", "Invited portal users and all internal users (public)", "All internal users", "Project manager only"], "answer": 1, "explanation": "Chỉ Visibility 'Invited portal users and all internal users (public)' mới cho phép portal user (khách hàng) truy cập task. Hai lựa chọn còn lại chỉ dành cho internal user.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/project_management/project_sharing.html"}, {"set": 2, "subject": "Project", "question": "A company wants every email sent to support@company.com to automatically create a task in its 'Support' project. Where is this configured?", "options": ["In Discuss ‣ Configuration ‣ Channels, on a support channel", "In the chatter of an existing task, via 'Send message'", "Nowhere: only the Helpdesk app can create records from emails", "On the project form, by setting its email alias"], "answer": 3, "explanation": "Mỗi project có email alias (tab Settings của project) — email gửi tới alias sẽ tạo task mới. Project hoàn toàn có thể nhận email, không cần Helpdesk.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 2, "subject": "Project", "question": "A manager wants to follow the projects themselves (not the tasks) in a kanban pipeline with columns such as 'To Do', 'In Progress' and 'Done'. What should be enabled?", "options": ["Project Stages", "Personal stages", "Milestones on each project", "Task Dependencies"], "answer": 0, "explanation": "Setting Project Stages cho phép nhóm các project theo stage trong kanban. Personal stages chỉ áp dụng cho task của từng user.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 2, "subject": "Project", "question": "In the Gantt view of Project (Odoo 18 Enterprise), what does a task need in order to be displayed as a bar on the timeline?", "options": ["Allocated time greater than zero", "A milestone", "A planned start date and a deadline", "At least two assignees and a milestone"], "answer": 2, "explanation": "Gantt của task dựa trên khoảng ngày kế hoạch (planned start date đến deadline). Task không có ngày sẽ là task chưa lên lịch; allocated time không quyết định vị trí trên timeline.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 2, "subject": "Timesheets", "question": "From a technical and accounting point of view, what is a timesheet entry in Odoo?", "options": ["An analytic line on the project's analytic account", "A journal entry in the Miscellaneous Operations journal", "A calendar event linked to the task", "An attendance record linked to the employee"], "answer": 0, "explanation": "Mỗi timesheet là một analytic line (account.analytic.line) trên analytic account của project, nên chi phí thời gian được phản ánh trong analytic accounting. Nó không tạo journal entry.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 2, "subject": "Timesheets", "question": "A customer buys a 'Support Pack - 20 hours' that must be invoiced in full immediately, regardless of the time actually spent, while the team still logs its time on tasks. Which invoicing policy fits the product?", "options": ["Based on Timesheets", "Based on Milestones", "Prepaid/Fixed Price", "Based on Delivered Quantity (Manual)"], "answer": 2, "explanation": "Prepaid/Fixed Price xuất hóa đơn theo ordered quantity ngay khi SO xác nhận, timesheet chỉ dùng để theo dõi. Based on Timesheets sẽ chỉ xuất hóa đơn số giờ thực tế đã ghi.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 2, "subject": "Timesheets", "question": "A company wants only timesheets that have been validated to be invoiced (and shown in the customer portal). Which setting achieves this?", "options": ["Encoding Method set to Days instead of Hours", "Timesheets Invoicing: Validated timesheets only", "Approver Reminder", "Project visibility set to Invited internal users (private)"], "answer": 1, "explanation": "Setting Timesheets Invoicing có hai lựa chọn: All recorded timesheets hoặc Validated timesheets only; lựa chọn sau chỉ xuất hóa đơn và hiển thị trên portal các timesheet đã validate.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 2, "subject": "Timesheets", "question": "A technician starts the timer on a Field Service task and stops it when the intervention is finished. What does Odoo create?", "options": ["An attendance record for the technician", "An expense for the technician's time", "A scheduled activity on the task", "A timesheet entry on the task"], "answer": 3, "explanation": "Timer trên task Field Service tạo timesheet trên task đó (project Field Service bật Timesheets sẵn). Attendance là chấm công vào/ra, không gắn với task.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/field_service.html"}, {"set": 2, "subject": "Timesheets", "question": "A support team wants to log timesheets directly on Helpdesk tickets. What must be done?", "options": ["Enable Timesheets on the Helpdesk team and select a project", "Create one project per ticket", "Enable timesheets in Helpdesk without any project, since tickets store time themselves", "Convert each ticket into a task"], "answer": 0, "explanation": "Bật Timesheets trên helpdesk team và chọn một project; timesheet của ticket sẽ được ghi vào project này (vì timesheet luôn là analytic line gắn với project).", "ref": "https://www.odoo.com/documentation/18.0/applications/services/helpdesk.html"}, {"set": 2, "subject": "Timesheets", "question": "Where is the cost used to value an employee's timesheets (for example in project profitability) defined?", "options": ["On the project's Invoicing tab", "In the cost of the service product sold", "In the Hourly Cost field on the employee form", "In the employee's working schedule"], "answer": 2, "explanation": "Chi phí timesheet = số giờ x Hourly Cost trên form nhân viên. Giá trên dòng SO là giá bán (doanh thu), không phải chi phí.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 2, "subject": "HR", "question": "HR wants to record each employee's language levels (A1 to C2) and track their progression. How should this be done?", "options": ["Use employee tags such as 'English C1'", "Use the Job Position field", "This is only possible with a custom field created in Studio", "A 'Languages' skill type with levels, set on the Resume tab"], "answer": 3, "explanation": "Employees ‣ Configuration ‣ Skill Types cho phép định nghĩa skill và các level kèm tỉ lệ tiến độ, sau đó gán cho nhân viên ở tab Resume. Tags không có khái niệm level.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 2, "subject": "HR", "question": "Which field determines where an employee appears in the organization chart?", "options": ["Manager", "Coach", "Department only", "Job Position"], "answer": 0, "explanation": "Org chart dựa trên trường Manager (quan hệ cấp trên - cấp dưới). Coach chỉ là người hướng dẫn, không quyết định vị trí trong sơ đồ.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 2, "subject": "HR", "question": "Employees should be able to request additional days for the time off type 'Compensatory Days' themselves. Which option must be set on that time off type (which requires allocation)?", "options": ["Requires allocation: No Limit", "Kind of Time Off: Worked Time", "Employee Requests: Extra Days Requests Allowed", "Approval: No Validation"], "answer": 2, "explanation": "Employee Requests = 'Extra Days Requests Allowed' cho phép nhân viên tự gửi yêu cầu allocation. Approval chỉ quy định mức duyệt, không bật khả năng yêu cầu.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 2, "subject": "HR", "question": "What makes a recruitment stage the one in which applicants are considered hired?", "options": ["The stage is folded in the kanban view", "The 'Hired Stage' checkbox is enabled on the stage", "It is the last stage in the sequence", "An email template is set on the stage"], "answer": 1, "explanation": "Checkbox Hired Stage đánh dấu stage tuyển dụng thành công (cập nhật ngày tuyển và số lượng tuyển). Vị trí cuối hay folded không quyết định điều này.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/recruitment.html"}, {"set": 2, "subject": "HR", "question": "A consultant pays travel costs during a customer project, and the company wants to re-invoice the customer for the actual amount spent. What should be configured?", "options": ["Set the expense category's Re-Invoice Costs to 'Sales price' and link the SO", "Set Paid By to 'Company' on the expense", "Log the amount as a timesheet", "Re-Invoice Costs 'At cost', with the expense linked to the SO"], "answer": 3, "explanation": "Re-Invoice Costs = 'At cost' xuất hóa đơn đúng số tiền thực chi, kèm liên kết expense với SO của khách (Customer to Reinvoice). 'Sales price' sẽ dùng giá bán cố định của category.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/expenses.html"}, {"set": 2, "subject": "HR", "question": "A company does not want small amounts of extra time (for example under 10 minutes per day) to be counted as overtime in Attendances. Which setting should be used?", "options": ["Tolerance Time In Favor Of Company", "Tolerance Time In Favor Of Employee", "Employee PIN Identification", "Attendance From Systray"], "answer": 0, "explanation": "Tolerance Time In Favor Of Company bỏ qua phần làm thêm nhỏ hơn ngưỡng (lợi cho công ty). Tolerance Time In Favor Of Employee là bỏ qua phần làm thiếu (lợi cho nhân viên).", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/attendances.html"}, {"set": 2, "subject": "HR", "question": "A fleet manager wants to be warned before vehicle contracts expire. Where is the delay for this alert configured?", "options": ["On the vehicle's odometer log", "In Fleet ‣ Configuration ‣ Models, per vehicle model", "In the Fleet settings (days before contract end)", "On each driver's employee form"], "answer": 2, "explanation": "Fleet ‣ Configuration ‣ Settings có tham số số ngày cảnh báo trước khi hợp đồng xe hết hạn (mặc định 30 ngày). Models chỉ khai báo mẫu xe.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/fleet.html"}, {"set": 2, "subject": "HR", "question": "Where are public holidays configured so that they are not deducted from employees' time off?", "options": ["On each employee's form", "Time Off ‣ Configuration ‣ Public Holidays", "In the Calendar app", "In the Accrual Plans"], "answer": 1, "explanation": "Public Holidays được khai báo tại Time Off ‣ Configuration ‣ Public Holidays và tự loại khỏi số ngày nghỉ bị trừ. Calendar app chỉ là lịch họp.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 2, "subject": "Studio", "question": "You add a Monetary field with Studio on a custom model that does not have a currency field yet. What does Studio do?", "options": ["It refuses to add the field", "It hardcodes the company currency in the view's widget options", "It converts the field into a Float field", "It creates a currency field and links the field to it"], "answer": 3, "explanation": "Field Monetary cần một field currency; Studio tự tạo x_studio_currency_id nếu model chưa có. Studio không đổi sang Float hay từ chối.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 2, "subject": "Studio", "question": "In a Studio approval rule, what does the 'Exclusive Approval' option do?", "options": ["The user who approves this rule cannot approve other rules for the same record", "Only one specific user can ever approve the rule", "Approval is required every time the record is saved", "The rule applies only to customers flagged as exclusive"], "answer": 0, "explanation": "Exclusive Approval: người đã duyệt rule này không thể duyệt các rule khác trên cùng bản ghi, đảm bảo nhiều người khác nhau phê duyệt.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/approval_rules.html"}, {"set": 2, "subject": "Studio", "question": "What is required to activate the Map view on a custom model with Studio?", "options": ["A date field for the start time", "A Monetary field with a currency", "A Many2one field to Contact", "The Geolocation module on every record"], "answer": 2, "explanation": "Map view định vị bản ghi theo địa chỉ của contact liên kết, nên model cần một Many2one tới Contact (res.partner). Field ngày dùng cho Calendar/Gantt.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 2, "subject": "Studio", "question": "What does a custom model need at minimum for Studio to activate a Calendar view?", "options": ["A Many2one field to Users", "A date or datetime field used as the start date", "A stage field", "A monetary field"], "answer": 1, "explanation": "Calendar view cần ít nhất một field date/datetime làm ngày bắt đầu. Stage dùng cho kanban, không bắt buộc cho calendar.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 2, "subject": "Studio", "question": "When a record is created, an automation rule must send its data to an external system's URL. Which action type should be used?", "options": ["Execute Code", "Send Email", "Create Activity", "Send Webhook Notification"], "answer": 3, "explanation": "Action 'Send Webhook Notification' gửi POST dữ liệu bản ghi tới URL ngoài. Execute Code chạy trong sandbox không được import thư viện HTTP, Send Email chỉ gửi email.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 2, "subject": "Studio", "question": "With Studio, you want to add a new tab to a form view. What do you drag onto the form?", "options": ["The 'Tabs' component", "The 'Columns' component", "A 'Lines' field", "A 'Notes' field"], "answer": 0, "explanation": "Trong tab Add của Studio, component Tabs tạo notebook/tab mới trên form. Columns chỉ chia bố cục thành cột.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 2, "subject": "Studio", "question": "Users want to create and edit records directly in a list view, without opening the form. What should be done with Studio?", "options": ["Enable 'Show Invisible Elements'", "Add a Lines field to the list view", "Make the list editable in place", "Enable mass editing on the list only"], "answer": 2, "explanation": "Thuộc tính editable của list view cho phép tạo/sửa trực tiếp trên dòng (thêm bản ghi ở đầu hoặc cuối). Show Invisible Elements chỉ hiện các phần tử ẩn khi đang chỉnh sửa trong Studio.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 2, "subject": "Studio", "question": "How does Studio store the changes you make to a standard Odoo view?", "options": ["It overwrites the original view's XML in the database", "In an inheriting view, leaving the original intact", "In a system parameter", "In the browser's local storage"], "answer": 1, "explanation": "Studio lưu thay đổi vào view kế thừa (inherited view) riêng, view gốc giữ nguyên nên việc nâng cấp module không ghi đè customization.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio.html"}, {"set": 2, "subject": "Studio", "question": "Which Odoo Online pricing plan includes the Studio app?", "options": ["Custom", "Standard", "One App Free", "None: Studio is never available on Odoo Online"], "answer": 0, "explanation": "Studio chỉ có trong gói Custom (cùng với multi-company, external API). Gói Standard và One App Free không bao gồm Studio.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio.html"}, {"set": 3, "subject": "Accounting", "question": "A company pays the same monthly rent and wants Odoo to post the recurring journal entry automatically each month. Which feature should be used on the journal entry?", "options": ["The Deferred Expense setting with Manually & Grouped", "A payment term of 30 days", "The 'Auto-post' field set to Monthly", "A reconciliation model"], "answer": 2, "explanation": "Trường Auto-post (At Date/Monthly/Quarterly/Yearly) trên bút toán cho phép Odoo tự tạo và post bút toán định kỳ. Payment term chỉ dùng cho hạn thanh toán của hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/get_started.html"}, {"set": 3, "subject": "Accounting", "question": "A payment is registered on a customer invoice through a bank journal whose payment method uses an Outstanding Receipts account. The bank statement has not been imported yet. What is the invoice status?", "options": ["In Payment", "Posted", "Paid", "Partial"], "answer": 0, "explanation": "Khi thanh toán ghi nhận vào tài khoản Outstanding Receipts, hóa đơn ở trạng thái 'In Payment' cho đến khi dòng sao kê ngân hàng được đối soát với thanh toán, lúc đó mới chuyển thành 'Paid'.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments.html"}, {"set": 3, "subject": "Accounting", "question": "What is the main benefit of Online Bank Synchronization in Odoo Accounting?", "options": ["Vendor bills are digitized automatically from scanned PDFs sent by the bank", "Customer invoices are automatically paid by SEPA direct debit mandates", "Bank transactions are imported automatically, ready to be reconciled", "The bank reconciles invoices on its side and sends the result to Odoo"], "answer": 2, "explanation": "Bank synchronization tự động nhập giao dịch ngân hàng vào journal Bank để người dùng đối soát trong Odoo. Số hóa hóa đơn (OCR) là tính năng khác.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/bank/bank_synchronization.html"}, {"set": 3, "subject": "Accounting", "question": "A company receives about 40 customer checks every week and wants to deposit them together and match one single line on the bank statement. Which feature should be enabled?", "options": ["Cash Basis", "Analytic Distribution Models", "Dedicated Credit Note Sequence", "Batch Payments"], "answer": 3, "explanation": "Batch Payments gom nhiều khoản thanh toán thành một lô để đối soát với một dòng sao kê duy nhất. Các tính năng còn lại không liên quan đến gom thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments/batch.html"}, {"set": 3, "subject": "Accounting", "question": "In the deferred revenue settings, which 'Based on' option makes the monthly amount vary according to the number of days in each month?", "options": ["Months", "Days", "Manually & Grouped", "Full Months"], "answer": 1, "explanation": "Với 'Days', số tiền phân bổ mỗi tháng thay đổi theo số ngày trong tháng. 'Months' chia đều theo tháng (chỉ prorate tháng lẻ), 'Full Months' coi mọi tháng bắt đầu là tháng đầy đủ.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/deferred_revenues.html"}, {"set": 3, "subject": "Accounting", "question": "A company sells a machine that is still being depreciated. What is the recommended way to record this in Odoo?", "options": ["Use 'Modify Depreciation' to set the remaining value to zero on the sale date", "Archive the asset and delete its remaining depreciation entries manually", "Use 'Sell or Dispose' on the asset and link the customer invoice line", "Create a credit note on the original vendor bill for the residual value"], "answer": 2, "explanation": "Nút 'Sell or Dispose' tạo bút toán thanh lý, tính lãi/lỗ dựa trên giá trị còn lại so với giá bán (hóa đơn bán phải được post trước). 'Modify Depreciation' dùng để tăng/giảm giá trị, không phải bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/vendor_bills/assets.html"}, {"set": 3, "subject": "Accounting", "question": "A fiscal position for intra-EU B2B customers maps 'VAT 21% (sales)' to 'VAT 0% EU'. What does this mapping do?", "options": ["It converts all invoice amounts into the customer's currency at the daily rate", "It replaces the default customer tax on all products permanently in their settings", "It blocks invoices to EU customers who have no valid VAT number on their contact", "On orders/invoices using this fiscal position, 21% is replaced by the 0% EU tax"], "answer": 3, "explanation": "Fiscal position ánh xạ thuế (và tài khoản) trên chứng từ khi được áp dụng, không thay đổi thuế mặc định trên sản phẩm. Việc đổi tiền tệ do pricelist/tiền tệ chứng từ quyết định.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes/fiscal_positions.html"}, {"set": 3, "subject": "Accounting", "question": "A EUR-based company posts a vendor bill in GBP. Which exchange rate does Odoo use to compute the company-currency amounts of the bill?", "options": ["The rate entered on the vendor's contact form", "The rate valid at the bill/accounting date", "The rate of the date when the bill will be paid", "The average rate of the fiscal year"], "answer": 1, "explanation": "Odoo quy đổi theo tỷ giá có hiệu lực tại ngày chứng từ; chênh lệch khi thanh toán ở ngày khác được ghi bằng bút toán exchange difference. Không có tỷ giá trên form liên hệ.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/get_started/multi_currency.html"}, {"set": 3, "subject": "Accounting", "question": "A key customer must never receive automatic reminders; the account manager wants to handle follow-ups personally. Where is this set?", "options": ["Delete the follow-up levels in Accounting ‣ Configuration ‣ Follow-up Levels", "Set a credit limit of zero on the customer", "Remove all payment terms from the customer's Sales & Purchase tab", "On the customer form, set the follow-up Reminders to Manual"], "answer": 3, "explanation": "Trong tab Accounting của khách hàng, phần Invoice follow-ups cho phép chọn Automatic hoặc Manual và người phụ trách. Xóa follow-up levels sẽ ảnh hưởng tất cả khách hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments/follow_up.html"}, {"set": 3, "subject": "Accounting", "question": "The 'Analytic' field is not visible on invoice lines in a new database. What must be done first?", "options": ["Enable 'Analytic Accounting' in Accounting ‣ Configuration ‣ Settings", "Install the Budget module", "Create a cost-center journal", "Activate developer mode"], "answer": 0, "explanation": "Trường Analytic Distribution chỉ xuất hiện khi bật Analytic Accounting trong Settings (mục Analytics). Developer mode không cần thiết cho việc này.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/analytic_accounting.html"}, {"set": 3, "subject": "Sales", "question": "A customer needs an invoice-like document before confirming the order so it can pay in advance. Which Sales setting allows sending this document?", "options": ["Pro-Forma Invoice", "Customer Addresses", "Lock Confirmed Sales", "Down Payments product"], "answer": 0, "explanation": "Pro-Forma Invoice cho phép gửi hóa đơn chiếu lệ từ báo giá mà không tạo bút toán kế toán. Lock Confirmed Sales chỉ khóa đơn đã xác nhận.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 3, "subject": "Sales", "question": "A T-shirt has an attribute 'Size' with value 'XXL'. The XXL variant must cost 3 € more than the base price. Where is this configured?", "options": ["In a separate product with its own sales price", "As an optional product", "As the Value Price Extra of the XXL value (via Configure on the product's Attributes & Variants tab)", "On the customer's pricelist only"], "answer": 2, "explanation": "Value Price Extra trên giá trị thuộc tính cộng thêm vào giá bán khi chọn giá trị đó. Tạo sản phẩm riêng sẽ mất lợi ích quản lý variant.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/products/variants.html"}, {"set": 3, "subject": "Sales", "question": "A sales manager wants to see the profit (sales price minus cost) on each quotation before confirming it. Which setting should be enabled?", "options": ["Margins", "Sale Warnings", "Pro-Forma Invoice", "Discounts"], "answer": 0, "explanation": "Margins hiển thị biên lợi nhuận trên dòng và tổng báo giá dựa trên giá vốn. Discounts chỉ thêm cột giảm giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 3, "subject": "Sales", "question": "A B2B customer has a head office receiving invoices and several warehouses receiving goods. Which Sales setting makes the Invoice Address and Delivery Address fields available on quotations?", "options": ["Pricelists", "Multi-Warehouses", "Dropshipping", "Customer Addresses"], "answer": 3, "explanation": "Bật Customer Addresses cho phép chọn địa chỉ xuất hóa đơn và địa chỉ giao hàng riêng trên báo giá. Multi-Warehouses là kho của công ty, không phải địa chỉ khách hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 3, "subject": "Sales", "question": "A quotation is emailed to the customer with 'Send by Email'. What is its status after sending, before confirmation?", "options": ["Sales Order", "Locked", "To Invoice", "Quotation Sent"], "answer": 3, "explanation": "Sau khi gửi email, báo giá chuyển sang trạng thái 'Quotation Sent'; chỉ khi xác nhận mới thành 'Sales Order'. 'To Invoice' là trạng thái hóa đơn chứ không phải trạng thái đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations.html"}, {"set": 3, "subject": "Sales", "question": "A marketing team wants to generate 500 unique single-use codes, each giving 10% off, to distribute at a trade fair. Which program type fits best?", "options": ["eWallet", "Coupons", "Promotions", "Loyalty Cards"], "answer": 1, "explanation": "Chương trình Coupons sinh ra các mã riêng, dùng một lần để phân phát. Promotions áp dụng tự động theo điều kiện, không cần sinh mã riêng cho từng người.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/loyalty_discount.html"}, {"set": 3, "subject": "Sales", "question": "In Odoo 18, what happens when a salesperson adds a product that has optional products configured to a quotation line?", "options": ["The optional products are added automatically with quantity 1", "A configurator dialog proposes the optional products", "Odoo blocks the line until optional products are selected", "Nothing; optional products only appear on the customer invoice"], "answer": 1, "explanation": "Khi sản phẩm có optional products, product configurator hiện lên để đề xuất thêm các sản phẩm tùy chọn. Chúng không tự động được thêm vào đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/optional_products.html"}, {"set": 3, "subject": "Sales", "question": "A pricelist rule should give 15% off a product only when a customer orders at least 50 units. Which field of the rule handles this?", "options": ["Price Extra", "Validity end date", "Min. Quantity", "Rounding Method"], "answer": 2, "explanation": "Min. Quantity trên quy tắc pricelist làm quy tắc chỉ áp dụng khi số lượng đặt đạt ngưỡng. Price Extra thuộc về giá trị thuộc tính variant.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/prices/pricing.html"}, {"set": 3, "subject": "Sales", "question": "A consulting firm sells a service whose hours are tracked in the Timesheets app, and wants to invoice exactly the hours recorded. Which invoicing policy should be set on the service product?", "options": ["Based on Timesheets", "Prepaid/Fixed Price", "Based on Milestones", "Ordered quantities with a down payment"], "answer": 0, "explanation": "Based on Timesheets lấy số giờ ghi nhận trên timesheet làm số lượng đã giao để lập hóa đơn. Prepaid/Fixed Price lập hóa đơn theo số lượng đặt bất kể giờ thực tế.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Purchase", "question": "The default Bill Control policy in Purchase settings is 'Received quantities', but one subscription service must be billed on ordered quantities. What should be done?", "options": ["Create the bill from Accounting without a PO", "Use a call for tenders", "Change the Control Policy on that product's Purchase tab", "Change the global setting each time"], "answer": 2, "explanation": "Chính sách trong Settings chỉ là mặc định cho sản phẩm mới; có thể ghi đè bằng trường Control Policy trên tab Purchase của từng sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 3, "subject": "Purchase", "question": "Under the 'Received quantities' policy, a user clicks 'Create Bill' on a confirmed PO before anything is received. What happens?", "options": ["Odoo raises an error since there is nothing to bill", "The receipt is automatically validated", "A bill for the full ordered quantity is created", "A bill with a 'To Approve' status is created"], "answer": 0, "explanation": "Với Received quantities, chưa nhận hàng thì không có gì để lập hóa đơn nên Odoo báo lỗi. Odoo không tự xác nhận phiếu nhập kho.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 3, "subject": "Purchase", "question": "A buyer wants Odoo to automatically email selected vendors a few days before the expected arrival date to confirm the delivery. Which feature is used?", "options": ["Receipt Reminder", "Lock Confirmed Orders", "Follow-up Levels", "Purchase Order Approval"], "answer": 0, "explanation": "Receipt Reminder gửi email cho nhà cung cấp trước ngày dự kiến nhận hàng (số ngày cấu hình được). Follow-up Levels là nhắc nợ khách hàng trong Accounting.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/manage.html"}, {"set": 3, "subject": "Purchase", "question": "A buyer creates a blanket order, adds products and quantities but leaves the Unit Price empty, and leaves 'Agreement Validity' empty. What is the result?", "options": ["The agreement cannot be confirmed without an end date", "Prices stay at 0 and the agreement has no expiry date", "Prices are taken from the product's sales price at confirmation", "Prices are copied from the product cost, and the agreement expires after one year"], "answer": 1, "explanation": "Giá trong blanket order không tự lấy từ giá sản phẩm nên để trống sẽ là 0; Agreement Validity để trống nghĩa là thỏa thuận không hết hạn.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/blanket_orders.html"}, {"set": 3, "subject": "Purchase", "question": "A buyer already has two independent RFQs for the same need, created before she learned about alternatives. How can she group them for comparison?", "options": ["It is not possible; only new alternatives can be compared", "Duplicate one into a blanket order", "Merge them with the Replenishment report", "From the Alternatives tab of one RFQ, use 'Link to Existing RfQ'"], "answer": 3, "explanation": "'Link to Existing RfQ' trong tab Alternatives liên kết RFQ có sẵn làm phương án thay thế để so sánh. Không cần tạo lại RFQ mới.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/calls_for_tenders.html"}, {"set": 3, "subject": "Purchase", "question": "A product has the 'Buy' and 'Replenish on Order (MTO)' routes. A sales order for it is confirmed. What does Odoo generate?", "options": ["Nothing until a reordering rule is triggered", "A manufacturing order for the quantity sold", "An RFQ to the product's vendor", "A draft vendor bill for the vendor"], "answer": 2, "explanation": "Kết hợp MTO và Buy khiến Odoo tạo RFQ cho nhà cung cấp ngay khi xác nhận đơn bán. Không cần reordering rule.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/mto.html"}, {"set": 3, "subject": "Purchase", "question": "Where is the vendor's delivery lead time entered so that Odoo can compute the expected arrival date on RFQs?", "options": ["In the Purchase Order Approval setting, as a minimum delay", "On the vendor's Accounting tab, next to the bank accounts", "On the vendor payment term, as the number of days due", "In the Delivery Lead Time of the product's vendor line"], "answer": 3, "explanation": "Delivery Lead Time trên dòng vendor pricelist được dùng để tính ngày dự kiến nhận hàng và thời điểm đặt hàng. Payment term chỉ liên quan đến thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/products/pricelist.html"}, {"set": 3, "subject": "Purchase", "question": "A product is sold by the unit but bought from the vendor in boxes of 12. How is this handled in Odoo 18?", "options": ["Create two different products and link them with a kit BoM", "Enable Units of Measure and set a different Purchase UoM on the product", "Use a variant attribute 'Box of 12' with a price extra", "Set a minimum quantity of 12 on the vendor pricelist line of the product"], "answer": 1, "explanation": "Với Units of Measure bật, sản phẩm có thể có Purchase UoM khác đơn vị bán; Odoo tự quy đổi khi nhập kho. Tạo hai sản phẩm riêng gây khó khăn quản lý tồn kho.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/products/uom.html"}, {"set": 3, "subject": "Spreadsheet", "question": "A user types =PIVOT(1,,0) in an empty cell. What does this produce?", "options": ["Only the first value of pivot 1, in the active cell", "A dynamic pivot table of pivot 1, without totals", "An error, because PIVOT requires a measure name as argument", "A static copy of pivot 1 pasted as plain values"], "answer": 1, "explanation": "PIVOT là hàm mảng tạo pivot động tự mở rộng; tham số include_total = 0 bỏ dòng/cột tổng. Lấy một giá trị đơn lẻ dùng PIVOT.VALUE.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/dynamic_pivot_tables.html"}, {"set": 3, "subject": "Spreadsheet", "question": "A sales dashboard must show each salesperson only their own figures by default. Which global filter setup helps?", "options": ["A Text filter in which each user types their own name", "Separate copies of the spreadsheet shared with each salesperson", "A Date filter with a relative period such as 'This month'", "A User relation filter defaulting to the current user"], "answer": 3, "explanation": "Relation filter trên model User có tùy chọn mặc định lọc theo người dùng hiện tại. Text filter yêu cầu nhập tay, Date filter không lọc theo người dùng.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/global_filters.html"}, {"set": 3, "subject": "Spreadsheet", "question": "A user uploads an Excel (.xlsx) file to Documents and opens it with Odoo Spreadsheet. By default, what happens to the original .xlsx file?", "options": ["It is converted into a spreadsheet template in the Documents app", "It is shared externally with the users who can access the folder", "It is sent to the trash, unless 'Send source file to trash' is disabled", "It is kept in the same folder and stays linked live to the new spreadsheet"], "answer": 2, "explanation": "Khi mở file xlsx bằng Odoo Spreadsheet, file gốc mặc định bị chuyển vào thùng rác; có thể tắt 'Send source file to trash' để giữ lại. File gốc không liên kết động với spreadsheet.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/get_started.html"}, {"set": 3, "subject": "Spreadsheet", "question": "A viewer opens a shared spreadsheet that has cell comments added by editors. What does the viewer see?", "options": ["All comments, in read-only mode without the reply box", "No comments; only Owners and Editors see comments", "Only the comments in which they are mentioned with @", "Only resolved comments, kept as a read-only history"], "answer": 1, "explanation": "Comments chỉ dành cho Owner và Editor; Viewer không thấy comment. Comment đã resolve vẫn nằm trong panel Comments cho Owner/Editor.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/share_collaborate.html"}, {"set": 3, "subject": "Spreadsheet", "question": "An administrator wants to customize the standard Sales dashboard without losing the changes at the next Odoo upgrade. What is recommended?", "options": ["Edit the standard dashboard directly; changes are kept on upgrade", "Download it as .xlsx, edit it in Excel and re-upload it over the original", "Use File ‣ Make a copy and customize the copy", "Save it as a template, then delete the original"], "answer": 2, "explanation": "Dashboard chuẩn được cài lại ở mỗi lần nâng cấp phiên bản nên sửa trực tiếp sẽ mất thay đổi; nên tạo bản sao (Make a copy) rồi tùy chỉnh.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/dashboards/build_and_customize_dashboards.html"}, {"set": 3, "subject": "Spreadsheet", "question": "In a dynamic pivot's properties panel, a manager wants a new measure 'Margin %' computed from two existing measures. What can be used?", "options": ["Add a calculated measure in the Measures section", "Use Flip axes so the measures are combined into one column", "Create a new field in the Sales model with Studio only", "Add a Text global filter named 'Margin %' to the pivot"], "answer": 0, "explanation": "Trong mục Measures có thể Add calculated measure, nhập công thức bắt đầu bằng '=' và chọn cách tổng hợp. Flip axes chỉ hoán đổi hàng và cột.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/dynamic_pivot_tables.html"}, {"set": 3, "subject": "Inventory", "question": "You create a new warehouse with the Short Name 'SG'. What does Odoo create automatically?", "options": ["A location hierarchy (e.g. SG/Stock) plus operation types and routes", "Only operation types; the SG/Stock location must be created manually", "Only a view location; operation types must be created manually", "A new company named SG, with its own chart of accounts"], "answer": 0, "explanation": "Khi tạo warehouse, Odoo tự sinh view location SG, các sub-location như SG/Stock và các operation type/route tương ứng. Không cần tạo thủ công và không tạo company mới.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "Which location type is used only to structure the location hierarchy and cannot contain products?", "options": ["Internal Location", "Inventory Loss", "View", "Transit Location"], "answer": 2, "explanation": "Location loại View chỉ dùng để tổ chức cây vị trí (ví dụ WH), không chứa hàng. Internal Location là nơi chứa tồn kho thực.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "High-value shelves must be counted every 30 days, with count dates scheduled automatically. What should be configured?", "options": ["Create a reordering rule with a 30-day lead time", "Set the Annual Inventory Day and Month in the Inventory settings", "Set the Inventory Frequency (days) to 30 on those locations", "Set a removal strategy on the shelves"], "answer": 2, "explanation": "Inventory Frequency trên location tự động đặt ngày kiểm kê theo chu kỳ (cycle count). Annual Inventory Day and Month chỉ áp dụng cho kiểm kê hằng năm toàn công ty.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "Which removal strategy picks products from the location whose name comes first in alphanumeric order?", "options": ["Closest Location", "Least Packages", "First In, First Out (FIFO)", "Last In, First Out (LIFO)"], "answer": 0, "explanation": "Closest Location ưu tiên lấy hàng từ location có tên đứng trước theo thứ tự chữ-số. Least Packages ưu tiên lấy từ ít package nhất, không theo tên location.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "A reordering rule has its Trigger set to 'Manual'. What is the behaviour?", "options": ["An RFQ is created and confirmed immediately when stock drops below the minimum", "The scheduler creates the order once a day as with an 'Auto' trigger", "The rule is ignored everywhere, including the Replenishment report", "Nothing runs automatically; a user orders it from the Replenishment report"], "answer": 3, "explanation": "Trigger Manual nghĩa là scheduler không tự tạo RFQ/MO; người dùng xem nhu cầu ở Replenishment và bấm đặt hàng. Tự động chạy theo scheduler là hành vi của trigger Auto.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "A product uses FIFO. You receive 5 units at $8, then 5 units at $12. You then deliver 6 units. What is the value of the delivered goods?", "options": ["$72", "$52", "$48", "$60"], "answer": 1, "explanation": "FIFO xuất các đơn vị nhập trước: 5 × $8 + 1 × $12 = $52. $60 là cách tính bình quân (AVCO), không phải FIFO.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "A product category uses Inventory Valuation = 'Manual'. What does this mean?", "options": ["The costing method is forced to Standard Price and cannot be changed", "Every stock move posts a journal entry to the stock valuation account in real time", "Vendor bills cannot be created for these products until they are received", "Stock moves create no journal entries; the accountant values stock manually"], "answer": 3, "explanation": "Manual (periodic) không sinh bút toán khi có stock move, kế toán tự ghi nhận giá trị tồn kho định kỳ. Ghi bút toán thời gian thực là chế độ Automated.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "Freight costs on a receipt must be distributed among the products according to how heavy each one is. Which split method should be used on the landed cost line?", "options": ["By Current Cost", "By Weight", "Equal", "By Quantity"], "answer": 1, "explanation": "Split method By Weight phân bổ chi phí theo trọng lượng sản phẩm. Equal chia đều cho các dòng bất kể khối lượng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "Warehouse B must be replenished from Warehouse A. What is the quickest way to set this up (Multi-Step Routes enabled)?", "options": ["Set 'Resupply From' to Warehouse A on Warehouse B's form", "Create a putaway rule from Warehouse A to Warehouse B", "Enable the Dropship route on the products, with Warehouse A as vendor", "Create a vendor contact for Warehouse A and buy from it with RFQs"], "answer": 0, "explanation": "Trường Resupply From trên warehouse tự tạo route tiếp hàng giữa các kho, dùng được trên sản phẩm hoặc reordering rule. Putaway rule chỉ hoạt động bên trong một kho khi nhập hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Inventory", "question": "Putaway rules must not store more than 500 kg on a given rack. What should be configured?", "options": ["A removal strategy on the rack location with a 500 kg limit", "A Storage Category (max weight) on the rack location", "A reordering rule on the rack location with a Max Quantity of 500", "A Package Type with a maximum weight of 500 kg for the rack"], "answer": 1, "explanation": "Storage Category cho phép giới hạn tải trọng/sức chứa của location, và putaway rule sẽ bỏ qua location đã đầy. Package Type mô tả bao bì, không giới hạn sức chứa của kệ.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html"}, {"set": 3, "subject": "Manufacturing", "question": "A manufacturing order should be considered ready as soon as the components needed for its first operation are available. Which BoM field should be set?", "options": ["Operation Dependencies ticked", "Manufacturing Readiness = 'When components for 1st operation are available'", "Manufacturing Lead Time = 0", "Flexible Consumption = 'Allowed'"], "answer": 1, "explanation": "Manufacturing Readiness quyết định MO được coi là sẵn sàng khi đủ toàn bộ component hay chỉ cần đủ component cho operation đầu tiên. Flexible Consumption liên quan đến số lượng tiêu thụ, không phải tình trạng sẵn sàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "A confirmed manufacturing order contains work orders. Which button schedules these work orders on the work centers' calendars?", "options": ["Plan", "Check availability", "Produce All", "Unlock"], "answer": 0, "explanation": "Nút Plan lên lịch các work order theo công suất và lịch của work center. Check availability chỉ kiểm tra/giữ component.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "With subcontracting, components must automatically be sent from your warehouse to the subcontractor when you purchase the finished product. Which route should be set on the components?", "options": ["Resupply Subcontractor on Order", "Replenish on Order (MTO)", "Manufacture", "Dropship"], "answer": 0, "explanation": "Route Resupply Subcontractor on Order tạo phiếu xuất component từ kho đến subcontractor khi PO thành phẩm được xác nhận. Dropship dùng khi nhà cung cấp giao thẳng cho khách.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "You want to update a manufactured product's cost based on its components and operations. What can you use?", "options": ["Create an ECO on the BoM", "Validate a landed cost on the last receipt", "Change the costing method to AVCO", "The 'Compute Price from BoM' action on the product form"], "answer": 3, "explanation": "Compute Price from BoM tính lại giá vốn từ chi phí component và chi phí operation (work center). Đổi costing method hay landed cost không tính giá từ BoM.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "Which application must be installed to manage engineering change orders (ECOs) and BoM versions?", "options": ["Quality", "Documents", "PLM", "Approvals"], "answer": 2, "explanation": "PLM (Product Lifecycle Management) quản lý ECO và các phiên bản BoM/operation. Approvals là app phê duyệt chung, không quản lý phiên bản BoM.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "Expected operation durations should be updated automatically from the times actually recorded on past work orders. What should be set on the operation?", "options": ["Duration Computation = 'Set duration manually'", "Time Efficiency = 100% on the work center", "Capacity = 1 on the work center", "Duration Computation = 'Compute based on tracked time'"], "answer": 3, "explanation": "Compute based on tracked time tính thời lượng dự kiến từ thời gian thực tế của các work order trước. 'Set duration manually' giữ nguyên giá trị nhập tay.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "A by-product should absorb 10% of the production cost. Where do you configure this?", "options": ["In the cost per hour of the work center used for the by-product", "In the analytic distribution of the BoM's by-product line", "In the by-product line's 'Cost Share (%)' on the BoM", "With a landed cost on the manufacturing order of the product"], "answer": 2, "explanation": "Cost Share (%) trên dòng by-product phân bổ một phần chi phí sản xuất cho sản phẩm phụ. Chi phí work center chỉ tính chi phí vận hành, không phân bổ giữa các sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Manufacturing", "question": "During production, a component is damaged and cannot be used. How do you record it on the manufacturing order?", "options": ["Archive the component product", "Use the Scrap button on the MO for the damaged component", "Create an unbuild order for the component from the MO", "Return the component to its vendor from the original receipt"], "answer": 1, "explanation": "Nút Scrap trên MO chuyển component hỏng sang scrap location và giữ liên kết với MO. Unbuild chỉ dùng để tháo dỡ thành phẩm đã sản xuất.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing.html"}, {"set": 3, "subject": "Point of Sale", "question": "During an open session, a cashier takes money from the drawer to pay a delivery person. How should this be recorded?", "options": ["Close the session and reopen it with a new opening balance", "Create a refund order for the amount", "Record it later as an expense in the Expenses app", "Use 'Cash In/Out' from the PoS menu and enter the reason"], "answer": 3, "explanation": "Cash In/Out ghi nhận tiền rút/nạp vào két trong phiên kèm lý do, giúp đối chiếu khi đóng session. Refund order là trả hàng cho khách, không phải chi tiền mặt.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "Where do you link a payment terminal (e.g. Adyen, Stripe) to a Point of Sale in Odoo 18?", "options": ["On the customer's contact form, Sales & Purchase tab", "On the bank journal of the shop, in the Bank Account field", "On the PoS payment method ('Use a Payment Terminal')", "In the PoS settings, in the receipt header and footer section"], "answer": 2, "explanation": "Sau khi bật terminal tương ứng trong PoS settings, chọn terminal ở trường Use a Payment Terminal trên payment method. Journal ngân hàng không chứa cấu hình thiết bị thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "A restaurant wants drinks to be printed at the bar and food at the kitchen. Which setting should be used?", "options": ["Use QR code on ticket", "Customer Display", "Preparation Printers, each linked to product categories", "Preparation Display with a single screen for all categories"], "answer": 2, "explanation": "Preparation Printers cho phép gán product category cho từng máy in để món in đúng nơi chế biến. Customer Display là màn hình cho khách xem.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "A shop runs a 'buy 2, get 1 free' offer on socks in the PoS. Which Discount & Loyalty program type is designed for this?", "options": ["Buy X Get Y", "eWallet", "Gift Card", "Next Order Coupons"], "answer": 0, "explanation": "Buy X Get Y tặng sản phẩm miễn phí khi mua đủ số lượng điều kiện. Next Order Coupons phát coupon dùng cho lần mua sau, không áp dụng ngay.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "A store wants customers who spend more than $100 to receive a coupon usable on their next purchase. Which program type should be used?", "options": ["Next Order Coupons", "Promotions", "Discount Code", "Loyalty Cards"], "answer": 0, "explanation": "Next Order Coupons phát coupon cho khách khi đơn đạt điều kiện, dùng ở lần mua tiếp theo. Promotions giảm giá ngay trên đơn hiện tại.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "Customers should be able to request an invoice themselves after purchase, using information printed on their receipt. Which setting enables this?", "options": ["Kiosk self-ordering mode", "Use QR code on ticket", "Flexible Pricelists", "Customer Account payment method"], "answer": 1, "explanation": "Use QR code on ticket in mã QR trên hóa đơn bán lẻ để khách tự yêu cầu invoice qua portal. Customer Account là phương thức ghi nợ, không liên quan đến tự xuất hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "'Log in with Employees' is enabled, but the 'Employees with basic access' and 'Employees with manager access' lists are left empty. Who can log in to the PoS?", "options": ["Only employees linked to a user account", "All employees", "Only the PoS managers", "Nobody"], "answer": 1, "explanation": "Theo cấu hình, nếu để trống danh sách nhân viên thì tất cả employee đều đăng nhập được vào PoS. Không có nghĩa là chặn toàn bộ.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "Point of Sale", "question": "A restaurant applies different taxes for takeaway and eat-in orders. Which PoS setting should be used?", "options": ["Tax-included prices on products", "Flexible Pricelists", "Two separate products for each dish", "Flexible Taxes"], "answer": 3, "explanation": "Flexible Taxes cho phép chọn fiscal position trên đơn để ánh xạ sang thuế khác (mang đi/tại chỗ). Pricelist thay đổi giá, không thay đổi thuế.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 3, "subject": "CRM", "question": "When converting a lead into an opportunity, what extra option does the conversion wizard offer besides choosing the customer and salesperson?", "options": ["Create an invoice for the expected revenue", "Directly confirm a sales order", "Send a mass mailing to the lead", "Merge the lead with existing similar opportunities"], "answer": 3, "explanation": "Wizard Convert to Opportunity cho phép chọn \"Merge with existing opportunities\" khi có bản ghi tương tự, cùng với chọn team/salesperson và khách hàng. Wizard không tạo sales order hay hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/convert.html"}, {"set": 3, "subject": "CRM", "question": "A sales manager wants to see expected revenue grouped by expected closing month. Which report is designed for this?", "options": ["CRM ‣ Reporting ‣ Lead Mining Requests", "CRM ‣ Reporting ‣ Activities", "CRM ‣ Reporting ‣ Forecast", "CRM ‣ Configuration ‣ Sales Teams"], "answer": 2, "explanation": "Báo cáo Forecast hiển thị opportunity theo Expected Closing (theo tháng) để dự báo doanh thu. Báo cáo Activities phân tích hoạt động, không nhóm theo ngày đóng dự kiến.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/forecast.html"}, {"set": 3, "subject": "CRM", "question": "A salesperson manually changes the probability of an opportunity that uses Predictive Lead Scoring. What happens next?", "options": ["Odoo refuses the change because the probability field is read-only", "It keeps the manual value until the user switches back to automated", "The manual value is applied to all opportunities in the same stage", "The manual value is overwritten by the automated one at the next stage change"], "answer": 1, "explanation": "Khi sửa tay, opportunity không còn dùng xác suất tự động; một nút (biểu tượng bánh răng) xuất hiện để quay về automated probability. Probability không phải read-only.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lead_scoring.html"}, {"set": 3, "subject": "CRM", "question": "Several duplicate opportunities are merged with the Merge wizard. What is the result?", "options": ["One opportunity remains with the merged data and chatter; the others are deleted", "All records are kept and linked together as \"siblings\" of the oldest one", "All records are archived and a new opportunity is created with all their data", "Only the chatter messages are copied over; the duplicates stay active in the pipeline"], "answer": 0, "explanation": "Merge gộp thông tin và lịch sử chatter vào một bản ghi duy nhất, các bản ghi còn lại bị xóa. Odoo không giữ song song các bản trùng sau khi gộp.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/convert.html"}, {"set": 3, "subject": "CRM", "question": "In the pipeline Kanban view, the activity (clock) icon of an opportunity is red. What does it mean?", "options": ["The next scheduled activity is overdue", "The activity is due today", "The opportunity has no activity scheduled", "The opportunity's probability is below 10%"], "answer": 0, "explanation": "Màu biểu tượng activity: đỏ = quá hạn, cam = đến hạn hôm nay, xanh lá = trong tương lai. Không có activity thì biểu tượng màu xám.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/optimize/utilize_activities.html"}, {"set": 3, "subject": "CRM", "question": "A company has two sales teams and wants a pipeline stage that only one of them uses. How is this done?", "options": ["Archive the stage so that it disappears from the other team's pipeline", "Fold the stage in the other team's Kanban view so it is hidden", "Set the Sales Team field on the stage (developer mode)", "Create the stage in CRM ‣ Configuration ‣ Settings for one team"], "answer": 2, "explanation": "Stage có field Sales Team; nếu điền team thì stage chỉ hiển thị trong pipeline của team đó, để trống thì dùng chung. Fold chỉ thu gọn cột, stage vẫn tồn tại cho mọi team.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 3, "subject": "CRM", "question": "What is the purpose of the \"Requirements\" field on a CRM stage?", "options": ["It blocks moving an opportunity to the stage until the listed fields are filled", "It sets the default probability of opportunities entering the stage", "It defines which salespeople can see the stage", "It describes internal requirements, shown as a tooltip on the stage name"], "answer": 3, "explanation": "Requirements chỉ là ghi chú nội bộ, hiển thị dạng tooltip khi rê chuột lên tên stage; nó không ép buộc điều kiện nào. Odoo không chặn chuyển stage dựa vào field này.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/manage_sales_teams.html"}, {"set": 3, "subject": "CRM", "question": "A company wants each submission of its website \"Contact Us\" form to appear in the CRM. What should be configured?", "options": ["Enable Lead Mining in CRM settings to import the submissions", "Set the form's Action to \"Create an Opportunity\" in the website editor", "Set the form's Action to \"Send an E-mail\" to the salesperson's address", "Enable Predictive Lead Scoring"], "answer": 1, "explanation": "Trong website editor, form building block có field Action; chọn \"Create an Opportunity\" để mỗi lần gửi form tạo lead/opportunity trong CRM. \"Send an E-mail\" chỉ gửi email, không tạo bản ghi CRM.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/web_design/building_blocks/form.html"}, {"set": 3, "subject": "Marketing", "question": "In Email Marketing, how can a marketer reuse the design of a successful past mailing for future mailings?", "options": ["Export the mailing as HTML and import it in Email Marketing settings", "Save it as a Marketing Automation activity", "Mark it as a favorite (star) so it appears among the templates", "Duplicate the mailing list it was sent to"], "answer": 2, "explanation": "Mailing được đánh dấu Favorite (ngôi sao) sẽ xuất hiện trong danh sách mẫu khi chọn giao diện cho mailing mới. Nhân bản mailing list chỉ sao chép danh sách người nhận.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 3, "subject": "Marketing", "question": "In Marketing Automation, an activity has a \"Validity Duration\" of 2 days. What does this mean?", "options": ["The activity is repeated every 2 days until the campaign is stopped", "If it cannot run within 2 days of its scheduled time, it is cancelled", "The participant is removed from the campaign 2 days after entering it", "The email links expire after 2 days"], "answer": 1, "explanation": "Validity Duration giới hạn thời gian cho phép thực thi activity; quá hạn mà chưa chạy được thì activity bị hủy cho participant đó. Nó không lặp lại activity hay làm hết hạn link.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation/workflow_activities.html"}, {"set": 3, "subject": "Marketing", "question": "A company has a Facebook page and a LinkedIn page connected to Social Marketing. How can it publish the same announcement on both?", "options": ["Publish on Facebook and enable automatic sharing to LinkedIn in Settings", "Create two posts, one per account; a post can only target one account", "Use Email Marketing with social accounts as recipients", "Create one social post and select both accounts in the post"], "answer": 3, "explanation": "Một bài Social Marketing có thể chọn nhiều tài khoản cùng lúc (Facebook, LinkedIn, X, Instagram…), có thể chỉnh preview riêng. Không cần tạo bài riêng cho từng tài khoản.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/social_marketing.html"}, {"set": 3, "subject": "Marketing", "question": "How can an event organiser automatically send a reminder email to all attendees 3 days before the event?", "options": ["In the event's Communication tab, add the reminder 3 days before the event", "Use the \"Use Event Barcode\" setting", "Schedule a 'Reminder' activity on each registration 3 days before", "Create a mass mailing to the registrations and send it manually 3 days before"], "answer": 0, "explanation": "Tab Communication của event là lịch gửi email/SMS tự động theo mốc (sau đăng ký, trước/sau sự kiện). Gửi mass mailing thủ công cũng được nhưng không tự động.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/events/create_events.html"}, {"set": 3, "subject": "Marketing", "question": "At the event entrance, staff want to check attendees in by scanning the barcode on their tickets. What is needed?", "options": ["Enable \"Use Event Barcode\" and scan from the Registration Desk", "Print badges from Email Marketing and check them by hand", "Install the Barcode app and scan tickets as receipts in a warehouse", "Enable \"Booth Management\" and scan tickets at each booth"], "answer": 0, "explanation": "Bật \"Use Event Barcode\" để vé/badge có barcode và dùng Registration Desk để quét check-in. Barcode của Inventory phục vụ kho, không phải check-in sự kiện.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/events/registration_desk.html"}, {"set": 3, "subject": "Marketing", "question": "A marketer prints a flyer and wants a short URL whose clicks are tracked with campaign, medium and source. Which tool should be used?", "options": ["Predictive Lead Scoring", "A mailing list", "Link Tracker", "A Marketing Automation campaign"], "answer": 2, "explanation": "Link Tracker tạo link rút gọn gắn tham số UTM (campaign, medium, source) và đếm số click. Marketing Automation dùng cho workflow gửi thông điệp, không tạo link rút gọn.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/reporting/link_tracker.html"}, {"set": 3, "subject": "Marketing", "question": "In the statistics of a sent mailing, what does a \"Bounced\" email mean?", "options": ["The recipient marked the email as spam and unsubscribed", "The recipient opened the email but did not click on any link", "The email was delivered to the recipient's spam folder", "The email could not be delivered to the recipient's mailbox"], "answer": 3, "explanation": "Bounced nghĩa là email bị server người nhận trả về, không giao được (địa chỉ sai, hộp thư đầy…). Email vào thư mục spam vẫn được tính là đã giao.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing/analytics.html"}, {"set": 3, "subject": "Marketing", "question": "An A/B test is configured on 20% of recipients with winner selection \"Highest Click Rate\". What happens on the \"Send Final On\" date?", "options": ["All versions are sent again to every recipient of the mailing list", "The best-performing version is sent automatically to the rest", "The marketer must pick the winner manually before anything is sent", "The test is cancelled if fewer than 50% of the test group clicked"], "answer": 1, "explanation": "Nếu tiêu chí khác Manual, đến ngày Send Final On Odoo tự chọn phiên bản tốt nhất và gửi cho phần người nhận còn lại. Chỉ khi chọn Manual thì người dùng mới phải tự chọn winner.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 3, "subject": "Survey", "question": "During a live session, the host wants participants who answer faster to earn more points. Which option enables this?", "options": ["Randomized per Section", "Scoring without answers", "Survey Time Limit", "Reward quick answers"], "answer": 3, "explanation": "\"Reward quick answers\" cho thêm điểm khi trả lời nhanh trong live session (kèm giới hạn thời gian mỗi câu). Survey Time Limit giới hạn tổng thời gian, không cộng điểm.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/live_session.html"}, {"set": 3, "subject": "Survey", "question": "A Matrix question lists several products as rows and satisfaction levels as columns. The respondent must be able to tick several columns per row. Which setting is required?", "options": ["Question type: Multiple choice: multiple answers allowed", "Matrix Type: \"Multiple choices per row\"", "Question type: Scale", "Matrix Type: \"One choice per row\""], "answer": 1, "explanation": "Câu hỏi Matrix có Matrix Type; chọn \"Multiple choices per row\" để tick nhiều cột trên mỗi dòng. Multiple cho
