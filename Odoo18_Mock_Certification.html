ice thường không có dạng dòng × cột.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/questions.html"}, {"set": 3, "subject": "Survey", "question": "When creating a survey in Odoo 18, which survey type disables scoring, certification and time limit by default?", "options": ["Survey", "Assessment", "Live session", "Custom"], "answer": 0, "explanation": "Loại Survey dùng để thu thập ý kiến nên mặc định tắt scoring, certification và time limit. Assessment dành cho bài đánh giá có chấm điểm.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 3, "subject": "Survey", "question": "Respondents complain they cannot return to a previous page to change an answer. Which option should be enabled?", "options": ["Randomized per Section", "Require Login", "Users can go back", "Conditional display"], "answer": 2, "explanation": "Tùy chọn \"Users can go back\" (Back Button) cho phép quay lại trang trước. Require Login chỉ bắt đăng nhập trước khi làm.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 3, "subject": "Survey", "question": "A question must be answered before the respondent can continue. What should be set?", "options": ["Set the survey Access Mode to \"Invited people only\"", "Enable \"Survey Time Limit\" on the survey options", "Add a conditional display on the question", "Tick \"Mandatory Answer\" on the question"], "answer": 3, "explanation": "\"Mandatory Answer\" trong tab Options của câu hỏi buộc phải trả lời, có thể kèm thông báo lỗi. Conditional display chỉ quyết định câu hỏi có hiển thị hay không.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/questions.html"}, {"set": 3, "subject": "Survey", "question": "What does the \"Certified Email Template\" option on a certification do?", "options": ["Emails the certification document to participants who pass", "Sends the results to the survey responsible after each attempt", "Sends a retry reminder to participants who failed the certification", "Sends the invitation link to all participants"], "answer": 0, "explanation": "Certified Email Template là email tự động gửi cho người đậu certification, kèm file chứng chỉ. Việc mời người làm survey dùng wizard Share/Invite.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/scoring.html"}, {"set": 3, "subject": "Website", "question": "A consultant wants customers to book a meeting with her directly from the website. Which app is needed?", "options": ["Live Chat", "Calendar only, by sharing her Odoo calendar link", "Events, with free tickets for each time slot", "Appointments, with a published appointment type"], "answer": 3, "explanation": "App Appointments cho phép tạo appointment type, publish lên website để khách tự chọn khung giờ trống. Events dùng cho sự kiện có đăng ký, không phải đặt lịch hẹn 1-1.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/appointments.html"}, {"set": 3, "subject": "Website", "question": "A designer wants to change the font and main colours of the whole website at once. Which part of the website editor is used?", "options": ["The Theme tab", "The Blocks tab", "The Customize tab of a selected block", "Site ‣ Pages"], "answer": 0, "explanation": "Tab Theme chứa thiết lập toàn cục (màu, font, nút, layout). Tab Customize chỉ chỉnh building block đang được chọn.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/web_design/themes.html"}, {"set": 3, "subject": "Website", "question": "The website already has a second language installed. How do you translate the text of a page into that language?", "options": ["Export a .po file from the website editor and re-import it", "Switch to that language and click \"Translate\" to edit inline", "Duplicate the page and rename its URL with the language code", "Edit the page in the default language; Odoo translates automatically"], "answer": 1, "explanation": "Chuyển sang ngôn ngữ cần dịch trên website rồi bấm Translate để sửa trực tiếp các đoạn văn bản. Nhân bản trang tạo nội dung trùng, không gắn với bản gốc.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/translate.html"}, {"set": 3, "subject": "Website", "question": "In a multi-website database, a landing page must only be shown on one of the websites. What should be done?", "options": ["Unpublish the page", "Set Visibility to \"Restricted Group\"", "Set the Website field of the page to that website", "Remove the page from the sitemap"], "answer": 2, "explanation": "Trang có field Website; chọn website cụ thể thì trang chỉ có trên website đó, để trống thì dùng chung. Unpublish sẽ ẩn trang khỏi tất cả khách truy cập.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/multi_website.html"}, {"set": 3, "subject": "Website", "question": "A thank-you page should stay published but should not appear in search engine results or the sitemap. What should be done?", "options": ["Unpublish the page", "Set Visibility to \"Signed In\"", "Remove its meta description", "Uncheck \"Indexed\" in the page properties"], "answer": 3, "explanation": "Bỏ tick \"Indexed\" giúp trang không bị search engine index và không xuất hiện trong sitemap nhưng vẫn truy cập được. Unpublish thì khách không xem được trang.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages.html"}, {"set": 3, "subject": "Website", "question": "Where do you upload the small icon (favicon) shown in the browser tab for the website?", "options": ["In the company logo field of Settings ‣ Companies", "Website ‣ Configuration ‣ Settings, Favicon field", "In the website editor, Blocks tab", "In Site ‣ Optimize SEO"], "answer": 1, "explanation": "Favicon được upload trong Website settings. Logo công ty hiển thị trên header/báo cáo, không phải favicon.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration.html"}, {"set": 3, "subject": "Website", "question": "A new page has been created but is still unpublished. Who can see it?", "options": ["Only logged-in portal users", "Nobody, not even administrators, until it is published", "Only users with website editing (designer) rights", "All visitors with the URL, but it is not listed in the menu"], "answer": 2, "explanation": "Trang chưa publish chỉ hiển thị với user nội bộ có quyền chỉnh sửa website (Restricted Editor/Editor and Designer). Khách truy cập và portal user không xem được.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages.html"}, {"set": 3, "subject": "eCommerce", "question": "Some products have no sales price and should not be bought online; customers should be invited to contact the company instead. What should be enabled?", "options": ["Prevent Sale of Zero Priced Product", "Unpublish all products with a price of 0", "Extra Step During Checkout with a contact form", "Customer Accounts: Mandatory (no guest checkout)"], "answer": 0, "explanation": "\"Prevent Sale of Zero Priced Product\" ẩn nút Add to Cart cho sản phẩm giá 0 và hiển thị nút Contact Us dẫn tới Button Url. Unpublish thì khách không thấy sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/price_management.html"}, {"set": 3, "subject": "eCommerce", "question": "A shop needs customers to fill in additional information (e.g. a comment or purchase order number) during checkout before payment. Which setting is used?", "options": ["Customer Accounts: Optional", "Abandoned Email", "Buy Now", "Extra Step During Checkout"], "answer": 3, "explanation": "\"Extra Step During Checkout\" thêm một bước có form tùy chỉnh trong luồng checkout. Buy Now chỉ cho phép mua ngay, bỏ qua giỏ hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/checkout.html"}, {"set": 3, "subject": "eCommerce", "question": "What does enabling the \"Buy Now\" option do in Odoo 18 eCommerce?", "options": ["Shows the product in a 'Buy Now' block on the homepage", "Adds a button that sends the customer straight to checkout", "Replaces the Add to Cart button by a 'Request a Quote' button", "Lets customers pay later by invoice instead of online"], "answer": 1, "explanation": "\"Buy Now\" thêm nút mua ngay trên trang sản phẩm, đưa khách thẳng đến checkout. Nút Add to Cart vẫn còn.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/checkout.html"}, {"set": 3, "subject": "eCommerce", "question": "A wholesaler wants only logged-in users to be able to browse the shop. Which setting should be used?", "options": ["Shared Customer Accounts", "Customer Accounts: Mandatory (no guest checkout)", "Visibility \"Signed In\" on each product page", "eCommerce Access: Logged in users"], "answer": 3, "explanation": "eCommerce Access (All users / Logged in users) giới hạn quyền xem shop. Customer Accounts: Mandatory chỉ bắt đăng nhập lúc checkout, khách vẫn duyệt shop được.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/checkout.html"}, {"set": 3, "subject": "eCommerce", "question": "A shop wants to show a crossed-out reference price next to the sale price, e.g. \"$100\" struck through and \"$80\". What should be enabled?", "options": ["A \"Sale\" ribbon on the product, set in the website editor", "Product Reference Price, then fill \"Compare to Price\"", "Display Product Prices: Tax Included", "Optional Products"], "answer": 1, "explanation": "Bật Product Reference Price/Comparison Price trong Website settings rồi nhập \"Compare to Price\" trên sản phẩm để hiển thị giá gạch ngang. Ribbon \"Sale\" chỉ là nhãn hiển thị trên ảnh sản phẩm, không tạo giá gạch ngang.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/price_management.html"}, {"set": 3, "subject": "eCommerce", "question": "A T-shirt costs $20, but the \"XL\" size must cost $3 more on the website. How is this configured?", "options": ["An Extra Price of $3 on the \"XL\" attribute value", "Create a delivery method with a $3 surcharge for XL orders", "Add a fixed $3 tax applied to the XL size only", "Create a separate product \"T-shirt XL\" at $23"], "answer": 0, "explanation": "Mỗi giá trị attribute trên sản phẩm có thể đặt Extra Price cộng vào giá cơ bản của biến thể. Tạo sản phẩm riêng làm mất tính năng chọn biến thể trên cùng trang.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/catalog.html"}, {"set": 3, "subject": "eCommerce", "question": "All online orders must be assigned to a specific sales team and salesperson for follow-up. Where is this set?", "options": ["In the payment provider form, on its Configuration tab", "On each product form, in its eCommerce/Sales tab", "Website ‣ Configuration ‣ Settings (Assignment)", "In CRM Rule-Based Assignment rules of the sales team"], "answer": 2, "explanation": "Website settings có mục Assignment để chọn Sales Team và Salesperson mặc định cho đơn hàng online. Rule-Based Assignment của CRM chỉ phân bổ lead/opportunity.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/performance.html"}, {"set": 3, "subject": "Project", "question": "In Odoo 18, a user creates a task from 'My Tasks' without selecting any project. What happens?", "options": ["The task cannot be saved without a project", "It becomes a private task, visible only to its assignees", "It is automatically added to the 'Internal' project", "It is visible to all internal users"], "answer": 1, "explanation": "Task không có project là private task, chỉ người được giao (assignees) mới thấy. Odoo 18 không bắt buộc project và không tự đưa vào project Internal.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 3, "subject": "Project", "question": "A sales order line uses a service product with the invoicing policy 'Based on Milestones'. What increases the line's delivered quantity so that it can be invoiced?", "options": ["Logging timesheets on the tasks of the milestone", "Confirming the sales order", "Moving all tasks to a folded stage", "Marking the linked milestone as Reached"], "answer": 3, "explanation": "Với chính sách Based on Milestones, delivered quantity được cập nhật khi milestone liên kết được đánh dấu Reached (theo % của milestone). Timesheet chỉ ảnh hưởng chính sách Based on Timesheets.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Project", "question": "When configuring a recurring task in Odoo 18, which options define how long the recurrence lasts?", "options": ["Forever, or Until a given end date", "Only a fixed number of repetitions", "Until the project's deadline only", "Until the related sales order is fully invoiced"], "answer": 0, "explanation": "Trường 'Until' của recurrence có hai lựa chọn: Forever hoặc Until (kèm End Date). Odoo 18 không còn tùy chọn số lần lặp cố định.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 3, "subject": "Project", "question": "Which Project report shows the evolution over time of the number of tasks in each stage?", "options": ["Tasks Analysis", "Customer Ratings", "Burndown Chart", "Project Updates"], "answer": 2, "explanation": "Project ‣ Reporting ‣ Burndown Chart hiển thị số lượng task theo stage theo thời gian. Tasks Analysis là báo cáo phân tích tổng hợp, không thể hiện diễn biến theo stage qua thời gian.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 3, "subject": "Project", "question": "A customer contact was added as collaborator of a shared project with the access mode 'Edit with limited access'. What can they do in the portal?", "options": ["Only read tasks, without editing them", "View and edit only the tasks they follow", "View and edit all tasks of the project, and choose which ones to follow", "Edit the project's stages and settings"], "answer": 1, "explanation": "'Edit with limited access' chỉ cho phép xem và sửa các task mà collaborator đang follow. Quyền xem/sửa mọi task là chế độ Edit.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/project_management/project_sharing.html"}, {"set": 3, "subject": "Project", "question": "A task has 10 hours of Allocated Time and 8 hours of timesheets logged on it. Its progress shows 80%. Where does this progress come from?", "options": ["Timesheet hours logged compared with allocated time", "The percentage of its sub-tasks that are closed", "The position of the task's current stage in the project pipeline", "The completion percentage of the linked milestone"], "answer": 0, "explanation": "Progress của task = giờ timesheet đã ghi / Allocated Time. Số sub-task đã đóng hay vị trí stage không ảnh hưởng đến chỉ số này.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 3, "subject": "Project", "question": "Every project created from a sales order for the service 'Onboarding Package' must start with the same predefined stages and tasks. What should be configured on the product?", "options": ["A recurring task on the product", "The Project Stages setting", "A milestone on the product", "The 'Project Template' field, pointing to a template project"], "answer": 3, "explanation": "Trường Project Template trên product (khi Create on Order là Project hoặc Project & Task) sẽ sao chép project mẫu với stage và task có sẵn. Setting Project Stages chỉ bật stage cho project, không tạo nội dung mẫu.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Timesheets", "question": "In a project invoiced based on timesheets, each consultant must be billed at a different hourly rate. How is this configured?", "options": ["Create one project per consultant", "Map employees to Sales Order Items on the project", "Change each employee's Hourly Cost on the HR Settings tab", "Assign each consultant a different working schedule"], "answer": 1, "explanation": "Bảng mapping employee - Sales Order Item ở tab Invoicing của project cho phép mỗi nhân viên dùng một dòng SO (đơn giá) riêng. Hourly Cost là chi phí nội bộ, không phải giá bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Timesheets", "question": "An employee cannot record time on a specific project from the Timesheets app. What is the most likely cause?", "options": ["The project has no customer", "The project has no milestones", "The project is not billable", "The Timesheets option is not enabled on the project"], "answer": 3, "explanation": "Chỉ project đã bật Timesheets mới cho phép ghi timesheet. Project không có customer hay không billable vẫn ghi timesheet được (chỉ là không xuất hóa đơn).", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 3, "subject": "Timesheets", "question": "When creating an invoice from a sales order whose lines are invoiced based on timesheets, how can you invoice only the timesheets of last month?", "options": ["Set the Timesheets Period in the Create Invoice wizard", "Archive the older timesheets before creating the invoice", "Change the product's invoicing policy to Prepaid/Fixed Price", "Delete the timesheets of the other months"], "answer": 0, "explanation": "Wizard Create Invoice cho phép chọn khoảng ngày Timesheets Period để chỉ xuất hóa đơn timesheet trong khoảng đó. Archive hay xóa timesheet làm mất dữ liệu và không phải cách đúng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Timesheets", "question": "Which option must be enabled on a project so that its tasks and timesheets can be linked to sales order items and invoiced?", "options": ["Customer Ratings", "Recurring Tasks", "Billable", "Task Dependencies"], "answer": 2, "explanation": "Tùy chọn Billable trên project cho phép gắn Sales Order Item vào task/timesheet để xuất hóa đơn. Các tùy chọn còn lại không liên quan đến invoicing.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Timesheets", "question": "What is the minimum Timesheets access right a user needs to validate the timesheets of other employees?", "options": ["User: own timesheets only", "User: all timesheets", "Administrator", "No specific right: any employee can validate"], "answer": 1, "explanation": "Quyền 'User: all timesheets' (approver) đủ để validate timesheet của nhân viên khác. 'User: own timesheets only' chỉ xem/ghi timesheet của chính mình; Administrator thì vượt mức tối thiểu.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 3, "subject": "Timesheets", "question": "A timesheet linked to a sales order line has already been invoiced. An employee then tries to change its duration. What happens?", "options": ["The invoice is updated automatically", "A credit note is generated automatically", "The change is saved and an extra line is added to the next invoice", "Odoo blocks the change: the timesheet is already invoiced"], "answer": 3, "explanation": "Odoo báo lỗi không cho sửa timesheet đã được xuất hóa đơn để đảm bảo khớp với hóa đơn. Odoo không tự cập nhật hóa đơn hay tạo credit note.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "HR", "question": "Which users can see the Private Information tab on other employees' records?", "options": ["Employees 'Officer: Manage all employees' or higher", "All internal users who have access to the Employees app", "Only the employee's manager and coach", "Portal users"], "answer": 0, "explanation": "Thông tin riêng tư (địa chỉ, giấy tờ...) chỉ hiển thị với user có quyền Employees Officer trở lên. Internal user thường chỉ thấy hồ sơ công khai của đồng nghiệp.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 3, "subject": "HR", "question": "An employee cannot see their time off dashboard or submit expenses for themselves when logged in. What is the most likely cause?", "options": ["The employee has no department", "The employee has no working schedule on the Work Information tab", "The employee is not linked to their user (Related User)", "The employee has no job position"], "answer": 2, "explanation": "Odoo xác định 'nhân viên của tôi' qua liên kết Related User giữa employee và user. Thiếu liên kết này thì các app Time Off/Expenses không nhận ra nhân viên.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 3, "subject": "HR", "question": "A company wants to forbid employees from taking time off on its annual inventory day. Which Odoo 18 feature should be used?", "options": ["A public holiday on that day", "An accrual plan", "Archiving all time off types for that day", "A Mandatory Day (Time Off ‣ Configuration ‣ Mandatory Days)"], "answer": 3, "explanation": "Mandatory Days là ngày nhân viên không được xin nghỉ phép. Public holiday thì ngược lại: là ngày nghỉ của toàn công ty.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 3, "subject": "HR", "question": "In an accrual plan milestone, unused days should be carried over at the carry-over date, but only up to 5 days. Which 'Carry over' option should be selected?", "options": ["None. Accrued time reset to 0", "Carry over with a maximum", "All accrued time carried over", "Set an expiration date on the allocation"], "answer": 1, "explanation": "'Carry over with a maximum' chuyển sang kỳ sau tối đa số ngày quy định. 'All accrued time carried over' chuyển toàn bộ, còn 'None' reset về 0.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 3, "subject": "HR", "question": "A recruiter refuses an applicant and wants the candidate to automatically receive a polite rejection email. How is this done?", "options": ["Refuse it with a refuse reason linked to an email template", "Delete the applicant record from the job position's pipeline", "Move the applicant to the Hired stage", "Archive the job position once it is filled"], "answer": 0, "explanation": "Nút Refuse cho chọn Refuse Reason, mỗi lý do có thể gắn email template để gửi cho ứng viên. Xóa applicant làm mất lịch sử và không gửi email.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/recruitment.html"}, {"set": 3, "subject": "HR", "question": "An expense report contains only expenses with 'Paid By: Company'. Once its journal entries are posted, what is the next step?", "options": ["Register a payment to reimburse the employee", "Wait for the employee to repay the company", "None; no reimbursement is needed", "It is automatically re-invoiced to a customer"], "answer": 2, "explanation": "Chi phí do công ty trả trực tiếp không cần hoàn tiền cho nhân viên nên report được coi là đã thanh toán sau khi post. Register Payment chỉ áp dụng cho 'Employee (to reimburse)'.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/expenses.html"}, {"set": 3, "subject": "HR", "question": "In kiosk mode, the company wants employees to confirm their identity with a code after selecting their name. Which setting should be enabled?", "options": ["Barcode Source", "Attendance From Systray", "Display Extra Hours", "Employee PIN Identification"], "answer": 3, "explanation": "Employee PIN Identification yêu cầu nhập PIN (khai báo trên form nhân viên) khi check-in/out ở kiosk. Barcode Source chỉ chọn thiết bị quét mã.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/attendances.html"}, {"set": 3, "subject": "HR", "question": "A manager wants colleagues of an employee to fill in a survey to give feedback before the employee's appraisal. Which feature is needed?", "options": ["Interview Forms in Recruitment", "360 Feedback in the Appraisals settings", "Employee skills", "Customer Ratings"], "answer": 1, "explanation": "360 Feedback (dựa trên Surveys) cho phép gửi khảo sát cho đồng nghiệp/người khác để lấy ý kiến cho appraisal. Interview Forms dùng cho tuyển dụng.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/appraisals.html"}, {"set": 3, "subject": "Studio", "question": "Users (without Studio access) must be able to add new 'Equipment Type' values later on. Which field type is the best choice?", "options": ["Selection field listing the current types", "Char field with free text", "Many2one to a new model", "Boolean per equipment type"], "answer": 2, "explanation": "Many2one tới một model riêng cho phép user thêm giá trị mới như bản ghi bình thường. Selection có danh sách cố định, chỉ sửa được bằng Studio.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 3, "subject": "Studio", "question": "What is specific about the 'On UI change' trigger of an automation rule?", "options": ["It runs on field change in the form, before saving", "It runs every night through a scheduled action", "It runs only when the record is deleted from the list view", "It runs when an incoming email is received on the record"], "answer": 0, "explanation": "'On UI change' hoạt động như onchange: chạy ngay khi user sửa field trên form, trước khi lưu. Các trigger khác (On save, Based on date field...) chạy phía server.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 3, "subject": "Studio", "question": "In a custom app built with Studio, you want to add order-line-like sub-records to each record. Which field should be added?", "options": ["Many2many", "Selection", "Related field", "Lines (a one2many to a new line model)"], "answer": 3, "explanation": "Field Lines tạo một model con và One2many để quản lý dòng chi tiết như order lines. Many2many liên kết bản ghi có sẵn, không tạo dòng con.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 3, "subject": "Studio", "question": "An external system must be able to call Odoo to update records of a custom model. Which automation rule trigger should be used?", "options": ["The 'Send Webhook Notification' action on the record", "The 'On webhook' trigger, which provides a URL", "The 'After creation' trigger on the custom model", "The 'On incoming message' trigger on the model"], "answer": 1, "explanation": "Trigger 'On webhook' sinh URL để hệ thống ngoài gọi vào và kích hoạt action trong Odoo. 'Send Webhook Notification' là chiều ngược lại: Odoo gửi dữ liệu ra ngoài.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 3, "subject": "Studio", "question": "A field must be required only when the record is in the 'Approved' stage. How can this be done with Studio?", "options": ["Use 'Allow visibility to groups' on the field only", "Make the field readonly in the 'Approved' stage", "Make it Required with a condition on the stage", "Set a default value on the field for that stage"], "answer": 2, "explanation": "Thuộc tính Required trong Studio có thể đặt theo điều kiện (domain), ví dụ stage = Approved. Allow visibility to groups chỉ giới hạn hiển thị theo group.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 3, "subject": "Studio", "question": "A module exported from Studio is imported into another database. What is required in the target database?", "options": ["Studio must be installed (the module depends on it)", "The database must run Odoo Community edition", "Developer mode must be disabled during the import", "The company must have the same name as in the source"], "answer": 0, "explanation": "Module export từ Studio có dependency tới web_studio nên database đích phải cài Studio (Enterprise). Community không có Studio.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 3, "subject": "Studio", "question": "You want to rename and reorder an app's menus, or add a menu for an existing model, without writing code. Which Studio tool is used?", "options": ["The report editor", "Automation Rules", "Approval rules", "Edit Menu"], "answer": 3, "explanation": "Trong Studio, Edit Menu cho phép đổi tên, sắp xếp và tạo menu mới trỏ tới model. Các công cụ còn lại không quản lý menu.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 3, "subject": "Studio", "question": "With Studio, you remove a standard field from a form view. What happens?", "options": ["The field and all its data are deleted from the database", "It is only hidden from the view; the field and data remain", "All records of the model are archived", "The module defining the field is uninstalled automatically"], "answer": 1, "explanation": "Xóa field khỏi view chỉ chỉnh view (ẩn field); field và dữ liệu vẫn còn trong database. Studio không xóa field chuẩn khỏi model.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 3, "subject": "Studio", "question": "Which Studio field type should be used to store formatted text with bold, lists and images?", "options": ["Text", "Char", "Html", "Selection"], "answer": 2, "explanation": "Field Html lưu nội dung có định dạng (rich text, hình ảnh). Text chỉ lưu văn bản thuần nhiều dòng, Char là một dòng.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 4, "subject": "Accounting", "question": "During bank reconciliation, the accountant often has small bank fee lines and wants a single click in the reconciliation widget to book them on the 'Bank Fees' expense account. Which type of reconciliation model should be created?", "options": ["Button to generate counterpart entry", "Rule to suggest counterpart entry", "Rule to match invoices/bills", "A fiscal position mapping the bank account to the Bank Fees account"], "answer": 0, "explanation": "Loại 'Button to generate counterpart entry' tạo một nút trong màn hình đối soát để ghi nhanh bút toán đối ứng (vd. phí ngân hàng) khi người dùng bấm. 'Rule to suggest counterpart entry' thì tự động gợi ý theo điều kiện chứ không phải nút thủ công.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/bank/reconciliation_models.html"}, {"set": 4, "subject": "Accounting", "question": "A retail shop enters product sales prices that already contain the 21% VAT (e.g. 121 € shown to customers). On the 21% sales tax, how should the 'Included in Price' field be set so that Odoo extracts the tax from the price instead of adding it?", "options": ["Tax Excluded", "Tax Included", "Leave it empty and set the tax computation to 'Fixed'", "Enable 'Affect Base of Subsequent Taxes'"], "answer": 1, "explanation": "Đặt 'Included in Price' = Tax Included thì giá bán được hiểu là đã gồm thuế, Odoo tách thuế ra (121 = 100 + 21). 'Affect Base of Subsequent Taxes' chỉ làm thuế này cộng vào cơ sở tính của các thuế sau.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes.html"}, {"set": 4, "subject": "Accounting", "question": "Management wants salespeople and accountants to be warned when a customer's total receivable exceeds an agreed amount. What happens in Odoo 18 once 'Sales Credit Limit' is enabled and a limit is set on the customer?", "options": ["Odoo blocks confirmation of any sales order that would push the customer's receivable above the limit", "The customer's portal access is suspended until the overdue balance is paid", "A warning is shown on the quotation, order and invoice, but they can still be confirmed", "Odoo automatically sends a follow-up reminder to the customer as soon as the limit is reached"], "answer": 2, "explanation": "Credit Limit trong Odoo 18 chỉ hiển thị cảnh báo trên đơn bán/hóa đơn khi vượt hạn mức, không chặn xác nhận. Muốn chặn hoàn toàn khách hàng thì phải dùng Blocking Message của Sale Warnings.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/credit_limit.html"}, {"set": 4, "subject": "Accounting", "question": "A new product is created without any Income Account on its Accounting tab; its product category has an Income Account. When the product is invoiced, which account does Odoo use for the revenue line?", "options": ["The default income account of the Sales journal used for the invoice", "The customer's receivable account, from the Accounting tab of the contact", "The first income-type account of the chart of accounts, sorted by code", "The Income Account of the product's category (or a parent category)"], "answer": 3, "explanation": "Nếu sản phẩm không có Income Account, Odoo lấy tài khoản doanh thu trên Product Category (dò lên category cha). Tài khoản phải thu của khách hàng chỉ dùng cho dòng công nợ, không phải dòng doanh thu.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/configure/product_categories.html"}, {"set": 4, "subject": "Accounting", "question": "A company wants to record the transactions of its corporate credit card in a dedicated journal so they can be reconciled like bank statements. Which journal type should be chosen in Odoo 18?", "options": ["Miscellaneous", "Purchase", "Cash", "Credit Card"], "answer": 3, "explanation": "Odoo 18 có loại sổ 'Credit Card' riêng (bên cạnh Sales, Purchase, Cash, Bank, Miscellaneous) để ghi nhận và đối soát giao dịch thẻ tín dụng. Miscellaneous dùng cho bút toán tổng hợp, không có dòng sao kê để đối soát.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/bank.html"}, {"set": 4, "subject": "Sales", "question": "In Sales ‣ Configuration ‣ Settings, the 'Default Quotation Validity' is set to 0. What is the consequence for new quotations?", "options": ["Quotations expire on the same day they are created", "Quotations no longer get an automatic expiration date", "Quotations can no longer be sent by email", "The validity falls back to the 30-day default"], "answer": 1, "explanation": "Giá trị 0 (hoặc để trống) tắt việc tự động tính ngày hết hạn báo giá. Mặc định là 30 ngày nhưng khi người dùng đặt 0 thì Odoo không quay về 30.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/quote_template.html"}, {"set": 4, "subject": "Sales", "question": "A salesperson must grant 5% off the whole quotation and wants it to appear as one separate discount line, without changing the Disc.% of each product line. Which option of the 'Discount' button wizard should be used?", "options": ["On All Order Lines", "Global Discount", "Fixed Amount", "A pricelist rule with 5% discount"], "answer": 1, "explanation": "Tùy chọn Global Discount thêm một dòng giảm giá riêng tính theo % tổng đơn. 'On All Order Lines' lại ghi % vào cột Disc.% của từng dòng sản phẩm, trái với yêu cầu.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/sales_quotations/discounts.html"}, {"set": 4, "subject": "Sales", "question": "A sandwich shop sells a 'Lunch Menu' at a single price, for which the customer chooses one sandwich, one drink and one dessert from predefined lists. Which Odoo 18 product setup fits best?", "options": ["A product with three attributes using 'Dynamically' variant creation", "A kit Bill of Materials with the three items", "A 'Combo' product with three combo choices", "Optional products on the Lunch Menu product"], "answer": 2, "explanation": "Odoo 18 có Product Type 'Combo', cho phép định nghĩa các nhóm lựa chọn (combo choices) và khách chọn một món trong mỗi nhóm với một giá chung. Attributes/variants mô tả biến thể của cùng một sản phẩm, không phải gói nhiều sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/configuration/products.html"}, {"set": 4, "subject": "Sales", "question": "Consultants pay travel costs on vendor bills and expenses; the company wants to re-invoice them to the customer's sales order at the exact amount spent. What should be set on the 'Travel' product?", "options": ["Re-Invoice Costs = Sales price", "Invoicing Policy = Ordered quantities", "Re-Invoice Costs = No, and add the product manually on the order", "Re-Invoice Costs = At cost"], "answer": 3, "explanation": "Re-Invoice Costs = At cost sẽ thêm chi phí thực tế (giá trên hóa đơn mua/chi phí) vào đơn bán để lập hóa đơn lại. 'Sales price' thì dùng giá bán của sản phẩm chứ không phải số tiền thực chi.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/expense.html"}, {"set": 4, "subject": "Sales", "question": "A beverage distributor sells water by the bottle but customers usually order full packs of 6. It wants salespeople to pick 'Pack of 6' on the order line and have the quantity computed. What must be enabled?", "options": ["The 'Product Packagings' setting, then define packagings on the product", "Units of Measure, and create a 'Pack of 6' UoM on every sales order", "Sales Grid Entry", "Variants, with a 'Pack size' attribute"], "answer": 0, "explanation": "Bật 'Product Packagings' cho phép khai báo các kiểu đóng gói (Pack of 6) trên sản phẩm và chọn Packaging trên dòng đơn bán, số lượng được quy đổi tự động. Sales Grid Entry chỉ là lưới nhập số lượng theo biến thể.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/configure/packaging.html"}, {"set": 4, "subject": "Purchase", "question": "A buyer has three RFQs in 'RFQ' status for the same vendor and the same currency and destination. She wants to combine them into one order. What does Odoo 18 do when she selects them in the list view and uses Actions ‣ Merge?", "options": ["A new RFQ is created and the three originals are deleted", "The lines are merged into the oldest RFQ and the other RFQs are cancelled", "The RFQs are merged into the most recent one and the others are archived", "Merging is only possible from the Alternatives tab"], "answer": 1, "explanation": "Hành động Merge gộp các dòng vào RFQ cũ nhất (cộng dồn số lượng nếu trùng sản phẩm) và hủy các RFQ còn lại, có ghi chú trong chatter. Các RFQ cần cùng vendor, currency, destination...; tab Alternatives dùng để so sánh báo giá, không phải gộp.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/manage.html"}, {"set": 4, "subject": "Purchase", "question": "On an RFQ, what is the meaning of the 'Order Deadline' field compared with 'Expected Arrival'?", "options": ["Order Deadline is the vendor's promised delivery date; Expected Arrival is the date the goods are put in stock", "Both fields hold the same date: Order Deadline on the RFQ and Expected Arrival on the confirmed PO", "Order Deadline is when the RFQ should be confirmed; Expected Arrival is the vendor's promised delivery date", "Order Deadline is the vendor bill due date; Expected Arrival is the date the receipt is validated in stock"], "answer": 2, "explanation": "Order Deadline là hạn để xác nhận RFQ thành đơn mua; Expected Arrival là ngày nhà cung cấp hứa giao (tính từ lead time). Order Deadline không liên quan ngày đến hạn thanh toán hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/rfq.html"}, {"set": 4, "subject": "Purchase", "question": "The default Bill Control in Purchase settings is 'Received quantities'. A user creates a new product of type 'Service' (e.g. consulting). What is its Control Policy by default?", "options": ["On ordered quantities", "On received quantities, as in the settings", "No policy: services cannot be purchased", "On delivered quantities"], "answer": 0, "explanation": "Với sản phẩm Service, Odoo tự đặt Control Policy = On ordered quantities vì dịch vụ không có phiếu nhập kho; thiết lập mặc định chỉ áp cho hàng hóa. 'On delivered quantities' không tồn tại trong Purchase.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 4, "subject": "Purchase", "question": "Vendors regularly deliver 2-3 days late. The planner wants Odoo to schedule automatically generated purchase orders a few days earlier as a safety margin. Which setting should be used?", "options": ["Receipt Reminder", "Purchase Order Approval", "Lock Confirmed Orders", "Security Lead Time for Purchase"], "answer": 3, "explanation": "Security Lead Time for Purchase thêm biên an toàn (số ngày) để các PO do replenishment tạo ra được lên lịch sớm hơn. Receipt Reminder chỉ gửi email nhắc nhà cung cấp xác nhận ngày giao.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/lead_times.html"}, {"set": 4, "subject": "Spreadsheet", "question": "A finance user needs, in a spreadsheet cell, the exchange rate from EUR to USD at a given date to convert figures. Which function should be used?", "options": ["ODOO.BALANCE(\"EUR\", \"USD\", date)", "ODOO.CURRENCY.RATE(\"EUR\", \"USD\", date)", "PIVOT.VALUE(\"EUR\", \"USD\")", "ODOO.RESIDUAL(\"EUR\", \"USD\")"], "answer": 1, "explanation": "ODOO.CURRENCY.RATE nhận mã tiền tệ nguồn, đích và ngày (tùy chọn) và trả về tỷ giá. ODOO.BALANCE dùng để lấy số dư tài khoản kế toán, không phải tỷ giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/functions.html"}, {"set": 4, "subject": "Spreadsheet", "question": "A dashboard must always display the last 90 days of sales, rolling forward automatically every day without anybody changing the filter. How should the global filter be configured?", "options": ["A Text filter whose default value is '90', linked to the order date", "A Relation filter on the Sales Team model, with all teams as default value", "A Date filter with a relative period such as 'Last 90 Days'", "A Date filter set to a fixed quarter"], "answer": 2, "explanation": "Global filter loại Date hỗ trợ khoảng thời gian tương đối (Year to Date, Last 7/30/90/180/365 Days...) tính lại theo ngày hiện tại. Một quý cố định sẽ không tự trượt theo thời gian.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/global_filters.html"}, {"set": 4, "subject": "Spreadsheet", "question": "An administrator wants the 'Purchase' dashboard in the Dashboards app to be visible only to users of the Purchase / Administrator group. Where is this configured?", "options": ["On the dashboard's access groups, in Dashboards ‣ Configuration ‣ Dashboards", "In the spreadsheet via File ‣ Share, choosing 'Viewer' for the Purchase / Administrator group", "In Settings ‣ Users, removing the Dashboards app from each user", "With a record rule on the purchase.order model restricted to Purchase / Administrator"], "answer": 0, "explanation": "Mỗi dashboard có trường nhóm quyền (group_ids, mặc định Internal User) trong Dashboards ‣ Configuration ‣ Dashboards; chỉ thành viên các nhóm đó mới thấy dashboard. Record rule trên purchase.order chỉ giới hạn dữ liệu chứ không ẩn dashboard.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/dashboards.html"}, {"set": 4, "subject": "Inventory", "question": "A company does not want delivery orders to reserve stock automatically when a sales order is confirmed; a stock clerk should decide when products get reserved. What should be configured on the Delivery Orders operation type?", "options": ["Set the Shipping Policy to 'When all products are ready'", "Set 'Create Backorder' to 'Never' on the operation type", "Set the Reservation Method to 'Manually'", "Untick 'Use Existing Lots/Serial Numbers'"], "answer": 2, "explanation": "Trường Reservation Method trên operation type có 3 giá trị: At Confirmation, Manually, Before scheduled date; chọn 'Manually' thì phải bấm 'Check Availability' để giữ hàng. Shipping Policy chỉ quyết định giao từng phần hay giao một lần, không liên quan việc reserve.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/reservation_methods.html"}, {"set": 4, "subject": "Inventory", "question": "A hardware store wants the most recently received units of a product to be the first ones taken out of stock for deliveries. Which removal strategy should be used?", "options": ["Last In, First Out (LIFO)", "First In, First Out (FIFO)", "Closest Location", "Least Packages"], "answer": 0, "explanation": "LIFO lấy hàng nhập gần nhất ra trước. FIFO thì ngược lại (hàng nhập sớm nhất ra trước), còn Closest Location dựa trên thứ tự tên vị trí.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/removal_strategies.html"}, {"set": 4, "subject": "Inventory", "question": "A supplier keeps its own goods in your warehouse; you only pay the supplier once the goods are sold, and they must not be counted in your inventory valuation. Which Inventory setting lets you record the owner of these goods on receipts?", "options": ["Dropshipping", "Packages", "Multi-Step Routes", "Consignment"], "answer": 3, "explanation": "Bật 'Consignment' trong Inventory ‣ Configuration ‣ Settings để nhập trường Owner trên phiếu nhập; hàng có owner khác công ty không được tính vào định giá tồn kho. Dropshipping là giao thẳng từ vendor tới khách, hàng không đi qua kho.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/owned_stock.html"}, {"set": 4, "subject": "Inventory", "question": "When validating a receipt, a warehouse worker wants to see which waiting delivery orders the incoming quantities can be allocated to. Which Inventory setting provides this?", "options": ["Batch, Wave & Cluster Transfers", "Reception Report", "Product Packagings", "Signature"], "answer": 1, "explanation": "'Reception Report' hiển thị báo cáo phân bổ hàng vừa nhận cho các phiếu xuất/MO đang chờ hàng. Batch, Wave & Cluster Transfers chỉ dùng để gom phiếu khi soạn hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/reporting/receptions_report.html"}, {"set": 4, "subject": "Inventory", "question": "In Inventory ‣ Configuration ‣ Settings, the Annual Inventory Day and Month are set to 31 December. What does this setting control?", "options": ["The date on which Odoo automatically applies all counted quantities of the year", "The closing date of the stock valuation journal, used for the yearly closing entry", "The default count date for locations without their own Inventory Frequency", "The date after which lots without an expiration date are automatically scrapped"], "answer": 2, "explanation": "Annual Inventory Day/Month là ngày kiểm kê mặc định cho hàng nằm ở các location không có chu kỳ đếm (Inventory Frequency). Odoo không tự Apply số đếm; người dùng vẫn phải đếm và Apply.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/count_products.html"}, {"set": 4, "subject": "Manufacturing", "question": "All work orders of a manufacturing order are finished, but nobody has clicked 'Produce All' yet to close the MO. Which state is the MO in?", "options": ["To Close", "In Progress", "Confirmed", "Done"], "answer": 0, "explanation": "Khi mọi work order đã xong (hoặc đã ghi nhận đủ số lượng sản xuất nếu không có work order), MO chuyển sang 'To Close'; chỉ khi bấm Produce All/Produce thì mới sang 'Done'. 'In Progress' là khi mới bắt đầu sản xuất một phần.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/manufacturing_orders.html"}, {"set": 4, "subject": "Manufacturing", "question": "A work center has Capacity = 2, Setup Time = 10 min, Cleanup Time = 5 min and Time Efficiency = 100%. The BoM operation on it has a default duration of 30 min. What is the expected duration of the work order for an MO of 5 units?", "options": ["75 min", "165 min", "90 min", "105 min"], "answer": 3, "explanation": "Số chu kỳ = làm tròn lên 5/2 = 3; thời lượng = setup + cleanup + 3 × 30 = 10 + 5 + 90 = 105 phút. Đáp án 165 phút là tính theo từng đơn vị (5 × 30 + 15), bỏ qua Capacity.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/advanced_configuration/using_work_centers.html"}, {"set": 4, "subject": "Manufacturing", "question": "The BoM of a bicycle (type 'Manufacture this product') contains a 'Wheel Set', which itself has a BoM of type 'Kit'. What happens when an MO for the bicycle is confirmed?", "options": ["A separate child MO is created for the Wheel Set and linked to the bicycle MO", "The Wheel Set's components are added directly to the bicycle MO", "The MO is blocked because a Kit BoM cannot be used as a component", "The Wheel Set is consumed as a single stocked product"], "answer": 1, "explanation": "BoM loại Kit (phantom) được 'nổ' ra: các linh kiện của kit xuất hiện trực tiếp trong danh sách component của MO cha, không tạo MO con. Muốn có MO con thì Wheel Set phải có BoM 'Manufacture this product' kèm route phù hợp.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/advanced_configuration/kit_shipping.html"}, {"set": 4, "subject": "Manufacturing", "question": "A BoM has three operations. Screws must only be consumed during the 'Assembly' operation so they appear on that work order in Shop Floor. What should be set on the screw's BoM line?", "options": ["The 'Apply on Variants' field", "The 'Cost Share (%)' field", "The 'Consumed in Operation' field", "The 'Manufacturing Readiness' field"], "answer": 2, "explanation": "Trường 'Consumed in Operation' trên dòng component gắn linh kiện với một operation cụ thể (cần bật Work Orders). 'Apply on Variants' chỉ lọc theo biến thể, không gắn với operation.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/bill_configuration.html"}, {"set": 4, "subject": "Point of Sale", "question": "A new product was created in the Sales app, but cashiers cannot find it in the Point of Sale. What is the most likely cause?", "options": ["The product has no barcode", "The 'Available in POS' checkbox is not ticked on the product", "The product is not tracked in inventory", "The product has no internal reference"], "answer": 1, "explanation": "Chỉ sản phẩm có tick 'Available in POS' (tab Sales/Point of Sale của sản phẩm) mới được tải vào PoS. Barcode hay internal reference không bắt buộc để sản phẩm hiển thị.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 4, "subject": "Point of Sale", "question": "A fast-food restaurant sells a 'Burger Menu' where the customer chooses one burger, one side and one drink from predefined lists, for a fixed price. How should this be set up in Odoo 18?", "options": ["Create a 'Kit' bill of materials containing a burger, a side and a drink", "Create a product with three attributes (burger, side, drink)", "Create a Buy X Get Y loyalty program", "Create a 'Combo' product with burger, side and drink choices"], "answer": 3, "explanation": "Odoo 18 có loại sản phẩm 'Combo', mỗi combo choice chứa danh sách sản phẩm để khách chọn; PoS hiện popup để chọn. Dùng attribute chỉ tạo biến thể của một sản phẩm, không trừ kho từng món.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/configuration/combo_products.html"}, {"set": 4, "subject": "Point of Sale", "question": "Cashiers keep changing product prices directly on PoS orders. The manager wants only PoS managers to be able to modify prices. Which setting should be enabled?", "options": ["Price Control", "Line Discounts", "Flexible Pricelists", "Set Maximum Difference"], "answer": 0, "explanation": "Setting 'Price Control' (Restrict Price Modifications to Managers) chỉ cho user có quyền Manager PoS sửa giá trên đơn. Set Maximum Difference liên quan chênh lệch tiền mặt khi đóng ca, không phải giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/configuration.html"}, {"set": 4, "subject": "Point of Sale", "question": "A furniture shop sells sofas in its store, but they must be delivered to the customer's home a few days later. Which PoS setting allows this?", "options": ["Share Open Orders", "Customer Account payment method", "Allow Ship Later", "Early Receipt Printing"], "answer": 2, "explanation": "'Allow Ship Later' cho phép thu ngân chọn ngày giao trên màn hình thanh toán (cần chọn khách hàng); phiếu giao hàng được tạo theo kho/route đã cấu hình. Customer Account chỉ là ghi nợ thanh toán, không liên quan giao hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/shop/ship_later.html"}, {"set": 4, "subject": "CRM", "question": "A sales manager wants new leads to be completed automatically with company data (industry, size, address) based on the email address of the lead. Which feature should be enabled?", "options": ["Lead Enrichment, set to enrich all leads automatically", "Lead Mining, with a filter on the lead's email domain", "Visits to Leads, restricted to known email domains", "Partner Autocomplete, used when typing a company name on a contact"], "answer": 0, "explanation": "Lead Enrichment (CRM ‣ Configuration ‣ Settings) dùng IAP để bổ sung dữ liệu công ty dựa trên domain email, có thể chọn 'Enrich all leads automatically' hoặc 'Enrich leads on demand only'. Lead Mining tạo lead MỚI chứ không làm giàu lead có sẵn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/lead_enrichment.html"}, {"set": 4, "subject": "CRM", "question": "A manager wants a standard list of reasons (e.g. \"Too expensive\", \"Chose a competitor\") that salespeople must choose from when they mark opportunities as lost. Where are these reasons maintained?", "options": ["CRM ‣ Configuration ‣ Tags", "CRM ‣ Configuration ‣ Lost Reasons", "CRM ‣ Configuration ‣ Stages, on the stage's Requirements field", "CRM ‣ Configuration ‣ Activity Types"], "answer": 1, "explanation": "Lý do thua được quản lý ở CRM ‣ Configuration ‣ Lost Reasons và được chọn trong wizard 'Mark Lost'. Tags chỉ dùng để phân loại, không phải danh sách lý do thua.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/lost_opportunities.html"}, {"set": 4, "subject": "CRM", "question": "An opportunity has an Expected Revenue of $10,000 and a Probability of 30%. What is its Prorated Revenue in CRM reporting?", "options": ["$7,000", "$10,000", "$3,000", "$13,000"], "answer": 2, "explanation": "Prorated Revenue = Expected Revenue × Probability / 100 = 10.000 × 30% = 3.000. Giá trị $10,000 là Expected Revenue chưa được nhân xác suất."}, {"set": 4, "subject": "CRM", "question": "With Rule-Based Assignment enabled, a manager wants unassigned leads to be distributed to salespeople every day without anyone clicking a button. What should be configured?", "options": ["Enable Predictive Lead Scoring, which assigns leads automatically", "Set the assignment to run \"Manually\" and ask a salesperson to click \"Assign Leads\" daily", "Create an automated email alias on each sales team", "Set Rule-Based Assignment to run \"Repeatedly\" every 1 day"], "answer": 3, "explanation": "Rule-Based Assignment có tùy chọn Running: 'Manually' hoặc 'Repeatedly' với tần suất (ví dụ mỗi 1 ngày), khi đó cron tự phân bổ lead. Predictive Lead Scoring chỉ tính xác suất, không phân công lead.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lead_scoring.html"}, {"set": 4, "subject": "Marketing", "question": "A company sends large newsletters and wants them to go through a different outgoing mail server than regular business emails. Which Email Marketing setting is used?", "options": ["Dedicated Server, with the mail server selected", "Mailing Campaigns, using a separate campaign for newsletters", "24H Stat Mailing Reports", "Blacklist Option when Unsubscribing"], "answer": 0, "explanation": "Trong Email Marketing ‣ Configuration ‣ Settings, bật 'Dedicated Server' và chọn Mail Server riêng cho mass mailing. 'Mailing Campaigns' chỉ dùng để nhóm mailing theo chiến dịch.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 4, "subject": "Marketing", "question": "A contact belongs to both the \"Newsletter\" and \"VIP\" mailing lists. A mailing is sent to both lists. How many copies of the mailing does the contact receive?", "options": ["Two, one copy for each of the mailing lists the contact belongs to", "One, as duplicate email addresses are removed when sending", "None, because contacts in several lists are skipped", "It depends on the A/B testing percentage"], "answer": 1, "explanation": "Khi gửi một mailing, Odoo loại trùng theo địa chỉ email (seen list), nên người nhận chỉ nhận 1 bản dù có trong nhiều danh sách. Không có chuyện gửi 2 lần theo từng list."}, {"set": 4, "subject": "Marketing", "question": "In a Marketing Automation campaign, which of the following triggers is NOT available for a child activity of an email activity?", "options": ["Mail: not clicked", "Mail: opened", "Mail: forwarded", "Mail: bounced"], "answer": 2, "explanation": "Các trigger email có sẵn là opened / not opened / replied / not replied / clicked / not clicked / bounced. Không có trigger 'forwarded' vì Odoo không theo dõi việc chuyển tiếp email.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation.html"}, {"set": 4, "subject": "Marketing", "question": "An event organiser asks a question \"Company name?\" on registration. For a group booking of 5 tickets, the answer should be asked only once and copied to every attendee. Which option should be set on the question?", "options": ["Limit Attendees on the event", "Mandatory Answer", "Question Type: Text Input", "Ask once per order"], "answer": 3, "explanation": "Trên câu hỏi sự kiện, tùy chọn 'Ask once per order' khiến câu hỏi chỉ hỏi một lần và giá trị được áp cho mọi attendee của đơn đăng ký. 'Mandatory Answer' chỉ bắt buộc trả lời, vẫn hỏi cho từng attendee."}, {"set": 4, "subject": "Survey", "question": "An HR officer wants respondents to enter their age, and only values between 18 and 65 should be accepted. Which configuration is correct?", "options": ["Question Type \"Numerical Value\" with \"Validate entry\" (min 18, max 65)", "Question Type \"Scale\" with Scale Minimum 18 and Scale Maximum 65", "Question Type \"Single Line Text Box\" with a conditional display", "Question Type \"Multiple choice: only one answer\" listing every age from 18 to 65"], "answer": 0, "explanation": "Câu hỏi 'Numerical Value' có tùy chọn 'Validate entry' với Minimum/Maximum value để chặn giá trị ngoài khoảng. Kiểu Scale dùng cho thang đánh giá (giá trị tối đa là 10), không phải nhập tuổi."}, {"set": 4, "subject": "Survey", "question": "In a quiz, a multiple choice question should give points only for the right answer. Where are the correct answer and its points defined?", "options": ["On the survey's Options tab, in the Required Score (%) field", "On the question's answers: tick \"Correct\" and set its Score", "In the question's Description field", "On the participant's answer record, after the survey is submitted"], "answer": 1, "explanation": "Với survey có scoring, mỗi đáp án gợi ý có cờ 'Correct' và trường 'Score'. Required Score (%) là ngưỡng đậu của cả bài, không xác định đáp án đúng."}, {"set": 4, "subject": "Survey", "question": "Participants of a live session open their browser and type a short code to join. Where do they enter it?", "options": ["By replying to the survey's invitation email with the code", "In the Discuss app", "On the website's /s page, using the Session Code", "In the website's search bar, which redirects to the session"], "answer": 2, "explanation": "Live session có 'Session Code'; người tham gia vào URL /s (hoặc /s/<code>) để nhập mã và tham gia. Không có cơ chế nhập mã qua Discuss."}, {"set": 4, "subject": "Website", "question": "During a 2-week seasonal promotion, the URL /shop should temporarily send visitors to /summer-sale, then return to normal. Which redirect type fits best?", "options": ["301 Moved permanently", "302 Moved temporarily", "404 Not Found", "308 Redirect / Rewrite"], "answer": 1, "explanation": "302 là chuyển hướng tạm thời, công cụ tìm kiếm giữ URL gốc. 301 báo cho search engine rằng URL đã chuyển vĩnh viễn, không phù hợp cho khuyến mãi ngắn hạn.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages/URL_redirection.html"}, {"set": 4, "subject": "Website", "question": "A marketer has customised a block (texts, colours, layout) and wants to reuse it on several other pages. What is the quickest way?", "options": ["Create a new theme", "Copy the HTML from the browser source code and paste it into each page", "Save the block as a custom snippet and reuse it from the blocks panel", "Duplicate the whole page each time and delete the other blocks"], "answer": 2, "explanation": "Trong website editor, có thể lưu một block đã tùy chỉnh (nút Save) thành custom snippet, sau đó kéo-thả lại từ nhóm Custom. Tạo theme mới là quá mức cần thiết."}, {"set": 4, "subject": "Website", "question": "Which privacy-friendly analytics tool can be connected in Odoo 18 Website settings so that statistics are displayed in Website ‣ Reporting ‣ Analytics?", "options": ["Adobe Analytics", "Matomo", "Hotjar", "Plausible"], "answer": 3, "explanation": "Website settings của Odoo 18 hỗ trợ Plausible Analytics (shared link) để xem số liệu trong Website ‣ Reporting ‣ Analytics, bên cạnh Google Analytics. Matomo, Hotjar không có tích hợp sẵn.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/reporting/analytics.html"}, {"set": 4, "subject": "Website", "question": "In a Contact Us form, the field \"Company Name\" should only be shown when the visitor selects \"Business\" in a previous field. How is this done in the website editor?", "options": ["Set the field's Visibility to be conditional on the \"Business\" option", "Create two different forms on two pages, one for each customer type", "Mark the field as Required", "Set the field's Visibility to \"Hidden\" and show it with custom JavaScript"], "answer": 0, "explanation": "Form builder của website cho phép đặt Visibility có điều kiện ('Visible only if' một trường khác có giá trị nhất định). Required chỉ bắt buộc nhập, không ẩn/hiện."}, {"set": 4, "subject": "eCommerce", "question": "A shop sells products tracked in inventory. When a product is out of stock, customers must not be able to order it, and the shop should show the remaining quantity when fewer than 5 units are left. What should be configured?", "options": ["Archive the product with an automation rule when its stock reaches zero", "Disable \"Continue Selling\" and set \"Show Available Qty\" below 5 units", "Set the product's sales price to zero when it is out of stock", "Enable \"Prevent Sale of Zero Priced Product\" in the website settings"], "answer": 1, "explanation": "Cài đặt Inventory của website (Out-of-Stock: Continue Selling, Show Available Qty only if below X Units) điều khiển việc bán khi hết hàng và hiển thị tồn; có thể ghi đè trên sản phẩm. Archive sản phẩm là thủ công và làm mất sản phẩm khỏi shop."}, {"set": 4, "subject": "eCommerce", "question": "A shop wants to display a \"New\" or \"Sale\" label on the corner of some product tiles in the shop grid. What is used?", "options": ["An eCommerce category named \"New\"", "A product tag", "A Ribbon on the product", "An attribute value with an extra price"], "answer": 2, "explanation": "Ribbon (product.ribbon) hiển thị nhãn như 'Sale', 'New' trên ảnh sản phẩm trong shop, chọn trên sản phẩm hoặc trong editor. eCommerce category chỉ phân nhóm, không hiển thị nhãn góc."}, {"set": 4, "subject": "eCommerce", "question": "A T-shirt has a \"Color\" attribute. Customers should pick colours by clicking coloured swatches on the product page. Which attribute setting is needed?", "options": ["eCommerce Filter Visibility: Hidden, on the attribute", "Display Type: Select", "Variant Creation: Never", "Display Type: Color, with an HTML colour on each value"], "answer": 3, "explanation": "Display Type 'Color' hiển thị ô màu, mỗi value cần mã màu HTML. 'Select' hiện dropdown; Filter Visibility chỉ ảnh hưởng bộ lọc sidebar."}, {"set": 4, "subject": "Project", "question": "Whenever a task of the 'Website Redesign' project reaches the 'Ready for Review' stage, the customer must automatically receive an informative email (not a satisfaction survey). How is this configured?", "options": ["Set an Email Template on the 'Ready for Review' stage", "Set a Rating Email Template on the 'Ready for Review' stage", "Enable 'Customer Ratings' and choose 'On a periodic basis' on the project", "Add the customer as a follower of the project with the 'Stage Changed' subtype only"], "answer": 0, "explanation": "Trường Email Template trên stage của task sẽ tự động gửi email cho khách hàng khi task vào stage đó. Rating Email Template thì gửi yêu cầu đánh giá (rating), không phải email thông tin thường.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 4, "subject": "Project", "question": "On a task stage, 'Automatic Kanban Status' is enabled and a rating email template is set. A customer replies to the rating request with a neutral (or bad) rating. What happens to the task?", "options": ["Its state is automatically set to 'Approved'", "Its state becomes 'Changes Requested'", "The task is automatically moved back to the previous stage", "The task is automatically set to 'Cancelled'"], "answer": 1, "explanation": "Khi bật Automatic Kanban Status trên stage, đánh giá tốt sẽ chuyển task sang 'Approved' (chấm xanh), còn đánh giá trung lập/xấu sẽ chuyển sang 'Changes Requested' (chấm cam). Odoo không tự đổi stage hay hủy task.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 4, "subject": "Project", "question": "In the kanban view of a project, a user quick-creates a task by typing 'Prepare demo #Marketing @Anna !'. What does Odoo 18 do with this title?", "options": ["Creates a task whose name is the full text, including the # @ ! characters", "Creates the task 'Prepare demo' in the 'Marketing' project and sends Anna an email", "Creates the task 'Prepare demo' with the tag Marketing, assigned to Anna, with high priority", "Creates the task 'Prepare demo' and posts '#Marketing @Anna !' as a note in its chatter"], "answer": 2, "explanation": "Trong Odoo 18, khi tạo nhanh task, '#' thêm tag, '@' gán người phụ trách và '!' đặt độ ưu tiên cao (starred); các ký hiệu này được loại khỏi tên task.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 4, "subject": "Timesheets", "question": "A project manager enables the Timesheets option on an existing project that has no analytic account. What happens?", "options": ["Odoo refuses to save until an analytic account is selected manually", "Timesheets are recorded without any analytic account on their lines", "Timesheets are posted on the company's default 'Internal' analytic account", "Odoo creates an analytic account for the project automatically"], "answer": 3, "explanation": "Timesheet là analytic line nên project bật Timesheets bắt buộc phải có analytic account; nếu chưa có, Odoo tự tạo khi lưu project. Không cần chọn thủ công và không ghi vào tài khoản 'Internal'.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 4, "subject": "Timesheets", "question": "In a billable project, one specific timesheet entry (an internal training hour) must not be invoiced to the customer, while the other timesheets of the task remain billable. What should be done?", "options": ["Remove the Sales Order Item on that timesheet line", "Uncheck 'Billable' on the project", "Remove the Sales Order Item from the task the entry is logged on", "Set that timesheet's duration to zero and add a note in its description"], "answer": 0, "explanation": "Gỡ Sales Order Item trên chính dòng timesheet đó sẽ khiến dòng này thành Non-Billable mà không ảnh hưởng các timesheet khác. Bỏ 'Billable' trên project hoặc gỡ SO item trên task sẽ tác động tới toàn bộ timesheet liên quan.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 4, "subject": "Timesheets", "question": "In the 'My Timesheets' view of the Timesheets app (Odoo 18 Enterprise), which keyboard key starts the timer and, pressed again, stops it?", "options": ["Space", "Enter", "Tab", "Ctrl + S"], "answer": 1, "explanation": "Trong view timesheet có timer, phím Enter dùng để bắt đầu và dừng timer (Escape dùng để hủy timer đang chạy). Các phím còn lại không gắn với timer.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 4, "subject": "HR", "question": "An HR officer archives the record of an employee who is leaving the company. What does Odoo 18 open?", "options": ["A confirmation dialog warning that archived employees are permanently deleted after 30 days", "The employee's contract so that its end date can be filled in before archiving is allowed", "A 'Register Departure' wizard for the departure reason, date and details", "Nothing: the record is simply hidden, and departure data must be entered on the Private Information tab"], "answer": 2, "explanation": "Khi archive một nhân viên, Odoo mở wizard Register Departure để nhập Departure Reason (mặc định Fired, Resigned, Retired), ngày nghỉ việc và thông tin bổ sung. Archive không xóa dữ liệu nhân viên.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees/offboarding.html"}, {"set": 4, "subject": "HR", "question": "Employees must be able to request time off for 'Medical Appointment' by the hour (e.g. 2 hours). Which field of the time off type must be set?", "options": ["Time Off Validation: No Validation", "Requires allocation: No Limit", "Kind of Time Off: Worked Time", "Take Time Off in: Hours"], "answer": 3, "explanation": "Trường 'Take Time Off in' trên time off type có các giá trị Day, Half Day và Hours; chọn Hours để cho phép xin nghỉ theo giờ. Các trường khác liên quan đến duyệt và phân bổ, không quyết định đơn vị nghỉ.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 4, "subject": "HR", "question": "A team lead without any Recruitment access rights must be able to see and manage all applicants of the 'Senior Developer' job position (attachments, meetings, refusal). What should be done?", "options": ["Add the team lead to the Interviewers field of the job position", "Give the team lead the Recruitment 'Administrator' right", "Make the team lead a follower of the job position", "Set the team lead as Recruiter on each applicant"], "answer": 0, "explanation": "Người được đặt trong trường Interviewers của job position có thể xem mọi applicant của vị trí đó (tài liệu, lịch hẹn, refuse) mà không cần quyền Recruitment. Cấp quyền Administrator là quá mức cần thiết.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/recruitment.html"}, {"set": 4, "subject": "HR", "question": "Which field on the employee form defines who approves that employee's expense reports, and what is its default value?", "options": ["The 'Coach' field in Work Information, filled by default with the department manager", "Work Information ‣ Expense approver; default: the manager, if they have Expenses rights", "The 'Time Off' approver field, which is also used for expenses", "The 'Responsible' field of the expense category, filled by default with the Expenses administrator"], "answer": 1, "explanation": "Trường Expense (approver) ở tab Work Information xác định người duyệt chi phí; mặc định lấy user của Manager nếu user đó có quyền Expenses. Coach hay approver Time Off không dùng cho Expenses.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/expenses.html"}, {"set": 4, "subject": "Studio", "question": "With Studio, you want to let users rate the importance of a custom record by clicking on stars in the form and kanban views. Which field type should be added?", "options": ["Selection", "Integer", "Priority", "Tags"], "answer": 2, "explanation": "Field type Priority trong Studio tạo một selection hiển thị bằng widget ngôi sao (priority). Selection thường hay Integer không hiển thị dạng sao mặc định.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 4, "subject": "Studio", "question": "In Studio, you drag a 'One2Many' field onto the form of model A, but Studio displays 'No related many2one fields found'. Why?", "options": ["One2Many fields can only be created on models that have a chatter", "One2Many fields can only be added when Studio is opened in developer mode", "Model A already contains a 'Lines' field, so a second One2Many is not allowed", "The target model has no Many2one field pointing back to model A"], "answer": 3, "explanation": "One2Many là quan hệ ngược của Many2one, nên phải tạo trước trường Many2one trỏ về model hiện tại trên model đích. Nếu muốn Studio tự tạo model dòng mới thì dùng field 'Lines'.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 4, "subject": "Studio", "question": "When creating a new app or model with Studio, which suggested features are already selected by default?", "options": ["Custom Sorting, Chatter and Archiving", "Contact details, User assignment and Tags", "Pipeline stages, Date & Calendar and Picture", "No features are pre-selected; all must be ticked manually"], "answer": 0, "explanation": "Trong màn hình cấu hình model mới của Studio, Custom Sorting, Chatter và Archiving được tick sẵn; các tính năng khác như Contact details, Pipeline stages phải tự chọn.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 4, "subject": "Studio", "question": "An automation rule must create a reminder activity when a custom 'Claim' record has not been modified for 7 days. Which trigger fits best?", "options": ["On save", "After last update, with a delay of 7 days", "After creation, with a delay of 7 days", "On UI change"], "answer": 1, "explanation": "Trigger 'After last update' chạy sau một khoảng thời gian kể từ lần cập nhật cuối của bản ghi, phù hợp với nhắc nhở khi bản ghi bị bỏ quên. 'After creation' tính từ ngày tạo, không phải lần sửa cuối.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 4, "subject": "Studio", "question": "An approval rule on the 'Confirm' button of purchase orders must only apply to orders with a total above 10,000. How is this achieved?", "options": ["Create a second 'Confirm' button visible only for large orders", "Enable 'Exclusive Approval' on the rule", "Set a condition (domain) on the approval rule, e.g. Total > 10,000", "Set the rule's Step to 2"], "answer": 2, "explanation": "Approval rule có thể có domain điều kiện; khi đó rule chỉ áp dụng cho bản ghi thỏa domain (conditional rule). Exclusive Approval và Step không giới hạn bản ghi áp dụng.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/approval_rules.html"}, {"set": 5, "subject": "Accounting", "question": "In Canada, a sale must carry both GST 5% and PST 7%, and the accountant wants to select one tax on product lines that applies both. Which 'Tax Computation' should the combined tax use?", "options": ["Group of Taxes", "Percentage Tax Included", "Fixed", "Percentage"], "answer": 0, "explanation": "Tax Computation = Group of Taxes cho phép gom nhiều thuế con (GST + PST) vào một thuế để chọn một lần trên dòng. Percentage Tax Included là cách tính thuế đã gồm trong giá, không gom nhiều thuế.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes.html"}, {"set": 5, "subject": "Accounting", "question": "A Swiss company must round cash invoice totals to 0.05 CHF and wants the rounding difference booked on dedicated profit/loss accounts rather than inside the tax amount. After enabling 'Cash Rounding', which Rounding Strategy should the rounding method use?", "options": ["Modify tax amount", "Add a rounding line", "Round globally", "Round per line"], "answer": 1, "explanation": "Strategy 'Add a rounding line' thêm một dòng làm tròn riêng hạch toán vào tài khoản Profit/Loss đã cấu hình. 'Modify tax amount' cộng chênh lệch vào dòng thuế lớn nhất; 'Round globally/per line' là phương pháp làm tròn thuế, không phải cash rounding.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/cash_rounding.html"}, {"set": 5, "subject": "Accounting", "question": "Vendors send their bills by email. The company wants a draft vendor bill to be created automatically, with the PDF attached, each time an email is received. What should be configured?", "options": ["A default mail template on the vendor contact form", "The 'Receipt Reminder' option in Purchase ‣ Configuration ‣ Settings", "The email alias of the Vendor Bills journal", "An email alias on the Bank journal, shared with all vendors"], "answer": 2, "explanation": "Sổ Purchase (và Sales) có email alias; mỗi email gửi tới alias đó sẽ tạo một hóa đơn nháp kèm tệp đính kèm. Receipt Reminder chỉ là email nhắc nhà cung cấp về ngày giao hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/vendor_bills.html"}, {"set": 5, "subject": "Accounting", "question": "A customer pays 995 € on a 1,000 € invoice and the company accepts to absorb the 5 € difference. In the Register Payment wizard, what should the accountant do?", "options": ["Keep the difference open and create a credit note later for 5 €", "Change the invoice amount to 995 € before registering the payment", "Select 'Keep open' and reconcile manually with the Bank Fees account", "Choose 'Mark as fully paid' with a write-off account"], "answer": 3, "explanation": "Chọn 'Mark as fully paid' với một tài khoản write-off giúp hóa đơn được tất toán ngay và 5 € chênh lệch ghi vào tài khoản đã chọn. 'Keep open' để hóa đơn ở trạng thái thanh toán một phần.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments.html"}, {"set": 5, "subject": "Accounting", "question": "A company wants the payment reference on its customer invoices to follow the international structured creditor reference format (starting with 'RF'). Which journal setting should be changed?", "options": ["On the Sales journal, set the Communication Standard to 'European'", "On the Sales journal, set the Communication Type to 'Open'", "In Accounting settings, enable 'Display SEPA QR-code'", "On the customer, set a dedicated payment term"], "answer": 0, "explanation": "Trường Communication Standard trên sổ bán hàng có các lựa chọn Odoo và European; European tạo tham chiếu RF theo chuẩn creditor reference. Communication Type = Open lại bỏ tham chiếu tự động.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/payment_references.html"}, {"set": 5, "subject": "Sales", "question": "Salespeople find it slow to type product names on order lines and want to browse products as cards and set quantities directly. Which Odoo 18 feature on the quotation's Order Lines
