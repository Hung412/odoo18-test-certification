<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Odoo 18 Mock Certification</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: exam-hall console — top status bar with timer, question pane + navigator rail; results as a scorecard then review list */
:root{
  --bg:#f6f4f6; --surface:#ffffff; --sunk:#efeaee; --line:#ddd3db;
  --fg:#231a21; --muted:#6c5f69;
  --accent:#6d3f63; --accent-fg:#ffffff; --accent-soft:#f1e5ee;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --bad:#b4332b; --bad-soft:#f8e2df; --warn:#a86a00; --warn-soft:#fbefd6;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17121a; --surface:#211a24; --sunk:#1b151e; --line:#3a2f3d;
  --fg:#f1eaf0; --muted:#ab9daa; --accent:#d29bc3; --accent-fg:#23141e; --accent-soft:#3a2636;
  --ok:#5fcf93; --ok-soft:#173326; --bad:#f2837a; --bad-soft:#3d1c1a; --warn:#f0b54a; --warn-soft:#3a2c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121a; --surface:#211a24; --sunk:#1b151e; --line:#3a2f3d;
  --fg:#f1eaf0; --muted:#ab9daa; --accent:#d29bc3; --accent-fg:#23141e; --accent-soft:#3a2636;
  --ok:#5fcf93; --ok-soft:#173326; --bad:#f2837a; --bad-soft:#3d1c1a; --warn:#f0b54a; --warn-soft:#3a2c12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent)}

/* ---------- Start ---------- */
.start{padding-block:40px 64px;display:grid;gap:32px}
.hero{display:grid;gap:14px;max-width:760px}
.hero h1{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rules div{background:var(--surface);padding:16px 18px;display:grid;gap:4px}
.rules b{font-family:var(--f-mono);font-size:22px}
.rules .plus{color:var(--ok)} .rules .minus{color:var(--bad)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;align-content:start}
.set h2{font-size:24px}
.set .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.set .hist{font-size:13px;color:var(--muted);min-height:20px}
.set .hist .pass{color:var(--ok);font-weight:600}.set .hist .fail{color:var(--bad);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.subjects{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--fg);border:1px solid transparent}
.resume{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.foot{color:var(--muted);font-size:12px}

/* ---------- Exam ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.bar .title{font-weight:700;font-family:var(--f-display);font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:700;padding:4px 12px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.progress{height:4px;background:var(--sunk)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-block:24px 48px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:18px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.qtext{font-size:18px;line-height:1.5;font-weight:500;margin:0}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.choice:hover{border-color:var(--accent)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice .key{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--muted)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .key{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qnav .grp{display:flex;gap:8px;flex-wrap:wrap}
.flagbtn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.counts div{background:var(--sunk);border-radius:8px;padding:8px 4px}
.counts b{display:block;font-family:var(--f-mono);font-size:18px}
.counts span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-height:46vh;overflow:auto;padding:2px}
.grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:5px;font:600 10px var(--f-mono);padding:0;position:relative}
.grid button.ans{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.grid button.cur{outline:2px solid var(--fg);outline-offset:1px}
.grid button.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:1.5px solid var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--muted)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:440px;width:100%;display:grid;gap:14px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Results ---------- */
.res{padding-block:28px 64px;display:grid;gap:28px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.verdict{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;text-align:center;border:10px solid var(--line);position:relative}
.verdict.pass{border-color:var(--ok)} .verdict.fail{border-color:var(--bad)}
.verdict b{font:800 34px var(--f-display);display:block}
.verdict span{font-size:12px;font-weight:700;letter-spacing:.1em}
.verdict.pass span{color:var(--ok)} .verdict.fail span{color:var(--bad)}
.score h2{font-size:28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px}
.stat b{font:700 20px var(--f-mono);display:block}
.stat.c b{color:var(--ok)} .stat.w b{color:var(--bad)} .stat.u b{color:var(--muted)}
.formula{font-size:13px;color:var(--muted);margin-top:10px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);margin-top:14px}
.stack i{display:block;height:100%}
.stack .c{background:var(--ok)} .stack .w{background:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
th.n{text-align:right}
tr:last-child td{border-bottom:none}
td .stack{margin:0;width:140px}
.pct.ok{color:var(--ok);font-weight:700}.pct.bad{color:var(--bad);font-weight:700}
.sec{display:grid;gap:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:999px;font-size:13px}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters select{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:12px;min-width:0}
.rv.c{border-left-color:var(--ok)} .rv.w{border-left-color:var(--bad)} .rv.u{border-left-color:var(--muted)}
.rv .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.pill.c{background:var(--ok-soft);color:var(--ok)} .pill.w{background:var(--bad-soft);color:var(--bad)} .pill.u{background:var(--sunk);color:var(--muted)}
.rv p.q{margin:0;font-weight:500}
.rv ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rv li{padding:8px 12px;border-radius:6px;border:1px solid var(--line);display:grid;grid-template-columns:24px 1fr auto;gap:8px;font-size:14px}
.rv li.right{background:var(--ok-soft);border-color:var(--ok)}
.rv li.picked{background:var(--bad-soft);border-color:var(--bad)}
.rv li small{font-weight:700;font-size:11px;align-self:center}
.rv li.right small{color:var(--ok)} .rv li.picked small{color:var(--bad)}
.explain{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:14px}
.explain b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.empty{color:var(--muted);padding:20px;text-align:center}

@media (max-width:860px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .grid{max-height:none}
  .score{grid-template-columns:1fr;justify-items:start}
}
@media (max-width:480px){
  .qcard{padding:16px}.qtext{font-size:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .timer{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>

<script>
const QBANK = [{"set": 1, "subject": "Accounting", "question": "After closing the fiscal year, a company must guarantee that entries up to the year end can NEVER be modified again, not even by an administrator, to comply with local inalterability rules. Which lock date should be set in Accounting ‣ Accounting ‣ Lock Dates?", "options": ["Hard Lock date", "The 'Locked' checkbox on each journal", "Tax Return lock date", "Lock Everything date"], "answer": 0, "explanation": "Hard Lock date là khóa không thể đảo ngược, không ai (kể cả admin) có thể thay đổi hay tạo ngoại lệ. Lock Everything date vẫn cho phép Administrator tạo exception hoặc gỡ bỏ nên không đáp ứng yêu cầu bất biến.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/year_end.html"}, {"set": 1, "subject": "Accounting", "question": "A Belgian company sells to customers in other EU countries and wants Odoo to apply the correct fiscal position on invoices without the salesperson selecting it manually. What must be configured on the fiscal position?", "options": ["Enable 'Detect Automatically' and set the matching criteria (e.g. country group, VAT required)", "Assign the fiscal position on each product's Accounting tab", "Create a tax group per country and link it to the customer", "Set the fiscal position as default on the Sales journal"], "answer": 0, "explanation": "Khi bật Detect Automatically và khai báo điều kiện (quốc gia/nhóm quốc gia, VAT Required...), Odoo tự chọn fiscal position theo địa chỉ khách hàng. Fiscal position không được gán trên sản phẩm hay journal.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes/fiscal_positions.html"}, {"set": 1, "subject": "Accounting", "question": "A company must declare VAT only when customer invoices are actually paid. Which tax configuration achieves this in Odoo?", "options": ["Create a fiscal position mapping the tax to 0% until payment", "Set the tax's computation to 'Fixed' and use a payment term of 'Immediate Payment'", "Enable Cash Basis in Accounting settings and set the tax's Tax Exigibility to 'Based on Payment'", "Mark the tax as 'Included in Price'"], "answer": 2, "explanation": "Thuế cash basis (Tax Exigibility = Based on Payment) chỉ ghi nhận vào tài khoản thuế thực tế khi hóa đơn được thanh toán/đối soát, trước đó nằm ở tài khoản chuyển tiếp. Thuế 'Included in Price' chỉ ảnh hưởng cách tính giá, không ảnh hưởng thời điểm kê khai.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes/cash_basis.html"}, {"set": 1, "subject": "Accounting", "question": "A customer is invoiced once for a 12-month maintenance contract. The revenue must be recognized month by month. In Odoo 18, what do you fill on the invoice line to trigger the deferred revenue entries?", "options": ["A recurring 'Auto-post' value of Monthly on the invoice", "An analytic distribution with 12 analytic accounts", "A payment term with 12 installments", "The Start Date and End Date of the line"], "answer": 3, "explanation": "Odoo tạo bút toán deferred revenue dựa trên Start Date và End Date trên dòng hóa đơn (tài khoản/journal deferred cấu hình trong Accounting ‣ Configuration ‣ Settings). Payment term nhiều đợt chỉ chia hạn thanh toán, không phân bổ doanh thu.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/deferred_revenues.html"}, {"set": 1, "subject": "Accounting", "question": "The controller wants every vendor bill line to carry a value for the 'Departments' analytic plan, and Odoo must refuse to post a bill without it. How is this configured?", "options": ["Create an analytic distribution model with no conditions", "On the analytic plan, add an Applicability line for the Vendor Bill domain set to 'Mandatory'", "On the expense accounts, tick 'Allow Reconciliation'", "On the purchase journal, enable 'Analytic required'"], "answer": 1, "explanation": "Applicability của analytic plan (Optional/Mandatory/Unavailable) theo từng domain như Vendor Bill quyết định có bắt buộc phân tích hay không. Analytic distribution model chỉ tự điền gợi ý, không chặn việc post.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/analytic_accounting.html"}, {"set": 1, "subject": "Accounting", "question": "A company's terms are '30% due on the invoice date, the balance 60 days later'. How is this handled in Odoo?", "options": ["Create a payment term with two lines (30% at 0 days and 70% at 60 days); the invoice then has two due dates", "Use a down payment product on the invoice", "Set a follow-up level at 60 days", "Create two separate invoices with different payment terms"], "answer": 0, "explanation": "Payment term có thể gồm nhiều dòng phần trăm với số ngày khác nhau, Odoo sẽ tạo nhiều dòng phải thu với các ngày đến hạn tương ứng. Follow-up level chỉ dùng để nhắc nợ, không chia hạn thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/payment_terms.html"}, {"set": 1, "subject": "Accounting", "question": "A posted customer invoice contains a wrong unit price. The accountant wants to cancel it and immediately get a new draft invoice to correct, in one step. Which option of the Credit Note wizard should be used?", "options": ["Reset to Draft on the posted invoice and delete it", "Reverse and Create Invoice", "Register Payment with a write-off", "Reverse"], "answer": 1, "explanation": "'Reverse and Create Invoice' tạo credit note đối trừ toàn bộ hóa đơn gốc và đồng thời tạo một hóa đơn nháp mới để sửa. 'Reverse' chỉ tạo credit note mà không tạo hóa đơn mới.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/credit_notes.html"}, {"set": 1, "subject": "Accounting", "question": "Where do you configure the number of days after the due date at which a payment reminder is sent, and whether it is sent by email, SMS or post?", "options": ["Accounting ‣ Configuration ‣ Payment Terms", "Accounting ‣ Configuration ‣ Journals ‣ Advanced Settings", "Contacts ‣ Configuration ‣ Tags", "Accounting ‣ Configuration ‣ Follow-up Levels"], "answer": 3, "explanation": "Follow-up Levels định nghĩa số ngày so với hạn thanh toán và các hành động (Email, SMS, Letter...). Payment Terms chỉ xác định ngày đến hạn chứ không gửi nhắc nợ.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments/follow_up.html"}, {"set": 1, "subject": "Accounting", "question": "A company invoices in EUR and USD and wants exchange rates updated daily without manual entry. What should be done?", "options": ["Install the Peppol module", "In Accounting settings, enable Automatic Currency Rates, choose a service and set the interval to Daily", "Activate the USD currency only; Odoo updates it on each invoice", "Create a scheduled action on each journal"], "answer": 1, "explanation": "Automatic Currency Rates trong Accounting ‣ Configuration ‣ Settings cho phép chọn nhà cung cấp tỷ giá và tần suất cập nhật (Daily...). Chỉ kích hoạt tiền tệ thì không tự lấy tỷ giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/get_started/multi_currency.html"}, {"set": 1, "subject": "Accounting", "question": "On a 'Fixed Assets' account, the 'Automate Assets' field is set to 'Create and validate'. What is required for this to work?", "options": ["A dedicated asset journal of type Bank", "The Analytic Accounting setting", "An asset model linked to the account", "A lock date on the purchase journal"], "answer": 2, "explanation": "Tùy chọn 'Create and validate' cần có Asset Model để Odoo tự tạo và xác nhận tài sản khi bút toán được ghi vào tài khoản. Với 'Create in draft', tài sản chỉ được tạo nháp và người dùng phải xác nhận thủ công.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/vendor_bills/assets.html"}, {"set": 1, "subject": "Sales", "question": "A sales manager wants reusable quotations with predefined products, validity duration and terms. Where are these created after enabling the right setting?", "options": ["Sales ‣ Products ‣ Pricelists", "Sales ‣ Configuration ‣ Quotation Templates", "Sales ‣ Orders ‣ Quotations ‣ Duplicate", "Sales ‣ Configuration ‣ Sales Teams"], "answer": 1, "explanation": "Sau khi bật Quotation Templates trong Sales settings, menu Sales ‣ Configuration ‣ Quotation Templates xuất hiện để tạo mẫu báo giá. Duplicate một báo giá không phải là mẫu tái sử dụng chính thức.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/quote_template.html"}, {"set": 1, "subject": "Sales", "question": "A company sells laptops and wants to propose a carrying case and an extended warranty as suggestions the customer can add from the online quotation. What should be used?", "options": ["Product variants with a Price Extra", "A Buy X Get Y promotion", "A kit Bill of Materials", "Optional products (on the quotation template or the product form)"], "answer": 3, "explanation": "Optional products được đề xuất trên báo giá và khách có thể tự thêm khi xem báo giá online. Variant là phiên bản của cùng một sản phẩm, không phải sản phẩm bổ sung.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/optional_products.html"}, {"set": 1, "subject": "Sales", "question": "A product uses the 'delivered quantities' invoicing policy. The order is confirmed but nothing has been delivered. What happens when the salesperson tries to create a regular invoice?", "options": ["Odoo invoices the full ordered quantity", "Odoo creates an invoice with zero lines and posts it", "Odoo creates a down payment automatically", "Odoo raises an error because there is nothing to invoice yet"], "answer": 3, "explanation": "Với chính sách theo số lượng giao, chỉ số lượng đã giao mới được xuất hóa đơn; chưa giao thì Odoo báo lỗi không có gì để lập hóa đơn. Lập hóa đơn toàn bộ số lượng đặt là hành vi của chính sách 'ordered'.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/invoicing_policy.html"}, {"set": 1, "subject": "Sales", "question": "A customer must pay 30% upfront before production starts on a confirmed sales order. What is the standard way to invoice this?", "options": ["Create a pricelist at 30%", "Apply a 30% discount on all lines", "Click Create Invoice and choose a down payment (percentage) of 30%", "Split the order into two sales orders"], "answer": 2, "explanation": "Wizard Create Invoice cho phép tạo down payment theo phần trăm hoặc số tiền cố định; khoản này sẽ được trừ vào hóa đơn cuối. Discount 30% làm giảm giá bán, không phải tạm ứng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/down_payment.html"}, {"set": 1, "subject": "Sales", "question": "What does enabling 'Online Signature' in the Sales settings allow?", "options": ["Customers can confirm quotations by signing them electronically from the customer portal", "Salespeople must sign each invoice before posting", "Quotations are locked until a manager signs them", "Vendor bills are signed with the Sign app automatically"], "answer": 0, "explanation": "Online Signature cho phép khách hàng ký điện tử trên portal để xác nhận báo giá, chuyển nó thành đơn bán. Không liên quan đến việc ký hóa đơn nội bộ.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/get_signature_to_validate.html"}, {"set": 1, "subject": "Sales", "question": "A furniture company offers a desk in 10 colors × 5 sizes × 4 finishes but does not want 200 variants created in advance. Which 'Variant Creation Mode' should the attributes use so that variants are only created when they are added to a sales order?", "options": ["Never", "Instantly", "Dynamically", "On demand from the Inventory app"], "answer": 2, "explanation": "Dynamically chỉ tạo variant khi tổ hợp thuộc tính được thêm vào đơn bán. Instantly tạo ngay tất cả tổ hợp; Never không tạo variant mua bán được.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/products/variants.html"}, {"set": 1, "subject": "Sales", "question": "A prepaid service of 10 hours was invoiced on ordered quantities, but 14 hours were actually delivered. What invoice status does Odoo show on the sales order?", "options": ["Upselling Opportunity", "To Invoice", "Fully Invoiced", "Nothing to Invoice"], "answer": 0, "explanation": "Khi số lượng giao vượt số lượng đặt với sản phẩm lập hóa đơn theo ordered, Odoo đánh dấu 'Upselling Opportunity' để nhân viên bán hàng đề xuất bán thêm. 'Fully Invoiced' không phản ánh phần vượt này.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/invoicing_policy.html"}, {"set": 1, "subject": "Sales", "question": "A wholesaler wants prices automatically computed as 'cost + 20%, rounded to .99' for one customer category. Which pricelist rule computation fits best?", "options": ["Discount on Sales Price", "Optional products on the template", "Formula, based on Cost, with a markup and rounding", "Fixed Price on each product"], "answer": 2, "explanation": "Quy tắc dạng Formula cho phép dựa trên giá vốn (Cost), cộng tỷ lệ markup và làm tròn giá (vd .99). Fixed Price yêu cầu nhập giá cố định cho từng sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/prices/pricing.html"}, {"set": 1, "subject": "Sales", "question": "A company wants confirmed sales orders to be automatically locked so they can no longer be edited. Which Sales setting is used?", "options": ["Online Signature", "Lock Confirmed Sales", "Pro-Forma Invoice", "Sale Warnings"], "answer": 1, "explanation": "Lock Confirmed Sales tự khóa đơn bán sau khi xác nhận, tránh sửa đổi. Sale Warnings chỉ hiển thị cảnh báo khi chọn khách hàng/sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 1, "subject": "Purchase", "question": "A company trusts its vendor and wants to be able to create the vendor bill as soon as the purchase order is confirmed, without waiting for the receipt. Which Bill Control policy should be used?", "options": ["Ordered quantities", "Received quantities", "3-way matching", "Purchase Order Approval"], "answer": 0, "explanation": "Với Ordered quantities, hóa đơn mua có thể tạo ngay khi PO được xác nhận. Received quantities yêu cầu phải nhận hàng trước.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 1, "subject": "Purchase", "question": "When 3-way matching is enabled, which field appears on vendor bills (Other Info tab) to indicate whether the bill can be paid?", "options": ["Should Be Paid", "To Approve", "Payment Reference", "Bill Status"], "answer": 0, "explanation": "3-way matching thêm trường 'Should Be Paid' (Yes/No/Exception) trên hóa đơn mua để biết hóa đơn có nên thanh toán hay không. 'To Approve' là trạng thái của PO cần duyệt.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 1, "subject": "Purchase", "question": "A blanket order with fixed unit prices for 3 products is confirmed. What does Odoo create on those products?", "options": ["A reordering rule for each product", "A sales pricelist with the same prices", "A new vendor line in each product's Purchase tab referencing the vendor, price and agreement", "A draft purchase order for the whole agreed quantity"], "answer": 2, "explanation": "Khi xác nhận blanket order, mỗi sản phẩm có thêm dòng vendor (giá, nhà cung cấp, thỏa thuận) trong tab Purchase, phục vụ cho replenishment. Odoo không tự tạo PO cho toàn bộ số lượng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/blanket_orders.html"}, {"set": 1, "subject": "Purchase", "question": "A buyer sent RFQs for the same items to three vendors as alternatives. Which tool lets her compare offers per product and pick the best one for each line?", "options": ["The Replenishment report", "The vendor's pricelist list view", "The Purchase Analysis report", "Compare Product Lines (from the Alternatives tab)"], "answer": 3, "explanation": "Từ tab Alternatives, 'Compare Product Lines' nhóm các báo giá theo sản phẩm và cho phép Choose/Clear từng dòng. Purchase Analysis là báo cáo thống kê, không dùng để chọn báo giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/calls_for_tenders.html"}, {"set": 1, "subject": "Purchase", "question": "Purchase Order Approval is enabled with a minimum amount of 5,000. A purchase user confirms an RFQ of 7,000. What happens?", "options": ["The confirmation is refused with an error", "The order goes to 'To Approve' and must be approved by a Purchase administrator", "The RFQ is automatically split into two orders", "The order is confirmed and the manager receives an email"], "answer": 1, "explanation": "Với Purchase Order Approval, đơn vượt Minimum Amount chuyển sang trạng thái 'To Approve' và cần người có quyền quản trị Purchase duyệt. Đơn không bị tách hay báo lỗi.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/manage.html"}, {"set": 1, "subject": "Purchase", "question": "A company sells products shipped directly from the vendor to the customer, without passing through its warehouse. What is needed?", "options": ["Use a blanket order", "Use the Make To Order route only", "Create a reordering rule with a 0 minimum", "Enable Dropshipping and set the Dropship route on the product (with a vendor defined)"], "answer": 3, "explanation": "Dropship route khiến việc xác nhận đơn bán tạo RFQ cho nhà cung cấp, hàng được giao thẳng từ vendor đến khách. MTO thuần sẽ nhập hàng về kho trước.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/dropshipping.html"}, {"set": 1, "subject": "Purchase", "question": "A product has a reordering rule with Min = 20 and Max = 100 and the Buy route. Forecasted stock drops to 15. What does Odoo propose?", "options": ["An RFQ for 5 units", "A manufacturing order for 100 units", "An RFQ for 85 units to the vendor, bringing forecast stock to 100", "An RFQ for 20 units"], "answer": 2, "explanation": "Khi tồn dự báo xuống dưới Min, Odoo đặt hàng đủ để đạt Max: 100 - 15 = 85. Route Buy tạo RFQ chứ không tạo lệnh sản xuất.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/reordering_rules.html"}, {"set": 1, "subject": "Purchase", "question": "A vendor gives 10 €/unit for orders under 100 units and 8 €/unit from 100 units. How do you make Odoo pick the right price automatically on RFQs?", "options": ["Use a call for tenders", "Create two vendor pricelist lines for the vendor on the product, the second with a minimum quantity of 100", "Create a sales pricelist with two rules", "Apply a 20% discount manually"], "answer": 1, "explanation": "Vendor pricelist (tab Purchase của sản phẩm) hỗ trợ Quantity tối thiểu; Odoo chọn giá phù hợp theo số lượng trên RFQ. Pricelist bán hàng không áp dụng cho mua hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/products/pricelist.html"}, {"set": 1, "subject": "Spreadsheet", "question": "A user wants to insert the records of a list view into an Odoo spreadsheet. Where is this option?", "options": ["Via Documents ‣ Configuration ‣ Spreadsheet Templates", "Via the Export button, choosing the XLSX format", "Via the Data ‣ Refresh all data menu", "Via the Actions (gear) icon next to the view name: Spreadsheet ‣ Insert list in spreadsheet"], "answer": 3, "explanation": "Từ list view, biểu tượng Actions (bánh răng) cạnh tên view có Spreadsheet ‣ Insert list in spreadsheet. Export XLSX tạo file tĩnh, không liên kết dữ liệu Odoo.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 1, "subject": "Spreadsheet", "question": "A spreadsheet with an inserted pivot is open while new sales orders are confirmed. How can the user update the figures without leaving the spreadsheet?", "options": ["File ‣ Save as template", "Insert ‣ Link", "Data ‣ Refresh all data", "File ‣ Make a copy"], "answer": 2, "explanation": "Dữ liệu Odoo cập nhật khi mở spreadsheet, khi tải lại trang hoặc khi chọn Data ‣ Refresh all data. Make a copy chỉ nhân bản file.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 1, "subject": "Spreadsheet", "question": "Which global filter types can be added to an Odoo 18 spreadsheet?", "options": ["Date, Relation and Text", "Date, Number and Boolean", "Only Date", "Relation, Formula and Selection"], "answer": 0, "explanation": "Odoo 18 hỗ trợ ba loại global filter: Date, Relation và Text. Không có loại Formula hay Boolean.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/global_filters.html"}, {"set": 1, "subject": "Spreadsheet", "question": "A finance team built a monthly reporting spreadsheet and wants every user to start future reports from it. What should they do?", "options": ["Use File ‣ Save as template; it then appears when creating a new spreadsheet", "Download it as .xlsx and re-upload it each month", "Share it with a public link", "Add it to a dashboard"], "answer": 0, "explanation": "File ‣ Save as template lưu spreadsheet thành mẫu (quản lý ở Documents ‣ Configuration ‣ Spreadsheet Templates), có thể chọn khi tạo New ‣ Spreadsheet. Add to dashboard biến nó thành dashboard, không phải mẫu.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/get_started.html"}, {"set": 1, "subject": "Spreadsheet", "question": "A user wants to share a spreadsheet containing live Odoo data with an external accountant who has no Odoo account. What should be used?", "options": ["Share the spreadsheet directly; external users see live data", "Freeze and share, which creates a read-only snapshot with formulas replaced by values", "Use File ‣ See version history", "Add the spreadsheet to a dashboard"], "answer": 1, "explanation": "Spreadsheet chứa dữ liệu động không thể truy cập bởi người dùng bên ngoài; 'Freeze and share' tạo bản sao chỉ đọc với giá trị tĩnh. Chia sẻ trực tiếp không hiển thị dữ liệu live cho người ngoài.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/share_collaborate.html"}, {"set": 1, "subject": "Spreadsheet", "question": "In an Odoo 18 spreadsheet, which function returns a single value from an inserted pivot table for a given measure and dimension values?", "options": ["ODOO.FILTER.VALUE", "PIVOT.HEADER", "ODOO.LIST", "PIVOT.VALUE"], "answer": 3, "explanation": "PIVOT.VALUE(pivot_id, measure_name, ...) trả về một giá trị của pivot. PIVOT.HEADER trả về tiêu đề; ODOO.LIST lấy giá trị từ list.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/functions.html"}, {"set": 2, "subject": "Accounting", "question": "The Lock Everything date is set to 31/12. An auditor finds an error and the accountant must post a correction dated 15/12. What is possible in Odoo 18?", "options": ["A user with Administrator rights in Accounting can create an exception to the lock date, which is logged in the company's chatter", "Any invoicing user can post the entry after a warning", "Nothing: the Lock Everything date can never be changed", "The entry is automatically re-dated to the next fiscal year without notice"], "answer": 0, "explanation": "Lock Everything date có thể được Administrator tạo exception (được ghi lại trong chatter của công ty) hoặc gỡ bỏ. Chỉ Hard Lock date mới là không thể thay đổi.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/year_end.html"}, {"set": 2, "subject": "Accounting", "question": "A payment term offers a 2% early payment discount. The company's country requires the tax base to be reduced only if the customer actually pays early. Which 'Reduced tax' option must be selected on the payment term?", "options": ["Always (upon invoice)", "Never", "On early payment", "Based on Payment"], "answer": 2, "explanation": "'On early payment' chỉ giảm cơ sở tính thuế khi khách hàng thực sự thanh toán sớm. 'Always (upon invoice)' giảm thuế ngay trên hóa đơn bất kể khách trả lúc nào.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/cash_discounts.html"}, {"set": 2, "subject": "Accounting", "question": "An auditor requires credit notes to use a numbering sequence separate from invoices in the same Sales journal. Where is this set?", "options": ["On each credit note, edit the Reference field", "On the journal, enable 'Dedicated Credit Note Sequence'", "Create a second company dedicated to credit notes", "In Accounting settings, enable 'Credit Note Lock Date'"], "answer": 1, "explanation": "Tùy chọn Dedicated Credit Note Sequence trên journal (Advanced Settings) tạo dãy số riêng cho credit note. Sửa tay trường Reference không tạo được dãy số độc lập.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/credit_notes.html"}, {"set": 2, "subject": "Accounting", "question": "A company does not want one deferral entry per invoice. It prefers to generate deferred revenue entries in bulk at month end from the deferred revenue report. Which 'Generate Entries' option should be selected?", "options": ["On invoice/bill validation", "Manually & Grouped", "Based on Days", "Auto-post: Monthly"], "answer": 1, "explanation": "'Manually & Grouped' cho phép tạo bút toán deferral gộp, thủ công (từ báo cáo deferred). 'On invoice/bill validation' (mặc định) tạo bút toán ngay khi xác nhận từng hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/deferred_revenues.html"}, {"set": 2, "subject": "Accounting", "question": "Each time a bill from vendor 'CleanCo' is recorded, the 'Facilities' analytic account should be pre-filled automatically. What is the best way?", "options": ["Create a reconciliation model for CleanCo", "Create an analytic distribution model with Partner = CleanCo and the Facilities distribution", "Make the analytic plan 'Mandatory'", "Set the analytic account on CleanCo's Accounting tab as a fiscal position"], "answer": 1, "explanation": "Analytic Distribution Models (Accounting ‣ Configuration) tự áp dụng phân bổ analytic khi thỏa điều kiện như partner, sản phẩm, tài khoản. Đặt plan là Mandatory chỉ bắt buộc nhập, không tự điền.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/analytic_accounting.html"}, {"set": 2, "subject": "Accounting", "question": "An invoice of USD 1,000 is posted when 1 USD = 0.90 EUR and paid when 1 USD = 0.92 EUR (company currency EUR). What does Odoo do at reconciliation?", "options": ["It refuses the reconciliation until the rates match", "It changes the original invoice amount to EUR 920", "It posts an exchange difference entry in the journal defined under Exchange Difference Entries in the settings", "It records the difference as a tax adjustment"], "answer": 2, "explanation": "Khi đối soát hóa đơn và thanh toán ngoại tệ với tỷ giá khác nhau, Odoo tự tạo bút toán chênh lệch tỷ giá vào journal và tài khoản lãi/lỗ cấu hình ở Settings. Hóa đơn gốc không bị sửa.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/get_started/multi_currency.html"}, {"set": 2, "subject": "Accounting", "question": "Which set lists the depreciation methods available for assets in Odoo 18?", "options": ["Straight Line, Declining, Declining Then Straight Line", "Straight Line, Double Declining, Annuity", "Linear, Degressive, Manual", "Straight Line, Sum of Years' Digits, Units of Production"], "answer": 0, "explanation": "Odoo 18 hỗ trợ ba phương pháp khấu hao: Straight Line, Declining và Declining Then Straight Line. Các phương pháp như Units of Production hay Sum of Years' Digits không có sẵn.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/vendor_bills/assets.html"}, {"set": 2, "subject": "Accounting", "question": "A Belgian company wants to send structured e-invoices to its customers through the Peppol network directly from Odoo. What is needed?", "options": ["Enable Bank Synchronization and send invoices as bank transfers", "Activate the 'Snailmail' follow-up action", "Export invoices as CSV and upload them to the tax portal", "Register the company on Peppol in the Accounting settings (EAS code and endpoint), then send invoices with the Peppol option of 'Send & Print'"], "answer": 3, "explanation": "Odoo hoạt động như access point Peppol: công ty đăng ký (Peppol EAS, Endpoint) rồi gửi hóa đơn qua tùy chọn Peppol trong 'Send & Print'. Snailmail là gửi thư giấy, không phải hóa đơn điện tử.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/electronic_invoicing.html"}, {"set": 2, "subject": "Accounting", "question": "In a follow-up level, the 'Send a Letter' and 'Send SMS Message' actions are enabled. What is required for these actions to work?", "options": ["A Peppol registration", "A dedicated follow-up journal", "In-App Purchase (IAP) credits", "The Hard Lock date"], "answer": 2, "explanation": "Gửi thư bưu điện và SMS là dịch vụ IAP nên cần có credits. Peppol dùng cho hóa đơn điện tử, không liên quan đến nhắc nợ.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments/follow_up.html"}, {"set": 2, "subject": "Accounting", "question": "A newly founded company has a first fiscal period of 18 months, after which it uses normal calendar years. How do you configure this?", "options": ["Create a new company after 18 months", "Change the Last Day of the fiscal period to an 18-month date", "Set a Lock Everything date 18 months ahead", "Enable 'Fiscal Years' in Accounting settings and create a fiscal year record with the 18-month start and end dates"], "answer": 3, "explanation": "Với kỳ khác 12 tháng, bật Fiscal Years và tạo bản ghi fiscal year với ngày bắt đầu/kết thúc; sau đó Odoo quay lại chu kỳ mặc định theo Last Day. Last Day chỉ là ngày/tháng kết thúc năm, không định nghĩa được kỳ 18 tháng.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/year_end.html"}, {"set": 2, "subject": "Sales", "question": "A quotation template is configured with 'Online Payment' and a prepayment of 40%. What happens when a customer accepts a quotation built from this template?", "options": ["The order is confirmed and 40% is invoiced at delivery", "A vendor bill of 40% is generated", "The customer receives a 40% discount", "The customer is asked to pay 40% online to confirm the order"], "answer": 3, "explanation": "Với Online Payment và prepayment %, khách phải thanh toán trước phần trăm đó trên portal để xác nhận đơn. Không có giảm giá hay hóa đơn mua nào được tạo.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/get_paid_to_validate.html"}, {"set": 2, "subject": "Sales", "question": "On a product attribute, the 'Multi-checkbox' display type is selected. Which Variant Creation Mode is required?", "options": ["Dynamically", "Instantly", "Any mode works", "Never"], "answer": 3, "explanation": "Display type Multi-checkbox yêu cầu Variant Creation Mode = Never vì nhiều giá trị có thể được chọn cùng lúc và không tạo variant. Instantly/Dynamically tạo variant cho một giá trị mỗi thuộc tính.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/products/variants.html"}, {"set": 2, "subject": "Sales", "question": "An eCommerce company wants invoices to be created automatically when online payments are confirmed. Its products use the 'delivered quantities' invoicing policy. What is the issue?", "options": ["Automatic Invoice cannot be used with the delivered quantities policy", "Online payments require the Purchase app", "Automatic Invoice only works with quotation templates", "There is no issue; it works out of the box"], "answer": 0, "explanation": "Tài liệu Odoo 18 nêu rõ không thể dùng Automatic Invoice với chính sách lập hóa đơn theo số lượng giao. Cần chuyển sang chính sách theo số lượng đặt.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/invoicing_policy.html"}, {"set": 2, "subject": "Sales", "question": "A 20% down payment was invoiced and paid on a sales order. What happens when the final invoice is created?", "options": ["The final invoice is blocked until the down payment is cancelled", "A credit note for 20% is created separately", "The down payment is ignored and must be refunded", "The down payment is deducted automatically from the final invoice as a separate line"], "answer": 3, "explanation": "Hóa đơn cuối sẽ có dòng trừ khoản down payment đã lập hóa đơn trước đó. Không cần hoàn tiền hay tạo credit note riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/down_payment.html"}, {"set": 2, "subject": "Sales", "question": "A customer has unpaid debts and the accountant wants to completely prevent new sales orders for this customer from being created. What can be configured?", "options": ["Set the customer's fiscal position to 'Blocked'", "Remove the customer's payment term", "Enable Sale Warnings and set a 'Blocking Message' on the customer", "Archive the customer's pricelist"], "answer": 2, "explanation": "Sale Warnings cho phép đặt cảnh báo hoặc 'Blocking Message' trên khách hàng/sản phẩm; blocking chặn tiếp tục tạo đơn. Xóa payment term không ngăn được việc bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 2, "subject": "Sales", "question": "Pricelists are enabled. How can a specific pricelist be applied automatically whenever a quotation is created for a given customer?", "options": ["Set the pricelist on the customer's contact form (Sales & Purchase tab)", "Set the pricelist on the sales team", "Add the customer to the pricelist's Optional Products", "Pricelists can only be selected manually on each quotation"], "answer": 0, "explanation": "Pricelist gán trên form khách hàng (tab Sales & Purchase) sẽ được tự động áp dụng khi tạo báo giá cho khách đó. Optional products không liên quan đến pricelist.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/prices/pricing.html"}, {"set": 2, "subject": "Sales", "question": "A sales manager wants each team's dashboard card to show progress against a monthly revenue goal. Where is this target defined?", "options": ["In Accounting ‣ Budgets", "On the sales team form, in the Invoicing Target field", "In the quotation template", "On each salesperson's employee form"], "answer": 1, "explanation": "Trường Invoicing Target trên Sales Team dùng để hiển thị tiến độ doanh thu trên dashboard của team. Quotation template không chứa mục tiêu doanh thu.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 2, "subject": "Sales", "question": "Salespeople need to give a percentage discount on individual quotation lines. What must be enabled?", "options": ["A pricelist with Fixed Price rules", "The 'Discounts' setting in Sales, which adds a Disc.% column on order lines", "The 'Margins' setting", "A Loyalty program of type Promotion"], "answer": 1, "explanation": "Bật Discounts trong Sales settings sẽ hiện cột Disc.% để giảm giá từng dòng. Margins chỉ hiển thị biên lợi nhuận, không cho phép giảm giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/prices.html"}, {"set": 2, "subject": "Sales", "question": "Which setting must be enabled in Sales to use coupons, promotions, loyalty cards and gift cards on quotations?", "options": ["Online Payment", "Pricelists", "Discounts, Loyalty & Gift Card", "Quotation Templates"], "answer": 2, "explanation": "Các chương trình coupon, promotion, loyalty, gift card và eWallet trong Sales yêu cầu bật 'Discounts, Loyalty & Gift Card'. Pricelists chỉ quản lý giá theo quy tắc.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/loyalty_discount.html"}, {"set": 2, "subject": "Purchase", "question": "3-way matching is enabled. With which Bill Control policy is it designed to work?", "options": ["Ordered quantities", "Received quantities", "Neither; it requires Purchase Agreements", "Both, without difference"], "answer": 1, "explanation": "3-way matching đảm bảo chỉ thanh toán khi đã nhận hàng nên chỉ hoạt động với chính sách Received quantities. Với Ordered quantities, hóa đơn có thể tạo trước khi nhận hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 2, "subject": "Purchase", "question": "With 3-way matching enabled, an accountant edits the quantity and price on a draft vendor bill. What does Odoo set in 'Should Be Paid'?", "options": ["Yes", "No", "Exception", "To Approve"], "answer": 2, "explanation": "Khi hóa đơn nháp bị chỉnh sửa (số lượng, giá, sản phẩm), Odoo đặt 'Exception' để cảnh báo nhưng không chặn. 'Yes' là giá trị mặc định cho hóa đơn mới, 'No' sau khi đã thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 2, "subject": "Purchase", "question": "A buyer confirms one of three alternative RFQs. A pop-up asks what to do with the others. Which choice cancels the remaining alternatives?", "options": ["Discard", "Keep Alternatives", "Lock", "Cancel Alternatives"], "answer": 3, "explanation": "'Cancel Alternatives' tự động hủy các RFQ thay thế còn lại; 'Keep Alternatives' giữ chúng mở; 'Discard' dừng việc xác nhận.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/calls_for_tenders.html"}, {"set": 2, "subject": "Purchase", "question": "A confirmed blanket order covers 1,000 units. The buyer clicks 'New Quotation' on it and confirms an order of 200 units. What is updated on the blanket order?", "options": ["The agreement quantity is reduced to 800 and a new agreement is created", "The blanket order is closed", "Nothing; blanket orders are not linked to RFQs", "The Ordered quantity on the agreement line increases by 200"], "answer": 3, "explanation": "RFQ tạo từ blanket order được liên kết với thỏa thuận và số lượng đặt sẽ cập nhật cột Ordered. Thỏa thuận vẫn mở cho các lần đặt tiếp theo.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/blanket_orders.html"}, {"set": 2, "subject": "Purchase", "question": "Which Purchase setting must be enabled to use blanket orders and to create alternative RFQs?", "options": ["Vendor Pricelists", "Purchase Order Approval", "Purchase Agreements", "Lock Confirmed Orders"], "answer": 2, "explanation": "Bật Purchase Agreements (Purchase ‣ Configuration ‣ Settings, mục Orders) cho phép dùng blanket order và tạo RFQ thay thế. Purchase Order Approval chỉ liên quan đến duyệt đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/agreements.html"}, {"set": 2, "subject": "Purchase", "question": "A company wants purchase orders to be automatically locked after confirmation so that they cannot be modified anymore. Which setting should be enabled?", "options": ["Lock Confirmed Orders", "Purchase Order Approval", "3-way matching", "Receipt Reminder"], "answer": 0, "explanation": "Lock Confirmed Orders khóa PO sau khi xác nhận (vẫn có thể Unlock nếu có quyền). Purchase Order Approval chỉ yêu cầu duyệt trước khi xác nhận.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/manage.html"}, {"set": 2, "subject": "Purchase", "question": "An accountant creates a vendor bill manually and wants to fill its lines from an existing purchase order. Which field on the draft bill is used?", "options": ["Auto-Complete", "Payment Reference", "Incoterm", "Source Document only"], "answer": 0, "explanation": "Trường Auto-Complete trên hóa đơn mua nháp cho phép chọn PO (hoặc hóa đơn cũ) để tự điền các dòng. Source Document chỉ là trường tham chiếu văn bản.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 2, "subject": "Purchase", "question": "In the Replenishment report (Inventory ‣ Operations ‣ Replenishment), what does the 'Order Once' button do?", "options": ["It confirms all draft RFQs of the vendor", "It triggers the replenishment once for that line without creating a permanent reordering rule", "It sets the reordering rule to Manual trigger forever", "It creates a blanket order"], "answer": 1, "explanation": "Order Once thực hiện bổ sung hàng một lần (tạo RFQ/MO) cho dòng đó mà không lưu thành quy tắc vĩnh viễn. Không tạo blanket order.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment.html"}, {"set": 2, "subject": "Spreadsheet", "question": "From a pivot view in the Sales app, a user clicks 'Insert in Spreadsheet' and chooses an existing spreadsheet. Where is the pivot placed?", "options": ["In a new dashboard", "In a separate .xlsx file attached to the spreadsheet", "On the currently selected cell of the first sheet", "On a new sheet of that spreadsheet, with its properties opened in a side panel"], "answer": 3, "explanation": "Pivot được chèn vào một sheet mới và panel thuộc tính pivot mở ở bên phải. Không tạo dashboard hay file xlsx.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 2, "subject": "Spreadsheet", "question": "A list of 80 customers was inserted into a spreadsheet. Next week, 15 new customers are created in Odoo. What happens in the spreadsheet?", "options": ["The list does not expand automatically; rows must be added manually (or extra rows inserted from the start)", "The list automatically grows to 95 rows", "The 15 new customers replace the oldest ones", "The spreadsheet shows an error until it is re-inserted"], "answer": 0, "explanation": "List đã chèn có số dòng cố định và không tự mở rộng khi có bản ghi mới; cần thêm dòng thủ công hoặc chèn dư dòng từ đầu.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 2, "subject": "Spreadsheet", "question": "A date global filter was added to a spreadsheet that contains two pivots and a list, but only one pivot reacts to it. What is the most likely cause?", "options": ["The filter has not been matched to a date field for the other data sources", "Global filters only work on the first sheet", "Lists and pivots cannot share a filter", "The spreadsheet must be saved as a template first"], "answer": 0, "explanation": "Mỗi data source phải được 'field matching' với một trường phù hợp thì global filter mới áp dụng; thiếu matching thì data source đó không được lọc. Global filter áp dụng cho mọi sheet.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/global_filters.html"}, {"set": 2, "subject": "Spreadsheet", "question": "An editor wants to mark the state of a budget spreadsheet before major changes so it can be restored later. Which feature should be used?", "options": ["Data ‣ Refresh all data", "File ‣ See version history, then name the version", "File ‣ Save as template", "Freeze and share"], "answer": 1, "explanation": "Version history cho phép xem các phiên bản trước, đặt tên phiên bản quan trọng, khôi phục hoặc tạo bản sao. Save as template tạo mẫu mới, không theo dõi lịch sử.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/get_started.html"}, {"set": 2, "subject": "Spreadsheet", "question": "A user selects File ‣ Add to dashboard on a spreadsheet. What happens?", "options": ["The spreadsheet is frozen and shared publicly", "The spreadsheet becomes a dashboard in the Dashboards app (first tab as the front end) and is removed from Documents", "Only the charts are copied to the dashboard", "A link to the spreadsheet is pinned on the user's home screen; the spreadsheet stays in Documents"], "answer": 1, "explanation": "Add to dashboard chuyển spreadsheet thành dashboard (chọn tên, section, access groups), tab đầu tiên là giao diện chính và spreadsheet bị gỡ khỏi Documents.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/get_started.html"}, {"set": 2, "subject": "Spreadsheet", "question": "Which Odoo spreadsheet function returns the total balance of given accounts over a period, e.g. for a custom P&L?", "options": ["ODOO.CURRENCY.RATE", "ODOO.LIST", "ODOO.BALANCE", "PIVOT.HEADER"], "answer": 2, "explanation": "ODOO.BALANCE(account_codes, date_range, ...) trả về số dư của các tài khoản trong kỳ. ODOO.CURRENCY.RATE chỉ trả về tỷ giá giữa hai tiền tệ.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/functions.html"}, {"set": 3, "subject": "Accounting", "question": "A company pays the same monthly rent and wants Odoo to post the recurring journal entry automatically each month. Which feature should be used on the journal entry?", "options": ["The Deferred Expense setting with Manually & Grouped", "A payment term of 30 days", "The 'Auto-post' field set to Monthly", "A reconciliation model"], "answer": 2, "explanation": "Trường Auto-post (At Date/Monthly/Quarterly/Yearly) trên bút toán cho phép Odoo tự tạo và post bút toán định kỳ. Payment term chỉ dùng cho hạn thanh toán của hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/get_started.html"}, {"set": 3, "subject": "Accounting", "question": "A payment is registered on a customer invoice through a bank journal whose payment method uses an Outstanding Receipts account. The bank statement has not been imported yet. What is the invoice status?", "options": ["In Payment", "Posted", "Paid", "Partial"], "answer": 0, "explanation": "Khi thanh toán ghi nhận vào tài khoản Outstanding Receipts, hóa đơn ở trạng thái 'In Payment' cho đến khi dòng sao kê ngân hàng được đối soát với thanh toán, lúc đó mới chuyển thành 'Paid'.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments.html"}, {"set": 3, "subject": "Accounting", "question": "What is the main benefit of Online Bank Synchronization in Odoo Accounting?", "options": ["Vendor bills are digitized from scanned PDFs", "Customer invoices are automatically paid by direct debit", "Bank transactions are imported automatically into the bank journal, ready to be reconciled", "The bank reconciles invoices on its side and sends the result to Odoo"], "answer": 2, "explanation": "Bank synchronization tự động nhập giao dịch ngân hàng vào journal Bank để người dùng đối soát trong Odoo. Số hóa hóa đơn (OCR) là tính năng khác.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/bank/bank_synchronization.html"}, {"set": 3, "subject": "Accounting", "question": "A company receives about 40 customer checks every week and wants to deposit them together and match one single line on the bank statement. Which feature should be enabled?", "options": ["Cash Basis", "Analytic Distribution Models", "Dedicated Credit Note Sequence", "Batch Payments"], "answer": 3, "explanation": "Batch Payments gom nhiều khoản thanh toán thành một lô để đối soát với một dòng sao kê duy nhất. Các tính năng còn lại không liên quan đến gom thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments/batch.html"}, {"set": 3, "subject": "Accounting", "question": "In the deferred revenue settings, which 'Based on' option makes the monthly amount vary according to the number of days in each month?", "options": ["Months", "Days", "Manually & Grouped", "Full Months"], "answer": 1, "explanation": "Với 'Days', số tiền phân bổ mỗi tháng thay đổi theo số ngày trong tháng. 'Months' chia đều theo tháng (chỉ prorate tháng lẻ), 'Full Months' coi mọi tháng bắt đầu là tháng đầy đủ.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/deferred_revenues.html"}, {"set": 3, "subject": "Accounting", "question": "A company sells a machine that is still being depreciated. What is the recommended way to record this in Odoo?", "options": ["Use 'Modify Depreciation' to set the value to zero", "Archive the asset and delete its remaining depreciation entries manually", "Post the customer invoice, then use 'Sell or Dispose' on the asset and link the invoice line; Odoo computes the gain or loss", "Create a credit note on the original vendor bill"], "answer": 2, "explanation": "Nút 'Sell or Dispose' tạo bút toán thanh lý, tính lãi/lỗ dựa trên giá trị còn lại so với giá bán (hóa đơn bán phải được post trước). 'Modify Depreciation' dùng để tăng/giảm giá trị, không phải bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/vendor_bills/assets.html"}, {"set": 3, "subject": "Accounting", "question": "A fiscal position for intra-EU B2B customers maps 'VAT 21% (sales)' to 'VAT 0% EU'. What does this mapping do?", "options": ["It converts invoice amounts into the customer's currency", "It changes the default tax on all products permanently", "It blocks invoices to EU customers without a VAT number", "When the fiscal position applies to an order or invoice, the 21% tax on product lines is replaced by the 0% EU tax"], "answer": 3, "explanation": "Fiscal position ánh xạ thuế (và tài khoản) trên chứng từ khi được áp dụng, không thay đổi thuế mặc định trên sản phẩm. Việc đổi tiền tệ do pricelist/tiền tệ chứng từ quyết định.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes/fiscal_positions.html"}, {"set": 3, "subject": "Accounting", "question": "A EUR-based company posts a vendor bill in GBP. Which exchange rate does Odoo use to compute the company-currency amounts of the bill?", "options": ["The rate entered on the vendor's contact form", "The rate valid at the bill/accounting date", "The rate of the date when the bill will be paid", "The average rate of the fiscal year"], "answer": 1, "explanation": "Odoo quy đổi theo tỷ giá có hiệu lực tại ngày chứng từ; chênh lệch khi thanh toán ở ngày khác được ghi bằng bút toán exchange difference. Không có tỷ giá trên form liên hệ.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/get_started/multi_currency.html"}, {"set": 3, "subject": "Accounting", "question": "A key customer must never receive automatic reminders; the account manager wants to handle follow-ups personally. Where is this set?", "options": ["Delete the follow-up levels", "Set a Lock Everything date", "Remove all payment terms from the customer", "On the customer form, Accounting tab, set the invoice follow-up reminders to Manual"], "answer": 3, "explanation": "Trong tab Accounting của khách hàng, phần Invoice follow-ups cho phép chọn Automatic hoặc Manual và người phụ trách. Xóa follow-up levels sẽ ảnh hưởng tất cả khách hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments/follow_up.html"}, {"set": 3, "subject": "Accounting", "question": "The 'Analytic' field is not visible on invoice lines in a new database. What must be done first?", "options": ["Enable 'Analytic Accounting' in Accounting ‣ Configuration ‣ Settings", "Install the Budget module", "Create a cost-center journal", "Activate developer mode"], "answer": 0, "explanation": "Trường Analytic Distribution chỉ xuất hiện khi bật Analytic Accounting trong Settings (mục Analytics). Developer mode không cần thiết cho việc này.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/analytic_accounting.html"}, {"set": 3, "subject": "Sales", "question": "A customer needs an invoice-like document before confirming the order so it can pay in advance. Which Sales setting allows sending this document?", "options": ["Pro-Forma Invoice", "Customer Addresses", "Lock Confirmed Sales", "Down Payments product"], "answer": 0, "explanation": "Pro-Forma Invoice cho phép gửi hóa đơn chiếu lệ từ báo giá mà không tạo bút toán kế toán. Lock Confirmed Sales chỉ khóa đơn đã xác nhận.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 3, "subject": "Sales", "question": "A T-shirt has an attribute 'Size' with value 'XXL'. The XXL variant must cost 3 € more than the base price. Where is this configured?", "options": ["In a separate product with its own sales price", "As an optional product", "As the Value Price Extra of the XXL value (via Configure on the product's Attributes & Variants tab)", "On the customer's pricelist only"], "answer": 2, "explanation": "Value Price Extra trên giá trị thuộc tính cộng thêm vào giá bán khi chọn giá trị đó. Tạo sản phẩm riêng sẽ mất lợi ích quản lý variant.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/products/variants.html"}, {"set": 3, "subject": "Sales", "question": "A sales manager wants to see the profit (sales price minus cost) on each quotation before confirming it. Which setting should be enabled?", "options": ["Margins", "Sale Warnings", "Pro-Forma Invoice", "Discounts"], "answer": 0, "explanation": "Margins hiển thị biên lợi nhuận trên dòng và tổng báo giá dựa trên giá vốn. Discounts chỉ thêm cột giảm giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 3, "subject": "Sales", "question": "A B2B customer has a head office receiving invoices and several warehouses receiving goods. Which Sales setting makes the Invoice Address and Delivery Address fields available on quotations?", "options": ["Pricelists", "Multi-Warehouses", "Dropshipping", "Customer Addresses"], "answer": 3, "explanation": "Bật Customer Addresses cho phép chọn địa chỉ xuất hóa đơn và địa chỉ giao hàng riêng trên báo giá. Multi-Warehouses là kho của công ty, không phải địa chỉ khách hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 3, "subject": "Sales", "question": "A quotation is emailed to the customer with 'Send by Email'. What is its status after sending, before confirmation?", "options": ["Sales Order", "Locked", "To Invoice", "Quotation Sent"], "answer": 3, "explanation": "Sau khi gửi email, báo giá chuyển sang trạng thái 'Quotation Sent'; chỉ khi xác nhận mới thành 'Sales Order'. 'To Invoice' là trạng thái hóa đơn chứ không phải trạng thái đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations.html"}, {"set": 3, "subject": "Sales", "question": "A marketing team wants to generate 500 unique single-use codes, each giving 10% off, to distribute at a trade fair. Which program type fits best?", "options": ["eWallet", "Coupons", "Promotions", "Loyalty Cards"], "answer": 1, "explanation": "Chương trình Coupons sinh ra các mã riêng, dùng một lần để phân phát. Promotions áp dụng tự động theo điều kiện, không cần sinh mã riêng cho từng người.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/loyalty_discount.html"}, {"set": 3, "subject": "Sales", "question": "In Odoo 18, what happens when a salesperson adds a product that has optional products configured to a quotation line?", "options": ["The optional products are added automatically with quantity 1", "A product configurator dialog opens proposing the optional products to add", "Odoo blocks the line until optional products are selected", "Nothing; optional products only appear on invoices"], "answer": 1, "explanation": "Khi sản phẩm có optional products, product configurator hiện lên để đề xuất thêm các sản phẩm tùy chọn. Chúng không tự động được thêm vào đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/optional_products.html"}, {"set": 3, "subject": "Sales", "question": "A pricelist rule should give 15% off a product only when a customer orders at least 50 units. Which field of the rule handles this?", "options": ["Price Extra", "Validity end date", "Min. Quantity", "Rounding Method"], "answer": 2, "explanation": "Min. Quantity trên quy tắc pricelist làm quy tắc chỉ áp dụng khi số lượng đặt đạt ngưỡng. Price Extra thuộc về giá trị thuộc tính variant.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/prices/pricing.html"}, {"set": 3, "subject": "Sales", "question": "A consulting firm sells a service whose hours are tracked in the Timesheets app, and wants to invoice exactly the hours recorded. Which invoicing policy should be set on the service product?", "options": ["Based on Timesheets", "Prepaid/Fixed Price", "Based on Milestones", "Ordered quantities with a down payment"], "answer": 0, "explanation": "Based on Timesheets lấy số giờ ghi nhận trên timesheet làm số lượng đã giao để lập hóa đơn. Prepaid/Fixed Price lập hóa đơn theo số lượng đặt bất kể giờ thực tế.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Purchase", "question": "The default Bill Control policy in Purchase settings is 'Received quantities', but one subscription service must be billed on ordered quantities. What should be done?", "options": ["Create the bill from Accounting without a PO", "Use a call for tenders", "Change the Control Policy on that product's Purchase tab", "Change the global setting each time"], "answer": 2, "explanation": "Chính sách trong Settings chỉ là mặc định cho sản phẩm mới; có thể ghi đè bằng trường Control Policy trên tab Purchase của từng sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 3, "subject": "Purchase", "question": "Under the 'Received quantities' policy, a user clicks 'Create Bill' on a confirmed PO before anything is received. What happens?", "options": ["Odoo raises an error since there is nothing to bill", "The receipt is automatically validated", "A bill for the full ordered quantity is created", "A bill with a 'To Approve' status is created"], "answer": 0, "explanation": "Với Received quantities, chưa nhận hàng thì không có gì để lập hóa đơn nên Odoo báo lỗi. Odoo không tự xác nhận phiếu nhập kho.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 3, "subject": "Purchase", "question": "A buyer wants Odoo to automatically email selected vendors a few days before the expected arrival date to confirm the delivery. Which feature is used?", "options": ["Receipt Reminder", "Lock Confirmed Orders", "Follow-up Levels", "Purchase Order Approval"], "answer": 0, "explanation": "Receipt Reminder gửi email cho nhà cung cấp trước ngày dự kiến nhận hàng (số ngày cấu hình được). Follow-up Levels là nhắc nợ khách hàng trong Accounting.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/manage.html"}, {"set": 3, "subject": "Purchase", "question": "A buyer creates a blanket order, adds products and quantities but leaves the Unit Price empty, and leaves 'Agreement Validity' empty. What is the result?", "options": ["The agreement cannot be confirmed without an end date", "Prices stay at 0 because they are not copied from the product, and the agreement has no expiry date", "Prices are taken from the sales pricelist", "Prices are copied from the product cost, and the agreement expires after one year"], "answer": 1, "explanation": "Giá trong blanket order không tự lấy từ giá sản phẩm nên để trống sẽ là 0; Agreement Validity để trống nghĩa là thỏa thuận không hết hạn.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/blanket_orders.html"}, {"set": 3, "subject": "Purchase", "question": "A buyer already has two independent RFQs for the same need, created before she learned about alternatives. How can she group them for comparison?", "options": ["It is not possible; only new alternatives can be compared", "Duplicate one into a blanket order", "Merge them with the Replenishment report", "From the Alternatives tab of one RFQ, use 'Link to Existing RfQ'"], "answer": 3, "explanation": "'Link to Existing RfQ' trong tab Alternatives liên kết RFQ có sẵn làm phương án thay thế để so sánh. Không cần tạo lại RFQ mới.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/calls_for_tenders.html"}, {"set": 3, "subject": "Purchase", "question": "A product has the 'Buy' and 'Replenish on Order (MTO)' routes. A sales order for it is confirmed. What does Odoo generate?", "options": ["Nothing until a reordering rule is triggered", "A manufacturing order", "An RFQ to the product's vendor, linked to the sales order demand", "A vendor bill"], "answer": 2, "explanation": "Kết hợp MTO và Buy khiến Odoo tạo RFQ cho nhà cung cấp ngay khi xác nhận đơn bán. Không cần reordering rule.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/mto.html"}, {"set": 3, "subject": "Purchase", "question": "Where is the vendor's delivery lead time entered so that Odoo can compute the expected arrival date on RFQs?", "options": ["In the Purchase Order Approval setting", "On the vendor's Accounting tab", "On the payment term", "In the Delivery Lead Time of the vendor line on the product's Purchase tab (vendor pricelist)"], "answer": 3, "explanation": "Delivery Lead Time trên dòng vendor pricelist được dùng để tính ngày dự kiến nhận hàng và thời điểm đặt hàng. Payment term chỉ liên quan đến thanh toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/products/pricelist.html"}, {"set": 3, "subject": "Purchase", "question": "A product is sold by the unit but bought from the vendor in boxes of 12. How is this handled in Odoo 18?", "options": ["Create two different products and link them with a kit", "Enable Units of Measure and set a Purchase UoM (e.g. Box of 12) different from the sales UoM on the product", "Use a variant attribute 'Box'", "Set a minimum quantity of 12 on the sales pricelist"], "answer": 1, "explanation": "Với Units of Measure bật, sản phẩm có thể có Purchase UoM khác đơn vị bán; Odoo tự quy đổi khi nhập kho. Tạo hai sản phẩm riêng gây khó khăn quản lý tồn kho.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/products/uom.html"}, {"set": 3, "subject": "Spreadsheet", "question": "A user types =PIVOT(1,,0) in an empty cell. What does this produce?", "options": ["The first value of pivot 1 only", "A dynamic pivot table for pivot 1, as an array that expands automatically, without totals", "An error, because PIVOT requires a measure name", "A static copy of pivot 1 as plain values"], "answer": 1, "explanation": "PIVOT là hàm mảng tạo pivot động tự mở rộng; tham số include_total = 0 bỏ dòng/cột tổng. Lấy một giá trị đơn lẻ dùng PIVOT.VALUE.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/dynamic_pivot_tables.html"}, {"set": 3, "subject": "Spreadsheet", "question": "A sales dashboard must show each salesperson only their own figures by default. Which global filter setup helps?", "options": ["A Text filter with the user's name typed by each user", "Separate copies of the spreadsheet per user", "A Date filter with a relative period", "A Relation filter on the User model with the option to automatically filter on the current user"], "answer": 3, "explanation": "Relation filter trên model User có tùy chọn mặc định lọc theo người dùng hiện tại. Text filter yêu cầu nhập tay, Date filter không lọc theo người dùng.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/work_with_data/global_filters.html"}, {"set": 3, "subject": "Spreadsheet", "question": "A user uploads an Excel (.xlsx) file to Documents and opens it with Odoo Spreadsheet. By default, what happens to the original .xlsx file?", "options": ["It is converted into a template", "It is shared externally", "It is sent to the trash, unless 'Send source file to trash' is disabled", "It is kept and linked live to the spreadsheet"], "answer": 2, "explanation": "Khi mở file xlsx bằng Odoo Spreadsheet, file gốc mặc định bị chuyển vào thùng rác; có thể tắt 'Send source file to trash' để giữ lại. File gốc không liên kết động với spreadsheet.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/get_started.html"}, {"set": 3, "subject": "Spreadsheet", "question": "A viewer opens a shared spreadsheet that has cell comments added by editors. What does the viewer see?", "options": ["All comments, read-only", "Nothing of the comments; only Owners and Editors can see and use comments", "Only comments mentioning them with @", "Only resolved comments"], "answer": 1, "explanation": "Comments chỉ dành cho Owner và Editor; Viewer không thấy comment. Comment đã resolve vẫn nằm trong panel Comments cho Owner/Editor.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/share_collaborate.html"}, {"set": 3, "subject": "Spreadsheet", "question": "An adminis
