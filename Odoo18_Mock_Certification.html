 tab provides this?", "options": ["The 'Add a section' link", "The 'Catalog' button", "The Product Configurator", "Sales Grid Entry"], "answer": 1, "explanation": "Nút 'Catalog' mở danh mục sản phẩm dạng thẻ (kanban) để thêm sản phẩm và chỉnh số lượng trực tiếp vào báo giá. Product Configurator chỉ mở khi sản phẩm có biến thể/sản phẩm tùy chọn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/sales_quotations/create_quotations.html"}, {"set": 5, "subject": "Sales", "question": "A customer wants to receive all items of a sales order in a single shipment rather than in several partial deliveries. Which field on the order's Other Info tab should be set?", "options": ["Shipping Policy = As soon as possible", "Delivery Date = today", "Shipping Policy = When all products are ready", "Incoterm = EXW"], "answer": 2, "explanation": "Shipping Policy = 'When all products are ready' lên lịch giao một lần khi tất cả sản phẩm sẵn sàng. 'As soon as possible' cho phép giao từng phần ngay khi có hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/delivery_policy.html"}, {"set": 5, "subject": "Sales", "question": "A clothing wholesaler sells a shirt in 5 sizes and 6 colors; customers order dozens of combinations at once. Which Sales setting lets salespeople enter quantities for all variants in a single matrix?", "options": ["Product Packagings", "Variants with 'Never' creation mode", "Optional products", "Sales Grid Entry"], "answer": 3, "explanation": "Sales Grid Entry hiển thị một lưới (ma trận thuộc tính) để nhập số lượng cho nhiều biến thể cùng lúc. Optional products chỉ gợi ý sản phẩm bổ sung, không phải nhập theo ma trận.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/products/variants.html"}, {"set": 5, "subject": "Sales", "question": "The 'Delivery Methods' setting is enabled and a shipping method is configured. How does a salesperson add the shipping cost to a quotation?", "options": ["Use the 'Add shipping' button and pick the delivery method", "Add the carrier as a follower of the quotation", "Set the delivery method on the customer only; the cost appears on the invoice", "Create a down payment for the shipping amount"], "answer": 0, "explanation": "Sau khi bật Delivery Methods, nút 'Add shipping' trên báo giá mở wizard chọn phương thức giao hàng và thêm dòng phí vận chuyển. Down payment là khoản trả trước, không liên quan phí ship.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/setup_configuration/delivery_method.html"}, {"set": 5, "subject": "Sales", "question": "A confirmed sales order was cancelled by mistake. The salesperson wants to reuse it instead of re-entering everything. What can be done?", "options": ["Duplicate it, since a cancelled order stays read-only", "Click 'Set to Quotation', then confirm it again", "Unarchive the order", "Use 'Reverse and Create Invoice' on the order"], "answer": 1, "explanation": "Đơn bị hủy có nút 'Set to Quotation' để đưa về trạng thái báo giá rồi xác nhận lại. 'Reverse and Create Invoice' là tùy chọn của credit note trong Accounting, không áp dụng cho đơn bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/sales_quotations/create_quotations.html"}, {"set": 5, "subject": "Purchase", "question": "A buyer clicks 'Send by Email' on a draft RFQ and sends it to the vendor. What is the status of the document afterwards?", "options": ["Purchase Order", "To Approve", "RFQ Sent", "Locked"], "answer": 2, "explanation": "Sau khi gửi email, RFQ chuyển sang trạng thái 'RFQ Sent'; chỉ khi bấm Confirm Order mới thành 'Purchase Order'. 'To Approve' chỉ xuất hiện khi bật Purchase Order Approval và vượt ngưỡng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/rfq.html"}, {"set": 5, "subject": "Purchase", "question": "A company sells an installation service that it actually subcontracts. Each time the service is sold on a confirmed sales order, an RFQ should be created for the subcontractor. What is required on the service product?", "options": ["Add the Buy and Replenish on Order (MTO) routes on the product", "Set the Invoicing Policy to 'Based on Timesheets' on the Sales tab", "Enable Dropshipping on the product", "Enable 'Subcontract Service' and set the subcontractor as vendor"], "answer": 3, "explanation": "Tùy chọn 'Subcontract Service' (chỉ cho sản phẩm Service, cần có vendor) tạo RFQ tự động khi đơn bán được xác nhận. Route Buy/MTO dùng cho hàng hóa lưu kho, không áp dụng cho dịch vụ.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/subcontracting.html"}, {"set": 5, "subject": "Purchase", "question": "A PO for 100 units is confirmed, but only 60 arrive. On validating the receipt with 60 done, Odoo asks about the remaining quantity. The vendor will ship the remaining 40 next week. Which choice should be made?", "options": ["Create Backorder", "No Backorder", "Discard and edit the PO to 60 units", "Return the 60 units"], "answer": 0, "explanation": "'Create Backorder' tạo một phiếu nhập mới cho 40 đơn vị còn lại để chờ nhận. 'No Backorder' sẽ hủy phần còn lại, PO không còn chờ 40 đơn vị nữa.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/partial_receipt.html"}, {"set": 5, "subject": "Purchase", "question": "A purchaser regularly orders a T-shirt in many size/color combinations from one vendor and wants to enter all quantities in one matrix on the RFQ. Which Purchase setting should be enabled?", "options": ["Purchase Agreements", "Purchase Grid Entry", "Variant Seller", "Product Packagings"], "answer": 1, "explanation": "Purchase Grid Entry (Purchase ‣ Configuration ‣ Settings) cho phép nhập số lượng của các biến thể theo dạng lưới trên RFQ. Purchase Agreements dùng cho blanket order và alternatives.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase.html"}, {"set": 5, "subject": "Spreadsheet", "question": "A list of sales orders is inserted in a spreadsheet as list 1. Which formula returns the 'amount_total' of the third record of that list?", "options": ["=ODOO.LIST.HEADER(1, \"amount_total\")", "=PIVOT.VALUE(1, \"amount_total\", 3)", "=ODOO.LIST(1, 3, \"amount_total\")", "=ODOO.LIST(\"amount_total\", 1, 3)"], "answer": 2, "explanation": "Cú pháp là ODOO.LIST(list_id, index, field_name), nên ODOO.LIST(1, 3, \"amount_total\") trả về giá trị trường của bản ghi thứ 3. ODOO.LIST.HEADER chỉ trả về tiêu đề cột.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 5, "subject": "Spreadsheet", "question": "A manager wants users who click a chart in a spreadsheet dashboard to land directly on the related Odoo view (e.g. the Sales Analysis report). What should be configured?", "options": ["Insert a hyperlink in the cell above the chart", "Convert the chart into a pivot", "Add a Relation global filter on the menu model", "Link the chart to an Odoo menu in the chart's properties"], "answer": 3, "explanation": "Biểu đồ trong spreadsheet có thể liên kết với một Odoo menu; khi người xem bấm vào biểu đồ sẽ mở menu/view tương ứng. Hyperlink trong ô chỉ hoạt động khi bấm vào ô, không phải biểu đồ.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 5, "subject": "Spreadsheet", "question": "In a new database with no sales recorded yet, a user opens the standard Sales dashboard in the Dashboards app. What is displayed?", "options": ["A sample dashboard with demo data", "An error message stating that the pivots return no data", "A blank page until the first order is confirmed", "The spreadsheet editor in edit mode"], "answer": 0, "explanation": "Khi dashboard chưa có dữ liệu và có sample file, Odoo hiển thị phiên bản mẫu (sample) với dữ liệu minh họa. Nó không báo lỗi hay hiển thị trang trống.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/dashboards.html"}, {"set": 5, "subject": "Inventory", "question": "A receipt for 100 units is validated with only 80 units received. The company never wants to wait for the remaining quantities from vendors. Which option on the Receipts operation type avoids being asked each time and creates no backorder?", "options": ["Reservation Method = 'Manually'", "Create Backorder = 'Never'", "Create Backorder = 'Always'", "Shipping Policy = 'As soon as possible'"], "answer": 1, "explanation": "Create Backorder có 3 giá trị Ask / Always / Never; 'Never' sẽ không tạo backorder và phần còn thiếu bị hủy. 'Always' thì ngược lại, luôn tạo backorder mà không hỏi.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_one_step.html"}, {"set": 5, "subject": "Inventory", "question": "A customer orders 3 different products and wants to receive everything in a single shipment, even if some items are available earlier. What should be set on the sales order (Other Info tab)?", "options": ["Delivery Method = 'Free delivery'", "Incoterm = 'DAP'", "Shipping Policy = 'As soon as possible'", "Shipping Policy = 'When all products are ready'"], "answer": 3, "explanation": "Shipping Policy 'When all products are ready' chỉ cho giao khi tất cả sản phẩm đã sẵn sàng (một lần giao). 'As soon as possible' là mặc định, cho giao từng phần ngay khi có hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/delivery_policy.html"}, {"set": 5, "subject": "Inventory", "question": "Each pallet rack location must only receive products through putaway rules when the location is completely empty. How is this configured?", "options": ["A Storage Category with 'Allow New Product' = 'If the location is empty'", "Set the rack locations' Location Type to 'View'", "Set the racks' Removal Strategy to 'Least Packages' so empty racks come first", "Untick 'Is a Scrap Location' on the racks"], "answer": 0, "explanation": "Storage Category có trường 'Allow New Product' với 3 giá trị: If the location is empty / If all products are same / Allow mixed products; putaway rule dùng storage category để chọn vị trí phù hợp. Location loại View thì không chứa hàng được.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/advanced_operations_warehouse/storage_category.html"}, {"set": 5, "subject": "Inventory", "question": "Products tracked by lots arrive with lot numbers assigned by the vendor, which must be typed in when receiving. Which option must be enabled on the Receipts operation type?", "options": ["Use Existing Lots/Serial Numbers only", "Move Entire Packages", "Create New Lots/Serial Numbers", "Generate Shipping Labels"], "answer": 2, "explanation": "'Create New Lots/Serial Numbers' cho phép nhập số lô mới khi xử lý phiếu nhập (mặc định bật cho Receipts). 'Use Existing Lots/Serial Numbers' chỉ cho chọn lô đã tồn tại, phù hợp cho phiếu xuất.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/product_tracking/lots.html"}, {"set": 5, "subject": "Inventory", "question": "A customer returns 2 units from a delivery order that is already validated. What happens when the user clicks 'Return' on that delivery and confirms?", "options": ["The original delivery is reset to draft and its quantity is reduced by 2", "A return transfer brings the 2 units back", "A credit note is posted automatically and stock is not affected", "The 2 units are moved directly to the scrap location"], "answer": 1, "explanation": "Nút Return tạo một phiếu chuyển kho mới (dùng 'Operation Type for Returns') đưa hàng từ Partners/Customers về kho; phiếu gốc giữ nguyên trạng thái Done. Credit note phải tạo riêng trong Sales/Accounting.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/returns.html"}, {"set": 5, "subject": "Manufacturing", "question": "Three confirmed manufacturing orders exist for the same product and the same BoM. The planner wants to combine them into a single MO. What should be done?", "options": ["Cancel two MOs and increase the quantity of the third manually", "Use the 'Split' button on one of the MOs", "Select the MOs in the list view and use Actions ‣ Merge", "Create an unbuild order for two of them"], "answer": 2, "explanation": "Action 'Merge' gộp các MO cùng sản phẩm, cùng BoM, cùng trạng thái (Draft hoặc Confirmed) thành một MO với tổng số lượng. 'Split' thì làm ngược lại: chia một MO thành nhiều MO.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/split_merge.html"}, {"set": 5, "subject": "Manufacturing", "question": "Components of a product take several days to be replenished. The company wants manufacturing orders generated by replenishment to be created and confirmed some days in advance. Which BoM field should be used?", "options": ["Days to prepare Manufacturing Order", "Manuf. Lead Time", "Setup Time on the work center", "Security Lead Time for Sales"], "answer": 0, "explanation": "'Days to prepare Manufacturing Order' (tab Miscellaneous của BoM) cho phép tạo và xác nhận MO sớm hơn số ngày đó để kịp bổ sung linh kiện. 'Manuf. Lead Time' là thời gian sản xuất của chính sản phẩm, không phải thời gian chuẩn bị MO.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/advanced_operations_shipping/scheduled_dates.html"}, {"set": 5, "subject": "Manufacturing", "question": "Operators must see assembly instructions from a PDF file while processing a work order in Shop Floor. Where is this configured?", "options": ["As an attachment on the product form's chatter", "In the 'Description for Pickings' of the product", "On the work center, in the 'Instructions' field", "Worksheet = 'PDF' on the BoM operation"], "answer": 3, "explanation": "Mỗi operation trên BoM có trường Worksheet với các loại PDF, Google Slide hoặc Text; tài liệu này hiển thị cho operator trong Shop Floor. File đính kèm trên sản phẩm không được hiển thị trên work order.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/configure_manufacturing_product.html"}, {"set": 5, "subject": "Manufacturing", "question": "A table's BoM uses a semi-finished 'Table Top' that has its own BoM. When the table MO is confirmed, Odoo should automatically create an MO for the Table Top, whatever the stock level. Which routes should be set on the Table Top product?", "options": ["Buy and Replenish on Order (MTO)", "Manufacture and Replenish on Order (MTO)", "Only Manufacture, with a reordering rule Min = 0 / Max = 0", "Resupply Subcontractor on Order"], "answer": 1, "explanation": "Route Manufacture + Replenish on Order (MTO) trên bán thành phẩm sẽ tạo MO con liên kết với MO cha mỗi khi MO cha được xác nhận. Nếu chọn Buy + MTO thì sẽ sinh RFQ thay vì MO.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/advanced_configuration/sub_assemblies.html"}, {"set": 5, "subject": "Point of Sale", "question": "A shop has two PoS: one at the bakery counter, one at the coffee bar. The bakery PoS should only display bakery products. What should be configured on the bakery PoS?", "options": ["Restrict Categories, with the bakery categories selected", "Untick 'Available in POS' on all coffee products", "Assign the bakery PoS a pricelist containing only bakery products", "Archive the coffee product category"], "answer": 0, "explanation": "Setting 'Restrict Categories' kèm danh sách PoS Product Categories giới hạn các sản phẩm hiển thị cho từng PoS. Bỏ tick 'Available in POS' sẽ ẩn sản phẩm ở mọi PoS, kể cả quầy coffee.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/configuration.html"}, {"set": 5, "subject": "Point of Sale", "question": "A cashier must be able to apply a 10% discount on the whole order with one button. Which PoS setting should be used?", "options": ["Line Discounts", "Flexible Pricelists", "Global Discounts", "Price Control"], "answer": 2, "explanation": "'Global Discounts' (module pos_discount) thêm nút Discount áp dụng % trên toàn đơn thông qua một discount product, với tỉ lệ mặc định cấu hình được. 'Line Discounts' chỉ cho giảm giá trên từng dòng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/pricing/discounts.html"}, {"set": 5, "subject": "Point of Sale", "question": "With the default Inventory Management option of Odoo 18 Point of Sale ('In real time'), when are the stock pickings created for PoS orders?", "options": ["Only when the PoS session is closed, as one picking for the whole session", "Only when the order is invoiced", "Once a day by a scheduled action", "As soon as each order is sent to the server, with its own picking"], "answer": 3, "explanation": "Mặc định 'Update quantities in stock' = In real time: mỗi đơn PoS gửi lên server tạo picking riêng. Tùy chọn 'At the session closing' mới gom một picking cho cả ca khi đóng session.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/configuration.html"}, {"set": 5, "subject": "Point of Sale", "question": "A shop wants customers to earn 1 point per $10 spent in the PoS and later exchange their points for rewards. Which Discount & Loyalty program type should be used?", "options": ["Promotions", "Loyalty Cards", "Discount Code", "Coupons"], "answer": 1, "explanation": "Chương trình 'Loyalty Cards' tích điểm cho khách hàng theo số tiền/sản phẩm mua và đổi điểm lấy phần thưởng ở các lần mua sau. 'Promotions' áp dụng giảm giá tức thời trên đơn hiện tại, không tích điểm lâu dài.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/pricing/loyalty.html"}, {"set": 5, "subject": "CRM", "question": "In the pipeline Kanban view, how many stars can a salesperson set to indicate the priority of an opportunity in Odoo 18?", "options": ["3 stars", "5 stars, as in customer ratings", "2 stars (High and Very High)", "4 stars, the fourth meaning Urgent"], "answer": 0, "explanation": "Trường Priority của crm.lead có 4 mức: Low (0 sao), Medium, High, Very High, tương ứng tối đa 3 sao. Không có thang 5 sao trong CRM."}, {"set": 5, "subject": "CRM", "question": "A stage called \"On Hold\" should stay in the pipeline but be displayed collapsed in the Kanban view by default. Which stage option is used?", "options": ["Is Won Stage", "Folded in Pipeline", "Requirements", "Archive the stage"], "answer": 1, "explanation": "Tích 'Folded in Pipeline' trên stage để cột đó mặc định được thu gọn trong Kanban. 'Is Won Stage' đánh dấu cơ hội là thắng, còn archive stage sẽ ẩn hẳn cột."}, {"set": 5, "subject": "CRM", "question": "A sales team has an email alias, but the manager wants it to create opportunities only from emails sent by known contacts in the database. Which alias setting should be changed?", "options": ["Accept Emails From: \"Followers only\" and add every customer as a follower of the team", "Accept Emails From: \"Everyone\"", "Accept Emails From: \"Authenticated Partners\"", "Disable the alias and use a website form instead"], "answer": 2, "explanation": "Trên Sales Team, trường 'Accept Emails From' của alias có các giá trị Everyone / Authenticated Partners / Followers only; 'Authenticated Partners' chỉ nhận email từ người gửi đã có contact. 'Everyone' cho phép mọi người gửi tạo cơ hội."}, {"set": 5, "subject": "CRM", "question": "For every new qualified opportunity, a salesperson must schedule the same sequence of activities (call, demo, send proposal). How can these be scheduled in one go in Odoo 18?", "options": ["Duplicate an old opportunity each time to copy its activities", "Create three Activity Types with the \"Default User\" set", "Add the activities to the stage's Requirements field", "Launch an Activity Plan from the opportunity"], "answer": 3, "explanation": "Odoo 18 có Activity Plans (CRM ‣ Configuration ‣ Activity Plans) gồm nhiều activity với người phụ trách và hạn, có thể áp dụng một lần cho bản ghi. Activity Type chỉ định nghĩa loại hoạt động đơn lẻ, không lên lịch cả chuỗi."}, {"set": 5, "subject": "Marketing", "question": "A marketing manager wants to automatically receive an email summarising the results (opens, clicks, replies) of each mailing one day after it was sent. Which setting should be enabled?", "options": ["24H Stat Mailing Reports", "Mailing Campaigns", "Dedicated Server", "Link Tracker"], "answer": 0, "explanation": "'24H Stat Mailing Reports' trong Email Marketing settings gửi báo cáo thống kê mailing một ngày sau khi gửi. Link Tracker chỉ theo dõi click trên đường link."}, {"set": 5, "subject": "Marketing", "question": "A Marketing Automation campaign targets contacts with the filter \"Country = Belgium\" and is already running. A new Belgian contact is created next week. What happens?", "options": ["Nothing; only records existing at launch time are included", "It is added as a participant at the next synchronisation", "The campaign must be stopped and relaunched to include the new contact", "The contact is added only if it is subscribed to a mailing list"], "answer": 1, "explanation": "Chiến dịch Marketing Automation đang chạy định kỳ (cron) đồng bộ participant, nên bản ghi mới thỏa domain sẽ được thêm vào. Không cần dừng và chạy lại chiến dịch.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation.html"}, {"set": 5, "subject": "Marketing", "question": "Which activity types can be used in an Odoo 18 Marketing Automation workflow (with SMS Marketing installed)?", "options": ["Email, SMS and To-Do activity", "Email, Phone Call and Meeting", "Email, Server Action and SMS", "Server Action, Social Post and Push Notification"], "answer": 2, "explanation": "Activity Type của Marketing Automation gồm Email, Server Action và SMS (khi có module SMS). Không có loại Phone Call/Meeting hay Social Post trực tiếp trong workflow."}, {"set": 5, "subject": "Marketing", "question": "An event has a room for 50 people. Registrations must stop automatically once 50 attendees have registered. What should be configured on the event?", "options": ["Add a reminder in the Communication tab", "Create 50 tickets with a price of zero", "Set the event stage to \"Booked\" after 50 registrations", "Enable \"Limit Attendees\" and set the maximum to 50"], "answer": 3, "explanation": "Bật 'Limit Attendees' với giá trị tối đa 50 thì khi hết chỗ, sự kiện không nhận thêm đăng ký. Stage 'Booked' không chặn đăng ký."}, {"set": 5, "subject": "Survey", "question": "A certification should also award a gamification badge to participants who pass it. Which option should be enabled on the survey?", "options": ["Show Session Leaderboard", "Certified Email Template", "Reward quick answers", "Give Badge"], "answer": 3, "explanation": "Trên certification, bật 'Give Badge' và chọn badge để tự động trao cho người đậu. 'Certified Email Template' chỉ gửi email kèm chứng chỉ."}, {"set": 5, "subject": "Survey", "question": "A question \"How did you hear about us?\" has several choices, and the respondent may also type a free comment that should count as their answer instead of a choice. Which options are used?", "options": ["\"Show Comments Field\" together with \"Comment is an answer\"", "\"Validate entry\"", "Matrix Type \"Multiple choices per row\"", "Conditional display on the question"], "answer": 0, "explanation": "'Show Comments Field' thêm ô bình luận, và 'Comment is an answer' cho phép bình luận được tính là câu trả lời. 'Validate entry' chỉ dùng kiểm tra định dạng/giới hạn giá trị."}, {"set": 5, "subject": "Survey", "question": "A manager clicks \"Test\" on a survey and answers it to check the flow. What happens to this test participation?", "options": ["It is counted as a normal completed participation", "Flagged as a test entry, excluded from results", "It is deleted as soon as the test session is finished", "It consumes one of the attempts of the manager's contact"], "answer": 1, "explanation": "Lượt làm qua nút 'Test' được đánh dấu test_entry và bị loại khỏi thống kê/kết quả, cũng không tính vào số lần thử. Vì vậy nó không phải là participation bình thường."}, {"set": 5, "subject": "Website", "question": "A new page must go live automatically next Monday at 8:00 without anyone clicking Publish at that time. What should be set?", "options": ["A 302 redirect to the page from the homepage", "The page's Publishing Date in its properties", "The page's Indexed option", "A website visibility \"Signed In\""], "answer": 1, "explanation": "Trang website có trường 'Publishing Date'; trang chỉ hiện công khai từ thời điểm đó. Indexed chỉ ảnh hưởng đến công cụ tìm kiếm."}, {"set": 5, "subject": "Website", "question": "Google requires a verification file before the website can be managed in Google Search Console. How is this handled in Odoo 18?", "options": ["Add the code to robots.txt", "Upload the file through the Documents app", "Enable Google Search Console in Website settings and enter the code", "Not supported: Search Console can only be verified through a DNS record"], "answer": 2, "explanation": "Trong Website ‣ Configuration ‣ Settings bật 'Google Search Console' và nhập mã xác minh (tên file google...html), Odoo sẽ phục vụ file này. Không cần sửa robots.txt.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/google_search_console.html"}, {"set": 5, "subject": "Website", "question": "A company wants its \"Products\" landing page, instead of the default page, to be shown when visitors open the root URL of the website. What should be done?", "options": ["Move the page to first position in the Menu Editor", "Rename the page to \"Home\"", "Create a 301 redirect from / to the page and delete the old homepage", "Open the page's properties and enable \"Is Homepage\""], "answer": 3, "explanation": "Trong thuộc tính trang (Page Properties) có toggle 'Is Homepage' để đặt trang làm trang chủ. Đổi tên hay sắp xếp menu không đổi trang chủ."}, {"set": 5, "subject": "Website", "question": "A company wants a homepage section that always shows its latest blog posts or products without manual updates. Which building block is designed for this?", "options": ["A Dynamic Content block such as Products", "A Text-Image block updated weekly by an editor", "A Mega Menu", "A Carousel block with static images"], "answer": 0, "explanation": "Các block Dynamic Content (Products, Blog Posts...) tự động lấy bản ghi theo filter và template hiển thị. Text-Image hay Carousel là nội dung tĩnh, cần sửa tay."}, {"set": 5, "subject": "eCommerce", "question": "A shop wants customers to enter a promo code in the cart to get 10% off. Which setting must be enabled first?", "options": ["Discounts, Loyalty & Gift Card", "Pricelists with \"Selectable\" ticked", "Product Reference Price", "Extra Step During Checkout"], "answer": 0, "explanation": "Mã khuyến mãi, coupon, loyalty và gift card cần bật 'Discounts, Loyalty & Gift Card', rồi tạo chương trình có điều kiện mã. Pricelist không áp dụng bằng cách nhập mã ở giỏ hàng."}, {"set": 5, "subject": "eCommerce", "question": "A shop manager wants the /shop page to show 3 columns of products instead of 4, and more products per page. Where is this changed?", "options": ["Website ‣ Configuration ‣ Settings, under Invoicing", "In the website editor on /shop, via its layout options", "On each eCommerce category", "On each product template form, in the Sales tab's eCommerce section"], "answer": 1, "explanation": "Bố cục trang shop (grid/list, số sản phẩm mỗi trang, số cột) được chỉnh trong website editor khi đang ở trang /shop. Category không điều khiển số cột hiển thị."}, {"set": 5, "subject": "eCommerce", "question": "Customers should be able to buy online and pick up their order at one of the company's stores, optionally paying there. What does Odoo 18 provide?", "options": ["A delivery method with 'Free if order amount is above' set to 0", "A Mondial Relay delivery method", "A 'Pick up in store' delivery method with 'Pay on site'", "Shipping connectors such as FedEx"], "answer": 2, "explanation": "Odoo 18 (website_sale_collect) có delivery method loại 'Pick up in store' gắn với warehouse và phương thức thanh toán 'Pay on site'. Mondial Relay là điểm nhận hàng của hãng vận chuyển, không phải cửa hàng của công ty."}, {"set": 5, "subject": "Project", "question": "A project sends customer rating requests 'on a periodic basis'. Which of the following is NOT an available Rating Frequency in Odoo 18?", "options": ["Twice a Month", "Quarterly", "Yearly", "Every two years"], "answer": 3, "explanation": "Rating Frequency gồm Daily, Weekly, Twice a Month, Once a Month, Quarterly và Yearly; không có tùy chọn hai năm một lần.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 5, "subject": "Project", "question": "Which of the following is NOT one of the task states available in Odoo 18 Project?", "options": ["Blocked", "Changes Requested", "Approved", "In Progress"], "answer": 0, "explanation": "Trạng thái task trong Odoo 18 gồm In Progress, Changes Requested, Approved, Waiting, Done và Cancelled. 'Blocked' là kanban state cũ (đỏ) của các phiên bản trước, nay được thay bằng các state mới.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 5, "subject": "Project", "question": "A user adds a new stage 'QA' directly from the kanban view of the 'Mobile App' project. Another project also needs this exact stage. What is the correct way to share it?", "options": ["Stages are global: 'QA' is already visible in every project", "Add the other project in the stage's Projects field (Task Stages menu)", "Duplicate the 'Mobile App' project, which is the only way to reuse stages", "Stages cannot be shared; a new 'QA' stage must be created in the other project"], "answer": 1, "explanation": "Stage tạo từ kanban của một project chỉ được gắn với project đó; một stage có thể dùng chung bằng cách thêm các project vào trường Projects của stage (menu Task Stages, cần developer mode).", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 5, "subject": "Timesheets", "question": "The 'Billing Rate Leaderboard' is enabled in the Timesheets settings. What must be set for each employee so that their billing rate can be computed?", "options": ["An Hourly Cost on the employee form", "A Sales Price on the employee's related user", "A Billing Time Target on the employee form", "A Working Schedule with flexible hours"], "answer": 2, "explanation": "Billing rate = thời gian billable / Billing Time Target, nên phải nhập Billing Time Target trên hồ sơ nhân viên (người có quyền Approver). Hourly Cost dùng để tính chi phí, không dùng cho leaderboard.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 5, "subject": "Timesheets", "question": "A parent task has 10 hours of Allocated Time. 2 hours are logged on the parent task itself and 4 hours on its sub-task (which has no allocated time). What progress is shown on the parent task?", "options": ["20%", "40%", "0%, because sub-task hours are excluded", "60%"], "answer": 3, "explanation": "Tiến độ của task cha = (giờ trên task + giờ của sub-task) / Allocated Time = (2 + 4) / 10 = 60%. Giờ của sub-task được cộng dồn vào task cha.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 5, "subject": "Timesheets", "question": "In Odoo 18 Timesheets, when can the Employee Reminder be scheduled to remind employees to fill in their timesheets?", "options": ["Some days after the end of the week or of the month", "Every day at a chosen hour", "Only on the last working day of each month", "A number of days before the end of each week or month"], "answer": 0, "explanation": "Employee Reminder cho phép chọn số ngày sau khi kết thúc tuần ('after the end of the week') hoặc kết thúc tháng ('after the end of the month'). Không có lịch nhắc hằng ngày.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 5, "subject": "HR", "question": "Employees may take up to 3 more days of 'Paid Time Off' than they were allocated, their balance becoming negative. How is this configured on the time off type?", "options": ["Set 'Requires allocation' to 'No Limit'", "Enable 'Allow Negative Cap' and set the Maximum Excess Amount to 3", "Create an extra allocation of 3 days valid for all employees", "Enable 'Extra Days Requests Allowed'"], "answer": 1, "explanation": "Allow Negative Cap cho phép số dư âm, giới hạn bởi Maximum Excess Amount (phải lớn hơn 0). 'No Limit' bỏ hoàn toàn giới hạn, không khống chế ở 3 ngày.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 5, "subject": "HR", "question": "For 'Sick Time Off', employees must be able to attach a medical certificate to their request. Which option should be enabled on the time off type?", "options": ["Is Unpaid", "Public Holiday Included", "Supporting Document", "Allow Negative Cap"], "answer": 2, "explanation": "Bật Supporting Document trên time off type để nhân viên có thể đính kèm tài liệu chứng minh (ví dụ giấy khám bệnh) vào đơn nghỉ. Các tùy chọn khác không liên quan đến file đính kèm.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 5, "subject": "HR", "question": "Employees record expenses by sending receipts to the expenses email alias. An email arrives, but no expense is created for any employee. What is the most likely cause?", "options": ["The employee has no bank account set on their private information", "The expense category is not set to 'Paid by Company'", "The employee does not have the Expenses 'Administrator' access right", "The sender's email matches no employee's work email or user email"], "answer": 3, "explanation": "Khi nhận email, Odoo tìm nhân viên theo địa chỉ người gửi (work email hoặc email của user liên kết); nếu không khớp thì không tạo expense cho nhân viên nào. Tài khoản ngân hàng hay quyền Administrator không phải điều kiện.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/expenses.html"}, {"set": 5, "subject": "HR", "question": "Employees often forget to check out in the Attendances app. The company wants them to be checked out automatically based on their working schedule plus 2 hours. Which setting should be used?", "options": ["Automatic Check-Out, with a tolerance of 2 hours", "Tolerance Time In Favor Of Employee, set to 2 hours", "Absence Management", "Kiosk Mode with a 2-hour Display Time"], "answer": 0, "explanation": "Automatic Check-Out tự động check-out nhân viên theo lịch làm việc cộng với Tolerance (giờ); không áp dụng cho lịch làm việc linh hoạt. Tolerance In Favor Of Employee chỉ dùng cho tính giờ làm thêm.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/attendances.html"}, {"set": 5, "subject": "Studio", "question": "A custom 'Delivery Report' model must allow the customer to sign the record directly on the form view. Which Studio field type should be used?", "options": ["Image", "Signature", "File", "Html"], "answer": 1, "explanation": "Field type Signature của Studio tạo trường binary với widget chữ ký để ký trực tiếp trên form. Image/File chỉ để tải ảnh hoặc tệp lên.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 5, "subject": "Studio", "question": "Users want to select several records in a list view and change the 'Responsible' field of all of them in one operation. Which list view property should be enabled in Studio?", "options": ["Show link to record", "Default Group By", "Enable Mass Editing", "When Creating Record: Add record on top"], "answer": 2, "explanation": "Enable Mass Editing (multi_edit) cho phép chọn nhiều dòng và sửa một trường cho tất cả cùng lúc. 'Add record on top' chỉ làm list editable khi tạo mới.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 5, "subject": "Studio", "question": "In a list view edited with Studio, the 'Amount' column must show its total at the bottom of the list. What should be done?", "options": ["Add a Related field computing the total", "Set the list's Default Group By on the Amount field", "Change the field type from Monetary to Integer", "Select the column and set its Aggregate property to Sum"], "answer": 3, "explanation": "Trong Studio, chọn cột số trong list và đặt thuộc tính Aggregate là Sum (hoặc Average) để hiển thị tổng ở cuối danh sách. Group by không tạo tổng cho toàn danh sách theo cách này.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 5, "subject": "Studio", "question": "An automation rule with the trigger 'On incoming message' cannot be saved on a custom model created with Studio. What is the most likely reason?", "options": ["The model has no chatter (it does not support messaging)", "The model has no 'Pipeline stages' feature", "The trigger requires the 'On webhook' option to be enabled first", "Message triggers are only available in developer mode"], "answer": 0, "explanation": "Các trigger dựa trên email (On incoming/outgoing message) chỉ dùng được cho model có tính năng thảo luận (mail thread/chatter). Model tạo bằng Studio không bật Chatter sẽ bị báo lỗi.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 5, "subject": "Studio", "question": "On the 'Validate' button of a custom model, two approval rules are defined: the team leader must approve first, and only then the finance director. Which approval rule setting enforces this order?", "options": ["Exclusive Approval on both rules", "The Step of each rule (Step 1 for the team leader, Step 2 for the finance director)", "Users to Notify on the first rule", "A different Approval Group on each rule; groups are always processed alphabetically"], "answer": 1, "explanation": "Trường Step (thứ tự) xác định thứ tự tuần tự yêu cầu phê duyệt giữa các rule. Exclusive Approval chỉ ngăn một người duyệt nhiều rule trên cùng bản ghi.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/approval_rules.html"}, {"set": 6, "subject": "Accounting", "question": "A Romanian company must record corrections as reversal entries that keep the same side with negative amounts (e.g. a negative debit instead of a credit). Which Accounting setting should be enabled?", "options": ["Cash Basis", "Storno accounting", "Quick encoding", "Dedicated Credit Note Sequence"], "answer": 1, "explanation": "Bật 'Storno accounting' thì các bút toán đảo (credit note, reverse) ghi số âm ở cùng phía Debit/Credit của bút toán gốc. Cash Basis liên quan thời điểm ghi nhận thuế, không phải cách đảo bút toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/get_started.html"}, {"set": 6, "subject": "Accounting", "question": "A company wants customers to pay invoices by scanning a code with their banking app. Which configuration enables printing a SEPA QR-code on invoices?", "options": ["Enable 'Online Signature' in Sales settings so customers sign and pay", "Enable 'Batch Payments' and SEPA Direct Debit on the bank journal", "Enable 'Display SEPA QR-code' and set an IBAN on the bank journal", "Install the Barcode app and print the customer's barcode on invoices"], "answer": 2, "explanation": "Tùy chọn Display SEPA QR-code (Accounting settings) cùng tài khoản ngân hàng IBAN trên sổ ngân hàng cho phép in mã QR thanh toán trên hóa đơn. SEPA Direct Debit là thu tiền tự động theo ủy quyền, không phải mã QR.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/epc_qr_code.html"}, {"set": 6, "subject": "Accounting", "question": "An accountant receives hundreds of PDF vendor bills and wants Odoo to read the vendor, dates, amounts and taxes automatically. Which feature is used, and what does it consume?", "options": ["Quick encoding, which is free and needs no setting", "Bank synchronization, which consumes IAP credits", "Snailmail, which consumes IAP credits", "Document Digitization (OCR), which consumes In-App Purchase (IAP) credits"], "answer": 3, "explanation": "Document Digitization dùng OCR/AI để trích xuất dữ liệu từ PDF hóa đơn và tiêu tốn IAP credits. Snailmail là gửi thư bưu điện, cũng dùng IAP nhưng không đọc hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/vendor_bills/invoice_digitization.html"}, {"set": 6, "subject": "Accounting", "question": "At month end, the accountant posts an accrual for electricity consumed in March but not yet billed, and wants it cancelled automatically on 1 April. What is the standard approach?", "options": ["Post it on 31 March, then 'Reverse' it dated 1 April", "Post the entry on 31 March and delete it manually on 1 April", "Set a Hard Lock date of 31 March in the Lock Dates menu", "Create a credit note on a fake vendor bill dated 1 April"], "answer": 0, "explanation": "Dùng chức năng Reverse trên bút toán với Reversal Date = 1/4 để tạo bút toán đảo ngày đầu tháng sau, chuẩn cho accrual. Không thể xóa bút toán đã post, và Hard Lock date chỉ khóa kỳ.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/year_end.html"}, {"set": 6, "subject": "Accounting", "question": "A recycling eco-fee of 0.50 € per unit must be charged on each unit of a product, regardless of its price. Which 'Tax Computation' should this tax use?", "options": ["Percentage", "Percentage Tax Included", "Group of Taxes", "Fixed"], "answer": 3, "explanation": "Tax Computation = Fixed tính một số tiền cố định trên mỗi đơn vị số lượng, không phụ thuộc giá. Percentage tính theo tỷ lệ của giá bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes.html"}, {"set": 6, "subject": "Sales", "question": "A company sells online training and wants an email with the course agenda and materials to be sent automatically to the customer when the invoice for that product is confirmed. Which Sales setting enables this?", "options": ["Pro-Forma Invoice", "Specific Email", "Online Signature", "Automatic Invoice"], "answer": 1, "explanation": "Setting 'Specific Email' cho phép gắn email template vào sản phẩm; email được gửi tự động khi hóa đơn của sản phẩm đó được xác nhận. Automatic Invoice chỉ tự tạo hóa đơn sau khi thanh toán online.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 6, "subject": "Sales", "question": "A sales team wants every quotation PDF to include a company presentation page at the beginning and terms & conditions pages at the end, uploaded as PDF files. Which setting fits?", "options": ["Quotation Templates with optional products", "Pro-Forma Invoice", "PDF Quote builder", "Specific Email"], "answer": 2, "explanation": "PDF Quote builder cho phép upload các trang PDF header/footer (và tài liệu theo sản phẩm) để ghép vào PDF báo giá. Quotation Templates xác định nội dung dòng/điều khoản, không ghép thêm trang PDF.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/sales_quotations/pdf_quote_builder.html"}, {"set": 6, "subject": "Sales", "question": "In Sales settings, the default Invoicing Policy is changed from 'Invoice what is ordered' to 'Invoice what is delivered'. What is the effect on products?", "options": ["All existing products are switched to 'Delivered quantities' at once", "All open sales orders are re-invoiced on delivered quantities automatically", "Service products are excluded and become non-invoiceable until reconfigured", "New products default to 'Delivered quantities'; existing ones are unchanged"], "answer": 3, "explanation": "Invoicing Policy trong Settings chỉ là giá trị mặc định cho sản phẩm tạo mới; sản phẩm cũ phải sửa trên tab Sales của từng sản phẩm. Nó không cập nhật hàng loạt sản phẩm hay đơn hàng đang mở.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/invoicing_policy.html"}, {"set": 6, "subject": "Sales", "question": "Before sending a quotation, a salesperson wants to see exactly what the customer will see online. Which button on the quotation should be used?", "options": ["Preview", "Print", "Send by Email", "Confirm"], "answer": 0, "explanation": "Nút 'Preview' mở báo giá trên customer portal đúng như khách hàng sẽ thấy (kèm ký/thanh toán online nếu bật). Print chỉ tạo bản PDF.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/get_signature_to_validate.html"}, {"set": 6, "subject": "Sales", "question": "A product is being phased out. The company wants salespeople to see a pop-up message when they add it to a quotation, but still allow them to sell it. What should be configured?", "options": ["Set a 'Blocking Message' warning on the product's Sales tab", "Enable Sale Order Warnings and set a 'Warning' on the product", "Archive the product", "Remove the product from all pricelists and quotation templates"], "answer": 1, "explanation": "Với Sale Order Warnings, loại 'Warning' hiển thị thông báo nhưng vẫn cho phép tiếp tục; 'Blocking Message' sẽ chặn không cho thêm sản phẩm. Archive làm sản phẩm không chọn được nữa.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 6, "subject": "Purchase", "question": "A PO contains a line for a 'Maintenance' service (control policy on received quantities) that the vendor has performed. There is no receipt in Inventory. How is the received quantity recorded?", "options": ["By validating a receipt automatically created for services", "By registering the vendor bill first", "By entering the Received quantity manually on the PO line", "It cannot be recorded; services always use ordered quantities"], "answer": 2, "explanation": "Dòng PO của dịch vụ không tạo phiếu nhập; cột Received được nhập thủ công trên dòng PO (qty received method = Manual). Hàng hóa (Goods) mới lấy số lượng nhận từ phiếu nhập kho.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 6, "subject": "Purchase", "question": "On a vendor's contact form (with Purchase and Inventory installed), a buyer looks at the 'On-Time Delivery Rate'. What does it measure?", "options": ["The percentage of the vendor's bills that were paid before their due date", "The number of RFQs the vendor answered before the order deadline", "The average delay in days between PO confirmation and receipt validation", "The share of ordered quantities received by the expected arrival date"], "answer": 3, "explanation": "On-Time Delivery Rate = số lượng sản phẩm nhận đúng hạn (trước/đúng Expected Arrival) chia cho số lượng đặt, mặc định trong 365 ngày gần nhất. Nó không đo việc thanh toán hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/advanced/analyze.html"}, {"set": 6, "subject": "Purchase", "question": "A restaurant buys the same set of ingredients from a vendor every week, but prices and quantities change each time. Which Odoo 18 purchase agreement type helps generate these RFQs quickly from a predefined product list?", "options": ["Purchase Template", "Blanket Order", "Call for Tenders", "Alternative RFQs"], "answer": 0, "explanation": "Purchase Template lưu sẵn danh sách sản phẩm để tạo RFQ nhanh mà không cam kết giá/số lượng. Blanket Order là cam kết giá với nhà cung cấp; 'Call for Tenders' không còn là loại agreement trong Odoo 18.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/agreements.html"}, {"set": 6, "subject": "Purchase", "question": "A product is purchased with a 10% input VAT, while it is sold with 20% output VAT. Where is the purchase tax set so that it is proposed by default on RFQ lines?", "options": ["In the 'Sales Taxes' field; Odoo converts it automatically", "In the 'Purchase Taxes' field of the product form", "On the vendor's fiscal position only", "In the Purchase journal's default tax"], "answer": 1, "explanation": "Thuế mua mặc định lấy từ trường Purchase Taxes (vendor taxes) trên sản phẩm, sau đó có thể bị fiscal position thay thế. Sales Taxes chỉ dùng cho đơn bán/hóa đơn khách hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes.html"}, {"set": 6, "subject": "Spreadsheet", "question": "A spreadsheet has a date global filter labelled 'Period'. The report title cell should display the period currently selected by the user. Which function returns it?", "options": ["=ODOO.LIST.HEADER(\"Period\")", "=PIVOT.HEADER(\"Period\")", "=ODOO.FILTER.VALUE(\"Period\")", "=ODOO.FISCALYEAR.START(\"Period\")"], "answer": 2, "explanation": "ODOO.FILTER.VALUE(filter_name) trả về giá trị hiện tại của global filter theo nhãn. PIVOT.HEADER trả về tiêu đề của pivot chứ không phải giá trị bộ lọc.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/global_filters.html"}, {"set": 6, "subject": "Spreadsheet", "question": "A company's fiscal year runs from 1 July to 30 June. In a spreadsheet report, which function returns the first day of the fiscal year containing a given date?", "options": ["ODOO.BALANCE", "ODOO.CURRENCY.RATE", "ODOO.FILTER.VALUE", "ODOO.FISCALYEAR.START"], "answer": 3, "explanation": "ODOO.FISCALYEAR.START trả về ngày bắt đầu năm tài chính chứa ngày đã cho (theo cấu hình công ty); có hàm tương ứng ODOO.FISCALYEAR.END. ODOO.BALANCE trả về số dư tài khoản.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/functions.html"}, {"set": 6, "subject": "Spreadsheet", "question": "A spreadsheet created by a US colleague shows dates as MM/DD/YYYY and decimals with a dot, but the Belgian team wants DD/MM/YYYY and decimal commas for this spreadsheet. What should they change?", "options": ["The Locale in File ‣ Settings of the spreadsheet", "The timezone in their user preferences", "The currency of the company", "The format of each cell one by one, there is no global option"], "answer": 0, "explanation": "Spreadsheet có phần Settings (File ‣ Settings) để chọn Locale, quyết định định dạng ngày, số thập phân và dấu phân cách cho cả bảng tính. Timezone chỉ ảnh hưởng giờ, không đổi định dạng số.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet.html"}, {"set": 6, "subject": "Inventory", "question": "A warehouse stores a product in packages and wants deliveries to be fulfilled using as few packages as possible. Which removal strategy fits best?", "options": ["Least Packages", "FIFO", "Closest Location", "LIFO"], "answer": 0, "explanation": "Removal strategy 'Least Packages' ưu tiên lấy hàng sao cho dùng ít package nhất. Closest Location chỉ dựa vào thứ tự tên location, không xét số package.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/removal_strategies.html"}, {"set": 6, "subject": "Inventory", "question": "A courier must have the customer sign on a tablet when goods are delivered, and the signature should be printed on the delivery slip. Which Inventory setting enables this?", "options": ["Delivery Methods", "Warnings for Stock", "Reception Report", "Signature"], "answer": 3, "explanation": "Bật 'Signature' trong Inventory ‣ Configuration ‣ Settings sẽ hiện nút Sign trên phiếu giao và in chữ ký lên delivery slip. 'Warnings for Stock' chỉ để hiện cảnh báo khi chọn partner/sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/setup_configuration/signature.html"}, {"set": 6, "subject": "Inventory", "question": "A product recall requires listing every receipt, manufacturing order and delivery in which lot LOT-0042 was involved. What is the quickest way to get this?", "options": ["Inventory ‣ Reporting ‣ Stock, grouped by product", "The Replenishment report", "The 'Traceability' smart button on the lot's form", "The Valuation report filtered on the product"], "answer": 2, "explanation": "Nút 'Traceability' trên form lot/serial mở báo cáo truy xuất toàn bộ các bước di chuyển (nhập, sản xuất, xuất) của lô đó. Báo cáo Stock chỉ cho thấy tồn hiện tại, không có lịch sử.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/product_tracking/lots.html"}, {"set": 6, "subject": "Inventory", "question": "Water bottles are sold individually but also in packs of 6 and cartons of 24, and salespeople should be able to sell by pack. Which setting must be enabled first?", "options": ["Packages", "Product Packagings", "Multi-Step Routes", "Consignment"], "answer": 1, "explanation": "'Product Packagings' cho phép định nghĩa các quy cách đóng gói (6, 24 chai…) trên sản phẩm và dùng chúng trên đơn bán/mua. 'Packages' là bao bì vật lý dùng để chứa hàng khi 'Put in Pack', không phải quy cách bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/configure/packaging.html"}, {"set": 6, "subject": "Inventory", "question": "Screws are purchased by the box of 100 but stocked and consumed per unit. With the Units of Measure setting enabled, how should the product be configured?", "options": ["Create two separate products, one per box and one per unit", "Set the Unit of Measure to 'Box of 100' and convert manually on each receipt", "Use a reordering rule with a Multiple Quantity of 100 units", "Keep Units as the UoM and set a 'Box of 100' Purchase Unit"], "answer": 3, "explanation": "Đơn vị mua (Purchase UoM) phải cùng category với đơn vị tồn kho; Odoo tự quy đổi 1 box = 100 units khi nhập kho. Tạo hai sản phẩm riêng sẽ làm sai tồn kho và giá vốn.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/configure/uom.html"}, {"set": 6, "subject": "Manufacturing", "question": "A confirmed manufacturing order for 100 units must be divided into 4 MOs of 25 units so that several teams can work in parallel. What should be used?", "options": ["The 'Split' action on the MO", "The 'Merge' action", "An unbuild order", "A backorder created at validation"], "answer": 0, "explanation": "Action 'Split' chia một MO (Draft/Confirmed) thành nhiều MO với số lượng tùy chọn. Backorder chỉ được đề xuất khi đóng MO với số lượng sản xuất thiếu, không dùng để chia trước.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/split_merge.html"}, {"set": 6, "subject": "Manufacturing", "question": "When computing the cost of a manufactured product from its BoM, the time spent on operations must be valued at $40 per hour for the CNC machine. Where is this rate configured?", "options": ["On the product form, in the 'Cost' field", "In the 'Cost Share (%)' field on the BoM", "In the 'Cost per hour' field of the CNC work center", "On the operation type 'Manufacturing'"], "answer": 2, "explanation": "'Cost per hour' trên work center được dùng để tính chi phí operation (thời gian × đơn giá) trong giá thành sản phẩm và BoM Overview. 'Cost Share (%)' chỉ phân bổ chi phí cho by-product.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/advanced_configuration/work_center_costs.html"}, {"set": 6, "subject": "Manufacturing", "question": "In Odoo 18, where do you define the 'Manuf. Lead Time' (number of days needed to manufacture a product) used to compute MO scheduled dates?", "options": ["On the product form, Inventory tab", "On the bill of materials, Miscellaneous tab", "On the work center, General Information tab", "In Manufacturing ‣ Configuration ‣ Settings"], "answer": 1, "explanation": "Từ Odoo 18, 'Manuf. Lead Time' (produce_delay) nằm trên BoM, tab Miscellaneous, cùng với 'Days to prepare Manufacturing Order'. Các phiên bản trước đặt trường này trên tab Inventory của sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/advanced_operations_shipping/scheduled_dates.html"}, {"set": 6, "subject": "Manufacturing", "question": "An old press machine works more slowly than standard: every operation on it takes longer than the BoM duration. Which work center field should be adjusted so that expected durations reflect this?", "options": ["OEE Target", "Capacity", "Setup Time", "Time Efficiency"], "answer": 3, "explanation": "'Time Efficiency' (%) điều chỉnh thời lượng dự kiến: thời gian chạy = thời lượng chuẩn × 100 / efficiency, nên efficiency < 100% làm thời gian dài hơn. 'OEE Target' chỉ là chỉ tiêu dùng cho báo cáo, không ảnh hưởng thời lượng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/advanced_configuration/using_work_centers.html"}, {"set": 6, "subject": "Point of Sale", "question": "A customer brings back an item bought yesterday in the shop. How should the cashier process the refund in the PoS?", "options": ["Add the product with a negative price on a new order and pay out", "From the Orders screen, select the original order line and click 'Refund'", "Cancel the original order from the backend", "Close the session, then create a credit note for the customer in Accounting"], "answer": 1, "explanation": "Cách chuẩn là vào màn hình Orders, tìm đơn gốc, chọn số lượng cần trả và bấm Refund; Odoo tạo đơn hoàn trả liên kết với đơn gốc (số lượng âm). Nhập giá âm thủ công sẽ mất liên kết với đơn gốc và sai thống kê.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/shop/refund.html"}, {"set": 6, "subject": "Point of Sale", "question": "A customer confirmed a quotation with a salesperson and comes to the store to pay and collect the goods. How can the cashier load this sales order in the PoS?", "options": ["Use the 'Quotation/Order' button and pick the order", "Scan the quotation's PDF with a barcode scanner", "Use the Customer Account payment method on a new order", "Duplicate the sales order as a PoS order from the Sales app"], "answer": 0, "explanation": "Khi cài Sales cùng PoS (module pos_sale), nút 'Quotation/Order' cho phép tải báo giá/đơn bán vào PoS để thanh toán (settle order hoặc trả trước). Customer Account là phương thức ghi nợ, không tải được đơn bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/shop/sales_order.html"}, {"set": 6, "subject": "Point of Sale", "question": "A country no longer uses 1-cent coins. Cash payments must be rounded to the nearest 0.05, but card payments must stay exact. How should this be configured?", "options": ["Set the currency's rounding factor to 0.05 in Accounting", "Create a pricelist that rounds all product prices to 0.05", "Cash Rounding at 0.05 with 'Only apply rounding on cash'", "Enable Global Discounts to absorb the cents on cash orders"], "answer": 2, "explanation": "Setting 'Cash Rounding' với rounding method 0.05 kèm tùy chọn 'Only apply rounding on cash' chỉ làm tròn khi trả bằng phương thức tiền mặt. Đổi rounding của tiền tệ sẽ ảnh hưởng toàn bộ kế toán và cả thanh toán thẻ.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/pricing/cash_rounding.html"}, {"set": 6, "subject": "Point of Sale", "question": "In a restaurant PoS, guests want to check their bill on paper before paying. Which setting lets the waiter print the bill before payment?", "options": ["Allow Bill Splitting", "Preparation Printers", "Use QR code on ticket", "Early Receipt Printing"], "answer": 3, "explanation": "'Early Receipt Printing' (restaurant) thêm nút in hóa đơn tạm (Bill) trước khi thanh toán. Preparation Printers dùng để in phiếu chế biến cho bếp/bar, không phải hóa đơn cho khách.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/restaurant/bill_printing.html"}, {"set": 6, "subject": "CRM", "question": "A salesperson wants to record an internal comment on an opportunity that must NOT be emailed to the customer. Which chatter action should be used?", "options": ["Log note", "Send message", "Schedule activity with the customer as assignee", "Add the customer as a follower and use Send message"], "answer": 0, "explanation": "'Log note' tạo ghi chú nội bộ, không gửi email cho khách hàng (follower bên ngoài). 'Send message' sẽ gửi email đến các follower, bao gồm khách hàng."}, {"set": 6, "subject": "CRM", "question": "When marking an opportunity as lost in Odoo 18, what can the salesperson fill in besides the Lost Reason?", "options": ["The competitor's quotation amount, which updates the expected revenue", "A Closing Note explaining the loss, which is logged in the chatter", "A new expected closing date for a future follow-up", "The name of the salesperson who will reopen it"], "answer": 1, "explanation": "Wizard 'Mark Lost' trong Odoo 18 có Lost Reason và Closing Note (ghi chú tự do được log vào chatter). Wizard không có trường số tiền đối thủ hay ngày đóng mới."}, {"set": 6, "subject": "CRM", "question": "A sales director wants to analyse how many calls, meetings and emails each salesperson has completed on leads and opportunities. Which report should be opened?", "options": ["CRM ‣ Reporting ‣ Pipeline", "CRM ‣ Reporting ‣ Forecast", "CRM ‣ Reporting ‣ Activities", "CRM ‣ Sales ‣ Teams"], "answer": 2, "explanation": "CRM ‣ Reporting ‣ Activities phân tích các hoạt động (call, meeting, email...) theo người phụ trách, loại và ngày. Forecast chỉ phân tích doanh thu dự kiến theo ngày chốt."}, {"set": 6, "subject": "CRM", "question": "From an opportunity, a salesperson clicks the \"Meeting\" smart button and books a demo in the calendar. What is the result?", "options": ["The meeting is only visible in the salesperson's personal calendar with no link to the opportunity", "A new opportunity is created for the meeting", "The opportunity automatically moves to the next stage", "The calendar event is linked to the opportunity and appears in its meeting count and chatter"], "answer": 3, "explanation": "Khi tạo cuộc họp từ smart button 'Meeting', sự kiện Calendar được liên kết với cơ hội (opportunity_id), được đếm trên smart button và ghi vào chatter. Việc đặt lịch không tự động chuyển stage."}, {"set": 6, "subject": "Marketing", "question": "An SMS mailing contains a link to a promotion page. How does Odoo track clicks on that link?", "options": ["They are shortened via the link tracker, which counts the clicks", "SMS links cannot be tracked; only email links can be shortened", "The marketer must add Google Analytics UTM tags to the SMS manually", "Only if the recipient replies to the SMS with the keyword"], "answer": 0, "explanation": "SMS Marketing tự động rút gọn link qua Link Tracker, kèm mã thống kê để đếm click theo người nhận. Không cần công cụ ngoài như Google Analytics."}, {"set": 6, "subject": "Marketing", "question": "In Social Marketing, a marketer wants to monitor the posts and comments of a connected Facebook page directly in Odoo. What should be added?", "options": ["A Marketing Automation campaign targeting the page", "A stream on the Feed (e.g. the page's posts)", "A Link Tracker entry for the page URL", "A mailing list for the page followers"], "answer": 1, "explanation": "Trong Social Marketing, vào Feed và thêm Stream (ví dụ 'Page Posts') để theo dõi bài đăng và bình luận của tài khoản đã kết nối. Link Tracker chỉ theo dõi click link.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/social_marketing.html"}, {"set": 6, "subject": "Marketing", "question": "A company wants to send web push notifications to visitors of its Odoo website through the Social Marketing app. What must be done first?", "options": ["Enable SMS Marketing and buy IAP credits for the notifications", "Connect a Facebook page as a stream in Social Marketing", "Enable Web Push Notifications in Website settings", "Add a Newsletter Popup block on the homepage to collect visitors"], "answer": 2, "explanation": "Push notification cần bật 'Enable Web Push Notifications' trong cài đặt Website (dùng Firebase); sau đó tài khoản Push Notifications xuất hiện trong Social Marketing. Kết nối Facebook không liên quan đến push trên website."}, {"set": 6, "subject": "Marketing", "question": "Recipients should be able to add themselves to the blacklist directly from the unsubscribe page of a mailing. Which setting enables this?", "options": ["Dedicated Server", "Mailing Campaigns", "Split First and Last Name", "Blacklist Option when Unsubscribing"], "answer": 3, "explanation": "'Blacklist Option when Unsubscribing' trong Email Marketing settings cho phép người nhận tự quản lý trạng thái blacklist trên trang hủy đăng ký. Các tùy chọn khác không liên quan đến trang unsubscribe."}, {"set": 6, "subject": "Survey", "question": "A company sends a survey invitation via the \"Share\" button and wants the personal links to stop working after the end of the month. What should be set in the invitation wizard?", "options": ["The number of attempts allowed", "The survey's time limit in minutes", "The Answer deadline", "The survey's Access Mode set to \"Anyone with the link\""], "answer": 2, "explanation": "Wizard Share/Invite có trường 'Answer deadline' giới hạn thời hạn trả lời cho các link mời. Time limit tính theo phút cho một lần làm bài, không phải hạn chót."}, {"set": 6, "subject": "Survey", "question": "A company wants its certification PDF to use a different design and colour. Where is this chosen?", "options": ["In the website editor's Theme tab, under Colors", "In Settings ‣ Companies ‣ Document Layout only", "In the Certified Email Template of the survey", "In the survey's Certification template field"], "answer": 3, "explanation": "Trường 'Certification template' trên survey cho chọn các mẫu Modern/Classic với màu Purple, Blue, Gold. Document Layout của công ty không điều khiển mẫu chứng chỉ survey."}, {"set": 6, "subject": "Survey", "question": "Which of the following is NOT a question type available in the Odoo 18 Survey app?", "options": ["File Upload", "Datetime", "Single Line Text Box", "Matrix"], "answer": 0, "explanation": "Odoo 18 Survey có các loại: Multiple choice (một/nhiều đáp án), Multiple Lines Text Box, Single Line Text Box, Numerical Value, Scale, Date, Datetime, Matrix. Không có kiểu 'File Upload' trong bản chuẩn."}, {"set": 6, "subject": "Website", "question": "An administrator wants to reorder the website's top menu items and create a sub-menu under \"Services\". Which tool is used?", "options": ["Website ‣ Configuration ‣ Settings", "The Menu Editor (Site ‣ Menu Editor)", "The Theme tab of the website editor", "Page Properties of the Services page"], "answer": 1, "explanation": "Menu Editor cho phép thêm, sắp xếp (kéo thả) và lồng menu con. Theme tab chỉ thay đổi giao diện (font, màu), không quản lý cấu trúc menu."}, {"set": 6, "subject": "Website", "question": "An administrator wants to see all website pages in a list, check which ones are published, and delete obsolete ones in bulk. Where is this done?", "options": ["Website ‣ Configuration ‣ Settings", "Website ‣ Reporting ‣ Analytics", "Website ‣ Site ‣ Pages", "Settings ‣ Technical ‣ Views"], "answer": 2, "explanation": "Website ‣ Site ‣ Pages hiển thị danh sách các trang (URL, trạng thái publish, indexed...) và cho phép thao tác hàng loạt. Technical ‣ Views là view kỹ thuật, không phải công cụ quản lý trang."}, {"set": 6, "subject": "Website", "question": "A large banner image looks good on desktop but cluttered on smartphones. How can it be hidden only on mobile devices?", "options": ["Switch the website to a mobile-specific theme in the Theme tab", "Delete the block and create a separate mobile website", "Set the page's Visibility to \"Signed In\"", "Hide it on mobile with the block's visibility option"], "answer": 3, "explanation": "Website editor cho phép ẩn/hiện block theo thiết bị (desktop/mobile) qua tùy chọn visibility của block. Không cần website riêng cho mobile."}, {"set": 6, "subject": "Website", "question": "A B2B company only wants customers it has explicitly invited to be able to create a portal account on the website. Which Customer Account option should be selected in Website settings?", "options": ["On invitation", "Free sign up", "Shared Customer Accounts", "Mandatory (no guest checkout)"], "answer": 0, "explanation": "Tùy chọn 'On invitation' chỉ cho phép người được mời (Portal Access) tạo tài khoản, còn 'Free sign up' cho bất kỳ ai đăng ký. Shared Customer Accounts chỉ liên quan đến multi-website."}, {"set": 6, "subject": "eCommerce", "question": "A shop offers free delivery for orders of $100 or more, otherwise a fixed $8 fee. How is this configured?", "options": ["Create two separate websites", "Create a 100% discount promotion for orders above $100 on all products", "Set a pricelist rule that subtracts $8 for orders above $100", "Tick \"Free if order amount is above\" $100 on an $8 Fixed Price method"], "answer": 3, "explanation": "Delivery method có tùy chọn 'Free if order amount is above' với ngưỡng; khi tổng đơn (chưa tính ship) ≥ ngưỡng thì phí giao hàng = 0. Giảm 100% sản phẩm sẽ làm hàng miễn phí chứ không phải phí giao hàng."}, {"set": 6, "subject": "eCommerce", "question": "An online shop wants an invoice to be created and marked as paid automatically when an online payment is confirmed. Which setting should be enabled?", "options": ["Automatic Invoice in the Sales settings", "Lock Confirmed Sales", "Extra Step During Checkout", "Abandoned cart emails"], "answer": 0, "explanation": "'Automatic Invoice' (Sales ‣ Configuration ‣ Settings) tạo và đối soát hóa đơn khi giao dịch thanh toán online được xác nhận. 'Lock Confirmed Sales' chỉ khóa đơn đã xác nhận."}, {"set": 6, "subject": "eCommerce", "question": "Returning customers want to quickly buy the same products again from an order they placed before. Which Odoo 18 eCommerce setting helps?", "options": ["Buy Now", "Re-order From Portal", "Wishlists", "Shared Customer Accounts"], "answer": 1, "explanation": "'Re-order From Portal' thêm nút cho phép khách đặt lại các sản phẩm từ đơn cũ trong portal. 'Buy Now' chỉ bỏ qua bước giỏ hàng trên trang sản phẩm."}, {"set": 6, "subject": "Project", "question": "A project manager wants to define key milestones on a project and link tasks to them, but the Milestones tab is missing. What must be done first?", "options": ["Set the project's invoicing policy to 'Based on Milestones'", "Install the Planning app", "Enable 'Milestones' in Project ‣ Configuration ‣ Settings", "Enable 'Project Stages' in Project ‣ Configuration ‣ Settings"], "answer": 2, "explanation": "Tính năng Milestones phải được bật trong Project Settings thì mới tạo được milestone và gắn task. Chính sách hóa đơn 'Based on Milestones' là của sản phẩm, chỉ dùng sau khi đã có milestone.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 6, "subject": "Project", "question": "A task must be handled jointly by two developers, and both must see it in their 'My Tasks'. How is this done in Odoo 18?", "options": ["Create a sub-task for the second developer; only one assignee is allowed per task", "Add the second developer as a follower of the task", "Duplicate the task and assign each copy to one developer", "Add both users in the task's Assignees field"], "answer": 3, "explanation": "Trường Assignees của task là many2many nên có thể gán nhiều người; task sẽ hiển thị trong My Tasks của từng người. Follower chỉ nhận thông báo, không được coi là người được giao.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 6, "subject": "Project", "question": "A recurring task 'Quarterly VAT review' must be recreated every three months. How should its recurrence be configured?", "options": ["Repeat Every 3 Months", "Repeat Every 1 Quarter", "Repeat Every 90 Weeks", "Repeat Every 12 Days"], "answer": 0, "explanation": "Đơn vị lặp lại của recurring task gồm Days, Weeks, Months và Years; không có đơn vị Quarter, nên cần đặt 3 Months.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 6, "subject": "Timesheets", "question": "In a project with Timesheets enabled, a user quick-creates a task by typing 'Write user guide 5h' in the kanban view. What does Odoo 18 do?", "options": ["Creates the task and logs a 5-hour timesheet on it", "Creates the task 'Write user guide' with 5 hours of Allocated Time", "Creates the task with a deadline in 5 hours", "Creates the task named 'Write user guide 5h' without any other change"], "answer": 1, "explanation": "Khi tạo nhanh task, cú pháp số + 'h' (ví dụ 5h) được hiểu là Allocated Time và bị loại khỏi tên task. Odoo không tự tạo timesheet hay deadline.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 6, "subject": "Timesheets", "question": "Which view of the Timesheets app lets employees enter their hours in a table with one line per project/task and one column per day of the week?", "options": ["Pivot view", "Kanban view", "Grid view", "Calendar view"], "answer": 2, "explanation": "Grid view (mặc định ở My Timesheets) hiển thị bảng mỗi dòng là project/task, mỗi cột là một ngày để nhập giờ trực tiếp. Pivot chỉ dùng để phân tích, không để nhập liệu.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 6, "subject": "Timesheets", "question": "A timesheet approver wants to quickly find and validate the timesheets of the previous period. Which menu is used?", "options": ["Timesheets ‣ Reporting ‣ by Employee", "Timesheets ‣ Configuration ‣ Settings", "Project ‣ Reporting ‣ Tasks Analysis", "Timesheets ‣ To Validate (e.g. 'Last Period')"], "answer": 3, "explanation": "Menu To Validate (với các mục như Last Period, All Timesheets) liệt kê timesheet chờ duyệt để người duyệt bấm Validate. Các menu Reporting chỉ dùng để phân tích.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 6, "subject": "HR", "question": "A company wants employees to be able to update their own data (e.g. private address) from their profile without HR intervention. Which Employees setting should be enabled?", "options": ["Employee Editing", "Advanced Presence Control", "Skills Management", "Remote Work"], "answer": 0, "explanation": "Employee Editing (trong Employees ‣ Configuration ‣ Settings) cho phép nhân viên tự cập nhật dữ liệu của mình. Advanced Presence Control liên quan đến cách xác định trạng thái có mặt.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 6, "subject": "HR", "question": "In the Appraisals app, a manager tracks an employee's goal 'Obtain the PMP certification'. Which progress values can be selected on a goal?", "options": ["Any percentage between 0 and 100", "0%, 25%, 50%, 75%, 100%", "Not Started, In Progress, Done", "1 to 5 stars"], "answer": 1, "explanation": "Trường Progress của goal trong Appraisals là selection với các mức 0%, 25%, 50%, 75% và 100%. Không thể nhập phần trăm tùy ý.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/appraisals.html"}, {"set": 6, "subject": "HR", "question": "During an appraisal, a manager is writing their feedback and does not want the employee to read it before it is finished. What should the manager do?", "options": ["Cancel the appraisal and recreate it once the feedback is ready", "Remove the employee from the appraisal's followers", "Switch off its toggle so it shows 'Not Visible to Employee'", "Move the feedback into the private notes of the employee form"], "answer": 2, "explanation": "Phần feedback của manager có toggle hiển thị; tắt nó để feedback ở trạng thái 'Not Visible to Employee' cho đến khi bật lại. Gỡ follower không ẩn nội dung feedback trên form.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/appraisals.html"}, {"set": 6, "subject": "HR", "question": "Extra hours recorded in Attendances must not be counted until the employee's manager has checked them. Which setting should be used?", "options": ["Extra Hours Validation: Automatically Approved", "Tolerance Time In Favor Of Company", "Automatic Check-Out", "Extra Hours Validation: Approved by Manager"], "answer": 3, "explanation": "Thiết lập Extra Hours Validation có hai giá trị Automatically Approved và Approved by Manager; chọn Approved by Manager để giờ làm thêm phải được quản lý duyệt. Tolerance chỉ bỏ qua các khoảng thời gian nhỏ.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/attendances.html"}, {"set": 6, "subject": "Studio", "question": "When creating a new model with Studio, which suggested feature adds start/end date fields and lets you visualize the records in a Gantt chart?", "options": ["Date range & Gantt", "Date & Calendar", "Pipeline stages", "Custom Sorting"], "answer": 0, "explanation": "Tùy chọn Date range & Gantt tạo trường ngày bắt đầu/kết thúc và Gantt view. Date & Calendar chỉ thêm một trường ngày và Calendar view.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 6, "subject": "Studio", "question": "In a multi-company database, records of a new Studio model must each belong to one company and be restricted to users of that company. Which suggested feature should be selected when creating the model?", "options": ["Contact details", "Company", "User assignment", "Archiving"], "answer": 1, "explanation": "Tùy chọn Company thêm trường company và các quy tắc truy cập (record rule) đa công ty tương ứng. User assignment chỉ thêm người phụ trách.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 6, "subject": "Studio", "question": "In Studio, an administrator wants to edit the XML of a view directly, or use 'Restore Default View' to discard all Studio changes on it. What is required for these buttons to appear in the view's sidebar?", "options": ["The view must first be exported with Studio's Export", "The user must be in the 'Technical Features' group of the Studio app only", "Developer mode must be activated", "Nothing: they are always visible in the Studio sidebar"], "answer": 2, "explanation": "Các nút More, XML, Default Values và Restore Default View trong sidebar của view editor chỉ hiện khi bật developer mode. Export không liên quan.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 6, "subject": "Studio", "question": "You export your Studio customizations to install them in a new database, and the records of your custom 'Equipment Type' model must be exported too. What should be done in the Studio export wizard?", "options": ["Nothing: all records of all custom models are always exported", "Export the records separately with Import/Export; Studio export cannot contain data", "Enable 'Include Demo Data' only", "Enable 'Include Data' and select the model(s) whose records must be exported"], "answer": 3, "explanation": "Wizard export của Studio có tùy chọn Include Data để chọn thêm model và bản ghi cần xuất kèm customizations. Include Demo Data chỉ đánh dấu dữ liệu là demo, không thay thế việc chọn dữ liệu.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio.html"}, {"set": 6, "subject": "Studio", "question":
