 mẫu khi chọn giao diện cho mailing mới. Nhân bản mailing list chỉ sao chép danh sách người nhận.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 3, "subject": "Marketing", "question": "In Marketing Automation, an activity has a \"Validity Duration\" of 2 days. What does this mean?", "options": ["The activity is repeated every 2 days", "If the activity cannot be executed within 2 days after its scheduled time, it is cancelled for that participant", "The participant is removed from the campaign after 2 days", "The email links expire after 2 days"], "answer": 1, "explanation": "Validity Duration giới hạn thời gian cho phép thực thi activity; quá hạn mà chưa chạy được thì activity bị hủy cho participant đó. Nó không lặp lại activity hay làm hết hạn link.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation/workflow_activities.html"}, {"set": 3, "subject": "Marketing", "question": "A company has a Facebook page and a LinkedIn page connected to Social Marketing. How can it publish the same announcement on both?", "options": ["Publish on Facebook and enable automatic sharing to LinkedIn in Settings", "Create two posts, one per account; a post can only target one account", "Use Email Marketing with social accounts as recipients", "Create one social post and select both accounts in the post"], "answer": 3, "explanation": "Một bài Social Marketing có thể chọn nhiều tài khoản cùng lúc (Facebook, LinkedIn, X, Instagram…), có thể chỉnh preview riêng. Không cần tạo bài riêng cho từng tài khoản.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/social_marketing.html"}, {"set": 3, "subject": "Marketing", "question": "How can an event organiser automatically send a reminder email to all attendees 3 days before the event?", "options": ["Add a line in the event's Communication tab with the reminder template, 3 days, \"Before the event\"", "Use the \"Use Event Barcode\" setting", "Schedule an activity on each registration", "Create a mass mailing to the event's registrations 3 days before manually"], "answer": 0, "explanation": "Tab Communication của event là lịch gửi email/SMS tự động theo mốc (sau đăng ký, trước/sau sự kiện). Gửi mass mailing thủ công cũng được nhưng không tự động.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/events/create_events.html"}, {"set": 3, "subject": "Marketing", "question": "At the event entrance, staff want to check attendees in by scanning the barcode on their tickets. What is needed?", "options": ["Enable \"Use Event Barcode\" in Events settings and use the Registration Desk", "Print badges from Email Marketing", "Install the Inventory Barcode app and scan into a warehouse", "Enable \"Booth Management\""], "answer": 0, "explanation": "Bật \"Use Event Barcode\" để vé/badge có barcode và dùng Registration Desk để quét check-in. Barcode của Inventory phục vụ kho, không phải check-in sự kiện.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/events/registration_desk.html"}, {"set": 3, "subject": "Marketing", "question": "A marketer prints a flyer and wants a short URL whose clicks are tracked with campaign, medium and source. Which tool should be used?", "options": ["Predictive Lead Scoring", "A mailing list", "Link Tracker", "A Marketing Automation campaign"], "answer": 2, "explanation": "Link Tracker tạo link rút gọn gắn tham số UTM (campaign, medium, source) và đếm số click. Marketing Automation dùng cho workflow gửi thông điệp, không tạo link rút gọn.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/reporting/link_tracker.html"}, {"set": 3, "subject": "Marketing", "question": "In the statistics of a sent mailing, what does a \"Bounced\" email mean?", "options": ["The recipient marked the email as spam and unsubscribed", "The recipient opened the email but did not click", "The email was delivered to the recipient's spam folder", "The email could not be delivered to the recipient's mailbox"], "answer": 3, "explanation": "Bounced nghĩa là email bị server người nhận trả về, không giao được (địa chỉ sai, hộp thư đầy…). Email vào thư mục spam vẫn được tính là đã giao.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing/analytics.html"}, {"set": 3, "subject": "Marketing", "question": "An A/B test is configured on 20% of recipients with winner selection \"Highest Click Rate\". What happens on the \"Send Final On\" date?", "options": ["All versions are sent again to every recipient", "Odoo automatically sends the best-performing version to the remaining recipients", "The marketer must always pick the winner manually", "The test is cancelled if fewer than 50% clicked"], "answer": 1, "explanation": "Nếu tiêu chí khác Manual, đến ngày Send Final On Odoo tự chọn phiên bản tốt nhất và gửi cho phần người nhận còn lại. Chỉ khi chọn Manual thì người dùng mới phải tự chọn winner.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 1, "subject": "Survey", "question": "A company wants respondents to rate a service on a 0 to 10 scale. Which question type is designed for this in Odoo 18?", "options": ["Matrix", "Multiple choice: only one answer", "Scale", "Numerical Value"], "answer": 2, "explanation": "Odoo 18 có loại câu hỏi Scale cho phép chọn điểm trên thang (tối đa 0–10) với nhãn hai đầu. Numerical Value chỉ là ô nhập số tự do, không hiển thị thang điểm.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/questions.html"}, {"set": 1, "subject": "Survey", "question": "A trainer wants participants to see the correct answers right after completing each page of a quiz. Which Scoring option should be selected?", "options": ["Scoring with answers after each page", "No scoring", "Scoring without answers", "Scoring with answers at the end"], "answer": 0, "explanation": "\"Scoring with answers after each page\" hiển thị đáp án đúng sau mỗi trang. \"Scoring with answers at the end\" chỉ hiển thị đáp án khi hoàn thành toàn bộ bài.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/scoring.html"}, {"set": 1, "subject": "Survey", "question": "What is required to turn a survey into a certification that participants pass or fail?", "options": ["Publish the survey in eLearning", "Enable a time limit", "Set the access mode to \"Invited people only\"", "Use a scoring option, tick \"Is a Certification\" and set the Required Score (%)"], "answer": 3, "explanation": "Certification cần bật chấm điểm, tick \"Is a Certification\" và đặt Required Score (%) để xác định đậu/rớt. Access mode hay time limit là tùy chọn, không bắt buộc.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/scoring.html"}, {"set": 1, "subject": "Survey", "question": "The \"Create Live Session\" button does not appear on a survey. What is the most likely reason?", "options": ["The survey access mode is \"Anyone with the link\"", "The survey is configured as a certification", "The survey uses the \"Scale\" question type", "The survey has more than 10 questions"], "answer": 1, "explanation": "Live session chỉ khả dụng khi survey type là Live session/Custom và survey không phải certification. Số câu hỏi hay access mode không ảnh hưởng.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/live_session.html"}, {"set": 1, "subject": "Survey", "question": "A survey should ask \"Which competitor do you use?\" only if the respondent answered \"Yes\" to \"Do you use a competitor?\". How is this configured?", "options": ["Create two separate surveys", "Place both questions on the same page; Odoo hides unanswered ones", "Make the second question mandatory", "In the second question's Options, use \"Conditional display\" and select the triggering answer \"Yes\""], "answer": 3, "explanation": "Conditional display cho phép chọn một hoặc nhiều triggering answer; câu hỏi chỉ hiện khi người trả lời chọn một trong các đáp án đó. Mandatory chỉ bắt buộc trả lời, không ẩn/hiện câu hỏi.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/questions.html"}, {"set": 1, "subject": "Survey", "question": "A survey's Access Mode is set to \"Invited people only\". What does this mean?", "options": ["Only internal users can answer", "Only people who received a personal invitation link (token) can answer", "The survey is visible only on the website's survey page", "Anyone can answer but must log in"], "answer": 1, "explanation": "\"Invited people only\" yêu cầu link mời cá nhân (có token) mới làm được survey. Yêu cầu đăng nhập là tùy chọn riêng \"Require Login\".", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 2, "subject": "Survey", "question": "Where do you set a time limit (in minutes) that participants have to complete a survey?", "options": ["In the survey's Options tab, by enabling the survey time limit", "On each question, in the Description tab", "In Surveys ‣ Configuration ‣ Settings", "On the invitation wizard"], "answer": 0, "explanation": "Giới hạn thời gian làm bài được bật trong tab Options của survey và nhập số phút. Từng câu hỏi không có field giới hạn thời gian (trừ chế độ live session).", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 2, "subject": "Survey", "question": "A manager wants to limit each participant to 2 attempts, but the option to limit the number of attempts is not available. Which configuration explains this?", "options": ["The survey is a certification", "The survey uses the Matrix question type", "The survey is open to \"Anyone with the link\" without \"Require Login\", so participants cannot be identified", "The survey layout is \"One page with all the questions\""], "answer": 2, "explanation": "Giới hạn số lần làm chỉ khả dụng khi Odoo nhận diện được người làm (Invited people only hoặc Require Login). Certification vẫn dùng được giới hạn attempts.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 2, "subject": "Survey", "question": "A trainer wants each participant to get a different random subset of questions from each section. Which option is used?", "options": ["Pagination: \"One page per question\"", "Scoring: \"Scoring without answers\"", "Enable \"Users can go back\"", "Question Selection: \"Randomized per Section\", then set the number of random questions on each section"], "answer": 3, "explanation": "\"Randomized per Section\" chọn ngẫu nhiên số câu hỏi đã định cho từng section. Pagination chỉ thay đổi cách chia trang, không xáo trộn câu hỏi.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 2, "subject": "Survey", "question": "Which pagination options are available for a survey in Odoo 18?", "options": ["One page per question, One page per section, One page with all the questions", "One page per question, One page per participant, One page per answer", "One page per section and one page per scoring level", "Only one page per question"], "answer": 0, "explanation": "Pagination có 3 lựa chọn: One page per question, One page per section, One page with all the questions. Các phương án khác không tồn tại.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 2, "subject": "Survey", "question": "An eLearning course must end with a certification exam. What is needed?", "options": ["Set the survey access mode to \"Anyone with the link\" and paste the link in the course description", "Enable Certifications in eLearning settings and add a content of type Certification linked to the certification survey", "Create a Live Session from the course", "Attach the survey PDF to the course"], "answer": 1, "explanation": "Khi bật Certifications trong eLearning, có thể thêm nội dung loại Certification gắn với survey certification vào khóa học. Dán link chỉ là liên kết ngoài, không ghi nhận tiến độ khóa học.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/scoring.html"}, {"set": 2, "subject": "Survey", "question": "In the survey results page, how can a manager analyse only the respondents who chose a specific answer to a question?", "options": ["Use the Scoring options", "Export results to Excel; filtering is not possible in Odoo", "Click the filter icon next to that answer to filter all results on it", "Create a new survey with only that question"], "answer": 2, "explanation": "Trang Results cho phép bấm biểu tượng lọc cạnh một đáp án để lọc toàn bộ kết quả theo những người đã chọn đáp án đó. Scoring chỉ liên quan chấm điểm.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/analysis.html"}, {"set": 3, "subject": "Survey", "question": "During a live session, the host wants participants who answer faster to earn more points. Which option enables this?", "options": ["Randomized per Section", "Scoring without answers", "Survey Time Limit", "Reward quick answers"], "answer": 3, "explanation": "\"Reward quick answers\" cho thêm điểm khi trả lời nhanh trong live session (kèm giới hạn thời gian mỗi câu). Survey Time Limit giới hạn tổng thời gian, không cộng điểm.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/live_session.html"}, {"set": 3, "subject": "Survey", "question": "A Matrix question lists several products as rows and satisfaction levels as columns. The respondent must be able to tick several columns per row. Which setting is required?", "options": ["Question type: Multiple choice: multiple answers allowed", "Matrix Type: \"Multiple choices per row\"", "Question type: Scale", "Matrix Type: \"One choice per row\""], "answer": 1, "explanation": "Câu hỏi Matrix có Matrix Type; chọn \"Multiple choices per row\" để tick nhiều cột trên mỗi dòng. Multiple choice thường không có dạng dòng × cột.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/questions.html"}, {"set": 3, "subject": "Survey", "question": "When creating a survey in Odoo 18, which survey type disables scoring, certification and time limit by default?", "options": ["Survey", "Assessment", "Live session", "Custom"], "answer": 0, "explanation": "Loại Survey dùng để thu thập ý kiến nên mặc định tắt scoring, certification và time limit. Assessment dành cho bài đánh giá có chấm điểm.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 3, "subject": "Survey", "question": "Respondents complain they cannot return to a previous page to change an answer. Which option should be enabled?", "options": ["Randomized per Section", "Require Login", "Users can go back", "Conditional display"], "answer": 2, "explanation": "Tùy chọn \"Users can go back\" (Back Button) cho phép quay lại trang trước. Require Login chỉ bắt đăng nhập trước khi làm.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/create.html"}, {"set": 3, "subject": "Survey", "question": "A question must be answered before the respondent can continue. What should be set?", "options": ["Set the survey Access Mode to \"Invited people only\"", "Enable \"Survey Time Limit\"", "Add a conditional display on the question", "Tick \"Mandatory Answer\" on the question and optionally set an error message"], "answer": 3, "explanation": "\"Mandatory Answer\" trong tab Options của câu hỏi buộc phải trả lời, có thể kèm thông báo lỗi. Conditional display chỉ quyết định câu hỏi có hiển thị hay không.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/questions.html"}, {"set": 3, "subject": "Survey", "question": "What does the \"Certified Email Template\" option on a certification do?", "options": ["Automatically sends an email containing the certification document to participants who pass", "Sends the results to the survey responsible after each attempt", "Sends a reminder to participants who failed", "Sends the invitation link to all participants"], "answer": 0, "explanation": "Certified Email Template là email tự động gửi cho người đậu certification, kèm file chứng chỉ. Việc mời người làm survey dùng wizard Share/Invite.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/surveys/scoring.html"}, {"set": 1, "subject": "Website", "question": "A page's URL is changed from /services to /our-services. How do you avoid broken links and keep its search engine ranking?", "options": ["Unpublish the old page", "Duplicate the page so both URLs exist", "Create a 301 (Moved Permanently) redirect from the old URL to the new one", "Create a 404 page for /services"], "answer": 2, "explanation": "Redirect 301 báo cho trình duyệt và search engine rằng trang đã chuyển vĩnh viễn, giữ thứ hạng SEO; khi đổi URL trong page properties Odoo có tùy chọn tạo redirect. Nhân bản trang tạo nội dung trùng lặp, hại SEO.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages/url_redirection.html"}, {"set": 1, "subject": "Website", "question": "A company runs two websites in one database and wants customers to use a single login on both. Which setting controls this?", "options": ["Multi-Companies", "Shared Customer Accounts", "Sign in/up at checkout", "Language selector"], "answer": 1, "explanation": "\"Shared Customer Accounts\" trong Website settings quyết định tài khoản khách hàng dùng chung cho mọi website hay riêng từng website. Multi-Companies là cấu hình công ty, không phải tài khoản khách.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/multi_website.html"}, {"set": 1, "subject": "Website", "question": "How do you make your website available in French in addition to English?", "options": ["Add French in Website ‣ Configuration ‣ Settings, Languages section, then translate the content", "Create a second website with a French domain", "Change the admin user's language to French", "Install a French theme"], "answer": 0, "explanation": "Thêm ngôn ngữ trong mục Languages của Website settings, sau đó dịch nội dung bằng nút Translate trên website. Đổi ngôn ngữ của user chỉ ảnh hưởng giao diện backend của user đó.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/translate.html"}, {"set": 1, "subject": "Website", "question": "Where can you define a page's meta title, meta description and keywords in Odoo 18?", "options": ["In the HTML editor of the page footer", "In Website ‣ Configuration ‣ Settings, Default Meta field", "On the page, via Site ‣ Optimize SEO", "In the robots.txt file"], "answer": 2, "explanation": "Hộp thoại Optimize SEO (menu Site) cho phép đặt meta title, description, keywords và ảnh chia sẻ cho từng trang. robots.txt chỉ điều khiển việc bot được crawl, không chứa meta.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages/seo.html"}, {"set": 1, "subject": "Website", "question": "A form building block must create a record instead of only sending an email. Where do you change this?", "options": ["In the Form Builder app", "Select the form in the website editor and change its Action field", "In Website ‣ Configuration ‣ Settings", "In Settings ‣ Technical ‣ Email Templates"], "answer": 1, "explanation": "Khi chọn form trong editor, panel tùy chỉnh có field Action (Send an E-mail, Create an Opportunity, Create a Customer…) quyết định dữ liệu gửi đi đâu. Không có app Form Builder riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/web_design/building_blocks/form.html"}, {"set": 1, "subject": "Website", "question": "To comply with privacy regulations, a company needs a consent banner for cookies on its website. What should it do?", "options": ["Add a Text building block at the top of each page", "Enable \"Shared Customer Accounts\"", "Install the Social Marketing app", "Enable the \"Cookies Bar\" option in Website settings"], "answer": 3, "explanation": "Bật \"Cookies Bar\" trong Website settings để hiển thị banner xin chấp thuận cookie và có thể tùy chỉnh trong editor. Building block Text không có chức năng ghi nhận lựa chọn của người dùng.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/cookies_bar.html"}, {"set": 1, "subject": "Website", "question": "In a multi-website database, how does Odoo know which website to display to a visitor?", "options": ["From the domain requested by the visitor, matched against the Domain set on each website", "From the visitor's IP country", "From the visitor's browser language", "It always shows the first website; others are reached through a menu"], "answer": 0, "explanation": "Mỗi website có field Domain; Odoo dựa vào domain trong request để chọn website tương ứng. Ngôn ngữ trình duyệt chỉ ảnh hưởng ngôn ngữ hiển thị.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/multi_website.html"}, {"set": 2, "subject": "Website", "question": "A page must be accessible only to visitors who know a specific password. How is this configured?", "options": ["Set Visibility to \"Signed In\"", "In the page properties, set Visibility to \"With Password\" and enter the password", "Unpublish the page", "Remove the page from the menu"], "answer": 1, "explanation": "Page properties có Visibility: All, Signed In, Restricted Group, With Password. \"Signed In\" yêu cầu đăng nhập chứ không phải mật khẩu riêng của trang.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages.html"}, {"set": 2, "subject": "Website", "question": "A company wants a menu item that opens a large dropdown with several columns of links and images. What should be created?", "options": ["A pop-up building block", "A sub-menu with many children", "A Mega Menu", "A new website"], "answer": 2, "explanation": "Mega Menu là dropdown lớn có thể thiết kế bằng building block (nhiều cột, ảnh). Sub-menu thông thường chỉ là danh sách link đơn giản.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages/menus.html"}, {"set": 2, "subject": "Website", "question": "Which statement about sitemap.xml and robots.txt in Odoo 18 is correct?", "options": ["Odoo does not support sitemaps", "The sitemap is regenerated only when a new theme is installed", "Both files must be uploaded manually by a developer", "Odoo generates sitemap.xml automatically, and robots.txt can be edited from Website settings"], "answer": 3, "explanation": "Odoo tự sinh sitemap.xml từ các trang được index và cho phép chỉnh robots.txt trong Website settings (mục SEO). Không cần upload thủ công.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages/seo.html"}, {"set": 2, "subject": "Website", "question": "A company wants an automated chatbot to greet visitors on certain website pages. Where is the chatbot linked to those pages?", "options": ["In the CRM sales team form", "In the Live Chat channel's rules, by selecting the chatbot and the URL regex", "In Website ‣ Configuration ‣ Settings, Cookies Bar", "In the website editor, by adding a Chatbot building block"], "answer": 1, "explanation": "Chatbot tạo trong Live Chat ‣ Configuration ‣ Chatbots và được kích hoạt qua Channel Rules (chọn chatbot, URL regex, điều kiện hiển thị). Không có building block chatbot.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/livechat/chatbots.html"}, {"set": 2, "subject": "Website", "question": "How do you connect Google Analytics to an Odoo website?", "options": ["Enable Plausible and Google is added automatically", "Paste the tracking code in each page's meta description", "Install the Google Analytics app from the Apps menu", "Enable Google Analytics in Website settings and enter the Measurement ID"], "answer": 3, "explanation": "Trong Website ‣ Configuration ‣ Settings, bật Google Analytics và nhập Measurement ID (G-…). Plausible là công cụ phân tích riêng, không liên quan Google.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/reporting/analytics.html"}, {"set": 2, "subject": "Website", "question": "A company wants to change the theme of its existing website in Odoo 18. Where is this done?", "options": ["In the website editor's Theme tab, using \"Switch Theme\"", "In Apps, by uninstalling the website module", "In Website ‣ Configuration ‣ Settings, Default language", "It is not possible after the website is created"], "answer": 0, "explanation": "Tab Theme trong website editor có nút \"Switch Theme\" để đổi theme (lưu ý có thể mất các tùy chỉnh). Gỡ module website sẽ xóa toàn bộ website.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/web_design/themes.html"}, {"set": 2, "subject": "Website", "question": "What can be done from the record of a website visitor in Odoo?", "options": ["Change the website's theme for that visitor only", "See their saved passwords", "See the pages they visited and contact them (e.g. send an email or start a live chat if they are online)", "Assign them a pricelist"], "answer": 2, "explanation": "Bản ghi Visitor cho thấy trang đã xem, quốc gia, lần truy cập cuối… và cho phép gửi email/SMS hoặc chat nếu đang online. Odoo không lưu mật khẩu người dùng dạng xem được.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/reporting/visitors.html"}, {"set": 3, "subject": "Website", "question": "A consultant wants customers to book a meeting with her directly from the website. Which app is needed?", "options": ["Live Chat", "Calendar only, by sharing her Odoo calendar link", "Events, with free tickets", "Appointments, with the appointment type published on the website"], "answer": 3, "explanation": "App Appointments cho phép tạo appointment type, publish lên website để khách tự chọn khung giờ trống. Events dùng cho sự kiện có đăng ký, không phải đặt lịch hẹn 1-1.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/appointments.html"}, {"set": 3, "subject": "Website", "question": "A designer wants to change the font and main colours of the whole website at once. Which part of the website editor is used?", "options": ["The Theme tab", "The Blocks tab", "The Customize tab of a selected block", "Site ‣ Pages"], "answer": 0, "explanation": "Tab Theme chứa thiết lập toàn cục (màu, font, nút, layout). Tab Customize chỉ chỉnh building block đang được chọn.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/web_design/themes.html"}, {"set": 3, "subject": "Website", "question": "The website already has a second language installed. How do you translate the text of a page into that language?", "options": ["Export a .po file from the website editor", "Switch the website to that language and click \"Translate\" to edit the texts inline", "Duplicate the page and rename it with the language code", "Edit the page in the default language; Odoo translates automatically"], "answer": 1, "explanation": "Chuyển sang ngôn ngữ cần dịch trên website rồi bấm Translate để sửa trực tiếp các đoạn văn bản. Nhân bản trang tạo nội dung trùng, không gắn với bản gốc.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/translate.html"}, {"set": 3, "subject": "Website", "question": "In a multi-website database, a landing page must only be shown on one of the websites. What should be done?", "options": ["Unpublish the page", "Set Visibility to \"Restricted Group\"", "Set the Website field of the page to that website", "Remove the page from the sitemap"], "answer": 2, "explanation": "Trang có field Website; chọn website cụ thể thì trang chỉ có trên website đó, để trống thì dùng chung. Unpublish sẽ ẩn trang khỏi tất cả khách truy cập.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/multi_website.html"}, {"set": 3, "subject": "Website", "question": "A thank-you page should stay published but should not appear in search engine results or the sitemap. What should be done?", "options": ["Unpublish the page", "Set Visibility to \"Signed In\"", "Remove its meta description", "Uncheck \"Indexed\" in the page properties"], "answer": 3, "explanation": "Bỏ tick \"Indexed\" giúp trang không bị search engine index và không xuất hiện trong sitemap nhưng vẫn truy cập được. Unpublish thì khách không xem được trang.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages.html"}, {"set": 3, "subject": "Website", "question": "Where do you upload the small icon (favicon) shown in the browser tab for the website?", "options": ["In the company logo field of Settings ‣ Companies", "Website ‣ Configuration ‣ Settings, Favicon field", "In the website editor, Blocks tab", "In Site ‣ Optimize SEO"], "answer": 1, "explanation": "Favicon được upload trong Website settings. Logo công ty hiển thị trên header/báo cáo, không phải favicon.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration.html"}, {"set": 3, "subject": "Website", "question": "A new page has been created but is still unpublished. Who can see it?", "options": ["Only portal users", "Nobody, until it is published", "Only logged-in users with website editing (designer) rights", "All visitors, but it is not listed in the menu"], "answer": 2, "explanation": "Trang chưa publish chỉ hiển thị với user nội bộ có quyền chỉnh sửa website (Restricted Editor/Editor and Designer). Khách truy cập và portal user không xem được.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages.html"}, {"set": 1, "subject": "eCommerce", "question": "A product exists in the Sales app but does not appear in the online shop. What is the most common reason?", "options": ["The product is not published on the website", "The product is not in any pricelist", "The product type is Service", "The product has no internal reference"], "answer": 0, "explanation": "Sản phẩm phải được Publish (nút Unpublished/Published trên trang sản phẩm hoặc field Is Published) mới hiển thị trên shop. Sản phẩm dịch vụ vẫn bán online được.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products.html"}, {"set": 1, "subject": "eCommerce", "question": "A B2B webshop wants customers to always log in before they can complete a purchase. Which Customer Accounts option should be selected?", "options": ["Shared Customer Accounts", "Mandatory (no guest checkout)", "Optional", "Disabled (buy as guest)"], "answer": 1, "explanation": "Customer Accounts có 3 lựa chọn: Optional, Disabled (buy as guest), Mandatory (no guest checkout); Mandatory bắt buộc đăng nhập để checkout. Shared Customer Accounts là tùy chọn multi-website, không liên quan checkout.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/checkout.html"}, {"set": 1, "subject": "eCommerce", "question": "Odoo can automatically email customers who left products in their cart. Which condition applies to these abandoned cart emails?", "options": ["It only works for carts above a minimum amount", "The customer must have paid at least once before", "It requires the Marketing Automation app", "The feature must be enabled with a delay (in hours), and the customer must be identifiable with an email address"], "answer": 3, "explanation": "Bật \"Automatically send abandoned checkout emails\" và đặt thời gian \"Send after\" (mặc định 10 giờ); chỉ gửi được cho khách đã biết email (đăng nhập hoặc đã nhập email). Không cần Marketing Automation.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/performance.html"}, {"set": 1, "subject": "eCommerce", "question": "When a customer adds a laptop to the cart, the shop should propose a warranty extension in a pop-up. Where is the warranty configured?", "options": ["As an Optional Product on the laptop's product form", "In a pricelist rule", "As a product variant of the laptop", "As an Alternative Product"], "answer": 0, "explanation": "Optional Products hiển thị trong pop-up khi thêm sản phẩm vào giỏ. Alternative Products chỉ gợi ý sản phẩm thay thế ở cuối trang sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/cross_upselling.html"}, {"set": 1, "subject": "eCommerce", "question": "A B2C shop must display product prices including taxes. Where is this set in Odoo 18?", "options": ["In the fiscal position of the website", "On each product, in the Sales Price field", "Website ‣ Configuration ‣ Settings, Display Product Prices: Tax Included", "In Accounting ‣ Configuration ‣ Taxes, by ticking \"Included in Price\" on every tax"], "answer": 2, "explanation": "Cài đặt \"Display Product Prices\" (Tax Included/Tax Excluded) trong Website settings quyết định cách hiển thị giá trên shop. Tick \"Included in Price\" trên thuế thay đổi cách tính giá chứ không chỉ là hiển thị.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/checkout.html"}, {"set": 1, "subject": "eCommerce", "question": "A shop wants to test the Stripe checkout flow without charging real cards. What should be done?", "options": ["Use the Wire Transfer provider instead", "Create a pricelist with 0 prices", "Set the payment provider's State to \"Test Mode\" and use the provider's test credentials", "Disable \"Prevent Sale of Zero Priced Product\""], "answer": 2, "explanation": "Payment provider có State: Disabled, Enabled, Test Mode; Test Mode dùng thông tin test để thử thanh toán mà không trừ tiền thật. Wire Transfer không mô phỏng luồng thanh toán Stripe.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/payment_providers.html"}, {"set": 1, "subject": "eCommerce", "question": "Customers on the website should be able to choose between a \"Retail\" and a \"Wholesale\" pricelist. What is needed?", "options": ["Set different fiscal positions on the website", "Enable Pricelists, then make both pricelists available on the website and mark them \"Selectable\"", "Create two product variants with different prices", "Create two websites"], "answer": 1, "explanation": "Khi bật Pricelists, mỗi pricelist có field Website và tùy chọn Selectable để khách tự chọn trên shop. Tạo hai website hay biến thể là không cần thiết.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/price_management.html"}, {"set": 2, "subject": "eCommerce", "question": "An attribute \"Material\" is used on products but must not appear as a filter in the shop sidebar. What should be changed?", "options": ["Set the attribute's eCommerce Filter Visibility to \"Hidden\"", "Delete the attribute from all products", "Unpublish the eCommerce category", "Set the attribute's Variants Creation Mode to \"Never\""], "answer": 0, "explanation": "Attribute có field eCommerce Filter Visibility (Visible/Hidden) quyết định có hiển thị trong bộ lọc shop hay không. Variants Creation Mode chỉ ảnh hưởng việc sinh biến thể.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/catalog.html"}, {"set": 2, "subject": "eCommerce", "question": "What is the difference between a Product Category and an eCommerce Category?", "options": ["They are the same model with different labels", "A product can only have one eCommerce Category", "eCommerce Categories control taxes on the website", "eCommerce Categories organise products on the website shop, while Product Categories are internal (accounting, inventory)"], "answer": 3, "explanation": "eCommerce Category dùng để phân loại và lọc sản phẩm trên shop, một sản phẩm có thể thuộc nhiều category; Product Category là phân loại nội bộ cho kế toán/kho. Chúng là hai model khác nhau.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/catalog.html"}, {"set": 2, "subject": "eCommerce", "question": "A shop wants real-time shipping rates from a carrier displayed at checkout. What is required?", "options": ["Create a delivery method with a Fixed Price for each country", "Enter shipping costs as product variants", "Install and configure the carrier's shipping connector as a delivery method, with the carrier account credentials", "Enable \"Extra Step During Checkout\""], "answer": 2, "explanation": "Shipping connector (FedEx, UPS, DHL, bpost, Easypost…) lấy giá vận chuyển thời gian thực từ hãng qua tài khoản hãng. Phương thức Fixed Price chỉ là giá cố định do mình tự nhập.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/setup_configuration.html"}, {"set": 2, "subject": "eCommerce", "question": "Where are Accessory Products shown to customers in an Odoo 18 shop?", "options": ["In a pop-up when the product is added to the cart", "At the bottom of the product page as alternatives", "Only in the customer portal after purchase", "In the cart review step, as suggested accessories before checkout"], "answer": 3, "explanation": "Accessory Products được gợi ý ở bước xem giỏ hàng (cart). Pop-up khi thêm vào giỏ là Optional Products, còn cuối trang sản phẩm là Alternative Products.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/cross_upselling.html"}, {"set": 2, "subject": "eCommerce", "question": "A shop wants customers to pay with Google Pay or Apple Pay directly from the cart, skipping the address forms. Which feature is used?", "options": ["Express Checkout, enabled on a compatible payment provider (e.g. Stripe) with \"Allow Express Checkout\"", "Extra Step During Checkout", "The \"Buy Now\" button", "Customer Accounts set to Disabled"], "answer": 0, "explanation": "Express Checkout dùng ví điện tử (Google Pay, Apple Pay) để lấy địa chỉ và thanh toán ngay, bật trên provider hỗ trợ bằng \"Allow Express Checkout\". Nút Buy Now chỉ bỏ qua giỏ hàng nhưng vẫn qua các bước checkout.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/payment_providers.html"}, {"set": 2, "subject": "eCommerce", "question": "Customers want to save products for later and compare technical specifications side by side. Which settings should be enabled?", "options": ["Product Variants and Pricelists", "Wishlists and Product Comparison Tool", "Shared Customer Accounts and Cookies Bar", "Optional Products and Accessory Products"], "answer": 1, "explanation": "Wishlists cho phép lưu sản phẩm yêu thích, Product Comparison Tool cho phép so sánh thuộc tính các sản phẩm. Optional/Accessory Products là tính năng bán kèm.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products.html"}, {"set": 2, "subject": "eCommerce", "question": "Which of the following is true about Alternative Products on an Odoo 18 product form?", "options": ["They are shown on the invoice", "They replace the product when it is out of stock", "They are suggested at the bottom of the product page to encourage an upsell or alternative choice", "They are added automatically to the cart with the main product"], "answer": 2, "explanation": "Alternative Products hiển thị ở cuối trang sản phẩm để khách cân nhắc sản phẩm khác (thường cao cấp hơn). Chúng không tự động thêm vào giỏ hay thay thế sản phẩm hết hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/cross_upselling.html"}, {"set": 3, "subject": "eCommerce", "question": "Some products have no sales price and should not be bought online; customers should be invited to contact the company instead. What should be enabled?", "options": ["Prevent Sale of Zero Priced Product (with a contact button URL)", "Unpublish all products with a price of 0", "Extra Step During Checkout", "Customer Accounts: Mandatory"], "answer": 0, "explanation": "\"Prevent Sale of Zero Priced Product\" ẩn nút Add to Cart cho sản phẩm giá 0 và hiển thị nút Contact Us dẫn tới Button Url. Unpublish thì khách không thấy sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/price_management.html"}, {"set": 3, "subject": "eCommerce", "question": "A shop needs customers to fill in additional information (e.g. a comment or purchase order number) during checkout before payment. Which setting is used?", "options": ["Customer Accounts: Optional", "Abandoned Email", "Buy Now", "Extra Step During Checkout"], "answer": 3, "explanation": "\"Extra Step During Checkout\" thêm một bước có form tùy chỉnh trong luồng checkout. Buy Now chỉ cho phép mua ngay, bỏ qua giỏ hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/checkout.html"}, {"set": 3, "subject": "eCommerce", "question": "What does enabling the \"Buy Now\" option do in Odoo 18 eCommerce?", "options": ["Shows the product on the homepage", "Adds a button on the product page that sends the customer directly to checkout, skipping the cart page", "Disables the Add to Cart button", "Lets customers pay later by invoice"], "answer": 1, "explanation": "\"Buy Now\" thêm nút mua ngay trên trang sản phẩm, đưa khách thẳng đến checkout. Nút Add to Cart vẫn còn.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/checkout.html"}, {"set": 3, "subject": "eCommerce", "question": "A wholesaler wants only logged-in users to be able to browse the shop. Which setting should be used?", "options": ["Shared Customer Accounts", "Customer Accounts: Mandatory (no guest checkout)", "Visibility \"Signed In\" on each product page", "eCommerce Access: Logged in users"], "answer": 3, "explanation": "eCommerce Access (All users / Logged in users) giới hạn quyền xem shop. Customer Accounts: Mandatory chỉ bắt đăng nhập lúc checkout, khách vẫn duyệt shop được.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/checkout.html"}, {"set": 3, "subject": "eCommerce", "question": "A shop wants to show a crossed-out reference price next to the sale price, e.g. \"$100\" struck through and \"$80\". What should be enabled?", "options": ["A pricelist with a 20% discount", "Product Reference Price (Comparison Price), then fill \"Compare to Price\" on the product", "Display Product Prices: Tax Included", "Optional Products"], "answer": 1, "explanation": "Bật Product Reference Price/Comparison Price trong Website settings rồi nhập \"Compare to Price\" trên sản phẩm để hiển thị giá gạch ngang. Pricelist giảm giá cũng có thể hiện giá gạch nhưng cần thêm tùy chọn hiển thị chiết khấu, không phải cách trực tiếp nhất.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/price_management.html"}, {"set": 3, "subject": "eCommerce", "question": "A T-shirt costs $20, but the \"XL\" size must cost $3 more on the website. How is this configured?", "options": ["Set an Extra Price of $3 on the \"XL\" attribute value of the product (Attributes & Variants tab)", "Create a delivery method with a $3 surcharge", "Add a $3 tax for the XL size", "Create a separate product \"T-shirt XL\" at $23"], "answer": 0, "explanation": "Mỗi giá trị attribute trên sản phẩm có thể đặt Extra Price cộng vào giá cơ bản của biến thể. Tạo sản phẩm riêng làm mất tính năng chọn biến thể trên cùng trang.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/products/catalog.html"}, {"set": 3, "subject": "eCommerce", "question": "All online orders must be assigned to a specific sales team and salesperson for follow-up. Where is this set?", "options": ["In the payment provider configuration", "On each product form", "Website ‣ Configuration ‣ Settings, Assignment section (Sales Team and Salesperson)", "In CRM Rule-Based Assignment"], "answer": 2, "explanation": "Website settings có mục Assignment để chọn Sales Team và Salesperson mặc định cho đơn hàng online. Rule-Based Assignment của CRM chỉ phân bổ lead/opportunity.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/ecommerce/performance.html"}, {"set": 1, "subject": "Project", "question": "In the Odoo 18 'My Tasks' view, each user can organize the tasks assigned to them in columns such as Inbox, Today, This Week and Later, without affecting how the tasks are staged in their project. What are these columns called?", "options": ["Project stages", "Task states", "Personal stages", "Kanban states"], "answer": 2, "explanation": "Personal stages là các cột riêng của từng user trong My Tasks, không làm thay đổi stage của task trong project. Project stages là stage của chính dự án, không phải của task.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 1, "subject": "Project", "question": "A project manager wants task B to be shown as blocked until task A is finished. What must be activated first?", "options": ["The Task Dependencies setting in Project ‣ Configuration ‣ Settings", "The Milestones setting", "The Sub-tasks tab on the project form", "The Recurring Tasks setting"], "answer": 0, "explanation": "Phải bật Task Dependencies trong Project ‣ Configuration ‣ Settings thì task mới có tab 'Blocked By'. Milestones dùng để đánh dấu mốc tiến độ chứ không chặn task.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 1, "subject": "Project", "question": "When is the next occurrence of a recurring task created in Odoo 18?", "options": ["Immediately when the recurring task is saved, for all future occurrences", "Every night by a scheduled action, whatever the state of the current task", "Only when a user clicks a 'Create next occurrence' button", "When the current occurrence is set to a closed state (Done or Cancelled)"], "answer": 3, "explanation": "Từ Odoo 17/18, lần lặp tiếp theo chỉ được tạo khi task hiện tại chuyển sang trạng thái đóng (Done hoặc Cancelled). Odoo không tạo sẵn tất cả các lần lặp tương lai.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 1, "subject": "Project", "question": "A customer should be able to see the tasks of a shared project in the portal, but must not be able to modify them. Which access mode should be chosen for this collaborator in the Share Project wizard?", "options": ["Edit", "Read", "Edit with limited access", "Invited internal users (private)"], "answer": 1, "explanation": "Chế độ Read cho phép collaborator xem task nhưng không được sửa. Edit và Edit with limited access đều cho phép chỉnh sửa task; 'Invited internal users (private)' là giá trị Visibility, không phải access mode.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/project_management/project_sharing.html"}, {"set": 1, "subject": "Project", "question": "When posting a project update in Odoo 18, which list contains only valid status values?", "options": ["Draft, In Progress, Done, Cancelled", "New, Blocked, Ready, Done", "On Track, At Risk, Off Track, On Hold, Done", "Green, Orange, Red"], "answer": 2, "explanation": "Project update trong Odoo 18 có các status On Track, At Risk, Off Track, On Hold và Done. Các phương án khác là trạng thái của task/đơn hàng hoặc màu sắc, không phải status của project update.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 1, "subject": "Project", "question": "A company wants customers to automatically receive a satisfaction rating request when one of their tasks reaches the 'Delivered' stage. Besides enabling Customer Ratings in the settings, what must be configured?", "options": ["A rating email template on the 'Delivered' stage, with the project's Customer Ratings set to be sent when reaching a given stage", "A survey linked to the project in its Settings tab", "An automation rule with the 'On UI change' trigger", "A milestone linked to the 'Delivered' stage"], "answer": 0, "explanation": "Rating request được gửi khi task tới stage có cấu hình Rating Email Template, và project phải chọn gửi rating 'when reaching a given stage'. Không cần Survey hay automation rule.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 1, "subject": "Project", "question": "A service product 'Website Implementation' must, when its sales order is confirmed, create a new project and one task in it for each order line. Which value should the product's 'Create on Order' field have?", "options": ["Task", "Project & Task", "Project", "Nothing"], "answer": 1, "explanation": "'Project & Task' tạo một project cho đơn hàng và một task cho mỗi dòng SO. 'Project' chỉ tạo project (không tạo task), còn 'Task' tạo task trong một project có sẵn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 2, "subject": "Project", "question": "In Odoo 18, how do you make sub-tasks available in a project?", "options": ["Enable 'Sub-tasks' in Project ‣ Configuration ‣ Settings", "Enable 'Task Dependencies' in the settings", "Convert the project into a project template", "Nothing: sub-tasks are available by default and are added from the parent task's 'Sub-tasks' tab"], "answer": 3, "explanation": "Từ Odoo 17, không còn setting Sub-tasks; sub-task luôn có sẵn trong tab Sub-tasks của task cha. Task Dependencies là tính năng khác (quan hệ chặn giữa các task).", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 2, "subject": "Project", "question": "Task B is blocked by task A through a task dependency, and task A is still in progress. Which state does Odoo 18 display on task B?", "options": ["Waiting", "Changes Requested", "Cancelled", "Approved"], "answer": 0, "explanation": "Khi task bị chặn bởi một task chưa đóng, Odoo tự đặt state là Waiting. Changes Requested và Approved là các state do người dùng chọn thủ công.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 2, "subject": "Project", "question": "Every time a 'Support Incident' service product is sold, a task must be created in the existing 'Support' project, without creating a new project. How should the product be configured?", "options": ["Create on Order: Project, with 'Support' as the project template", "Create on Order: Project & Task, with 'Support' as the project", "Create on Order: Task, with the 'Support' project selected on the product", "Create on Order: Nothing; tasks will come from the project's email alias"], "answer": 2, "explanation": "Giá trị 'Task' tạo task trong project được chọn sẵn trên product. 'Project' và 'Project & Task' đều tạo project mới khi xác nhận SO.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 2, "subject": "Project", "question": "The tasks of a project must be accessible to the customer through the portal. Which Visibility value must the project have?", "options": ["Invited internal users (private)", "Invited portal users and all internal users (public)", "All internal users", "Project manager only"], "answer": 1, "explanation": "Chỉ Visibility 'Invited portal users and all internal users (public)' mới cho phép portal user (khách hàng) truy cập task. Hai lựa chọn còn lại chỉ dành cho internal user.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/project_management/project_sharing.html"}, {"set": 2, "subject": "Project", "question": "A company wants every email sent to support@company.com to automatically create a task in its 'Support' project. Where is this configured?", "options": ["In Discuss ‣ Channels", "In the chatter of an existing task", "Nowhere: only the Helpdesk app can create records from emails", "On the project form (Settings tab), by defining the project's email alias"], "answer": 3, "explanation": "Mỗi project có email alias (tab Settings của project) — email gửi tới alias sẽ tạo task mới. Project hoàn toàn có thể nhận email, không cần Helpdesk.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 2, "subject": "Project", "question": "A manager wants to follow the projects themselves (not the tasks) in a kanban pipeline with columns such as 'To Do', 'In Progress' and 'Done'. What should be enabled?", "options": ["Project Stages in Project ‣ Configuration ‣ Settings", "Personal stages", "Milestones", "Task Dependencies"], "answer": 0, "explanation": "Setting Project Stages cho phép nhóm các project theo stage trong kanban. Personal stages chỉ áp dụng cho task của từng user.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 2, "subject": "Project", "question": "In the Gantt view of Project (Odoo 18 Enterprise), what does a task need in order to be displayed as a bar on the timeline?", "options": ["Allocated time", "A milestone", "A planned date range (start date and deadline)", "At least two assignees"], "answer": 2, "explanation": "Gantt của task dựa trên khoảng ngày kế hoạch (planned start date đến deadline). Task không có ngày sẽ là task chưa lên lịch; allocated time không quyết định vị trí trên timeline.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 3, "subject": "Project", "question": "In Odoo 18, a user creates a task from 'My Tasks' without selecting any project. What happens?", "options": ["The task cannot be saved without a project", "It becomes a private task, visible only to its assignees", "It is automatically added to the 'Internal' project", "It is visible to all internal users"], "answer": 1, "explanation": "Task không có project là private task, chỉ người được giao (assignees) mới thấy. Odoo 18 không bắt buộc project và không tự đưa vào project Internal.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 3, "subject": "Project", "question": "A sales order line uses a service product with the invoicing policy 'Based on Milestones'. What increases the line's delivered quantity so that it can be invoiced?", "options": ["Logging timesheets on the tasks of the milestone", "Confirming the sales order", "Moving all tasks to a folded stage", "Marking the linked milestone as Reached"], "answer": 3, "explanation": "Với chính sách Based on Milestones, delivered quantity được cập nhật khi milestone liên kết được đánh dấu Reached (theo % của milestone). Timesheet chỉ ảnh hưởng chính sách Based on Timesheets.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Project", "question": "When configuring a recurring task in Odoo 18, which options define how long the recurrence lasts?", "options": ["Forever, or Until a given end date", "Only a fixed number of repetitions", "Until the project's deadline only", "Until the related sales order is fully invoiced"], "answer": 0, "explanation": "Trường 'Until' của recurrence có hai lựa chọn: Forever hoặc Until (kèm End Date). Odoo 18 không còn tùy chọn số lần lặp cố định.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 3, "subject": "Project", "question": "Which Project report shows the evolution over time of the number of tasks in each stage?", "options": ["Tasks Analysis", "Customer Ratings", "Burndown Chart", "Project Updates"], "answer": 2, "explanation": "Project ‣ Reporting ‣ Burndown Chart hiển thị số lượng task theo stage theo thời gian. Tasks Analysis là báo cáo phân tích tổng hợp, không thể hiện diễn biến theo stage qua thời gian.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 3, "subject": "Project", "question": "A customer contact was added as collaborator of a shared project with the access mode 'Edit with limited access'. What can they do in the portal?", "options": ["Only read tasks, without editing them", "View and edit only the tasks they follow", "View and edit all tasks of the project, and choose which ones to follow", "Edit the project's stages and settings"], "answer": 1, "explanation": "'Edit with limited access' chỉ cho phép xem và sửa các task mà collaborator đang follow. Quyền xem/sửa mọi task là chế độ Edit.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/project_management/project_sharing.html"}, {"set": 3, "subject": "Project", "question": "A task has 10 hours of Allocated Time and 8 hours of timesheets logged on it. Its progress shows 80%. Where does this progress come from?", "options": ["Hours recorded in timesheets on the task compared with its allocated time", "The percentage of closed sub-tasks", "The position of the task's stage in the pipeline", "The percentage of the linked milestone"], "answer": 0, "explanation": "Progress của task = giờ timesheet đã ghi / Allocated Time. Số sub-task đã đóng hay vị trí stage không ảnh hưởng đến chỉ số này.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project/tasks.html"}, {"set": 3, "subject": "Project", "question": "Every project created from a sales order for the service 'Onboarding Package' must start with the same predefined stages and tasks. What should be configured on the product?", "options": ["A recurring task on the product", "The Project Stages setting", "A milestone on the product", "The 'Project Template' field, pointing to a template project"], "answer": 3, "explanation": "Trường Project Template trên product (khi Create on Order là Project hoặc Project & Task) sẽ sao chép project mẫu với stage và task có sẵn. Setting Project Stages chỉ bật stage cho project, không tạo nội dung mẫu.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 1, "subject": "Timesheets", "question": "A consulting firm wants its employees to record their time in days instead of hours. Where is this configured?", "options": ["Employees ‣ Configuration ‣ Working Schedules", "Timesheets ‣ Configuration ‣ Settings, Time Encoding section: Encoding Method = Days", "On each project, in a Unit of Measure field", "Inventory ‣ Configuration ‣ Units of Measure"], "answer": 1, "explanation": "Encoding Method (Hours/Days) được cấu hình trong Timesheets ‣ Configuration ‣ Settings, mục Time Encoding. Working Schedules định nghĩa giờ làm việc, không đổi đơn vị nhập timesheet.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 1, "subject": "Timesheets", "question": "In the Timesheets settings, 'Minimal Duration' is 15 minutes and 'Round up' is 15 minutes. An employee starts the timer on a task and stops it after 7 minutes. How much time is recorded?", "options": ["7 minutes", "Nothing: the entry is discarded", "10 minutes", "15 minutes"], "answer": 3, "explanation": "Thời gian dưới Minimal Duration được nâng lên mức tối thiểu (15 phút) rồi làm tròn lên theo bội số Round up, nên ghi nhận 15 phút. Timer không bỏ qua bản ghi ngắn.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 1, "subject": "Timesheets", "question": "A service product is sold with the invoicing policy 'Based on Timesheets'. Which quantity of the sales order line is invoiced?", "options": ["The delivered quantity, computed from the timesheets logged on the tasks linked to the line", "The ordered quantity, as soon as the order is confirmed", "The allocated time of the related task", "A quantity entered manually on the invoice"], "answer": 0, "explanation": "Với Based on Timesheets, delivered quantity của dòng SO được tính từ timesheet ghi trên task liên kết và đó là số lượng được xuất hóa đơn. Ordered quantity chỉ áp dụng cho Prepaid/Fixed Price.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 1, "subject": "Timesheets", "question": "What is the main consequence for an employee once their timesheets have been validated?", "options": ["They are automatically invoiced to the customer", "They disappear from the grid view", "The employee can no longer modify them; only users with higher Timesheets rights can", "They are converted into time off"], "answer": 2, "explanation": "Sau khi validate, timesheet bị khóa với nhân viên thường; chỉ người có quyền cao hơn (ví dụ Administrator) mới sửa được. Validate không tự tạo hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 1, "subject": "Timesheets", "question": "Which automatic reminders can be enabled in Timesheets ‣ Configuration ‣ Settings?", "options": ["Customer Reminder and Invoice Reminder", "Employee Reminder and Approver Reminder", "Project Deadline Reminder and Task Reminder", "Only an overtime reminder"], "answer": 1, "explanation": "Timesheets có Employee Reminder (nhắc nhân viên nhập timesheet) và Approver Reminder (nhắc người duyệt validate), mỗi loại có tần suất và số ngày riêng.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 1, "subject": "Timesheets", "question": "Time Off and Timesheets are both installed. What happens when an employee's time off request is validated?", "options": ["Nothing: the absence must be logged manually in Timesheets", "A negative timesheet is created on the employee's projects", "An activity is created for the manager to encode the absence", "Timesheets are generated automatically on the configured time off task (by default the 'Time Off' task of the 'Internal' project)"], "answer": 3, "explanation": "Khi time off được duyệt, Odoo tự tạo timesheet trên task Time Off của project Internal (cấu hình trong Timesheets settings), giúp bảng chấm công đầy đủ mà không cần nhập tay.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 2, "subject": "Timesheets", "question": "From a technical and accounting point of view, what is a timesheet entry in Odoo?", "options": ["An analytic line posted on the analytic account of the project", "A journal entry in the miscellaneous journal", "A calendar event", "An attendance record"], "answer": 0, "explanation": "Mỗi timesheet là một analytic line (account.analytic.line) trên analytic account của project, nên chi phí thời gian được phản ánh trong analytic accounting. Nó không tạo journal entry.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 2, "subject": "Timesheets", "question": "A customer buys a 'Support Pack - 20 hours' that must be invoiced in full immediately, regardless of the time actually spent, while the team still logs its time on tasks. Which invoicing policy fits the product?", "options": ["Based on Timesheets", "Based on Milestones", "Prepaid/Fixed Price", "Based on Delivered Quantity (Manual)"], "answer": 2, "explanation": "Prepaid/Fixed Price xuất hóa đơn theo ordered quantity ngay khi SO xác nhận, timesheet chỉ dùng để theo dõi. Based on Timesheets sẽ chỉ xuất hóa đơn số giờ thực tế đã ghi.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 2, "subject": "Timesheets", "question": "A company wants only timesheets that have been validated to be invoiced (and shown in the customer portal). Which setting achieves this?", "options": ["Encoding Method: Days", "Timesheets Invoicing: Validated timesheets only (Timesheets settings)", "Approver Reminder", "Project visibility set to private"], "answer": 1, "explanation": "Setting Timesheets Invoicing có hai lựa chọn: All recorded timesheets hoặc Validated timesheets only; lựa chọn sau chỉ xuất hóa đơn và hiển thị trên portal các timesheet đã validate.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 2, "subject": "Timesheets", "question": "A technician starts the timer on a Field Service task and stops it when the intervention is finished. What does Odoo create?", "options": ["An attendance record", "An expense", "A scheduled activity", "A timesheet entry on the task, in its Field Service project"], "answer": 3, "explanation": "Timer trên task Field Service tạo timesheet trên task đó (project Field Service bật Timesheets sẵn). Attendance là chấm công vào/ra, không gắn với task.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/field_service.html"}, {"set": 2, "subject": "Timesheets", "question": "A support team wants to log timesheets directly on Helpdesk tickets. What must be done?", "options": ["Enable Timesheets on the Helpdesk team and select the project in which the tickets' timesheets are recorded", "Create one project per ticket", "Enable timesheets in Helpdesk without any project, since tickets store time themselves", "Convert each ticket into a task"], "answer": 0, "explanation": "Bật Timesheets trên helpdesk team và chọn một project; timesheet của ticket sẽ được ghi vào project này (vì timesheet luôn là analytic line gắn với project).", "ref": "https://www.odoo.com/documentation/18.0/applications/services/helpdesk.html"}, {"set": 2, "subject": "Timesheets", "question": "Where is the cost used to value an employee's timesheets (for example in project profitability) defined?", "options": ["On the project's Invoicing tab", "In the cost of the service product sold", "In the Hourly Cost field on the employee form", "In the employee's working schedule"], "answer": 2, "explanation": "Chi phí timesheet = số giờ x Hourly Cost trên form nhân viên. Giá trên dòng SO là giá bán (doanh thu), không phải chi phí.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 3, "subject": "Timesheets", "question": "In a project invoiced based on timesheets, each consultant must be billed at a different hourly rate. How is this configured?", "options": ["Create one project per consultant", "On the project's Invoicing tab, map each employee to a specific Sales Order Item", "Change each employee's Hourly Cost", "Assign each consultant a different working schedule"], "answer": 1, "explanation": "Bảng mapping employee - Sales Order Item ở tab Invoicing của project cho phép mỗi nhân viên dùng một dòng SO (đơn giá) riêng. Hourly Cost là chi phí nội bộ, không phải giá bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Timesheets", "question": "An employee cannot record time on a specific project from the Timesheets app. What is the most likely cause?", "options": ["The project has no customer", "The project has no milestones", "The project is not billable", "The Timesheets option is not enabled on the project"], "answer": 3, "explanation": "Chỉ project đã bật Timesheets mới cho phép ghi timesheet. Project không có customer hay không billable vẫn ghi timesheet được (chỉ là không xuất hóa đơn).", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 3, "subject": "Timesheets", "question": "When creating an invoice from a sales order whose lines are invoiced based on timesheets, how can you invoice only the timesheets of last month?", "options": ["Set the Timesheets Period (start and end date) in the Create Invoice wizard", "Archive the older timesheets", "Change the product's invoicing policy to Prepaid/Fixed Price", "Delete the timesheets of the other months"], "answer": 0, "explanation": "Wizard Create Invoice cho phép chọn khoảng ngày Timesheets Period để chỉ xuất hóa đơn timesheet trong khoảng đó. Archive hay xóa timesheet làm mất dữ liệu và không phải cách đúng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Timesheets", "question": "Which option must be enabled on a project so that its tasks and timesheets can be linked to sales order items and invoiced?", "options": ["Customer Ratings", "Recurring Tasks", "Billable", "Task Dependencies"], "answer": 2, "explanation": "Tùy chọn Billable trên project cho phép gắn Sales Order Item vào task/timesheet để xuất hóa đơn. Các tùy chọn còn lại không liên quan đến invoicing.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 3, "subject": "Timesheets", "question": "What is the minimum Timesheets access right a user needs to validate the timesheets of other employees?", "options": ["User: own timesheets only", "User: all timesheets", "Administrator", "No specific right: any employee can validate"], "answer": 1, "explanation": "Quyền 'User: all timesheets' (approver) đủ để validate timesheet của nhân viên khác. 'User: own timesheets only' chỉ xem/ghi timesheet của chính mình; Administrator thì vượt mức tối thiểu.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 3, "subject": "Timesheets", "question": "A timesheet linked to a sales order line has already been invoiced. An employee then tries to change its duration. What happens?", "options": ["The invoice is updated automatically", "A credit note is generated automatically", "The change is saved and a new invoice line is added", "Odoo blocks the change because the timesheet is already invoiced"], "answer": 3, "explanation": "Odoo báo lỗi không cho sửa timesheet đã được xuất hóa đơn để đảm bảo khớp với hóa đơn. Odoo không tự cập nhật hóa đơn hay tạo credit note.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/time_materials.html"}, {"set": 1, "subject": "HR", "question": "An employee is assigned to a department that has a manager. What happens to the employee's Manager field?", "options": ["Nothing: it must always be filled manually", "The department manager is set as Coach only", "It is automatically filled with the department's manager (and can still be changed)", "The employee becomes the department manager"], "answer": 2, "explanation": "Khi chọn Department, Manager của nhân viên tự lấy theo manager của phòng ban và vẫn có thể sửa. Coach là trường riêng, không tự điền theo cách này.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 1, "subject": "HR", "question": "In Odoo 18, an employee has no fixed start and end times but must work 40 hours per week. How should their working schedule be configured?", "options": ["Enable 'Flexible Hours' on the working schedule and set the required number of hours", "Remove the working schedule from the employee", "Create a dedicated time off type", "Set the schedule's Average Hour per Day to 0"], "answer": 0, "explanation": "Odoo 18 có tùy chọn Flexible Hours trên working schedule, chỉ cần định nghĩa tổng số giờ thay vì khung giờ cố định. Bỏ trống working schedule sẽ làm sai tính toán time off/attendance.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 1, "subject": "HR", "question": "A company wants employees to automatically earn 1.5 days of paid leave for each month worked. What should be used?", "options": ["A regular allocation renewed manually every month", "A time off type with 'Requires allocation: No Limit'", "Public holidays", "An accrual plan, used in an allocation of type Accrual"], "answer": 3, "explanation": "Accrual plan (Time Off ‣ Configuration ‣ Accrual Plans) tự cộng dồn ngày phép theo chu kỳ khi dùng trong allocation loại Accrual. Allocation thường phải cấp tay, còn No Limit thì không theo dõi số dư.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 1, "subject": "HR", "question": "A time off type must first be approved by the employee's manager and then by HR. Which 'Time Off Validation' value should be selected?", "options": ["By Time Off Officer", "By Employee's Approver and Time Off Officer", "By Employee's Approver", "No Validation"], "answer": 1, "explanation": "'By Employee's Approver and Time Off Officer' yêu cầu hai cấp duyệt: người duyệt của nhân viên rồi đến Time Off Officer. Các lựa chọn khác chỉ có một cấp hoặc không duyệt.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 1, "subject": "HR", "question": "Recruiters want a standard interview questionnaire to be used for a given job position. What should they do?", "options": ["Enable 360 Feedback in the Appraisals settings", "Configure skills on the job position", "Enable 'Interview Forms' in the Recruitment settings, then select a form on the job position", "Publish an eLearning course"], "answer": 2, "explanation": "Setting Interview Forms (dùng app Surveys) cho phép gắn form phỏng vấn vào job position để dùng cho applicant. 360 Feedback thuộc Appraisals, không phải Recruitment.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/recruitment.html"}, {"set": 1, "subject": "HR", "question": "An employee pays a business expense with the company's credit card. Which value should the expense's 'Paid By' field have?", "options": ["Company", "Employee (to reimburse)", "Customer", "Vendor"], "answer": 0, "explanation": "Chi phí trả bằng thẻ công ty chọn Paid By = Company nên không cần hoàn tiền cho nhân viên. 'Employee (to reimburse)' dùng khi nhân viên tự trả và cần được hoàn lại.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/expenses.html"}, {"set": 1, "subject": "HR", "question": "Which of the following is NOT an available Attendance Mode for the Attendances kiosk in Odoo 18?", "options": ["Barcode / RFID", "Barcode / RFID and Manual Selection", "Manual Selection", "Facial Recognition"], "answer": 3, "explanation": "Kiosk Odoo 18 có ba chế độ: Barcode / RFID, Barcode / RFID and Manual Selection và Manual Selection. Không có chế độ nhận diện khuôn mặt.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/attendances.html"}, {"set": 1, "subject": "HR", "question": "HR wants appraisals to be scheduled automatically a few months after an employee's arrival and then periodically (for example every 12 months). Where is this configured?", "options": ["Only manually, through each employee's next appraisal date", "In Appraisals ‣ Configuration ‣ Settings, in the Appraisals Plans section", "In a Time Off accrual plan", "On the job position in Recruitment"], "answer": 1, "explanation": "Mục Appraisals Plans trong Appraisals settings định nghĩa số tháng sau khi tuyển dụng và chu kỳ đánh giá tiếp theo để tự động lên lịch appraisal. Không cần nhập tay từng nhân viên.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/appraisals.html"}, {"set": 2, "subject": "HR", "question": "HR wants to record each employee's language levels (A1 to C2) and track their progression. How should this be done?", "options": ["Use employee tags", "Use the Job Position field", "This is only possible with a custom field created in Studio", "Create a skill type 'Languages' with its skills and skill levels, then add skills on the employee's Resume tab"], "answer": 3, "explanation": "Employees ‣ Configuration ‣ Skill Types cho phép định nghĩa skill và các level kèm tỉ lệ tiến độ, sau đó gán cho nhân viên ở tab Resume. Tags không có khái niệm level.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 2, "subject": "HR", "question": "Which field determines where an employee appears in the organization chart?", "options": ["Manager", "Coach", "Department only", "Job Position"], "answer": 0, "explanation": "Org chart dựa trên trường Manager (quan hệ cấp trên - cấp dưới). Coach chỉ là người hướng dẫn, không quyết định vị trí trong sơ đồ.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 2, "subject": "HR", "question": "Employees should be able to request additional days for the time off type 'Compensatory Days' themselves. Which option must be set on that time off type (which requires allocation)?", "options": ["Requires allocation: No Limit", "Kind of Time Off: Worked Time", "Employee Requests: Extra Days Requests Allowed", "Approval: No Validation"], "answer": 2, "explanation": "Employee Requests = 'Extra Days Requests Allowed' cho phép nhân viên tự gửi yêu cầu allocation. Approval chỉ quy định mức duyệt, không bật khả năng yêu cầu.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 2, "subject": "HR", "question": "What makes a recruitment stage the one in which applicants are considered hired?", "options": ["The stage is folded in the kanban view", "The 'Hired Stage' checkbox is enabled on the stage", "It is the last stage in the sequence", "An email template is set on the stage"], "answer": 1, "explanation": "Checkbox Hired Stage đánh dấu stage tuyển dụng thành công (cập nhật ngày tuyển và số lượng tuyển). Vị trí cuối hay folded không quyết định điều này.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/recruitment.html"}, {"set": 2, "subject": "HR", "question": "A consultant pays travel costs during a customer project, and the company wants to re-invoice the customer for the actual amount spent. What should be configured?", "options": ["Set the expense category's Re-Invoice Costs to 'Sales price'", "Set Paid By to 'Company'", "Log the amount as a timesheet", "Set the expense category's Re-Invoice Costs to 'At cost' and link the expense to the customer's sales order"], "answer": 3, "explanation": "Re-Invoice Costs = 'At cost' xuất hóa đơn đúng số tiền thực chi, kèm liên kết expense với SO của khách (Customer to Reinvoice). 'Sales price' sẽ dùng giá bán cố định của category.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/expenses.html"}, {"set": 2, "subject": "HR", "question": "A company does not want small amounts of extra time (for example under 10 minutes per day) to be counted as overtime in Attendances. Which setting should be used?", "options": ["Tolerance Time In Favor Of Company", "Tolerance Time In Favor Of Employee", "Employee PIN Identification", "Attendance From Systray"], "answer": 0, "explanation": "Tolerance Time In Favor Of Company bỏ qua phần làm thêm nhỏ hơn ngưỡng (lợi cho công ty). Tolerance Time In Favor Of Employee là bỏ qua phần làm thiếu (lợi cho nhân viên).", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/attendances.html"}, {"set": 2, "subject": "HR", "question": "A fleet manager wants to be warned before vehicle contracts expire. Where is the delay for this alert configured?", "options": ["On the vehicle's odometer log", "In Fleet ‣ Configuration ‣ Models", "In the Fleet settings (number of days before the contract end date)", "On each driver's employee form"], "answer": 2, "explanation": "Fleet ‣ Configuration ‣ Settings có tham số số ngày cảnh báo trước khi hợp đồng xe hết hạn (mặc định 30 ngày). Models chỉ khai báo mẫu xe.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/fleet.html"}, {"set": 2, "subject": "HR", "question": "Where are public holidays configured so that they are not deducted from employees' time off?", "options": ["On each employee's form", "Time Off ‣ Configuration ‣ Public Holidays", "In the Calendar app", "In the Accrual Plans"], "answer": 1, "explanation": "Public Holidays được khai báo tại Time Off ‣ Configuration ‣ Public Holidays và tự loại khỏi số ngày nghỉ bị trừ. Calendar app chỉ là lịch họp.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 3, "subject": "HR", "question": "Which users can see the Private Information tab on other employees' records?", "options": ["Users with the Employees access right 'Officer: Manage all employees' or higher", "All internal users", "Only the employee's coach", "Portal users"], "answer": 0, "ex
