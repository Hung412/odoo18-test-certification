      <div class="grp">${S.cur<S.order.length-1?`<button class="btn primary" id="next">Câu sau →</button>`:`<button class="btn primary" id="end">Nộp bài</button>`}</div>
    </div>`;
  document.querySelectorAll(".choice input").forEach(r=>r.onchange=()=>{ S.ans[id]=+r.value; save(); drawQ(); });
  document.getElementById("flag").onclick=()=>{ S.flags[id]=!S.flags[id]; if(!S.flags[id]) delete S.flags[id]; save(); drawQ(); };
  document.getElementById("clear").onclick=()=>{ delete S.ans[id]; save(); drawQ(); };
  document.getElementById("prev").onclick=()=>go(-1);
  const nx = document.getElementById("next"); if(nx) nx.onclick=()=>go(1);
  const en = document.getElementById("end"); if(en) en.onclick=confirmSubmit;
  drawRail();
}
function go(d){ const n = S.cur+d; if(n>=0 && n<S.order.length){ S.cur=n; save(); drawQ(); window.scrollTo({top:0}); } }
function drawRail(){
  const nA = Object.keys(S.ans).length, nF = Object.keys(S.flags).length;
  document.getElementById("cA").textContent = nA;
  document.getElementById("cU").textContent = S.order.length-nA;
  document.getElementById("cF").textContent = nF;
  document.getElementById("prog").style.width = (nA/S.order.length*100)+"%";
  document.querySelectorAll("#grid button").forEach((b,i)=>{
    const id = S.order[i];
    b.className = (S.ans[id]!==undefined?"ans ":"")+(S.flags[id]?"flag ":"")+(i===S.cur?"cur":"");
  });
}
function confirmSubmit(){
  const nA = Object.keys(S.ans).length, nU = S.order.length-nA, nF = Object.keys(S.flags).length;
  const m = document.createElement("div"); m.className="modal";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h3 id="mt">Nộp bài?</h3>
    <p style="margin:0">Bạn đã trả lời <b>${nA}/${S.order.length}</b> câu${nU?`, còn <b>${nU}</b> câu bỏ trống (0 điểm)`:""}${nF?`, <b>${nF}</b> câu đang đánh dấu xem lại`:""}. Còn ${fmt((S.end-Date.now())/1000)}.</p>
    <p style="margin:0;color:var(--muted);font-size:13px">Sau khi nộp không thể sửa đáp án.</p>
    <div class="row"><button class="btn" id="mno">Tiếp tục làm bài</button><button class="btn primary" id="myes">Nộp bài</button></div></div>`;
  document.body.appendChild(m);
  document.getElementById("mno").focus();
  document.getElementById("mno").onclick=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  document.getElementById("myes").onclick=()=>{ m.remove(); clearInterval(tick); finish(S, false); };
}
document.addEventListener("keydown", e=>{
  if(!S || !document.getElementById("qcard") || document.querySelector(".modal")) return;
  if(e.target.matches("input[type=text],select,textarea")) return;
  const id = S.order[S.cur], k = e.key.toUpperCase();
  if(KEYS.includes(k) && k.length===1){ S.ans[id] = S.perm[id][KEYS.indexOf(k)]; save(); drawQ(); }
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(k==="F"){ S.flags[id]=!S.flags[id]; if(!S.flags[id]) delete S.flags[id]; save(); drawQ(); }
  else if(e.key==="Delete"||e.key==="Backspace"){ delete S.ans[id]; save(); drawQ(); }
});

/* ================= RESULTS ================= */
function grade(st){
  const rows = st.order.map((id,i)=>{
    const q = QBANK[id], a = st.ans[id];
    const r = a===undefined ? "u" : (a===q.answer ? "c" : "w");
    return {i, id, q, a, r, flag:!!st.flags[id]};
  });
  const c = rows.filter(x=>x.r==="c").length, w = rows.filter(x=>x.r==="w").length, u = rows.length-c-w;
  const pts = c - 0.5*w, pct = Math.max(0, pts/rows.length*100);
  return {rows,c,w,u,pts,pct,pass:pct>=PASS*100};
}
function finish(st, timeout){
  const used = Math.min(durOf(st.set), (Math.min(Date.now(), st.end) - st.start)/1000);
  const g = grade(st);
  const at = Date.now();
  const hist = store.get("o18_hist") || [];
  hist.push({set:st.set, at, pct:g.pct, pts:g.pts, c:g.c, w:g.w, u:g.u, used, timeout});
  store.set("o18_hist", hist.slice(-300));
  saveAttempt({at, set:st.set, used, timeout,
    order: st.order.map(id=>qkey(QBANK[id])),
    perm: Object.fromEntries(st.order.map(id=>[qkey(QBANK[id]), st.perm[id]])),
    ans: Object.fromEntries(Object.entries(st.ans).map(([id,a])=>[qkey(QBANK[id]), a])),
    flags: Object.keys(st.flags).map(id=>qkey(QBANK[id]))});
  store.del("o18_active");
  S = null; renderResults({st, g, used, timeout, at});
}

/* ================= HISTORY ================= */
// Chi tiết bài làm lưu riêng ("o18_attempts"); "o18_hist" chỉ giữ tóm tắt điểm
function saveAttempt(rec){
  let list = (store.get("o18_attempts") || []).concat(rec).slice(-150);
  while(list.length){
    try{ localStorage.setItem("o18_attempts", JSON.stringify(list)); return; }
    catch(e){ if(list.length === 1) return; list = list.slice(1); } // đầy bộ nhớ: bỏ bài cũ nhất rồi thử lại
  }
}
function openAttempt(at){
  const rec = (store.get("o18_attempts") || []).find(r=>r.at===at);
  if(!rec) return;
  const ids = rec.order.map(k=>KIDX.get(k)).filter(i=>i!==undefined); // bỏ qua câu đã bị xóa khỏi đề
  const st = {set:rec.set, order:ids,
    perm: Object.fromEntries(ids.map(i=>[i, rec.perm[qkey(QBANK[i])] || [0,1,2,3]])),
    ans: Object.fromEntries(ids.filter(i=>rec.ans[qkey(QBANK[i])]!==undefined).map(i=>[i, rec.ans[qkey(QBANK[i])]])),
    flags: Object.fromEntries(ids.filter(i=>rec.flags.includes(qkey(QBANK[i]))).map(i=>[i, true]))};
  renderResults({st, g:grade(st), used:rec.used, timeout:rec.timeout, at, fromHist:true});
}
function renderHistory(setFilter=""){
  clearInterval(tick);
  window.scrollTo({top:0});
  const hist = (store.get("o18_hist") || []).slice().reverse();
  const detail = new Set((store.get("o18_attempts") || []).map(r=>r.at));
  const list = hist.filter(h=>!setFilter || h.set===+setFilter);
  const passN = list.filter(h=>h.pct>=PASS*100).length;
  const avg = list.length ? list.reduce((a,h)=>a+h.pct,0)/list.length : 0;
  const best = list.length ? Math.max(...list.map(h=>h.pct)) : 0;
  app.innerHTML = `<div class="wrap res">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
      <div><span class="label">Lịch sử</span><h2 style="font-size:28px">Lịch sử làm bài</h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="home">Về trang chọn đề</button>${hist.length?`<button class="btn danger" id="clearall">Xóa toàn bộ lịch sử</button>`:""}</div>
    </div>
    <div class="filters">
      <label for="setf" class="label">Đề</label>
      <select id="setf"><option value="">Tất cả các đề</option>${FORMATS.flatMap(f=>f.sets.map(n=>`<option value="${n}" ${+setFilter===n?"selected":""}>Đề ${n} · ${f.name.toLowerCase()}</option>`)).join("")}</select>
    </div>
    <div class="stats" style="margin-top:0">
      <div class="stat"><span class="label">Số lần thi</span><b>${list.length}</b></div>
      <div class="stat c"><span class="label">Số lần đạt</span><b>${passN}</b></div>
      <div class="stat"><span class="label">Điểm trung bình</span><b>${num(avg)}%</b></div>
      <div class="stat"><span class="label">Cao nhất</span><b>${num(best)}%</b></div>
    </div>
    ${list.length ? `<div class="tablewrap"><table>
      <thead><tr><th>Thời điểm nộp</th><th>Đề</th><th class="n">Điểm</th><th class="n">Tỉ lệ</th><th>Kết quả</th><th class="n">Đúng</th><th class="n">Sai</th><th class="n">Bỏ trống</th><th class="n">Thời gian</th><th></th></tr></thead>
      <tbody>${list.map(h=>`<tr>
        <td class="mono">${dtfmt(h.at)}</td>
        <td>Đề ${h.set} <span style="color:var(--muted)">· ${fmtOf(h.set).minutes}′</span></td>
        <td class="n">${num(h.pts)}/${h.c+h.w+h.u}</td>
        <td class="n"><span class="pct ${h.pct>=PASS*100?"ok":"bad"}">${num(h.pct)}%</span></td>
        <td><span class="pill ${h.pct>=PASS*100?"c":"w"}">${h.pct>=PASS*100?"Đạt":"Chưa đạt"}</span></td>
        <td class="n">${h.c}</td><td class="n">${h.w}</td><td class="n">${h.u}</td>
        <td class="n">${h.used!==undefined?fmt(h.used):"–"}</td>
        <td style="white-space:nowrap">${detail.has(h.at)?`<button class="btn" data-open="${h.at}">Xem lại</button>`:`<span style="color:var(--muted);font-size:12px">Không có chi tiết</span>`}
          <button class="btn" data-del="${h.at}" aria-label="Xóa lần thi này">Xóa</button></td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="empty">Chưa có lần thi nào${setFilter?" cho đề này":""}. Nộp bài xong, kết quả sẽ tự lưu vào đây.</div>`}
    <p class="foot">Lịch sử lưu trong trình duyệt này (localStorage): giữ tối đa 300 lần thi, trong đó 150 lần gần nhất xem lại được từng câu. Xóa dữ liệu trình duyệt hoặc dùng cửa sổ ẩn danh sẽ mất lịch sử.</p>
  </div>`;
  document.getElementById("home").onclick = renderStart;
  document.getElementById("setf").onchange = e => renderHistory(e.target.value);
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openAttempt(+b.dataset.open));
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>askConfirm("Xóa lần thi này?", "Kết quả và chi tiết bài làm của lần thi này sẽ bị xóa, không khôi phục được.", "Xóa", ()=>{
    const at = +b.dataset.del;
    store.set("o18_hist", (store.get("o18_hist")||[]).filter(h=>h.at!==at));
    store.set("o18_attempts", (store.get("o18_attempts")||[]).filter(r=>r.at!==at));
    renderHistory(setFilter);
  }));
  const ca = document.getElementById("clearall");
  if(ca) ca.onclick = () => askConfirm("Xóa toàn bộ lịch sử?", `Toàn bộ ${hist.length} lần thi sẽ bị xóa, không khôi phục được.`, "Xóa hết", ()=>{
    store.del("o18_hist"); store.del("o18_attempts"); renderHistory();
  });
}
function askConfirm(title, text, okLabel, onOk){
  const m = document.createElement("div"); m.className="modal";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="ct">
    <h3 id="ct">${esc(title)}</h3><p style="margin:0">${esc(text)}</p>
    <div class="row"><button class="btn" id="cno">Hủy</button><button class="btn danger" id="cyes">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(m);
  document.getElementById("cno").focus();
  document.getElementById("cno").onclick = () => m.remove();
  m.onclick = e => { if(e.target===m) m.remove(); };
  document.getElementById("cyes").onclick = () => { m.remove(); onOk(); };
}

function renderResults({st, g, used, timeout, at, fromHist}){
  window.scrollTo({top:0});
  const total = g.rows.length;
  const bySub = {};
  for(const r of g.rows){ const s = bySub[r.q.subject] ||= {n:0,c:0,w:0,u:0}; s.n++; s[r.r]++; }
  const subs = SUBJECT_ORDER.filter(s=>bySub[s]).concat(Object.keys(bySub).filter(s=>!SUBJECT_ORDER.includes(s)));
  const weak = subs.map(s=>({s, p:(bySub[s].c-0.5*bySub[s].w)/bySub[s].n})).sort((a,b)=>a.p-b.p).slice(0,3);
  app.innerHTML = `<div class="wrap res">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
      <div><span class="label">Kết quả · Đề ${st.set} (${fmtOf(st.set).name.toLowerCase()})${at?` · nộp lúc ${dtfmt(at)}`:""}${timeout?" · hết giờ, tự động nộp":""}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="home">Về trang chọn đề</button><button class="btn" id="tohist">${fromHist?"← Về lịch sử":"Lịch sử làm bài"}</button><button class="btn primary" id="again">Thi lại Đề ${st.set}</button></div>
    </div>
    <div class="score">
      <div class="verdict ${g.pass?"pass":"fail"}"><div><b class="mono">${num(g.pct)}%</b><span>${g.pass?"ĐẠT":"CHƯA ĐẠT"}</span></div></div>
      <div style="min-width:0">
        <h2>${g.pass?"Chúc mừng, bạn đã vượt ngưỡng 70%.":"Chưa đạt ngưỡng 70%."}</h2>
        <div class="stats">
          <div class="stat"><span class="label">Điểm</span><b>${num(g.pts)} / ${total}</b></div>
          <div class="stat c"><span class="label">Đúng</span><b>${g.c}</b></div>
          <div class="stat w"><span class="label">Sai</span><b>${g.w}</b></div>
          <div class="stat u"><span class="label">Bỏ trống</span><b>${g.u}</b></div>
          <div class="stat"><span class="label">Thời gian</span><b>${fmt(used)}</b></div>
        </div>
        <div class="stack" title="Đúng / Sai / Bỏ trống"><i class="c" style="width:${g.c/total*100}%"></i><i class="w" style="width:${g.w/total*100}%"></i></div>
        <p class="formula">Điểm = ${g.c} × 1 − ${g.w} × 0,5 + ${g.u} × 0 = <b>${num(g.pts)}</b>. Cần ≥ ${num(total*PASS)} điểm (70%) để đạt.
        ${weak.length?`<br>Nên ôn thêm: <b>${weak.map(x=>esc(x.s)).join(", ")}</b>.`:""}</p>
      </div>
    </div>
    <div class="sec"><h3>Thống kê theo phân hệ</h3>
      <div class="tablewrap"><table>
        <thead><tr><th>Phân hệ</th><th class="n">Số câu</th><th class="n">Đúng</th><th class="n">Sai</th><th class="n">Bỏ trống</th><th class="n">Điểm</th><th>Tỉ lệ</th></tr></thead>
        <tbody>${subs.map(s=>{ const b=bySub[s], p=(b.c-0.5*b.w)/b.n*100; return `<tr>
          <td>${esc(s)}</td><td class="n">${b.n}</td><td class="n">${b.c}</td><td class="n">${b.w}</td><td class="n">${b.u}</td>
          <td class="n"><span class="pct ${p>=70?"ok":"bad"}">${num(Math.max(0,p))}%</span></td>
          <td><div class="stack"><i class="c" style="width:${b.c/b.n*100}%"></i><i class="w" style="width:${b.w/b.n*100}%"></i></div></td></tr>`; }).join("")}</tbody>
      </table></div>
    </div>
    <div class="sec"><h3>Xem lại đáp án và giải thích</h3>
      <div class="filters" id="filters">
        <button data-f="all" class="on">Tất cả (${total})</button>
        <button data-f="w">Sai (${g.w})</button>
        <button data-f="u">Bỏ trống (${g.u})</button>
        <button data-f="c">Đúng (${g.c})</button>
        <button data-f="flag">Đã đánh dấu (${g.rows.filter(r=>r.flag).length})</button>
        <label for="subf" class="label" style="margin-left:6px">Phân hệ</label>
        <select id="subf"><option value="">Tất cả</option>${subs.map(s=>`<option>${esc(s)}</option>`).join("")}</select>
      </div>
      <div id="review" class="sec"></div>
    </div>
  </div>`;
  let f = "all";
  const draw = () => {
    const sub = document.getElementById("subf").value;
    const list = g.rows.filter(r => (f==="all" || (f==="flag"?r.flag:r.r===f)) && (!sub || r.q.subject===sub));
    const lbl = {c:"Đúng", w:"Sai", u:"Bỏ trống"};
    document.getElementById("review").innerHTML = list.length ? list.map(r=>{
      const p = st.perm[r.id] || [0,1,2,3];
      return `<article class="rv ${r.r}">
        <div class="top"><span class="pill ${r.r}">${lbl[r.r]}</span><span class="mono">Câu ${r.i+1}</span><span>${esc(r.q.subject)}</span>${r.flag?`<span>· đã đánh dấu</span>`:""}<span style="margin-left:auto" class="mono">${r.r==="c"?"+1":r.r==="w"?"−0,5":"0"}</span></div>
        <p class="q">${esc(r.q.question)}</p>
        <ol>${p.map((o,k)=>{ const right=o===r.q.answer, picked=o===r.a && !right;
          return `<li class="${right?"right":""} ${picked?"picked":""}"><span class="mono">${KEYS[k]}</span><span>${esc(r.q.options[o])}</span><small>${right?"Đáp án đúng":picked?"Bạn chọn":""}</small></li>`; }).join("")}</ol>
        <div class="explain"><b>Giải thích</b>${esc(r.q.explanation)}${r.q.ref?` <a href="${esc(r.q.ref)}" target="_blank" rel="noopener">Tài liệu Odoo 18 ↗</a>`:""}</div>
      </article>`; }).join("") : `<div class="empty">Không có câu nào khớp bộ lọc.</div>`;
  };
  document.getElementById("filters").onclick = e => { const b=e.target.closest("button"); if(!b) return; f=b.dataset.f; document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("on",x===b)); draw(); };
  document.getElementById("subf").onchange = draw;
  document.getElementById("home").onclick = renderStart;
  document.getElementById("tohist").onclick = () => renderHistory();
  document.getElementById("again").onclick = () => startExam(st.set);
  draw();
}

renderStart();
</script>
</body></html>
