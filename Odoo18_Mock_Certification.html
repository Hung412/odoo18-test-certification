planation": "Thông tin riêng tư (địa chỉ, giấy tờ...) chỉ hiển thị với user có quyền Employees Officer trở lên. Internal user thường chỉ thấy hồ sơ công khai của đồng nghiệp.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 3, "subject": "HR", "question": "An employee cannot see their time off dashboard or submit expenses for themselves when logged in. What is the most likely cause?", "options": ["The employee has no department", "The employee has no working schedule", "The employee record is not linked to their user (Related User)", "The employee has no job position"], "answer": 2, "explanation": "Odoo xác định 'nhân viên của tôi' qua liên kết Related User giữa employee và user. Thiếu liên kết này thì các app Time Off/Expenses không nhận ra nhân viên.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 3, "subject": "HR", "question": "A company wants to forbid employees from taking time off on its annual inventory day. Which Odoo 18 feature should be used?", "options": ["A public holiday on that day", "An accrual plan", "Archiving all time off types for that day", "A Mandatory Day (Time Off ‣ Configuration ‣ Mandatory Days)"], "answer": 3, "explanation": "Mandatory Days là ngày nhân viên không được xin nghỉ phép. Public holiday thì ngược lại: là ngày nghỉ của toàn công ty.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 3, "subject": "HR", "question": "In an accrual plan milestone, unused days should be carried over at the carry-over date, but only up to 5 days. Which 'Carry over' option should be selected?", "options": ["None. Accrued time reset to 0", "Carry over with a maximum", "All accrued time carried over", "Set an expiration date on the allocation"], "answer": 1, "explanation": "'Carry over with a maximum' chuyển sang kỳ sau tối đa số ngày quy định. 'All accrued time carried over' chuyển toàn bộ, còn 'None' reset về 0.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 3, "subject": "HR", "question": "A recruiter refuses an applicant and wants the candidate to automatically receive a polite rejection email. How is this done?", "options": ["Use the Refuse action and choose a refuse reason linked to an email template", "Delete the applicant", "Move the applicant to the Hired stage", "Archive the job position"], "answer": 0, "explanation": "Nút Refuse cho chọn Refuse Reason, mỗi lý do có thể gắn email template để gửi cho ứng viên. Xóa applicant làm mất lịch sử và không gửi email.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/recruitment.html"}, {"set": 3, "subject": "HR", "question": "An expense report contains only expenses with 'Paid By: Company'. Once its journal entries are posted, what is the next step?", "options": ["Register a payment to reimburse the employee", "Wait for the employee to repay the company", "None: no reimbursement is needed, the report is considered paid", "It is automatically re-invoiced to a customer"], "answer": 2, "explanation": "Chi phí do công ty trả trực tiếp không cần hoàn tiền cho nhân viên nên report được coi là đã thanh toán sau khi post. Register Payment chỉ áp dụng cho 'Employee (to reimburse)'.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/expenses.html"}, {"set": 3, "subject": "HR", "question": "In kiosk mode, the company wants employees to confirm their identity with a code after selecting their name. Which setting should be enabled?", "options": ["Barcode Source", "Attendance From Systray", "Display Extra Hours", "Employee PIN Identification"], "answer": 3, "explanation": "Employee PIN Identification yêu cầu nhập PIN (khai báo trên form nhân viên) khi check-in/out ở kiosk. Barcode Source chỉ chọn thiết bị quét mã.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/attendances.html"}, {"set": 3, "subject": "HR", "question": "A manager wants colleagues of an employee to fill in a survey to give feedback before the employee's appraisal. Which feature is needed?", "options": ["Interview Forms in Recruitment", "360 Feedback in the Appraisals settings", "Employee skills", "Customer Ratings"], "answer": 1, "explanation": "360 Feedback (dựa trên Surveys) cho phép gửi khảo sát cho đồng nghiệp/người khác để lấy ý kiến cho appraisal. Interview Forms dùng cho tuyển dụng.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/appraisals.html"}, {"set": 1, "subject": "Studio", "question": "On the sales order form, you want to display the customer's phone number (stored on the contact) without duplicating the data. Which kind of field should be added with Studio?", "options": ["A Text field filled by an automation rule", "A related field (Customer > Phone)", "A new Many2one field to Contact", "An Html field"], "answer": 1, "explanation": "Related field hiển thị giá trị từ bản ghi liên kết (Customer ‣ Phone) và luôn đồng bộ, không nhân bản dữ liệu. Field Text cập nhật bằng automation sẽ bị lệch khi dữ liệu gốc thay đổi.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 1, "subject": "Studio", "question": "An email must be sent 3 days before the 'End Date' of a custom contract record. Which automation rule trigger should be used?", "options": ["On save", "On UI change", "After last update", "Based on date field, with a delay of 3 days before"], "answer": 3, "explanation": "Trigger 'Based on date field' chạy theo một trường ngày với delay trước/sau. 'After last update' tính từ lần sửa cuối, không phải từ End Date.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 1, "subject": "Studio", "question": "The 'Confirm' button on purchase orders must require approval from a manager group before it is executed. Which Studio feature should be used?", "options": ["Approval rules set on the button, in its properties in the form view", "'Allow visibility to groups' on the button", "An automation rule with the 'On deletion' trigger", "The PDF report editor"], "answer": 0, "explanation": "Studio cho phép đặt approval rules trên button; hành động chỉ chạy khi đủ phê duyệt. Giới hạn visibility chỉ ẩn nút chứ không tạo quy trình phê duyệt.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/approval_rules.html"}, {"set": 1, "subject": "Studio", "question": "When creating a new PDF report with Studio, which report types can be chosen?", "options": ["Standard, Custom, Empty", "PDF, HTML, Text", "External, Internal, Blank", "Header, Body, Footer"], "answer": 2, "explanation": "Studio tạo report mới theo ba loại: External (có header/footer công ty), Internal (header tối giản) và Blank (trống).", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/pdf_reports.html"}, {"set": 1, "subject": "Studio", "question": "When creating a new app with Studio, which suggested feature adds stages so that records can be managed in a kanban pipeline?", "options": ["Tags", "Pipeline stages", "Date range & Gantt", "Lines"], "answer": 1, "explanation": "Tùy chọn 'Pipeline stages' tạo trường stage và kanban theo stage. 'Date range & Gantt' thêm ngày bắt đầu/kết thúc cho Gantt, không tạo stage.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 1, "subject": "Studio", "question": "Each record of a custom model must be linked to several existing 'Skill' records, displayed as tags. Which field type should be added?", "options": ["Many2one", "One2many", "Selection", "Many2many (tags)"], "answer": 3, "explanation": "Many2many cho phép liên kết nhiều bản ghi và hiển thị dạng tags. Many2one chỉ chọn được một bản ghi.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 1, "subject": "Studio", "question": "With Studio, a field on a form view must be visible only to members of the Sales Manager group. Which property should be used?", "options": ["Allow visibility to groups", "Readonly", "Required", "Invisible, without any condition"], "answer": 0, "explanation": "Thuộc tính 'Allow visibility to groups' giới hạn phần tử view cho các group được chọn. Invisible không điều kiện sẽ ẩn với tất cả mọi người.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 1, "subject": "Studio", "question": "How can Studio customizations made in a test database be moved to another database?", "options": ["By copying each modified view's XML manually", "By duplicating the production database", "By using Studio's Export (zip module) and importing it in the target database", "They are transferred automatically between all databases of the same company"], "answer": 2, "explanation": "Studio có chức năng Export tạo file zip module chứa customization, sau đó Import vào database khác. Customization không tự đồng bộ giữa các database.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 1, "subject": "Studio", "question": "What prefix does Odoo give by default to the technical name of a field created with Studio?", "options": ["studio_", "x_studio_", "custom_", "o_"], "answer": 1, "explanation": "Field tạo bằng Studio có tên kỹ thuật bắt đầu bằng x_studio_ (custom field luôn bắt đầu bằng x_).", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 2, "subject": "Studio", "question": "You add a Monetary field with Studio on a custom model that does not have a currency field yet. What does Studio do?", "options": ["It refuses to add the field", "It hardcodes the company currency in the view", "It converts the field into a Float field", "It automatically creates a currency field (x_studio_currency_id) and links the monetary field to it"], "answer": 3, "explanation": "Field Monetary cần một field currency; Studio tự tạo x_studio_currency_id nếu model chưa có. Studio không đổi sang Float hay từ chối.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 2, "subject": "Studio", "question": "In a Studio approval rule, what does the 'Exclusive Approval' option do?", "options": ["The user who approves this rule cannot approve other rules for the same record", "Only one specific user can ever approve the rule", "Approval is required every time the record is saved", "The rule applies only to customers flagged as exclusive"], "answer": 0, "explanation": "Exclusive Approval: người đã duyệt rule này không thể duyệt các rule khác trên cùng bản ghi, đảm bảo nhiều người khác nhau phê duyệt.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/approval_rules.html"}, {"set": 2, "subject": "Studio", "question": "What is required to activate the Map view on a custom model with Studio?", "options": ["A date field", "A Monetary field", "A Many2one field to Contact whose address will be used", "The Geolocation module on every record"], "answer": 2, "explanation": "Map view định vị bản ghi theo địa chỉ của contact liên kết, nên model cần một Many2one tới Contact (res.partner). Field ngày dùng cho Calendar/Gantt.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 2, "subject": "Studio", "question": "What does a custom model need at minimum for Studio to activate a Calendar view?", "options": ["A Many2one field to Users", "A date or datetime field used as the start date", "A stage field", "A monetary field"], "answer": 1, "explanation": "Calendar view cần ít nhất một field date/datetime làm ngày bắt đầu. Stage dùng cho kanban, không bắt buộc cho calendar.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 2, "subject": "Studio", "question": "When a record is created, an automation rule must send its data to an external system's URL. Which action type should be used?", "options": ["Execute Code", "Send Email", "Create Activity", "Send Webhook Notification"], "answer": 3, "explanation": "Action 'Send Webhook Notification' gửi POST dữ liệu bản ghi tới URL ngoài. Execute Code chạy trong sandbox không được import thư viện HTTP, Send Email chỉ gửi email.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 2, "subject": "Studio", "question": "With Studio, you want to add a new tab to a form view. What do you drag onto the form?", "options": ["The 'Tabs' component", "The 'Columns' component", "A 'Lines' field", "A 'Notes' field"], "answer": 0, "explanation": "Trong tab Add của Studio, component Tabs tạo notebook/tab mới trên form. Columns chỉ chia bố cục thành cột.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 2, "subject": "Studio", "question": "Users want to create and edit records directly in a list view, without opening the form. What should be done with Studio?", "options": ["Enable 'Show Invisible Elements'", "Add a Lines field to the list", "Make the list view editable in place (new records added at the top or bottom)", "Enable mass editing only"], "answer": 2, "explanation": "Thuộc tính editable của list view cho phép tạo/sửa trực tiếp trên dòng (thêm bản ghi ở đầu hoặc cuối). Show Invisible Elements chỉ hiện các phần tử ẩn khi đang chỉnh sửa trong Studio.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 2, "subject": "Studio", "question": "How does Studio store the changes you make to a standard Odoo view?", "options": ["It overwrites the original view's XML", "In a separate view that inherits from the standard view, leaving the original unchanged", "In a system parameter", "In the browser's local storage"], "answer": 1, "explanation": "Studio lưu thay đổi vào view kế thừa (inherited view) riêng, view gốc giữ nguyên nên việc nâng cấp module không ghi đè customization.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio.html"}, {"set": 2, "subject": "Studio", "question": "Which Odoo Online pricing plan includes the Studio app?", "options": ["Custom", "Standard", "One App Free", "None: Studio is never available on Odoo Online"], "answer": 0, "explanation": "Studio chỉ có trong gói Custom (cùng với multi-company, external API). Gói Standard và One App Free không bao gồm Studio.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio.html"}, {"set": 3, "subject": "Studio", "question": "Users (without Studio access) must be able to add new 'Equipment Type' values later on. Which field type is the best choice?", "options": ["Selection", "Char", "Many2one to a new model holding the equipment types", "Boolean"], "answer": 2, "explanation": "Many2one tới một model riêng cho phép user thêm giá trị mới như bản ghi bình thường. Selection có danh sách cố định, chỉ sửa được bằng Studio.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 3, "subject": "Studio", "question": "What is specific about the 'On UI change' trigger of an automation rule?", "options": ["It runs in the form view as soon as the field is modified, before the record is saved", "It runs every night", "It runs only when the record is deleted", "It runs when an incoming email is received"], "answer": 0, "explanation": "'On UI change' hoạt động như onchange: chạy ngay khi user sửa field trên form, trước khi lưu. Các trigger khác (On save, Based on date field...) chạy phía server.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 3, "subject": "Studio", "question": "In a custom app built with Studio, you want to add order-line-like sub-records to each record. Which field should be added?", "options": ["Many2many", "Selection", "Related field", "Lines (a one2many to a new line model)"], "answer": 3, "explanation": "Field Lines tạo một model con và One2many để quản lý dòng chi tiết như order lines. Many2many liên kết bản ghi có sẵn, không tạo dòng con.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 3, "subject": "Studio", "question": "An external system must be able to call Odoo to update records of a custom model. Which automation rule trigger should be used?", "options": ["The 'Send Webhook Notification' action", "The 'On webhook' trigger, which provides a URL that receives requests", "The 'After creation' trigger", "The 'On incoming message' trigger"], "answer": 1, "explanation": "Trigger 'On webhook' sinh URL để hệ thống ngoài gọi vào và kích hoạt action trong Odoo. 'Send Webhook Notification' là chiều ngược lại: Odoo gửi dữ liệu ra ngoài.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 3, "subject": "Studio", "question": "A field must be required only when the record is in the 'Approved' stage. How can this be done with Studio?", "options": ["Use 'Allow visibility to groups'", "Make the field readonly", "Enable the Required property with a condition (domain) on the stage", "Set a default value on the field"], "answer": 2, "explanation": "Thuộc tính Required trong Studio có thể đặt theo điều kiện (domain), ví dụ stage = Approved. Allow visibility to groups chỉ giới hạn hiển thị theo group.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 3, "subject": "Studio", "question": "A module exported from Studio is imported into another database. What is required in the target database?", "options": ["Studio must be installed, because the exported module depends on it", "The database must be Odoo Community", "Developer mode must be disabled", "The company must have the same name"], "answer": 0, "explanation": "Module export từ Studio có dependency tới web_studio nên database đích phải cài Studio (Enterprise). Community không có Studio.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 3, "subject": "Studio", "question": "You want to rename and reorder an app's menus, or add a menu for an existing model, without writing code. Which Studio tool is used?", "options": ["The report editor", "Automation Rules", "Approval rules", "Edit Menu"], "answer": 3, "explanation": "Trong Studio, Edit Menu cho phép đổi tên, sắp xếp và tạo menu mới trỏ tới model. Các công cụ còn lại không quản lý menu.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 3, "subject": "Studio", "question": "With Studio, you remove a standard field from a form view. What happens?", "options": ["The field and its data are deleted from the database", "The field is only hidden from that view; the field and its data remain in the database", "All records of the model are archived", "The module defining the field is uninstalled"], "answer": 1, "explanation": "Xóa field khỏi view chỉ chỉnh view (ẩn field); field và dữ liệu vẫn còn trong database. Studio không xóa field chuẩn khỏi model.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 3, "subject": "Studio", "question": "Which Studio field type should be used to store formatted text with bold, lists and images?", "options": ["Text", "Char", "Html", "Selection"], "answer": 2, "explanation": "Field Html lưu nội dung có định dạng (rich text, hình ảnh). Text chỉ lưu văn bản thuần nhiều dòng, Char là một dòng.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 4, "subject": "Accounting", "question": "During bank reconciliation, the accountant often has small bank fee lines and wants a single click in the reconciliation widget to book them on the 'Bank Fees' expense account. Which type of reconciliation model should be created?", "options": ["Button to generate counterpart entry", "Rule to suggest counterpart entry", "Rule to match invoices/bills", "A fiscal position mapping the bank account to the Bank Fees account"], "answer": 0, "explanation": "Loại 'Button to generate counterpart entry' tạo một nút trong màn hình đối soát để ghi nhanh bút toán đối ứng (vd. phí ngân hàng) khi người dùng bấm. 'Rule to suggest counterpart entry' thì tự động gợi ý theo điều kiện chứ không phải nút thủ công.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/bank/reconciliation_models.html"}, {"set": 4, "subject": "Accounting", "question": "A retail shop enters product sales prices that already contain the 21% VAT (e.g. 121 € shown to customers). On the 21% sales tax, how should the 'Included in Price' field be set so that Odoo extracts the tax from the price instead of adding it?", "options": ["Tax Excluded", "Tax Included", "Leave it empty and set the tax computation to 'Fixed'", "Enable 'Affect Base of Subsequent Taxes'"], "answer": 1, "explanation": "Đặt 'Included in Price' = Tax Included thì giá bán được hiểu là đã gồm thuế, Odoo tách thuế ra (121 = 100 + 21). 'Affect Base of Subsequent Taxes' chỉ làm thuế này cộng vào cơ sở tính của các thuế sau.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes.html"}, {"set": 4, "subject": "Accounting", "question": "Management wants salespeople and accountants to be warned when a customer's total receivable exceeds an agreed amount. What happens in Odoo 18 once 'Sales Credit Limit' is enabled and a limit is set on the customer?", "options": ["Odoo blocks confirmation of any sales order that exceeds the limit", "The customer's portal access is suspended until the balance is paid", "A warning banner is displayed on the quotation/sales order and invoice when the limit would be exceeded, but the documents can still be confirmed", "Odoo automatically creates a follow-up reminder for the customer"], "answer": 2, "explanation": "Credit Limit trong Odoo 18 chỉ hiển thị cảnh báo trên đơn bán/hóa đơn khi vượt hạn mức, không chặn xác nhận. Muốn chặn hoàn toàn khách hàng thì phải dùng Blocking Message của Sale Warnings.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/credit_limit.html"}, {"set": 4, "subject": "Accounting", "question": "A new product is created without any Income Account on its Accounting tab; its product category has an Income Account. When the product is invoiced, which account does Odoo use for the revenue line?", "options": ["The default account of the Sales journal", "The receivable account of the customer", "The first income-type account of the chart of accounts, by code", "The Income Account defined on the product's category (or its parent category)"], "answer": 3, "explanation": "Nếu sản phẩm không có Income Account, Odoo lấy tài khoản doanh thu trên Product Category (dò lên category cha). Tài khoản phải thu của khách hàng chỉ dùng cho dòng công nợ, không phải dòng doanh thu.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/configure/product_categories.html"}, {"set": 4, "subject": "Accounting", "question": "A company wants to record the transactions of its corporate credit card in a dedicated journal so they can be reconciled like bank statements. Which journal type should be chosen in Odoo 18?", "options": ["Miscellaneous", "Purchase", "Cash", "Credit Card"], "answer": 3, "explanation": "Odoo 18 có loại sổ 'Credit Card' riêng (bên cạnh Sales, Purchase, Cash, Bank, Miscellaneous) để ghi nhận và đối soát giao dịch thẻ tín dụng. Miscellaneous dùng cho bút toán tổng hợp, không có dòng sao kê để đối soát.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/bank.html"}, {"set": 4, "subject": "Sales", "question": "In Sales ‣ Configuration ‣ Settings, the 'Default Quotation Validity' is set to 0. What is the consequence for new quotations?", "options": ["Quotations expire on the same day they are created", "Quotations no longer get an automatic expiration date", "Quotations can no longer be sent by email", "The validity falls back to the 30-day default"], "answer": 1, "explanation": "Giá trị 0 (hoặc để trống) tắt việc tự động tính ngày hết hạn báo giá. Mặc định là 30 ngày nhưng khi người dùng đặt 0 thì Odoo không quay về 30.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/quote_template.html"}, {"set": 4, "subject": "Sales", "question": "A salesperson must grant 5% off the whole quotation and wants it to appear as one separate discount line, without changing the Disc.% of each product line. Which option of the 'Discount' button wizard should be used?", "options": ["On All Order Lines", "Global Discount", "Fixed Amount", "A pricelist rule with 5% discount"], "answer": 1, "explanation": "Tùy chọn Global Discount thêm một dòng giảm giá riêng tính theo % tổng đơn. 'On All Order Lines' lại ghi % vào cột Disc.% của từng dòng sản phẩm, trái với yêu cầu.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/sales_quotations/discounts.html"}, {"set": 4, "subject": "Sales", "question": "A sandwich shop sells a 'Lunch Menu' at a single price, for which the customer chooses one sandwich, one drink and one dessert from predefined lists. Which Odoo 18 product setup fits best?", "options": ["A product with three attributes using 'Dynamically' variant creation", "A kit Bill of Materials with the three items", "A product of type 'Combo' with three combo choices (sandwiches, drinks, desserts)", "Optional products on the Lunch Menu product"], "answer": 2, "explanation": "Odoo 18 có Product Type 'Combo', cho phép định nghĩa các nhóm lựa chọn (combo choices) và khách chọn một món trong mỗi nhóm với một giá chung. Attributes/variants mô tả biến thể của cùng một sản phẩm, không phải gói nhiều sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/configuration/products.html"}, {"set": 4, "subject": "Sales", "question": "Consultants pay travel costs on vendor bills and expenses; the company wants to re-invoice them to the customer's sales order at the exact amount spent. What should be set on the 'Travel' product?", "options": ["Re-Invoice Costs = Sales price", "Invoicing Policy = Ordered quantities", "Re-Invoice Costs = No, and add the product manually on the order", "Re-Invoice Costs = At cost"], "answer": 3, "explanation": "Re-Invoice Costs = At cost sẽ thêm chi phí thực tế (giá trên hóa đơn mua/chi phí) vào đơn bán để lập hóa đơn lại. 'Sales price' thì dùng giá bán của sản phẩm chứ không phải số tiền thực chi.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/expense.html"}, {"set": 4, "subject": "Sales", "question": "A beverage distributor sells water by the bottle but customers usually order full packs of 6. It wants salespeople to pick 'Pack of 6' on the order line and have the quantity computed. What must be enabled?", "options": ["The 'Product Packagings' setting, then define packagings on the product", "Units of Measure, and create a 'Pack of 6' UoM on every sales order", "Sales Grid Entry", "Variants, with a 'Pack size' attribute"], "answer": 0, "explanation": "Bật 'Product Packagings' cho phép khai báo các kiểu đóng gói (Pack of 6) trên sản phẩm và chọn Packaging trên dòng đơn bán, số lượng được quy đổi tự động. Sales Grid Entry chỉ là lưới nhập số lượng theo biến thể.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/configure/packaging.html"}, {"set": 4, "subject": "Purchase", "question": "A buyer has three RFQs in 'RFQ' status for the same vendor and the same currency and destination. She wants to combine them into one order. What does Odoo 18 do when she selects them in the list view and uses Actions ‣ Merge?", "options": ["A new RFQ is created and the three originals are deleted", "The lines are merged into the oldest RFQ and the other RFQs are cancelled", "The RFQs are merged into the most recent one and the others are archived", "Merging is only possible from the Alternatives tab"], "answer": 1, "explanation": "Hành động Merge gộp các dòng vào RFQ cũ nhất (cộng dồn số lượng nếu trùng sản phẩm) và hủy các RFQ còn lại, có ghi chú trong chatter. Các RFQ cần cùng vendor, currency, destination...; tab Alternatives dùng để so sánh báo giá, không phải gộp.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/manage.html"}, {"set": 4, "subject": "Purchase", "question": "On an RFQ, what is the meaning of the 'Order Deadline' field compared with 'Expected Arrival'?", "options": ["Order Deadline is the vendor's delivery date; Expected Arrival is the date goods are put in stock", "Both fields are the same date shown in two places", "Order Deadline is the date by which the RFQ should be confirmed into a PO; Expected Arrival is the date the vendor promises to deliver", "Order Deadline is the vendor bill due date; Expected Arrival is the receipt date"], "answer": 2, "explanation": "Order Deadline là hạn để xác nhận RFQ thành đơn mua; Expected Arrival là ngày nhà cung cấp hứa giao (tính từ lead time). Order Deadline không liên quan ngày đến hạn thanh toán hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/rfq.html"}, {"set": 4, "subject": "Purchase", "question": "The default Bill Control in Purchase settings is 'Received quantities'. A user creates a new product of type 'Service' (e.g. consulting). What is its Control Policy by default?", "options": ["On ordered quantities", "On received quantities, as in the settings", "No policy: services cannot be purchased", "On delivered quantities"], "answer": 0, "explanation": "Với sản phẩm Service, Odoo tự đặt Control Policy = On ordered quantities vì dịch vụ không có phiếu nhập kho; thiết lập mặc định chỉ áp cho hàng hóa. 'On delivered quantities' không tồn tại trong Purchase.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 4, "subject": "Purchase", "question": "Vendors regularly deliver 2-3 days late. The planner wants Odoo to schedule automatically generated purchase orders a few days earlier as a safety margin. Which setting should be used?", "options": ["Receipt Reminder", "Purchase Order Approval", "Lock Confirmed Orders", "Security Lead Time for Purchase"], "answer": 3, "explanation": "Security Lead Time for Purchase thêm biên an toàn (số ngày) để các PO do replenishment tạo ra được lên lịch sớm hơn. Receipt Reminder chỉ gửi email nhắc nhà cung cấp xác nhận ngày giao.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/lead_times.html"}, {"set": 4, "subject": "Spreadsheet", "question": "A finance user needs, in a spreadsheet cell, the exchange rate from EUR to USD at a given date to convert figures. Which function should be used?", "options": ["ODOO.BALANCE(\"EUR\", \"USD\", date)", "ODOO.CURRENCY.RATE(\"EUR\", \"USD\", date)", "PIVOT.VALUE(\"EUR\", \"USD\")", "ODOO.RESIDUAL(\"EUR\", \"USD\")"], "answer": 1, "explanation": "ODOO.CURRENCY.RATE nhận mã tiền tệ nguồn, đích và ngày (tùy chọn) và trả về tỷ giá. ODOO.BALANCE dùng để lấy số dư tài khoản kế toán, không phải tỷ giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/functions.html"}, {"set": 4, "subject": "Spreadsheet", "question": "A dashboard must always display the last 90 days of sales, rolling forward automatically every day without anybody changing the filter. How should the global filter be configured?", "options": ["A Text filter with the value '90'", "A Relation filter on the Sales Team model", "A Date filter using a relative period such as 'Last 90 Days' as default value", "A Date filter set to a fixed quarter"], "answer": 2, "explanation": "Global filter loại Date hỗ trợ khoảng thời gian tương đối (Year to Date, Last 7/30/90/180/365 Days...) tính lại theo ngày hiện tại. Một quý cố định sẽ không tự trượt theo thời gian.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/global_filters.html"}, {"set": 4, "subject": "Spreadsheet", "question": "An administrator wants the 'Purchase' dashboard in the Dashboards app to be visible only to users of the Purchase / Administrator group. Where is this configured?", "options": ["In Dashboards ‣ Configuration ‣ Dashboards, on the dashboard's Group field (access groups)", "In the spreadsheet via File ‣ Share, choosing 'Viewer'", "In Settings ‣ Users, removing the Dashboards app from each user", "With a record rule on the purchase.order model"], "answer": 0, "explanation": "Mỗi dashboard có trường nhóm quyền (group_ids, mặc định Internal User) trong Dashboards ‣ Configuration ‣ Dashboards; chỉ thành viên các nhóm đó mới thấy dashboard. Record rule trên purchase.order chỉ giới hạn dữ liệu chứ không ẩn dashboard.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/dashboards.html"}, {"set": 5, "subject": "Accounting", "question": "In Canada, a sale must carry both GST 5% and PST 7%, and the accountant wants to select one tax on product lines that applies both. Which 'Tax Computation' should the combined tax use?", "options": ["Group of Taxes", "Percentage Tax Included", "Fixed", "Percentage"], "answer": 0, "explanation": "Tax Computation = Group of Taxes cho phép gom nhiều thuế con (GST + PST) vào một thuế để chọn một lần trên dòng. Percentage Tax Included là cách tính thuế đã gồm trong giá, không gom nhiều thuế.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes.html"}, {"set": 5, "subject": "Accounting", "question": "A Swiss company must round cash invoice totals to 0.05 CHF and wants the rounding difference booked on dedicated profit/loss accounts rather than inside the tax amount. After enabling 'Cash Rounding', which Rounding Strategy should the rounding method use?", "options": ["Modify tax amount", "Add a rounding line", "Round globally", "Round per line"], "answer": 1, "explanation": "Strategy 'Add a rounding line' thêm một dòng làm tròn riêng hạch toán vào tài khoản Profit/Loss đã cấu hình. 'Modify tax amount' cộng chênh lệch vào dòng thuế lớn nhất; 'Round globally/per line' là phương pháp làm tròn thuế, không phải cash rounding.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/cash_rounding.html"}, {"set": 5, "subject": "Accounting", "question": "Vendors send their bills by email. The company wants a draft vendor bill to be created automatically, with the PDF attached, each time an email is received. What should be configured?", "options": ["A mail template on the vendor contact", "The 'Receipt Reminder' option in Purchase settings", "The email alias of the Purchase (Vendor Bills) journal, and have vendors send bills to that address", "An email alias on the Bank journal"], "answer": 2, "explanation": "Sổ Purchase (và Sales) có email alias; mỗi email gửi tới alias đó sẽ tạo một hóa đơn nháp kèm tệp đính kèm. Receipt Reminder chỉ là email nhắc nhà cung cấp về ngày giao hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/vendor_bills.html"}, {"set": 5, "subject": "Accounting", "question": "A customer pays 995 € on a 1,000 € invoice and the company accepts to absorb the 5 € difference. In the Register Payment wizard, what should the accountant do?", "options": ["Keep the difference open and create a credit note later for 5 €", "Change the invoice amount to 995 € before registering the payment", "Select 'Keep open' and reconcile manually with the Bank Fees account", "Set Payment Difference to 'Mark as fully paid' and choose a write-off account and label"], "answer": 3, "explanation": "Chọn 'Mark as fully paid' với một tài khoản write-off giúp hóa đơn được tất toán ngay và 5 € chênh lệch ghi vào tài khoản đã chọn. 'Keep open' để hóa đơn ở trạng thái thanh toán một phần.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/payments.html"}, {"set": 5, "subject": "Accounting", "question": "A company wants the payment reference on its customer invoices to follow the international structured creditor reference format (starting with 'RF'). Which journal setting should be changed?", "options": ["On the Sales journal, set the Communication Standard to 'European'", "On the Sales journal, set the Communication Type to 'Open'", "In Accounting settings, enable 'Display SEPA QR-code'", "On the customer, set a dedicated payment term"], "answer": 0, "explanation": "Trường Communication Standard trên sổ bán hàng có các lựa chọn Odoo và European; European tạo tham chiếu RF theo chuẩn creditor reference. Communication Type = Open lại bỏ tham chiếu tự động.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/payment_references.html"}, {"set": 5, "subject": "Sales", "question": "Salespeople find it slow to type product names on order lines and want to browse products as cards and set quantities directly. Which Odoo 18 feature on the quotation's Order Lines tab provides this?", "options": ["The 'Add a section' link", "The 'Catalog' button", "The Product Configurator", "Sales Grid Entry"], "answer": 1, "explanation": "Nút 'Catalog' mở danh mục sản phẩm dạng thẻ (kanban) để thêm sản phẩm và chỉnh số lượng trực tiếp vào báo giá. Product Configurator chỉ mở khi sản phẩm có biến thể/sản phẩm tùy chọn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/sales_quotations/create_quotations.html"}, {"set": 5, "subject": "Sales", "question": "A customer wants to receive all items of a sales order in a single shipment rather than in several partial deliveries. Which field on the order's Other Info tab should be set?", "options": ["Shipping Policy = As soon as possible", "Delivery Date = today", "Shipping Policy = When all products are ready", "Incoterm = EXW"], "answer": 2, "explanation": "Shipping Policy = 'When all products are ready' lên lịch giao một lần khi tất cả sản phẩm sẵn sàng. 'As soon as possible' cho phép giao từng phần ngay khi có hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/delivery_policy.html"}, {"set": 5, "subject": "Sales", "question": "A clothing wholesaler sells a shirt in 5 sizes and 6 colors; customers order dozens of combinations at once. Which Sales setting lets salespeople enter quantities for all variants in a single matrix?", "options": ["Product Packagings", "Variants with 'Never' creation mode", "Optional products", "Sales Grid Entry"], "answer": 3, "explanation": "Sales Grid Entry hiển thị một lưới (ma trận thuộc tính) để nhập số lượng cho nhiều biến thể cùng lúc. Optional products chỉ gợi ý sản phẩm bổ sung, không phải nhập theo ma trận.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/products_prices/products/variants.html"}, {"set": 5, "subject": "Sales", "question": "The 'Delivery Methods' setting is enabled and a shipping method is configured. How does a salesperson add the shipping cost to a quotation?", "options": ["Click the 'Add shipping' button on the quotation and select the delivery method", "Add the carrier as a follower of the quotation", "Set the delivery method on the customer only; the cost appears on the invoice", "Create a down payment for the shipping amount"], "answer": 0, "explanation": "Sau khi bật Delivery Methods, nút 'Add shipping' trên báo giá mở wizard chọn phương thức giao hàng và thêm dòng phí vận chuyển. Down payment là khoản trả trước, không liên quan phí ship.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/setup_configuration/delivery_method.html"}, {"set": 5, "subject": "Sales", "question": "A confirmed sales order was cancelled by mistake. The salesperson wants to reuse it instead of re-entering everything. What can be done?", "options": ["Duplicate is the only option, a cancelled order can never be reopened", "Click 'Set to Quotation' on the cancelled order, then confirm it again", "Unarchive the order", "Use 'Reverse and Create Invoice' on the order"], "answer": 1, "explanation": "Đơn bị hủy có nút 'Set to Quotation' để đưa về trạng thái báo giá rồi xác nhận lại. 'Reverse and Create Invoice' là tùy chọn của credit note trong Accounting, không áp dụng cho đơn bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/sales_quotations/create_quotations.html"}, {"set": 5, "subject": "Purchase", "question": "A buyer clicks 'Send by Email' on a draft RFQ and sends it to the vendor. What is the status of the document afterwards?", "options": ["Purchase Order", "To Approve", "RFQ Sent", "Locked"], "answer": 2, "explanation": "Sau khi gửi email, RFQ chuyển sang trạng thái 'RFQ Sent'; chỉ khi bấm Confirm Order mới thành 'Purchase Order'. 'To Approve' chỉ xuất hiện khi bật Purchase Order Approval và vượt ngưỡng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/rfq.html"}, {"set": 5, "subject": "Purchase", "question": "A company sells an installation service that it actually subcontracts. Each time the service is sold on a confirmed sales order, an RFQ should be created for the subcontractor. What is required on the service product?", "options": ["Add the Buy and MTO routes on the product", "Set the invoicing policy to 'Based on Timesheets'", "Enable Dropshipping on the product", "Enable 'Subcontract Service' on the Purchase tab and define the subcontractor as vendor"], "answer": 3, "explanation": "Tùy chọn 'Subcontract Service' (chỉ cho sản phẩm Service, cần có vendor) tạo RFQ tự động khi đơn bán được xác nhận. Route Buy/MTO dùng cho hàng hóa lưu kho, không áp dụng cho dịch vụ.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/subcontracting.html"}, {"set": 5, "subject": "Purchase", "question": "A PO for 100 units is confirmed, but only 60 arrive. On validating the receipt with 60 done, Odoo asks about the remaining quantity. The vendor will ship the remaining 40 next week. Which choice should be made?", "options": ["Create Backorder", "No Backorder", "Discard and edit the PO to 60 units", "Return the 60 units"], "answer": 0, "explanation": "'Create Backorder' tạo một phiếu nhập mới cho 40 đơn vị còn lại để chờ nhận. 'No Backorder' sẽ hủy phần còn lại, PO không còn chờ 40 đơn vị nữa.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/partial_receipt.html"}, {"set": 5, "subject": "Purchase", "question": "A purchaser regularly orders a T-shirt in many size/color combinations from one vendor and wants to enter all quantities in one matrix on the RFQ. Which Purchase setting should be enabled?", "options": ["Purchase Agreements", "Purchase Grid Entry", "Variant Seller", "Product Packagings"], "answer": 1, "explanation": "Purchase Grid Entry (Purchase ‣ Configuration ‣ Settings) cho phép nhập số lượng của các biến thể theo dạng lưới trên RFQ. Purchase Agreements dùng cho blanket order và alternatives.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase.html"}, {"set": 5, "subject": "Spreadsheet", "question": "A list of sales orders is inserted in a spreadsheet as list 1. Which formula returns the 'amount_total' of the third record of that list?", "options": ["=ODOO.LIST.HEADER(1, \"amount_total\")", "=PIVOT.VALUE(1, \"amount_total\", 3)", "=ODOO.LIST(1, 3, \"amount_total\")", "=ODOO.LIST(\"amount_total\", 1, 3)"], "answer": 2, "explanation": "Cú pháp là ODOO.LIST(list_id, index, field_name), nên ODOO.LIST(1, 3, \"amount_total\") trả về giá trị trường của bản ghi thứ 3. ODOO.LIST.HEADER chỉ trả về tiêu đề cột.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 5, "subject": "Spreadsheet", "question": "A manager wants users who click a chart in a spreadsheet dashboard to land directly on the related Odoo view (e.g. the Sales Analysis report). What should be configured?", "options": ["Insert a hyperlink in the cell above the chart", "Convert the chart into a pivot", "Add a Relation global filter on the menu model", "Link the chart to an Odoo menu in the chart's properties"], "answer": 3, "explanation": "Biểu đồ trong spreadsheet có thể liên kết với một Odoo menu; khi người xem bấm vào biểu đồ sẽ mở menu/view tương ứng. Hyperlink trong ô chỉ hoạt động khi bấm vào ô, không phải biểu đồ.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/insert.html"}, {"set": 5, "subject": "Spreadsheet", "question": "In a new database with no sales recorded yet, a user opens the standard Sales dashboard in the Dashboards app. What is displayed?", "options": ["A sample version of the dashboard with demonstration data, marked as a sample", "An error because the pivots return no data", "A blank page until the first order is confirmed", "The spreadsheet editor in edit mode"], "answer": 0, "explanation": "Khi dashboard chưa có dữ liệu và có sample file, Odoo hiển thị phiên bản mẫu (sample) với dữ liệu minh họa. Nó không báo lỗi hay hiển thị trang trống.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/dashboards.html"}, {"set": 6, "subject": "Accounting", "question": "A Romanian company must record corrections as reversal entries that keep the same side with negative amounts (e.g. a negative debit instead of a credit). Which Accounting setting should be enabled?", "options": ["Cash Basis", "Storno accounting", "Quick encoding", "Dedicated Credit Note Sequence"], "answer": 1, "explanation": "Bật 'Storno accounting' thì các bút toán đảo (credit note, reverse) ghi số âm ở cùng phía Debit/Credit của bút toán gốc. Cash Basis liên quan thời điểm ghi nhận thuế, không phải cách đảo bút toán.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/get_started.html"}, {"set": 6, "subject": "Accounting", "question": "A company wants customers to pay invoices by scanning a code with their banking app. Which configuration enables printing a SEPA QR-code on invoices?", "options": ["Enable 'Online Signature' in Sales settings", "Enable 'Batch Payments' and SEPA Direct Debit", "Enable 'Display SEPA QR-code' in Accounting settings and have a bank account (IBAN) set on the bank journal", "Install the Barcode app and add a barcode on the customer"], "answer": 2, "explanation": "Tùy chọn Display SEPA QR-code (Accounting settings) cùng tài khoản ngân hàng IBAN trên sổ ngân hàng cho phép in mã QR thanh toán trên hóa đơn. SEPA Direct Debit là thu tiền tự động theo ủy quyền, không phải mã QR.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/customer_invoices/epc_qr_code.html"}, {"set": 6, "subject": "Accounting", "question": "An accountant receives hundreds of PDF vendor bills and wants Odoo to read the vendor, dates, amounts and taxes automatically. Which feature is used, and what does it consume?", "options": ["Quick encoding, which is free and needs no setting", "Bank synchronization, which consumes IAP credits", "Snailmail, which consumes IAP credits", "Document Digitization (OCR), which consumes In-App Purchase (IAP) credits"], "answer": 3, "explanation": "Document Digitization dùng OCR/AI để trích xuất dữ liệu từ PDF hóa đơn và tiêu tốn IAP credits. Snailmail là gửi thư bưu điện, cũng dùng IAP nhưng không đọc hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/vendor_bills/invoice_digitization.html"}, {"set": 6, "subject": "Accounting", "question": "At month end, the accountant posts an accrual for electricity consumed in March but not yet billed, and wants it cancelled automatically on 1 April. What is the standard approach?", "options": ["Post the accrual entry dated 31 March, then use 'Reverse' with a reversal date of 1 April", "Post the entry and delete it on 1 April", "Set a Hard Lock date at 31 March", "Create a credit note on a fake vendor bill dated 1 April"], "answer": 0, "explanation": "Dùng chức năng Reverse trên bút toán với Reversal Date = 1/4 để tạo bút toán đảo ngày đầu tháng sau, chuẩn cho accrual. Không thể xóa bút toán đã post, và Hard Lock date chỉ khóa kỳ.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/reporting/year_end.html"}, {"set": 6, "subject": "Accounting", "question": "A recycling eco-fee of 0.50 € per unit must be charged on each unit of a product, regardless of its price. Which 'Tax Computation' should this tax use?", "options": ["Percentage", "Percentage Tax Included", "Group of Taxes", "Fixed"], "answer": 3, "explanation": "Tax Computation = Fixed tính một số tiền cố định trên mỗi đơn vị số lượng, không phụ thuộc giá. Percentage tính theo tỷ lệ của giá bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes.html"}, {"set": 6, "subject": "Sales", "question": "A company sells online training and wants an email with the course agenda and materials to be sent automatically to the customer when the invoice for that product is confirmed. Which Sales setting enables this?", "options": ["Pro-Forma Invoice", "Specific Email (an email template linked to the product)", "Online Signature", "Automatic Invoice"], "answer": 1, "explanation": "Setting 'Specific Email' cho phép gắn email template vào sản phẩm; email được gửi tự động khi hóa đơn của sản phẩm đó được xác nhận. Automatic Invoice chỉ tự tạo hóa đơn sau khi thanh toán online.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 6, "subject": "Sales", "question": "A sales team wants every quotation PDF to include a company presentation page at the beginning and terms & conditions pages at the end, uploaded as PDF files. Which setting fits?", "options": ["Quotation Templates with optional products", "Pro-Forma Invoice", "PDF Quote builder", "Specific Email"], "answer": 2, "explanation": "PDF Quote builder cho phép upload các trang PDF header/footer (và tài liệu theo sản phẩm) để ghép vào PDF báo giá. Quotation Templates xác định nội dung dòng/điều khoản, không ghép thêm trang PDF.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/sales_quotations/pdf_quote_builder.html"}, {"set": 6, "subject": "Sales", "question": "In Sales settings, the default Invoicing Policy is changed from 'Invoice what is ordered' to 'Invoice what is delivered'. What is the effect on products?", "options": ["All existing products are switched to 'Delivered quantities'", "All open sales orders are re-invoiced on delivered quantities", "Service products are excluded and become non-invoiceable", "Only newly created products get 'Delivered quantities' by default; existing products keep their current policy"], "answer": 3, "explanation": "Invoicing Policy trong Settings chỉ là giá trị mặc định cho sản phẩm tạo mới; sản phẩm cũ phải sửa trên tab Sales của từng sản phẩm. Nó không cập nhật hàng loạt sản phẩm hay đơn hàng đang mở.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/invoicing/invoicing_policy.html"}, {"set": 6, "subject": "Sales", "question": "Before sending a quotation, a salesperson wants to see exactly what the customer will see online. Which button on the quotation should be used?", "options": ["Preview", "Print", "Send by Email", "Confirm"], "answer": 0, "explanation": "Nút 'Preview' mở báo giá trên customer portal đúng như khách hàng sẽ thấy (kèm ký/thanh toán online nếu bật). Print chỉ tạo bản PDF.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales/send_quotations/get_signature_to_validate.html"}, {"set": 6, "subject": "Sales", "question": "A product is being phased out. The company wants salespeople to see a pop-up message when they add it to a quotation, but still allow them to sell it. What should be configured?", "options": ["Set a 'Blocking Message' on the product", "Enable Sale Order Warnings and set a 'Warning' message on the product's Sales tab", "Archive the product", "Remove the product from all pricelists"], "answer": 1, "explanation": "Với Sale Order Warnings, loại 'Warning' hiển thị thông báo nhưng vẫn cho phép tiếp tục; 'Blocking Message' sẽ chặn không cho thêm sản phẩm. Archive làm sản phẩm không chọn được nữa.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/sales.html"}, {"set": 6, "subject": "Purchase", "question": "A PO contains a line for a 'Maintenance' service (control policy on received quantities) that the vendor has performed. There is no receipt in Inventory. How is the received quantity recorded?", "options": ["By validating a receipt automatically created for services", "By registering the vendor bill first", "By entering the Received quantity manually on the PO line", "It cannot be recorded; services always use ordered quantities"], "answer": 2, "explanation": "Dòng PO của dịch vụ không tạo phiếu nhập; cột Received được nhập thủ công trên dòng PO (qty received method = Manual). Hàng hóa (Goods) mới lấy số lượng nhận từ phiếu nhập kho.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/control_bills.html"}, {"set": 6, "subject": "Purchase", "question": "On a vendor's contact form (with Purchase and Inventory installed), a buyer looks at the 'On-Time Delivery Rate'. What does it measure?", "options": ["The percentage of vendor bills paid before their due date", "The number of RFQs the vendor answered before the order deadline", "The average delay in days between confirmation and receipt", "The share of ordered product quantities received on or before the expected arrival date, over a recent period (365 days by default)"], "answer": 3, "explanation": "On-Time Delivery Rate = số lượng sản phẩm nhận đúng hạn (trước/đúng Expected Arrival) chia cho số lượng đặt, mặc định trong 365 ngày gần nhất. Nó không đo việc thanh toán hóa đơn.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/advanced/analyze.html"}, {"set": 6, "subject": "Purchase", "question": "A restaurant buys the same set of ingredients from a vendor every week, but prices and quantities change each time. Which Odoo 18 purchase agreement type helps generate these RFQs quickly from a predefined product list?", "options": ["Purchase Template", "Blanket Order", "Call for Tenders", "Alternative RFQs"], "answer": 0, "explanation": "Purchase Template lưu sẵn danh sách sản phẩm để tạo RFQ nhanh mà không cam kết giá/số lượng. Blanket Order là cam kết giá với nhà cung cấp; 'Call for Tenders' không còn là loại agreement trong Odoo 18.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/agreements.html"}, {"set": 6, "subject": "Purchase", "question": "A product is purchased with a 10% input VAT, while it is sold with 20% output VAT. Where is the purchase tax set so that it is proposed by default on RFQ lines?", "options": ["In the 'Sales Taxes' field; Odoo converts it automatically", "In the 'Purchase Taxes' field of the product form", "On the vendor's fiscal position only", "In the Purchase journal's default tax"], "answer": 1, "explanation": "Thuế mua mặc định lấy từ trường Purchase Taxes (vendor taxes) trên sản phẩm, sau đó có thể bị fiscal position thay thế. Sales Taxes chỉ dùng cho đơn bán/hóa đơn khách hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/accounting/taxes.html"}, {"set": 6, "subject": "Spreadsheet", "question": "A spreadsheet has a date global filter labelled 'Period'. The report title cell should display the period currently selected by the user. Which function returns it?", "options": ["=ODOO.LIST.HEADER(\"Period\")", "=PIVOT.HEADER(\"Period\")", "=ODOO.FILTER.VALUE(\"Period\")", "=ODOO.FISCALYEAR.START(\"Period\")"], "answer": 2, "explanation": "ODOO.FILTER.VALUE(filter_name) trả về giá trị hiện tại của global filter theo nhãn. PIVOT.HEADER trả về tiêu đề của pivot chứ không phải giá trị bộ lọc.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/global_filters.html"}, {"set": 6, "subject": "Spreadsheet", "question": "A company's fiscal year runs from 1 July to 30 June. In a spreadsheet report, which function returns the first day of the fiscal year containing a given date?", "options": ["ODOO.BALANCE", "ODOO.CURRENCY.RATE", "ODOO.FILTER.VALUE", "ODOO.FISCALYEAR.START"], "answer": 3, "explanation": "ODOO.FISCALYEAR.START trả về ngày bắt đầu năm tài chính chứa ngày đã cho (theo cấu hình công ty); có hàm tương ứng ODOO.FISCALYEAR.END. ODOO.BALANCE trả về số dư tài khoản.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet/functions.html"}, {"set": 6, "subject": "Spreadsheet", "question": "A spreadsheet created by a US colleague shows dates as MM/DD/YYYY and decimals with a dot, but the Belgian team wants DD/MM/YYYY and decimal commas for this spreadsheet. What should they change?", "options": ["The Locale in File ‣ Settings of the spreadsheet", "The timezone in their user preferences", "The currency of the company", "The format of each cell one by one, there is no global option"], "answer": 0, "explanation": "Spreadsheet có phần Settings (File ‣ Settings) để chọn Locale, quyết định định dạng ngày, số thập phân và dấu phân cách cho cả bảng tính. Timezone chỉ ảnh hưởng giờ, không đổi định dạng số.", "ref": "https://www.odoo.com/documentation/18.0/applications/productivity/spreadsheet.html"}, {"set": 4, "subject": "Inventory", "question": "A company does not want delivery orders to reserve stock automatically when a sales order is confirmed; a stock clerk should decide when products get reserved. What should be configured on the Delivery Orders operation type?", "options": ["Set the Shipping Policy to 'When all products are ready'", "Set 'Create Backorder' to 'Never'", "Set the Reservation Method to 'Manually'", "Untick 'Use Existing Lots/Serial Numbers'"], "answer": 2, "explanation": "Trường Reservation Method trên operation type có 3 giá trị: At Confirmation, Manually, Before scheduled date; chọn 'Manually' thì phải bấm 'Check Availability' để giữ hàng. Shipping Policy chỉ quyết định giao từng phần hay giao một lần, không liên quan việc reserve.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/reservation_methods.html"}, {"set": 4, "subject": "Inventory", "question": "A hardware store wants the most recently received units of a product to be the first ones taken out of stock for deliveries. Which removal strategy should be used?", "options": ["Last In, First Out (LIFO)", "First In, First Out (FIFO)", "Closest Location", "Least Packages"], "answer": 0, "explanation": "LIFO lấy hàng nhập gần nhất ra trước. FIFO thì ngược lại (hàng nhập sớm nhất ra trước), còn Closest Location dựa trên thứ tự tên vị trí.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/removal_strategies.html"}, {"set": 4, "subject": "Inventory", "question": "A supplier keeps its own goods in your warehouse; you only pay the supplier once the goods are sold, and they must not be counted in your inventory valuation. Which Inventory setting lets you record the owner of these goods on receipts?", "options": ["Dropshipping", "Packages", "Multi-Step Routes", "Consignment"], "answer": 3, "explanation": "Bật 'Consignment' trong Inventory ‣ Configuration ‣ Settings để nhập trường Owner trên phiếu nhập; hàng có owner khác công ty không được tính vào định giá tồn kho. Dropshipping là giao thẳng từ vendor tới khách, hàng không đi qua kho.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/owned_stock.html"}, {"set": 4, "subject": "Inventory", "question": "When validating a receipt, a warehouse worker wants to see which waiting delivery orders the incoming quantities can be allocated to. Which Inventory setting provides this?", "options": ["Batch, Wave & Cluster Transfers", "Reception Report", "Product Packagings", "Signature"], "answer": 1, "explanation": "'Reception Report' hiển thị báo cáo phân bổ hàng vừa nhận cho các phiếu xuất/MO đang chờ hàng. Batch, Wave & Cluster Transfers chỉ dùng để gom phiếu khi soạn hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/reporting/receptions_report.html"}, {"set": 4, "subject": "Inventory", "question": "In Inventory ‣ Configuration ‣ Settings, the Annual Inventory Day and Month are set to 31 December. What does this setting control?", "options": ["The date on which Odoo automatically applies all counted quantities", "The closing date of the stock valuation journal", "The default scheduled count date for quantities in locations that have no cyclic Inventory Frequency", "The date after which lots without an expiration date are scrapped"], "answer": 2, "explanation": "Annual Inventory Day/Month là ngày kiểm kê mặc định cho hàng nằm ở các location không có chu kỳ đếm (Inventory Frequency). Odoo không tự Apply số đếm; người dùng vẫn phải đếm và Apply.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/count_products.html"}, {"set": 4, "subject": "Manufacturing", "question": "All work orders of a manufacturing order are finished, but nobody has clicked 'Produce All' yet to close the MO. Which state is the MO in?", "options": ["To Close", "In Progress", "Confirmed", "Done"], "answer": 0, "explanation": "Khi mọi work order đã xong (hoặc đã ghi nhận đủ số lượng sản xuất nếu không có work order), MO chuyển sang 'To Close'; chỉ khi bấm Produce All/Produce thì mới sang 'Done'. 'In Progress' là khi mới bắt đầu sản xuất một phần.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/manufacturing_orders.html"}, {"set": 4, "subject": "Manufacturing", "question": "A work center has Capacity = 2, Setup Time = 10 min, Cleanup Time = 5 min and Time Efficiency = 100%. The BoM operation on it has a default duration of 30 min. What is the expected duration of the work order for an MO of 5 units?", "options": ["75 min", "165 min", "90 min", "105 min"], "answer": 3, "explanation": "Số chu kỳ = làm tròn lên 5/2 = 3; thời lượng = setup + cleanup + 3 × 30 = 10 + 5 + 90 = 105 phút. Đáp án 165 phút là tính theo từng đơn vị (5 × 30 + 15), bỏ qua Capacity.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/advanced_configuration/using_work_centers.html"}, {"set": 4, "subject": "Manufacturing", "question": "The BoM of a bicycle (type 'Manufacture this product') contains a 'Wheel Set', which itself has a BoM of type 'Kit'. What happens when an MO for the bicycle is confirmed?", "options": ["A separate MO is created for the Wheel Set", "The Wheel Set's components are listed directly as components of the bicycle MO", "The MO is blocked because kits cannot be used as components", "The Wheel Set is consumed as a single stocked product"], "answer": 1, "explanation": "BoM loại Kit (phantom) được 'nổ' ra: các linh kiện của kit xuất hiện trực tiếp trong danh sách component của MO cha, không tạo MO con. Muốn có MO con thì Wheel Set phải có BoM 'Manufacture this product' kèm route phù hợp.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/advanced_configuration/kit_shipping.html"}, {"set": 4, "subject": "Manufacturing", "question": "A BoM has three operations. Screws must only be consumed during the 'Assembly' operation so they appear on that work order in Shop Floor. What should be set on the screw's BoM line?", "options": ["The 'Apply on Variants' field", "The 'Cost Share (%)' field", "The 'Consumed in Operation' field", "The 'Manufacturing Readiness' field"], "answer": 2, "explanation": "Trường 'Consumed in Operation' trên dòng component gắn linh kiện với một operation cụ thể (cần bật Work Orders). 'Apply on Variants' chỉ lọc theo biến thể, không gắn với operation.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/bill_configuration.html"}, {"set": 4, "subject": "Point of Sale", "question": "A new product was created in the Sales app, but cashiers cannot find it in the Point of Sale. What is the most likely cause?", "options": ["The product has no barcode", "The 'Available in POS' checkbox is not ticked on the product", "The product is not tracked in inventory", "The product has no internal reference"], "answer": 1, "explanation": "Chỉ sản phẩm có tick 'Available in POS' (tab Sales/Point of Sale của sản phẩm) mới được tải vào PoS. Barcode hay internal reference không bắt buộc để sản phẩm hiển thị.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale.html"}, {"set": 4, "subject": "Point of Sale", "question": "A fast-food restaurant sells a 'Burger Menu' where the customer chooses one burger, one side and one drink from predefined lists, for a fixed price. How should this be set up in Odoo 18?", "options": ["Create a 'Kit' bill of materials for the menu", "Create a product with three attributes (burger, side, drink)", "Create a Buy X Get Y loyalty program", "Create a product of type 'Combo' with combo choices for burgers, sides and drinks"], "answer": 3, "explanation": "Odoo 18 có loại sản phẩm 'Combo', mỗi combo choice chứa danh sách sản phẩm để khách chọn; PoS hiện popup để chọn. Dùng attribute chỉ tạo biến thể của một sản phẩm, không trừ kho từng món.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/configuration/combo_products.html"}, {"set": 4, "subject": "Point of Sale", "question": "Cashiers keep changing product prices directly on PoS orders. The manager wants only PoS managers to be able to modify prices. Which setting should be enabled?", "options": ["Price Control (restrict price modification to managers)", "Line Discounts", "Flexible Pricelists", "Set Maximum Difference"], "answer": 0, "explanation": "Setting 'Price Control' (Restrict Price Modifications to Managers) chỉ cho user có quyền Manager PoS sửa giá trên đơn. Set Maximum Difference liên quan chênh lệch tiền mặt khi đóng ca, không phải giá.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/configuration.html"}, {"set": 4, "subject": "Point of Sale", "question": "A furniture shop sells sofas in its store, but they must be delivered to the customer's home a few days later. Which PoS setting allows this?", "options": ["Share Open Orders", "Customer Account payment method", "Allow Ship Later", "Early Receipt Printing"], "answer": 2, "explanation": "'Allow Ship Later' cho phép thu ngân chọn ngày giao trên màn hình thanh toán (cần chọn khách hàng); phiếu giao hàng được tạo theo kho/route đã cấu hình. Customer Account chỉ là ghi nợ thanh toán, không liên quan giao hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/shop/ship_later.html"}, {"set": 5, "subject": "Inventory", "question": "A receipt for 100 units is validated with only 80 units received. The company never wants to wait for the remaining quantities from vendors. Which option on the Receipts operation type avoids being asked each time and creates no backorder?", "options": ["Reservation Method = 'Manually'", "Create Backorder = 'Never'", "Create Backorder = 'Always'", "Shipping Policy = 'As soon as possible'"], "answer": 1, "explanation": "Create Backorder có 3 giá trị Ask / Always / Never; 'Never' sẽ không tạo backorder và phần còn thiếu bị hủy. 'Always' thì ngược lại, luôn tạo backorder mà không hỏi.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_one_step.html"}, {"set": 5, "subject": "Inventory", "question": "A customer orders 3 different products and wants to receive everything in a single shipment, even if some items are available earlier. What should be set on the sales order (Other Info tab)?", "options": ["Delivery Method = 'Free delivery'", "Incoterm = 'DAP'", "Shipping Policy = 'As soon as possible'", "Shipping Policy = 'When all products are ready'"], "answer": 3, "explanation": "Shipping Policy 'When all products are ready' chỉ cho giao khi tất cả sản phẩm đã sẵn sàng (một lần giao). 'As soon as possible' là mặc định, cho giao từng phần ngay khi có hàng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/delivery_policy.html"}, {"set": 5, "subject": "Inventory", "question": "Each pallet rack location must only receive products through putaway rules when the location is completely empty. How is this configured?", "options": ["Create a Storage Category with 'Allow New Product' = 'If the location is empty' and assign it to the rack locations", "Set the rack locations' type to 'View'", "Set the removal strategy of the racks to 'Least Packages'", "Untick 'Is a Scrap Location' on the racks"], "answer": 0, "explanation": "Storage Category có trường 'Allow New Product' với 3 giá trị: If the location is empty / If all products are same / Allow mixed products; putaway rule dùng storage category để chọn vị trí phù hợp. Location loại View thì không chứa hàng được.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/warehouses_storage/advanced_operations_warehouse/storage_category.html"}, {"set": 5, "subject": "Inventory", "question": "Products tracked by lots arrive with lot numbers assigned by the vendor, which must be typed in when receiving. Which option must be enabled on the Receipts operation type?", "options": ["Use Existing Lots/Serial Numbers only", "Move Entire Packages", "Create New Lots/Serial Numbers", "Generate Shipping Labels"], "answer": 2, "explanation": "'Create New Lots/Serial Numbers' cho phép nhập số lô mới khi xử lý phiếu nhập (mặc định bật cho Receipts). 'Use Existing Lots/Serial Numbers' chỉ cho chọn lô đã tồn tại, phù hợp cho phiếu xuất.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/product_tracking/lots.html"}, {"set": 5, "subject": "Inventory", "question": "A customer returns 2 units from a delivery order that is already validated. What happens when the user clicks 'Return' on that delivery and confirms?", "options": ["The original delivery is reset to draft and its quantity is reduced by 2", "A new return transfer is created to bring the 2 units back from the customer location", "A credit note is posted automatically and stock is not affected", "The 2 units are moved directly to the scrap location"], "answer": 1, "explanation": "Nút Return tạo một phiếu chuyển kho mới (dùng 'Operation Type for Returns') đưa hàng từ Partners/Customers về kho; phiếu gốc giữ nguyên trạng thái Done. Credit note phải tạo riêng trong Sales/Accounting.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/returns.html"}, {"set": 5, "subject": "Manufacturing", "question": "Three confirmed manufacturing orders exist for the same product and the same BoM. The planner wants to combine them into a single MO. What should be done?", "options": ["Cancel two MOs and increase the quantity of the third manually", "Use the 'Split' button on one of the MOs", "Select the MOs in the list view and use Actions ‣ Merge", "Create an unbuild order for two of them"], "answer": 2, "explanation": "Action 'Merge' gộp các MO cùng sản phẩm, cùng BoM, cùng trạng thái (Draft hoặc Confirmed) thành một MO với tổng số lượng. 'Split' thì làm ngược lại: chia một MO thành nhiều MO.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/split_merge.html"}, {"set": 5, "subject": "Manufacturing", "question": "Components of a product take several days to be replenished. The company wants manufacturing orders generated by replenishment to be created and confirmed some days in advance. Which BoM field should be used?", "options": ["Days to prepare Manufacturing Order", "Manuf. Lead Time", "Setup Time on the work center", "Security Lead Time for Sales"], "answer": 0, "explanation": "'Days to prepare Manufacturing Order' (tab Miscellaneous của BoM) cho phép tạo và xác nhận MO sớm hơn số ngày đó để kịp bổ sung linh kiện. 'Manuf. Lead Time' là thời gian sản xuất của chính sản phẩm, không phải thời gian chuẩn bị MO.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/advanced_operations_shipping/scheduled_dates.html"}, {"set": 5, "subject": "Manufacturing", "question": "Operators must see assembly instructions from a PDF file while processing a work order in Shop Floor. Where is this configured?", "options": ["As an attachment on the product form", "In the 'Description for Pickings' of the product", "On the work center, in the 'Instructions' field", "On the BoM operation, by setting Worksheet = 'PDF' and uploading the file"], "answer": 3, "explanation": "Mỗi operation trên BoM có trường Worksheet với các loại PDF, Google Slide hoặc Text; tài liệu này hiển thị cho operator trong Shop Floor. File đính kèm trên sản phẩm không được hiển thị trên work order.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/configure_manufacturing_product.html"}, {"set": 5, "subject": "Manufacturing", "question": "A table's BoM uses a semi-finished 'Table Top' that has its own BoM. When the table MO is confirmed, Odoo should automatically create an MO for the Table Top, whatever the stock level. Which routes should be set on the Table Top product?", "options": ["Buy and Replenish on Order (MTO)", "Manufacture and Replenish on Order (MTO)", "Only Manufacture, with a reordering rule Min = 0 / Max = 0", "Resupply Subcontractor on Order"], "answer": 1, "explanation": "Route Manufacture + Replenish on Order (MTO) trên bán thành phẩm sẽ tạo MO con liên kết với MO cha mỗi khi MO cha được xác nhận. Nếu chọn Buy + MTO thì sẽ sinh RFQ thay vì MO.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/advanced_configuration/sub_assemblies.html"}, {"set": 5, "subject": "Point of Sale", "question": "A shop has two PoS: one at the bakery counter, one at the coffee bar. The bakery PoS should only display bakery products. What should be configured on the bakery PoS?", "options": ["Enable 'Restrict Categories' and select the bakery PoS product categories", "Untick 'Available in POS' on all coffee products", "Create a pricelist with only bakery products", "Archive the coffee product category"], "answer": 0, "explanation": "Setting 'Restrict Categories' kèm danh sách PoS Product Categories giới hạn các sản phẩm hiển thị cho từng PoS. Bỏ tick 'Available in POS' sẽ ẩn sản phẩm ở mọi PoS, kể cả quầy coffee.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/configuration.html"}, {"set": 5, "subject": "Point of Sale", "question": "A cashier must be able to apply a 10% discount on the whole order with one button. Which PoS setting should be used?", "options": ["Line Discounts", "Flexible Pricelists", "Global Discounts", "Price Control"], "answer": 2, "explanation": "'Global Discounts' (module pos_discount) thêm nút Discount áp dụng % trên toàn đơn thông qua một discount product, với tỉ lệ mặc định cấu hình được. 'Line Discounts' chỉ cho giảm giá trên từng dòng.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/pricing/discounts.html"}, {"set": 5, "subject": "Point of Sale", "question": "With the default Inventory Management option of Odoo 18 Point of Sale ('In real time'), when are the stock pickings created for PoS orders?", "options": ["Only when the PoS session is closed, as one picking for the whole session", "Only when the order is invoiced", "Once a day by a scheduled action", "As soon as each order is sent to the server, with its own picking"], "answer": 3, "explanation": "Mặc định 'Update quantities in stock' = In real time: mỗi đơn PoS gửi lên server tạo picking riêng. Tùy chọn 'At the session closing' mới gom một picking cho cả ca khi đóng session.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/configuration.html"}, {"set": 5, "subject": "Point of Sale", "question": "A shop wants customers to earn 1 point per $10 spent in the PoS and later exchange their points for rewards. Which Discount & Loyalty program type should be used?", "options": ["Promotions", "Loyalty Cards", "Discount Code", "Coupons"], "answer": 1, "explanation": "Chương trình 'Loyalty Cards' tích điểm cho khách hàng theo số tiền/sản phẩm mua và đổi điểm lấy phần thưởng ở các lần mua sau. 'Promotions' áp dụng giảm giá tức thời trên đơn hiện tại, không tích điểm lâu dài.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/pricing/loyalty.html"}, {"set": 6, "subject": "Inventory", "question": "A warehouse stores a product in packages and wants deliveries to be fulfilled using as few packages as possible. Which removal strategy fits best?", "options": ["Least Packages", "FIFO", "Closest Location", "LIFO"], "answer": 0, "explanation": "Removal strategy 'Least Packages' ưu tiên lấy hàng sao cho dùng ít package nhất. Closest Location chỉ dựa vào thứ tự tên location, không xét số package.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/removal_strategies.html"}, {"set": 6, "subject": "Inventory", "question": "A courier must have the customer sign on a tablet when goods are delivered, and the signature should be printed on the delivery slip. Which Inventory setting enables this?", "options": ["Delivery Methods", "Warnings for Stock", "Reception Report", "Signature"], "answer": 3, "explanation": "Bật 'Signature' trong Inventory ‣ Configuration ‣ Settings sẽ hiện nút Sign trên phiếu giao và in chữ ký lên delivery slip. 'Warnings for Stock' chỉ để hiện cảnh báo khi chọn partner/sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/setup_configuration/signature.html"}, {"set": 6, "subject": "Inventory", "question": "A product recall requires listing every receipt, manufacturing order and delivery in which lot LOT-0042 was involved. What is the quickest way to get this?", "options": ["Inventory ‣ Reporting ‣ Stock, grouped by product", "The Replenishment report", "The 'Traceability' smart button on the lot's form", "The Valuation report filtered on the product"], "answer": 2, "explanation": "Nút 'Traceability' trên form lot/serial mở báo cáo truy xuất toàn bộ các bước di chuyển (nhập, sản xuất, xuất) của lô đó. Báo cáo Stock chỉ cho thấy tồn hiện tại, không có lịch sử.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/product_tracking/lots.html"}, {"set": 6, "subject": "Inventory", "question": "Water bottles are sold individually but also in packs of 6 and cartons of 24, and salespeople should be able to sell by pack. Which setting must be enabled first?", "options": ["Packages", "Product Packagings", "Multi-Step Routes", "Consignment"], "answer": 1, "explanation": "'Product Packagings' cho phép định nghĩa các quy cách đóng gói (6, 24 chai…) trên sản phẩm và dùng chúng trên đơn bán/mua. 'Packages' là bao bì vật lý dùng để chứa hàng khi 'Put in Pack', không phải quy cách bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_an
