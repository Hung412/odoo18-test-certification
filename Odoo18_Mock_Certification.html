d_mrp/inventory/product_management/configure/packaging.html"}, {"set": 6, "subject": "Inventory", "question": "Screws are purchased by the box of 100 but stocked and consumed per unit. With the Units of Measure setting enabled, how should the product be configured?", "options": ["Create two separate products, one per box and one per unit", "Set the Unit of Measure to 'Box of 100' and convert manually on each receipt", "Use a reordering rule with a multiple quantity of 100", "Keep the Unit of Measure in Units and set the Purchase Unit to a 'Box of 100' UoM of the same category"], "answer": 3, "explanation": "Đơn vị mua (Purchase UoM) phải cùng category với đơn vị tồn kho; Odoo tự quy đổi 1 box = 100 units khi nhập kho. Tạo hai sản phẩm riêng sẽ làm sai tồn kho và giá vốn.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/product_management/configure/uom.html"}, {"set": 6, "subject": "Manufacturing", "question": "A confirmed manufacturing order for 100 units must be divided into 4 MOs of 25 units so that several teams can work in parallel. What should be used?", "options": ["The 'Split' action on the MO", "The 'Merge' action", "An unbuild order", "A backorder created at validation"], "answer": 0, "explanation": "Action 'Split' chia một MO (Draft/Confirmed) thành nhiều MO với số lượng tùy chọn. Backorder chỉ được đề xuất khi đóng MO với số lượng sản xuất thiếu, không dùng để chia trước.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/split_merge.html"}, {"set": 6, "subject": "Manufacturing", "question": "When computing the cost of a manufactured product from its BoM, the time spent on operations must be valued at $40 per hour for the CNC machine. Where is this rate configured?", "options": ["On the product form, in the 'Cost' field", "In the 'Cost Share (%)' field on the BoM", "In the 'Cost per hour' field of the CNC work center", "On the operation type 'Manufacturing'"], "answer": 2, "explanation": "'Cost per hour' trên work center được dùng để tính chi phí operation (thời gian × đơn giá) trong giá thành sản phẩm và BoM Overview. 'Cost Share (%)' chỉ phân bổ chi phí cho by-product.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/advanced_configuration/work_center_costs.html"}, {"set": 6, "subject": "Manufacturing", "question": "In Odoo 18, where do you define the 'Manuf. Lead Time' (number of days needed to manufacture a product) used to compute MO scheduled dates?", "options": ["On the product form, Inventory tab", "On the bill of materials, Miscellaneous tab", "On the work center, General Information tab", "In Manufacturing ‣ Configuration ‣ Settings"], "answer": 1, "explanation": "Từ Odoo 18, 'Manuf. Lead Time' (produce_delay) nằm trên BoM, tab Miscellaneous, cùng với 'Days to prepare Manufacturing Order'. Các phiên bản trước đặt trường này trên tab Inventory của sản phẩm.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory/shipping_receiving/advanced_operations_shipping/scheduled_dates.html"}, {"set": 6, "subject": "Manufacturing", "question": "An old press machine works more slowly than standard: every operation on it takes longer than the BoM duration. Which work center field should be adjusted so that expected durations reflect this?", "options": ["OEE Target", "Capacity", "Setup Time", "Time Efficiency"], "answer": 3, "explanation": "'Time Efficiency' (%) điều chỉnh thời lượng dự kiến: thời gian chạy = thời lượng chuẩn × 100 / efficiency, nên efficiency < 100% làm thời gian dài hơn. 'OEE Target' chỉ là chỉ tiêu dùng cho báo cáo, không ảnh hưởng thời lượng.", "ref": "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/advanced_configuration/using_work_centers.html"}, {"set": 6, "subject": "Point of Sale", "question": "A customer brings back an item bought yesterday in the shop. How should the cashier process the refund in the PoS?", "options": ["Add the product with a negative price on a new order", "Open the Orders screen, find the original order, select the line and click 'Refund', then pay back the customer", "Cancel the original order from the backend", "Close the session and create a credit note in Accounting"], "answer": 1, "explanation": "Cách chuẩn là vào màn hình Orders, tìm đơn gốc, chọn số lượng cần trả và bấm Refund; Odoo tạo đơn hoàn trả liên kết với đơn gốc (số lượng âm). Nhập giá âm thủ công sẽ mất liên kết với đơn gốc và sai thống kê.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/shop/refund.html"}, {"set": 6, "subject": "Point of Sale", "question": "A customer confirmed a quotation with a salesperson and comes to the store to pay and collect the goods. How can the cashier load this sales order in the PoS?", "options": ["Click the 'Quotation/Order' button in the PoS and select the sales order", "Scan the quotation's PDF with a barcode scanner", "Use the Customer Account payment method", "Duplicate the sales order as a PoS order from the Sales app"], "answer": 0, "explanation": "Khi cài Sales cùng PoS (module pos_sale), nút 'Quotation/Order' cho phép tải báo giá/đơn bán vào PoS để thanh toán (settle order hoặc trả trước). Customer Account là phương thức ghi nợ, không tải được đơn bán.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/shop/sales_order.html"}, {"set": 6, "subject": "Point of Sale", "question": "A country no longer uses 1-cent coins. Cash payments must be rounded to the nearest 0.05, but card payments must stay exact. How should this be configured?", "options": ["Set the currency rounding to 0.05", "Create a pricelist that rounds prices to 0.05", "Enable Cash Rounding with a 0.05 rounding method and tick 'Only apply rounding on cash'", "Enable Global Discounts"], "answer": 2, "explanation": "Setting 'Cash Rounding' với rounding method 0.05 kèm tùy chọn 'Only apply rounding on cash' chỉ làm tròn khi trả bằng phương thức tiền mặt. Đổi rounding của tiền tệ sẽ ảnh hưởng toàn bộ kế toán và cả thanh toán thẻ.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/pricing/cash_rounding.html"}, {"set": 6, "subject": "Point of Sale", "question": "In a restaurant PoS, guests want to check their bill on paper before paying. Which setting lets the waiter print the bill before payment?", "options": ["Allow Bill Splitting", "Preparation Printers", "Use QR code on ticket", "Early Receipt Printing"], "answer": 3, "explanation": "'Early Receipt Printing' (restaurant) thêm nút in hóa đơn tạm (Bill) trước khi thanh toán. Preparation Printers dùng để in phiếu chế biến cho bếp/bar, không phải hóa đơn cho khách.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/point_of_sale/restaurant/bill_printing.html"}, {"set": 4, "subject": "CRM", "question": "A sales manager wants new leads to be completed automatically with company data (industry, size, address) based on the email address of the lead. Which feature should be enabled?", "options": ["Lead Enrichment, set to enrich all leads automatically (uses IAP credits)", "Lead Mining, with a filter on the lead's email domain", "Visits to Leads, restricted to known email domains", "Partner Autocomplete on the Contacts app only"], "answer": 0, "explanation": "Lead Enrichment (CRM ‣ Configuration ‣ Settings) dùng IAP để bổ sung dữ liệu công ty dựa trên domain email, có thể chọn 'Enrich all leads automatically' hoặc 'Enrich leads on demand only'. Lead Mining tạo lead MỚI chứ không làm giàu lead có sẵn.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/acquire_leads/lead_enrichment.html"}, {"set": 4, "subject": "CRM", "question": "A manager wants a standard list of reasons (e.g. \"Too expensive\", \"Chose a competitor\") that salespeople must choose from when they mark opportunities as lost. Where are these reasons maintained?", "options": ["CRM ‣ Configuration ‣ Tags", "CRM ‣ Configuration ‣ Lost Reasons", "CRM ‣ Configuration ‣ Stages, on the stage's Requirements field", "CRM ‣ Configuration ‣ Activity Types"], "answer": 1, "explanation": "Lý do thua được quản lý ở CRM ‣ Configuration ‣ Lost Reasons và được chọn trong wizard 'Mark Lost'. Tags chỉ dùng để phân loại, không phải danh sách lý do thua.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/pipeline/lost_opportunities.html"}, {"set": 4, "subject": "CRM", "question": "An opportunity has an Expected Revenue of $10,000 and a Probability of 30%. What is its Prorated Revenue in CRM reporting?", "options": ["$7,000", "$10,000", "$3,000", "$13,000"], "answer": 2, "explanation": "Prorated Revenue = Expected Revenue × Probability / 100 = 10.000 × 30% = 3.000. Giá trị $10,000 là Expected Revenue chưa được nhân xác suất."}, {"set": 4, "subject": "CRM", "question": "With Rule-Based Assignment enabled, a manager wants unassigned leads to be distributed to salespeople every day without anyone clicking a button. What should be configured?", "options": ["Enable Predictive Lead Scoring, which assigns leads automatically", "Set the assignment to run \"Manually\" and ask a salesperson to click \"Assign Leads\" daily", "Create an automated email alias on each sales team", "Set Rule-Based Assignment to run \"Repeatedly\" with an interval of 1 day in CRM ‣ Configuration ‣ Settings"], "answer": 3, "explanation": "Rule-Based Assignment có tùy chọn Running: 'Manually' hoặc 'Repeatedly' với tần suất (ví dụ mỗi 1 ngày), khi đó cron tự phân bổ lead. Predictive Lead Scoring chỉ tính xác suất, không phân công lead.", "ref": "https://www.odoo.com/documentation/18.0/applications/sales/crm/track_leads/lead_scoring.html"}, {"set": 5, "subject": "CRM", "question": "In the pipeline Kanban view, how many stars can a salesperson set to indicate the priority of an opportunity in Odoo 18?", "options": ["3 stars (Medium, High, Very High; no star means Low)", "5 stars", "2 stars (High and Very High)", "4 stars, the fourth meaning Urgent"], "answer": 0, "explanation": "Trường Priority của crm.lead có 4 mức: Low (0 sao), Medium, High, Very High, tương ứng tối đa 3 sao. Không có thang 5 sao trong CRM."}, {"set": 5, "subject": "CRM", "question": "A stage called \"On Hold\" should stay in the pipeline but be displayed collapsed in the Kanban view by default. Which stage option is used?", "options": ["Is Won Stage", "Folded in Pipeline", "Requirements", "Archive the stage"], "answer": 1, "explanation": "Tích 'Folded in Pipeline' trên stage để cột đó mặc định được thu gọn trong Kanban. 'Is Won Stage' đánh dấu cơ hội là thắng, còn archive stage sẽ ẩn hẳn cột."}, {"set": 5, "subject": "CRM", "question": "A sales team has an email alias, but the manager wants it to create opportunities only from emails sent by known contacts in the database. Which alias setting should be changed?", "options": ["Accept Emails From: \"Followers only\" and add every customer as a follower of the team", "Accept Emails From: \"Everyone\"", "Accept Emails From: \"Authenticated Partners\"", "Disable the alias and use a website form instead"], "answer": 2, "explanation": "Trên Sales Team, trường 'Accept Emails From' của alias có các giá trị Everyone / Authenticated Partners / Followers only; 'Authenticated Partners' chỉ nhận email từ người gửi đã có contact. 'Everyone' cho phép mọi người gửi tạo cơ hội."}, {"set": 5, "subject": "CRM", "question": "For every new qualified opportunity, a salesperson must schedule the same sequence of activities (call, demo, send proposal). How can these be scheduled in one go in Odoo 18?", "options": ["Duplicate an old opportunity each time to copy its activities", "Create three Activity Types with the \"Default User\" set", "Add the activities to the stage's Requirements field", "Create an Activity Plan in CRM ‣ Configuration ‣ Activity Plans and launch it from the opportunity's activity scheduler"], "answer": 3, "explanation": "Odoo 18 có Activity Plans (CRM ‣ Configuration ‣ Activity Plans) gồm nhiều activity với người phụ trách và hạn, có thể áp dụng một lần cho bản ghi. Activity Type chỉ định nghĩa loại hoạt động đơn lẻ, không lên lịch cả chuỗi."}, {"set": 6, "subject": "CRM", "question": "A salesperson wants to record an internal comment on an opportunity that must NOT be emailed to the customer. Which chatter action should be used?", "options": ["Log note", "Send message", "Schedule activity with the customer as assignee", "Add the customer as a follower and use Send message"], "answer": 0, "explanation": "'Log note' tạo ghi chú nội bộ, không gửi email cho khách hàng (follower bên ngoài). 'Send message' sẽ gửi email đến các follower, bao gồm khách hàng."}, {"set": 6, "subject": "CRM", "question": "When marking an opportunity as lost in Odoo 18, what can the salesperson fill in besides the Lost Reason?", "options": ["The competitor's quotation amount, which updates the expected revenue", "A Closing Note explaining the loss, which is logged in the chatter", "A new expected closing date for a future follow-up", "The name of the salesperson who will reopen it"], "answer": 1, "explanation": "Wizard 'Mark Lost' trong Odoo 18 có Lost Reason và Closing Note (ghi chú tự do được log vào chatter). Wizard không có trường số tiền đối thủ hay ngày đóng mới."}, {"set": 6, "subject": "CRM", "question": "A sales director wants to analyse how many calls, meetings and emails each salesperson has completed on leads and opportunities. Which report should be opened?", "options": ["CRM ‣ Reporting ‣ Pipeline", "CRM ‣ Reporting ‣ Forecast", "CRM ‣ Reporting ‣ Activities", "CRM ‣ Sales ‣ Teams"], "answer": 2, "explanation": "CRM ‣ Reporting ‣ Activities phân tích các hoạt động (call, meeting, email...) theo người phụ trách, loại và ngày. Forecast chỉ phân tích doanh thu dự kiến theo ngày chốt."}, {"set": 6, "subject": "CRM", "question": "From an opportunity, a salesperson clicks the \"Meeting\" smart button and books a demo in the calendar. What is the result?", "options": ["The meeting is only visible in the salesperson's personal calendar with no link to the opportunity", "A new opportunity is created for the meeting", "The opportunity automatically moves to the next stage", "The calendar event is linked to the opportunity and appears in its meeting count and chatter"], "answer": 3, "explanation": "Khi tạo cuộc họp từ smart button 'Meeting', sự kiện Calendar được liên kết với cơ hội (opportunity_id), được đếm trên smart button và ghi vào chatter. Việc đặt lịch không tự động chuyển stage."}, {"set": 4, "subject": "Marketing", "question": "A company sends large newsletters and wants them to go through a different outgoing mail server than regular business emails. Which Email Marketing setting is used?", "options": ["Dedicated Server, then select the mail server for mailings", "Mailing Campaigns", "24H Stat Mailing Reports", "Blacklist Option when Unsubscribing"], "answer": 0, "explanation": "Trong Email Marketing ‣ Configuration ‣ Settings, bật 'Dedicated Server' và chọn Mail Server riêng cho mass mailing. 'Mailing Campaigns' chỉ dùng để nhóm mailing theo chiến dịch.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/email_marketing.html"}, {"set": 4, "subject": "Marketing", "question": "A contact belongs to both the \"Newsletter\" and \"VIP\" mailing lists. A mailing is sent to both lists. How many copies of the mailing does the contact receive?", "options": ["Two, one per mailing list", "One, because Odoo removes duplicate email addresses within the same mailing", "None, because contacts in several lists are skipped", "It depends on the A/B testing percentage"], "answer": 1, "explanation": "Khi gửi một mailing, Odoo loại trùng theo địa chỉ email (seen list), nên người nhận chỉ nhận 1 bản dù có trong nhiều danh sách. Không có chuyện gửi 2 lần theo từng list."}, {"set": 4, "subject": "Marketing", "question": "In a Marketing Automation campaign, which of the following triggers is NOT available for a child activity of an email activity?", "options": ["Mail: not clicked", "Mail: opened", "Mail: forwarded", "Mail: bounced"], "answer": 2, "explanation": "Các trigger email có sẵn là opened / not opened / replied / not replied / clicked / not clicked / bounced. Không có trigger 'forwarded' vì Odoo không theo dõi việc chuyển tiếp email.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation.html"}, {"set": 4, "subject": "Marketing", "question": "An event organiser asks a question \"Company name?\" on registration. For a group booking of 5 tickets, the answer should be asked only once and copied to every attendee. Which option should be set on the question?", "options": ["Limit Attendees on the event", "Mandatory Answer", "Question Type: Text Input", "Ask once per order"], "answer": 3, "explanation": "Trên câu hỏi sự kiện, tùy chọn 'Ask once per order' khiến câu hỏi chỉ hỏi một lần và giá trị được áp cho mọi attendee của đơn đăng ký. 'Mandatory Answer' chỉ bắt buộc trả lời, vẫn hỏi cho từng attendee."}, {"set": 5, "subject": "Marketing", "question": "A marketing manager wants to automatically receive an email summarising the results (opens, clicks, replies) of each mailing one day after it was sent. Which setting should be enabled?", "options": ["24H Stat Mailing Reports", "Mailing Campaigns", "Dedicated Server", "Link Tracker"], "answer": 0, "explanation": "'24H Stat Mailing Reports' trong Email Marketing settings gửi báo cáo thống kê mailing một ngày sau khi gửi. Link Tracker chỉ theo dõi click trên đường link."}, {"set": 5, "subject": "Marketing", "question": "A Marketing Automation campaign targets contacts with the filter \"Country = Belgium\" and is already running. A new Belgian contact is created next week. What happens?", "options": ["Nothing; only records existing at launch time are included", "The contact is automatically added as a participant when the campaign synchronises its participants", "The campaign must be stopped and relaunched to include the new contact", "The contact is added only if it is subscribed to a mailing list"], "answer": 1, "explanation": "Chiến dịch Marketing Automation đang chạy định kỳ (cron) đồng bộ participant, nên bản ghi mới thỏa domain sẽ được thêm vào. Không cần dừng và chạy lại chiến dịch.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/marketing_automation.html"}, {"set": 5, "subject": "Marketing", "question": "Which activity types can be used in an Odoo 18 Marketing Automation workflow (with SMS Marketing installed)?", "options": ["Email, SMS and To-Do activity", "Email, Phone Call and Meeting", "Email, Server Action and SMS", "Server Action, Social Post and Push Notification"], "answer": 2, "explanation": "Activity Type của Marketing Automation gồm Email, Server Action và SMS (khi có module SMS). Không có loại Phone Call/Meeting hay Social Post trực tiếp trong workflow."}, {"set": 5, "subject": "Marketing", "question": "An event has a room for 50 people. Registrations must stop automatically once 50 attendees have registered. What should be configured on the event?", "options": ["Add a reminder in the Communication tab", "Create 50 tickets with a price of zero", "Set the event stage to \"Booked\" after 50 registrations", "Enable \"Limit Attendees\" and set the maximum to 50"], "answer": 3, "explanation": "Bật 'Limit Attendees' với giá trị tối đa 50 thì khi hết chỗ, sự kiện không nhận thêm đăng ký. Stage 'Booked' không chặn đăng ký."}, {"set": 6, "subject": "Marketing", "question": "An SMS mailing contains a link to a promotion page. How does Odoo track clicks on that link?", "options": ["Links in SMS mailings are automatically shortened via the link tracker so clicks are counted per recipient", "SMS links cannot be tracked in Odoo", "The marketer must install Google Analytics on the SMS", "Only if the recipient replies to the SMS"], "answer": 0, "explanation": "SMS Marketing tự động rút gọn link qua Link Tracker, kèm mã thống kê để đếm click theo người nhận. Không cần công cụ ngoài như Google Analytics."}, {"set": 6, "subject": "Marketing", "question": "In Social Marketing, a marketer wants to monitor the posts and comments of a connected Facebook page directly in Odoo. What should be added?", "options": ["A Marketing Automation campaign targeting the page", "A stream on the Feed (e.g. the page's posts)", "A Link Tracker entry for the page URL", "A mailing list for the page followers"], "answer": 1, "explanation": "Trong Social Marketing, vào Feed và thêm Stream (ví dụ 'Page Posts') để theo dõi bài đăng và bình luận của tài khoản đã kết nối. Link Tracker chỉ theo dõi click link.", "ref": "https://www.odoo.com/documentation/18.0/applications/marketing/social_marketing.html"}, {"set": 6, "subject": "Marketing", "question": "A company wants to send web push notifications to visitors of its Odoo website through the Social Marketing app. What must be done first?", "options": ["Enable SMS Marketing and buy IAP credits", "Connect a Facebook page in Social Marketing", "Enable Web Push Notifications in Website ‣ Configuration ‣ Settings", "Add a Newsletter Popup block on the homepage"], "answer": 2, "explanation": "Push notification cần bật 'Enable Web Push Notifications' trong cài đặt Website (dùng Firebase); sau đó tài khoản Push Notifications xuất hiện trong Social Marketing. Kết nối Facebook không liên quan đến push trên website."}, {"set": 6, "subject": "Marketing", "question": "Recipients should be able to add themselves to the blacklist directly from the unsubscribe page of a mailing. Which setting enables this?", "options": ["Dedicated Server", "Mailing Campaigns", "Split First and Last Name", "Blacklist Option when Unsubscribing"], "answer": 3, "explanation": "'Blacklist Option when Unsubscribing' trong Email Marketing settings cho phép người nhận tự quản lý trạng thái blacklist trên trang hủy đăng ký. Các tùy chọn khác không liên quan đến trang unsubscribe."}, {"set": 4, "subject": "Survey", "question": "An HR officer wants respondents to enter their age, and only values between 18 and 65 should be accepted. Which configuration is correct?", "options": ["Question Type \"Numerical Value\" with \"Validate entry\" enabled and minimum 18 / maximum 65", "Question Type \"Scale\" from 18 to 65", "Question Type \"Single Line Text Box\" with a conditional display", "Question Type \"Multiple choice: only one answer\" listing every age"], "answer": 0, "explanation": "Câu hỏi 'Numerical Value' có tùy chọn 'Validate entry' với Minimum/Maximum value để chặn giá trị ngoài khoảng. Kiểu Scale dùng cho thang đánh giá, không phải nhập tuổi."}, {"set": 4, "subject": "Survey", "question": "In a quiz, a multiple choice question should give points only for the right answer. Where are the correct answer and its points defined?", "options": ["On the survey's Options tab, in Required Score (%)", "On the question's answers: tick \"Correct\" and set a Score for that answer", "In the question's Description field", "On the participant's answer record after submission"], "answer": 1, "explanation": "Với survey có scoring, mỗi đáp án gợi ý có cờ 'Correct' và trường 'Score'. Required Score (%) là ngưỡng đậu của cả bài, không xác định đáp án đúng."}, {"set": 4, "subject": "Survey", "question": "Participants of a live session open their browser and type a short code to join. Where do they enter it?", "options": ["On the survey's invitation email reply", "In the Discuss app", "On the /s page of the website, using the survey's Session Code", "In the website's search bar"], "answer": 2, "explanation": "Live session có 'Session Code'; người tham gia vào URL /s (hoặc /s/<code>) để nhập mã và tham gia. Không có cơ chế nhập mã qua Discuss."}, {"set": 5, "subject": "Survey", "question": "A certification should also award a gamification badge to participants who pass it. Which option should be enabled on the survey?", "options": ["Show Session Leaderboard", "Certified Email Template", "Reward quick answers", "Give Badge, then select the certification badge"], "answer": 3, "explanation": "Trên certification, bật 'Give Badge' và chọn badge để tự động trao cho người đậu. 'Certified Email Template' chỉ gửi email kèm chứng chỉ."}, {"set": 5, "subject": "Survey", "question": "A question \"How did you hear about us?\" has several choices, and the respondent may also type a free comment that should count as their answer instead of a choice. Which options are used?", "options": ["\"Show Comments Field\" together with \"Comment is an answer\"", "\"Validate entry\"", "Matrix Type \"Multiple choices per row\"", "Conditional display on the question"], "answer": 0, "explanation": "'Show Comments Field' thêm ô bình luận, và 'Comment is an answer' cho phép bình luận được tính là câu trả lời. 'Validate entry' chỉ dùng kiểm tra định dạng/giới hạn giá trị."}, {"set": 5, "subject": "Survey", "question": "A manager clicks \"Test\" on a survey and answers it to check the flow. What happens to this test participation?", "options": ["It is counted as a normal completed participation", "It is flagged as a test entry and excluded from the survey statistics and results", "It is deleted as soon as the test is finished", "It consumes one of the attempts of the manager's contact"], "answer": 1, "explanation": "Lượt làm qua nút 'Test' được đánh dấu test_entry và bị loại khỏi thống kê/kết quả, cũng không tính vào số lần thử. Vì vậy nó không phải là participation bình thường."}, {"set": 6, "subject": "Survey", "question": "A company sends a survey invitation via the \"Share\" button and wants the personal links to stop working after the end of the month. What should be set in the invitation wizard?", "options": ["The number of attempts allowed", "The survey's time limit in minutes", "The Answer deadline", "The survey's Access Mode set to \"Anyone with the link\""], "answer": 2, "explanation": "Wizard Share/Invite có trường 'Answer deadline' giới hạn thời hạn trả lời cho các link mời. Time limit tính theo phút cho một lần làm bài, không phải hạn chót."}, {"set": 6, "subject": "Survey", "question": "A company wants its certification PDF to use a different design and colour. Where is this chosen?", "options": ["In the website editor's Theme tab", "In Settings ‣ Companies ‣ Document Layout only", "In the Certified Email Template", "In the survey's Certification template field (e.g. Modern Gold, Classic Blue)"], "answer": 3, "explanation": "Trường 'Certification template' trên survey cho chọn các mẫu Modern/Classic với màu Purple, Blue, Gold. Document Layout của công ty không điều khiển mẫu chứng chỉ survey."}, {"set": 6, "subject": "Survey", "question": "Which of the following is NOT a question type available in the Odoo 18 Survey app?", "options": ["File Upload", "Datetime", "Single Line Text Box", "Matrix"], "answer": 0, "explanation": "Odoo 18 Survey có các loại: Multiple choice (một/nhiều đáp án), Multiple Lines Text Box, Single Line Text Box, Numerical Value, Scale, Date, Datetime, Matrix. Không có kiểu 'File Upload' trong bản chuẩn."}, {"set": 4, "subject": "Website", "question": "During a 2-week seasonal promotion, the URL /shop should temporarily send visitors to /summer-sale, then return to normal. Which redirect type fits best?", "options": ["301 Moved permanently", "302 Moved temporarily", "404 Not Found", "308 Redirect / Rewrite"], "answer": 1, "explanation": "302 là chuyển hướng tạm thời, công cụ tìm kiếm giữ URL gốc. 301 báo cho search engine rằng URL đã chuyển vĩnh viễn, không phù hợp cho khuyến mãi ngắn hạn.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/pages/URL_redirection.html"}, {"set": 4, "subject": "Website", "question": "A marketer has customised a block (texts, colours, layout) and wants to reuse it on several other pages. What is the quickest way?", "options": ["Create a new theme", "Copy the HTML from the browser source and paste it into each page", "Save the block as a custom snippet; it then appears in the Custom category of the blocks panel", "Duplicate the whole page each time"], "answer": 2, "explanation": "Trong website editor, có thể lưu một block đã tùy chỉnh (nút Save) thành custom snippet, sau đó kéo-thả lại từ nhóm Custom. Tạo theme mới là quá mức cần thiết."}, {"set": 4, "subject": "Website", "question": "Which privacy-friendly analytics tool can be connected in Odoo 18 Website settings so that statistics are displayed in Website ‣ Reporting ‣ Analytics?", "options": ["Adobe Analytics", "Matomo", "Hotjar", "Plausible"], "answer": 3, "explanation": "Website settings của Odoo 18 hỗ trợ Plausible Analytics (shared link) để xem số liệu trong Website ‣ Reporting ‣ Analytics, bên cạnh Google Analytics. Matomo, Hotjar không có tích hợp sẵn.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/reporting/analytics.html"}, {"set": 4, "subject": "Website", "question": "In a Contact Us form, the field \"Company Name\" should only be shown when the visitor selects \"Business\" in a previous field. How is this done in the website editor?", "options": ["Select the field and set its Visibility to be visible only if the \"Business\" option is selected", "Create two different forms on two pages", "Mark the field as Required", "Hide the field with \"Hidden\" visibility and use a custom JavaScript"], "answer": 0, "explanation": "Form builder của website cho phép đặt Visibility có điều kiện ('Visible only if' một trường khác có giá trị nhất định). Required chỉ bắt buộc nhập, không ẩn/hiện."}, {"set": 5, "subject": "Website", "question": "A new page must go live automatically next Monday at 8:00 without anyone clicking Publish at that time. What should be set?", "options": ["A 302 redirect to the page from the homepage", "The page's Publishing Date in its properties", "The page's Indexed option", "A website visibility \"Signed In\""], "answer": 1, "explanation": "Trang website có trường 'Publishing Date'; trang chỉ hiện công khai từ thời điểm đó. Indexed chỉ ảnh hưởng đến công cụ tìm kiếm."}, {"set": 5, "subject": "Website", "question": "Google requires a verification file before the website can be managed in Google Search Console. How is this handled in Odoo 18?", "options": ["Add the code to robots.txt", "Upload the file through the Documents app", "Enable Google Search Console in Website settings and enter the verification code (HTML file name)", "It is not possible; Search Console requires DNS access only"], "answer": 2, "explanation": "Trong Website ‣ Configuration ‣ Settings bật 'Google Search Console' và nhập mã xác minh (tên file google...html), Odoo sẽ phục vụ file này. Không cần sửa robots.txt.", "ref": "https://www.odoo.com/documentation/18.0/applications/websites/website/configuration/google_search_console.html"}, {"set": 5, "subject": "Website", "question": "A company wants its \"Products\" landing page, instead of the default page, to be shown when visitors open the root URL of the website. What should be done?", "options": ["Move the page to first position in the Menu Editor", "Rename the page to \"Home\"", "Create a 301 redirect from / to the page and delete the old homepage", "Open the page's properties and enable \"Is Homepage\""], "answer": 3, "explanation": "Trong thuộc tính trang (Page Properties) có toggle 'Is Homepage' để đặt trang làm trang chủ. Đổi tên hay sắp xếp menu không đổi trang chủ."}, {"set": 5, "subject": "Website", "question": "A company wants a homepage section that always shows its latest blog posts or products without manual updates. Which building block is designed for this?", "options": ["A dynamic content block (e.g. Blog Posts or Products) with a filter", "A Text-Image block updated weekly", "A Mega Menu", "A Carousel block with static images"], "answer": 0, "explanation": "Các block Dynamic Content (Products, Blog Posts...) tự động lấy bản ghi theo filter và template hiển thị. Text-Image hay Carousel là nội dung tĩnh, cần sửa tay."}, {"set": 6, "subject": "Website", "question": "An administrator wants to reorder the website's top menu items and create a sub-menu under \"Services\". Which tool is used?", "options": ["Website ‣ Configuration ‣ Settings", "The Menu Editor (Site ‣ Menu Editor)", "The Theme tab of the website editor", "Page Properties of the Services page"], "answer": 1, "explanation": "Menu Editor cho phép thêm, sắp xếp (kéo thả) và lồng menu con. Theme tab chỉ thay đổi giao diện (font, màu), không quản lý cấu trúc menu."}, {"set": 6, "subject": "Website", "question": "An administrator wants to see all website pages in a list, check which ones are published, and delete obsolete ones in bulk. Where is this done?", "options": ["Website ‣ Configuration ‣ Settings", "Website ‣ Reporting ‣ Analytics", "Website ‣ Site ‣ Pages", "Settings ‣ Technical ‣ Views"], "answer": 2, "explanation": "Website ‣ Site ‣ Pages hiển thị danh sách các trang (URL, trạng thái publish, indexed...) và cho phép thao tác hàng loạt. Technical ‣ Views là view kỹ thuật, không phải công cụ quản lý trang."}, {"set": 6, "subject": "Website", "question": "A large banner image looks good on desktop but cluttered on smartphones. How can it be hidden only on mobile devices?", "options": ["Change the theme to a mobile theme", "Delete the block and create a separate mobile website", "Set the page's Visibility to \"Signed In\"", "Select the block in the editor and use its visibility option to hide it on mobile"], "answer": 3, "explanation": "Website editor cho phép ẩn/hiện block theo thiết bị (desktop/mobile) qua tùy chọn visibility của block. Không cần website riêng cho mobile."}, {"set": 6, "subject": "Website", "question": "A B2B company only wants customers it has explicitly invited to be able to create a portal account on the website. Which Customer Account option should be selected in Website settings?", "options": ["On invitation", "Free sign up", "Shared Customer Accounts", "Mandatory (no guest checkout)"], "answer": 0, "explanation": "Tùy chọn 'On invitation' chỉ cho phép người được mời (Portal Access) tạo tài khoản, còn 'Free sign up' cho bất kỳ ai đăng ký. Shared Customer Accounts chỉ liên quan đến multi-website."}, {"set": 4, "subject": "eCommerce", "question": "A shop sells products tracked in inventory. When a product is out of stock, customers must not be able to order it, and the shop should show the remaining quantity when fewer than 5 units are left. What should be configured?", "options": ["Archive the product when stock reaches zero", "Disable \"Continue Selling\" for out-of-stock and enable \"Show Available Qty\" only if below 5 units", "Set the product's sales price to zero when out of stock", "Enable \"Prevent Sale of Zero Priced Product\""], "answer": 1, "explanation": "Cài đặt Inventory của website (Out-of-Stock: Continue Selling, Show Available Qty only if below X Units) điều khiển việc bán khi hết hàng và hiển thị tồn; có thể ghi đè trên sản phẩm. Archive sản phẩm là thủ công và làm mất sản phẩm khỏi shop."}, {"set": 4, "subject": "eCommerce", "question": "A shop wants to display a \"New\" or \"Sale\" label on the corner of some product tiles in the shop grid. What is used?", "options": ["An eCommerce category named \"New\"", "A product tag", "A Ribbon set on the product (Ribbon field / editor option)", "An attribute value with an extra price"], "answer": 2, "explanation": "Ribbon (product.ribbon) hiển thị nhãn như 'Sale', 'New' trên ảnh sản phẩm trong shop, chọn trên sản phẩm hoặc trong editor. eCommerce category chỉ phân nhóm, không hiển thị nhãn góc."}, {"set": 4, "subject": "eCommerce", "question": "A T-shirt has a \"Color\" attribute. Customers should pick colours by clicking coloured swatches on the product page. Which attribute setting is needed?", "options": ["eCommerce Filter Visibility: Hidden", "Display Type: Select", "Variant Creation: Never", "Display Type: Color, with an HTML colour on each value"], "answer": 3, "explanation": "Display Type 'Color' hiển thị ô màu, mỗi value cần mã màu HTML. 'Select' hiện dropdown; Filter Visibility chỉ ảnh hưởng bộ lọc sidebar."}, {"set": 5, "subject": "eCommerce", "question": "A shop wants customers to enter a promo code in the cart to get 10% off. Which setting must be enabled first?", "options": ["Discounts, Loyalty & Gift Card", "Pricelists with \"Selectable\" ticked", "Product Reference Price", "Extra Step During Checkout"], "answer": 0, "explanation": "Mã khuyến mãi, coupon, loyalty và gift card cần bật 'Discounts, Loyalty & Gift Card', rồi tạo chương trình có điều kiện mã. Pricelist không áp dụng bằng cách nhập mã ở giỏ hàng."}, {"set": 5, "subject": "eCommerce", "question": "A shop manager wants the /shop page to show 3 columns of products instead of 4, and more products per page. Where is this changed?", "options": ["Website ‣ Configuration ‣ Settings, under Invoicing", "In the website editor on the /shop page, via the layout options (products per page and number of columns)", "On each eCommerce category", "In the product template form"], "answer": 1, "explanation": "Bố cục trang shop (grid/list, số sản phẩm mỗi trang, số cột) được chỉnh trong website editor khi đang ở trang /shop. Category không điều khiển số cột hiển thị."}, {"set": 5, "subject": "eCommerce", "question": "Customers should be able to buy online and pick up their order at one of the company's stores, optionally paying there. What does Odoo 18 provide?", "options": ["A delivery method with Free if order amount is above 0", "A Mondial Relay delivery method", "A \"Pick up in store\" delivery method linked to warehouses, and the \"Pay on site\" payment option", "Shipping connectors such as FedEx"], "answer": 2, "explanation": "Odoo 18 (website_sale_collect) có delivery method loại 'Pick up in store' gắn với warehouse và phương thức thanh toán 'Pay on site'. Mondial Relay là điểm nhận hàng của hãng vận chuyển, không phải cửa hàng của công ty."}, {"set": 6, "subject": "eCommerce", "question": "A shop offers free delivery for orders of $100 or more, otherwise a fixed $8 fee. How is this configured?", "options": ["Create two separate websites", "Create a 100% discount promotion for orders above $100 on all products", "Set the pricelist to subtract $8 above $100", "On a Fixed Price delivery method of $8, tick \"Free if order amount is above\" and set $100"], "answer": 3, "explanation": "Delivery method có tùy chọn 'Free if order amount is above' với ngưỡng; khi tổng đơn (chưa tính ship) ≥ ngưỡng thì phí giao hàng = 0. Giảm 100% sản phẩm sẽ làm hàng miễn phí chứ không phải phí giao hàng."}, {"set": 6, "subject": "eCommerce", "question": "An online shop wants an invoice to be created and marked as paid automatically when an online payment is confirmed. Which setting should be enabled?", "options": ["Automatic Invoice in the Sales settings", "Lock Confirmed Sales", "Extra Step During Checkout", "Abandoned cart emails"], "answer": 0, "explanation": "'Automatic Invoice' (Sales ‣ Configuration ‣ Settings) tạo và đối soát hóa đơn khi giao dịch thanh toán online được xác nhận. 'Lock Confirmed Sales' chỉ khóa đơn đã xác nhận."}, {"set": 6, "subject": "eCommerce", "question": "Returning customers want to quickly buy the same products again from an order they placed before. Which Odoo 18 eCommerce setting helps?", "options": ["Buy Now", "Re-order From Portal", "Wishlists", "Shared Customer Accounts"], "answer": 1, "explanation": "'Re-order From Portal' thêm nút cho phép khách đặt lại các sản phẩm từ đơn cũ trong portal. 'Buy Now' chỉ bỏ qua bước giỏ hàng trên trang sản phẩm."}, {"set": 4, "subject": "Project", "question": "Whenever a task of the 'Website Redesign' project reaches the 'Ready for Review' stage, the customer must automatically receive an informative email (not a satisfaction survey). How is this configured?", "options": ["Set an Email Template on the 'Ready for Review' stage", "Set a Rating Email Template on the 'Ready for Review' stage", "Enable 'Customer Ratings' and choose 'On a periodic basis' on the project", "Add the customer as a follower of the project with the 'Stage Changed' subtype only"], "answer": 0, "explanation": "Trường Email Template trên stage của task sẽ tự động gửi email cho khách hàng khi task vào stage đó. Rating Email Template thì gửi yêu cầu đánh giá (rating), không phải email thông tin thường.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 4, "subject": "Project", "question": "On a task stage, 'Automatic Kanban Status' is enabled and a rating email template is set. A customer replies to the rating request with a neutral (or bad) rating. What happens to the task?", "options": ["Its state is automatically set to 'Approved'", "Its state is automatically set to 'Changes Requested'", "The task is automatically moved back to the previous stage", "The task is automatically set to 'Cancelled'"], "answer": 1, "explanation": "Khi bật Automatic Kanban Status trên stage, đánh giá tốt sẽ chuyển task sang 'Approved' (chấm xanh), còn đánh giá trung lập/xấu sẽ chuyển sang 'Changes Requested' (chấm cam). Odoo không tự đổi stage hay hủy task.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 4, "subject": "Project", "question": "In the kanban view of a project, a user quick-creates a task by typing 'Prepare demo #Marketing @Anna !'. What does Odoo 18 do with this title?", "options": ["Creates a task whose name is the full text, including the # @ ! characters", "Creates the task 'Prepare demo' in the 'Marketing' project and sends Anna an email", "Creates the task 'Prepare demo' with the tag Marketing, assigned to Anna, with high priority", "Creates the task 'Prepare demo' and posts '#Marketing @Anna !' as a note in its chatter"], "answer": 2, "explanation": "Trong Odoo 18, khi tạo nhanh task, '#' thêm tag, '@' gán người phụ trách và '!' đặt độ ưu tiên cao (starred); các ký hiệu này được loại khỏi tên task.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 4, "subject": "Timesheets", "question": "A project manager enables the Timesheets option on an existing project that has no analytic account. What happens?", "options": ["Odoo refuses to save until an analytic account is selected manually", "Timesheets are recorded without any analytic account", "Timesheets are posted on the company's default 'Internal' analytic account", "Odoo automatically creates an analytic account for the project so that timesheets can be recorded"], "answer": 3, "explanation": "Timesheet là analytic line nên project bật Timesheets bắt buộc phải có analytic account; nếu chưa có, Odoo tự tạo khi lưu project. Không cần chọn thủ công và không ghi vào tài khoản 'Internal'.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 4, "subject": "Timesheets", "question": "In a billable project, one specific timesheet entry (an internal training hour) must not be invoiced to the customer, while the other timesheets of the task remain billable. What should be done?", "options": ["Remove the Sales Order Item on that timesheet line, which makes it non-billable", "Uncheck 'Billable' on the project", "Remove the Sales Order Item from the task", "Set the duration of that timesheet to zero"], "answer": 0, "explanation": "Gỡ Sales Order Item trên chính dòng timesheet đó sẽ khiến dòng này thành Non-Billable mà không ảnh hưởng các timesheet khác. Bỏ 'Billable' trên project hoặc gỡ SO item trên task sẽ tác động tới toàn bộ timesheet liên quan.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 4, "subject": "Timesheets", "question": "In the 'My Timesheets' view of the Timesheets app (Odoo 18 Enterprise), which keyboard key starts the timer and, pressed again, stops it?", "options": ["Space", "Enter", "Tab", "Ctrl + S"], "answer": 1, "explanation": "Trong view timesheet có timer, phím Enter dùng để bắt đầu và dừng timer (Escape dùng để hủy timer đang chạy). Các phím còn lại không gắn với timer.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 4, "subject": "HR", "question": "An HR officer archives the record of an employee who is leaving the company. What does Odoo 18 open?", "options": ["A confirmation dialog warning that archived employees are permanently deleted after 30 days", "The employee's contract so that its end date can be filled in before archiving is allowed", "A 'Register Departure' wizard to record the departure reason (e.g. Fired, Resigned, Retired), date and additional information", "Nothing: the record is simply hidden, and departure data must be entered on the Private Information tab"], "answer": 2, "explanation": "Khi archive một nhân viên, Odoo mở wizard Register Departure để nhập Departure Reason (mặc định Fired, Resigned, Retired), ngày nghỉ việc và thông tin bổ sung. Archive không xóa dữ liệu nhân viên.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees/offboarding.html"}, {"set": 4, "subject": "HR", "question": "Employees must be able to request time off for 'Medical Appointment' by the hour (e.g. 2 hours). Which field of the time off type must be set?", "options": ["Time Off Validation: No Validation", "Requires allocation: No Limit", "Kind of Time Off: Worked Time", "Take Time Off in: Hours"], "answer": 3, "explanation": "Trường 'Take Time Off in' trên time off type có các giá trị Day, Half Day và Hours; chọn Hours để cho phép xin nghỉ theo giờ. Các trường khác liên quan đến duyệt và phân bổ, không quyết định đơn vị nghỉ.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 4, "subject": "HR", "question": "A team lead without any Recruitment access rights must be able to see and manage all applicants of the 'Senior Developer' job position (attachments, meetings, refusal). What should be done?", "options": ["Add the team lead to the Interviewers field of the job position", "Give the team lead the Recruitment 'Administrator' right", "Make the team lead a follower of the job position", "Set the team lead as Recruiter on each applicant"], "answer": 0, "explanation": "Người được đặt trong trường Interviewers của job position có thể xem mọi applicant của vị trí đó (tài liệu, lịch hẹn, refuse) mà không cần quyền Recruitment. Cấp quyền Administrator là quá mức cần thiết.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/recruitment.html"}, {"set": 4, "subject": "HR", "question": "Which field on the employee form defines who approves that employee's expense reports, and what is its default value?", "options": ["The 'Coach' field, filled by default with the department manager", "The 'Expense' approver field in the Work Information tab, filled by default with the employee's manager (if that user has Expenses rights)", "The 'Time Off' approver field, which is also used for expenses", "The 'Responsible' field of the expense category, filled by default with the administrator"], "answer": 1, "explanation": "Trường Expense (approver) ở tab Work Information xác định người duyệt chi phí; mặc định lấy user của Manager nếu user đó có quyền Expenses. Coach hay approver Time Off không dùng cho Expenses.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/expenses.html"}, {"set": 4, "subject": "Studio", "question": "With Studio, you want to let users rate the importance of a custom record by clicking on stars in the form and kanban views. Which field type should be added?", "options": ["Selection", "Integer", "Priority", "Tags"], "answer": 2, "explanation": "Field type Priority trong Studio tạo một selection hiển thị bằng widget ngôi sao (priority). Selection thường hay Integer không hiển thị dạng sao mặc định.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 4, "subject": "Studio", "question": "In Studio, you drag a 'One2Many' field onto the form of model A, but Studio displays 'No related many2one fields found'. Why?", "options": ["One2Many fields can only be created on models that have a chatter", "One2Many fields can only be added in developer mode", "Model A already contains a 'Lines' field", "A One2Many field needs an existing Many2one field on the target model that points back to model A"], "answer": 3, "explanation": "One2Many là quan hệ ngược của Many2one, nên phải tạo trước trường Many2one trỏ về model hiện tại trên model đích. Nếu muốn Studio tự tạo model dòng mới thì dùng field 'Lines'.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 4, "subject": "Studio", "question": "When creating a new app or model with Studio, which suggested features are already selected by default?", "options": ["Custom Sorting, Chatter and Archiving", "Contact details, User assignment and Tags", "Pipeline stages, Date & Calendar and Picture", "No features are pre-selected; all must be ticked manually"], "answer": 0, "explanation": "Trong màn hình cấu hình model mới của Studio, Custom Sorting, Chatter và Archiving được tick sẵn; các tính năng khác như Contact details, Pipeline stages phải tự chọn.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 4, "subject": "Studio", "question": "An automation rule must create a reminder activity when a custom 'Claim' record has not been modified for 7 days. Which trigger fits best?", "options": ["On save", "After last update, with a delay of 7 days", "After creation, with a delay of 7 days", "On UI change"], "answer": 1, "explanation": "Trigger 'After last update' chạy sau một khoảng thời gian kể từ lần cập nhật cuối của bản ghi, phù hợp với nhắc nhở khi bản ghi bị bỏ quên. 'After creation' tính từ ngày tạo, không phải lần sửa cuối.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 4, "subject": "Studio", "question": "An approval rule on the 'Confirm' button of purchase orders must only apply to orders with a total above 10,000. How is this achieved?", "options": ["Create a second 'Confirm' button visible only for large orders", "Enable 'Exclusive Approval' on the rule", "Set a condition (domain) on the approval rule, e.g. Total > 10,000", "Set the rule's Step to 2"], "answer": 2, "explanation": "Approval rule có thể có domain điều kiện; khi đó rule chỉ áp dụng cho bản ghi thỏa domain (conditional rule). Exclusive Approval và Step không giới hạn bản ghi áp dụng.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/approval_rules.html"}, {"set": 5, "subject": "Project", "question": "A project sends customer rating requests 'on a periodic basis'. Which of the following is NOT an available Rating Frequency in Odoo 18?", "options": ["Twice a Month", "Quarterly", "Yearly", "Every two years"], "answer": 3, "explanation": "Rating Frequency gồm Daily, Weekly, Twice a Month, Once a Month, Quarterly và Yearly; không có tùy chọn hai năm một lần.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 5, "subject": "Project", "question": "Which of the following is NOT one of the task states available in Odoo 18 Project?", "options": ["Blocked", "Changes Requested", "Approved", "In Progress"], "answer": 0, "explanation": "Trạng thái task trong Odoo 18 gồm In Progress, Changes Requested, Approved, Waiting, Done và Cancelled. 'Blocked' là kanban state cũ (đỏ) của các phiên bản trước, nay được thay bằng các state mới.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 5, "subject": "Project", "question": "A user adds a new stage 'QA' directly from the kanban view of the 'Mobile App' project. Another project also needs this exact stage. What is the correct way to share it?", "options": ["Stages are global: 'QA' is already visible in every project", "Open the stage in Project ‣ Configuration ‣ Task Stages (developer mode) and add the other project in its Projects field", "Duplicate the 'Mobile App' project, which is the only way to reuse stages", "Stages cannot be shared; a new 'QA' stage must be created in the other project"], "answer": 1, "explanation": "Stage tạo từ kanban của một project chỉ được gắn với project đó; một stage có thể dùng chung bằng cách thêm các project vào trường Projects của stage (menu Task Stages, cần developer mode).", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 5, "subject": "Timesheets", "question": "The 'Billing Rate Leaderboard' is enabled in the Timesheets settings. What must be set for each employee so that their billing rate can be computed?", "options": ["An Hourly Cost on the employee form", "A Sales Price on the employee's related user", "A Billing Time Target on the employee form", "A Working Schedule with flexible hours"], "answer": 2, "explanation": "Billing rate = thời gian billable / Billing Time Target, nên phải nhập Billing Time Target trên hồ sơ nhân viên (người có quyền Approver). Hourly Cost dùng để tính chi phí, không dùng cho leaderboard.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 5, "subject": "Timesheets", "question": "A parent task has 10 hours of Allocated Time. 2 hours are logged on the parent task itself and 4 hours on its sub-task (which has no allocated time). What progress is shown on the parent task?", "options": ["20%", "40%", "0%, because sub-task hours are excluded", "60%"], "answer": 3, "explanation": "Tiến độ của task cha = (giờ trên task + giờ của sub-task) / Allocated Time = (2 + 4) / 10 = 60%. Giờ của sub-task được cộng dồn vào task cha.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 5, "subject": "Timesheets", "question": "In Odoo 18 Timesheets, when can the Employee Reminder be scheduled to remind employees to fill in their timesheets?", "options": ["A number of days after the end of the week or after the end of the month", "Every day at a chosen hour", "Only on the last working day of each month", "A number of days before the end of each week"], "answer": 0, "explanation": "Employee Reminder cho phép chọn số ngày sau khi kết thúc tuần ('after the end of the week') hoặc kết thúc tháng ('after the end of the month'). Không có lịch nhắc hằng ngày.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 5, "subject": "HR", "question": "Employees may take up to 3 more days of 'Paid Time Off' than they were allocated, their balance becoming negative. How is this configured on the time off type?", "options": ["Set 'Requires allocation' to 'No Limit'", "Enable 'Allow Negative Cap' and set the Maximum Excess Amount to 3", "Create an extra allocation of 3 days valid for all employees", "Enable 'Extra Days Requests Allowed'"], "answer": 1, "explanation": "Allow Negative Cap cho phép số dư âm, giới hạn bởi Maximum Excess Amount (phải lớn hơn 0). 'No Limit' bỏ hoàn toàn giới hạn, không khống chế ở 3 ngày.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 5, "subject": "HR", "question": "For 'Sick Time Off', employees must be able to attach a medical certificate to their request. Which option should be enabled on the time off type?", "options": ["Is Unpaid", "Public Holiday Included", "Supporting Document", "Allow Negative Cap"], "answer": 2, "explanation": "Bật Supporting Document trên time off type để nhân viên có thể đính kèm tài liệu chứng minh (ví dụ giấy khám bệnh) vào đơn nghỉ. Các tùy chọn khác không liên quan đến file đính kèm.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/time_off.html"}, {"set": 5, "subject": "HR", "question": "Employees record expenses by sending receipts to the expenses email alias. An email arrives, but no expense is created for any employee. What is the most likely cause?", "options": ["The employee has no bank account set on their private information", "The expense category is not set to 'Paid by Company'", "The employee does not have the Expenses 'Administrator' right", "The sender's email address does not match the work email of an employee (or the email of their related user)"], "answer": 3, "explanation": "Khi nhận email, Odoo tìm nhân viên theo địa chỉ người gửi (work email hoặc email của user liên kết); nếu không khớp thì không tạo expense cho nhân viên nào. Tài khoản ngân hàng hay quyền Administrator không phải điều kiện.", "ref": "https://www.odoo.com/documentation/18.0/applications/finance/expenses.html"}, {"set": 5, "subject": "HR", "question": "Employees often forget to check out in the Attendances app. The company wants them to be checked out automatically based on their working schedule plus 2 hours. Which setting should be used?", "options": ["Automatic Check-Out, with a tolerance of 2 hours", "Tolerance Time In Favor Of Employee, set to 2 hours", "Absence Management", "Kiosk Mode with a 2-hour Display Time"], "answer": 0, "explanation": "Automatic Check-Out tự động check-out nhân viên theo lịch làm việc cộng với Tolerance (giờ); không áp dụng cho lịch làm việc linh hoạt. Tolerance In Favor Of Employee chỉ dùng cho tính giờ làm thêm.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/attendances.html"}, {"set": 5, "subject": "Studio", "question": "A custom 'Delivery Report' model must allow the customer to sign the record directly on the form view. Which Studio field type should be used?", "options": ["Image", "Signature", "File", "Html"], "answer": 1, "explanation": "Field type Signature của Studio tạo trường binary với widget chữ ký để ký trực tiếp trên form. Image/File chỉ để tải ảnh hoặc tệp lên.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/fields.html"}, {"set": 5, "subject": "Studio", "question": "Users want to select several records in a list view and change the 'Responsible' field of all of them in one operation. Which list view property should be enabled in Studio?", "options": ["Show link to record", "Default Group By", "Enable Mass Editing", "When Creating Record: Add record on top"], "answer": 2, "explanation": "Enable Mass Editing (multi_edit) cho phép chọn nhiều dòng và sửa một trường cho tất cả cùng lúc. 'Add record on top' chỉ làm list editable khi tạo mới.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 5, "subject": "Studio", "question": "In a list view edited with Studio, the 'Amount' column must show its total at the bottom of the list. What should be done?", "options": ["Add a Related field computing the total", "Set the list's Default Group By on the Amount field", "Change the field type from Monetary to Integer", "Select the column and set its Aggregate property to Sum"], "answer": 3, "explanation": "Trong Studio, chọn cột số trong list và đặt thuộc tính Aggregate là Sum (hoặc Average) để hiển thị tổng ở cuối danh sách. Group by không tạo tổng cho toàn danh sách theo cách này.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 5, "subject": "Studio", "question": "An automation rule with the trigger 'On incoming message' cannot be saved on a custom model created with Studio. What is the most likely reason?", "options": ["The model has no chatter (it does not support messaging)", "The model has no 'Pipeline stages' feature", "The trigger requires the 'On webhook' option to be enabled first", "Message triggers are only available in developer mode"], "answer": 0, "explanation": "Các trigger dựa trên email (On incoming/outgoing message) chỉ dùng được cho model có tính năng thảo luận (mail thread/chatter). Model tạo bằng Studio không bật Chatter sẽ bị báo lỗi.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/automated_actions.html"}, {"set": 5, "subject": "Studio", "question": "On the 'Validate' button of a custom model, two approval rules are defined: the team leader must approve first, and only then the finance director. Which approval rule setting enforces this order?", "options": ["Exclusive Approval on both rules", "The Step of each rule (Step 1 for the team leader, Step 2 for the finance director)", "Users to Notify on the first rule", "A different Approval Group on each rule; groups are always processed alphabetically"], "answer": 1, "explanation": "Trường Step (thứ tự) xác định thứ tự tuần tự yêu cầu phê duyệt giữa các rule. Exclusive Approval chỉ ngăn một người duyệt nhiều rule trên cùng bản ghi.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/approval_rules.html"}, {"set": 6, "subject": "Project", "question": "A project manager wants to define key milestones on a project and link tasks to them, but the Milestones tab is missing. What must be done first?", "options": ["Set the project's invoicing policy to 'Based on Milestones'", "Install the Planning app", "Enable 'Milestones' in Project ‣ Configuration ‣ Settings", "Enable 'Project Stages' in Project ‣ Configuration ‣ Settings"], "answer": 2, "explanation": "Tính năng Milestones phải được bật trong Project Settings thì mới tạo được milestone và gắn task. Chính sách hóa đơn 'Based on Milestones' là của sản phẩm, chỉ dùng sau khi đã có milestone.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 6, "subject": "Project", "question": "A task must be handled jointly by two developers, and both must see it in their 'My Tasks'. How is this done in Odoo 18?", "options": ["Create a sub-task for the second developer; only one assignee is allowed per task", "Add the second developer as a follower of the task", "Duplicate the task and assign each copy to one developer", "Add both users in the task's Assignees field"], "answer": 3, "explanation": "Trường Assignees của task là many2many nên có thể gán nhiều người; task sẽ hiển thị trong My Tasks của từng người. Follower chỉ nhận thông báo, không được coi là người được giao.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 6, "subject": "Project", "question": "A recurring task 'Quarterly VAT review' must be recreated every three months. How should its recurrence be configured?", "options": ["Repeat Every 3 Months", "Repeat Every 1 Quarter", "Repeat Every 90 Weeks", "Repeat Every 12 Days"], "answer": 0, "explanation": "Đơn vị lặp lại của recurring task gồm Days, Weeks, Months và Years; không có đơn vị Quarter, nên cần đặt 3 Months.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/project.html"}, {"set": 6, "subject": "Timesheets", "question": "In a project with Timesheets enabled, a user quick-creates a task by typing 'Write user guide 5h' in the kanban view. What does Odoo 18 do?", "options": ["Creates the task and logs a 5-hour timesheet on it", "Creates the task 'Write user guide' with 5 hours of Allocated Time", "Creates the task with a deadline in 5 hours", "Creates the task named 'Write user guide 5h' without any other change"], "answer": 1, "explanation": "Khi tạo nhanh task, cú pháp số + 'h' (ví dụ 5h) được hiểu là Allocated Time và bị loại khỏi tên task. Odoo không tự tạo timesheet hay deadline.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 6, "subject": "Timesheets", "question": "Which view of the Timesheets app lets employees enter their hours in a table with one line per project/task and one column per day of the week?", "options": ["Pivot view", "Kanban view", "Grid view", "Calendar view"], "answer": 2, "explanation": "Grid view (mặc định ở My Timesheets) hiển thị bảng mỗi dòng là project/task, mỗi cột là một ngày để nhập giờ trực tiếp. Pivot chỉ dùng để phân tích, không để nhập liệu.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 6, "subject": "Timesheets", "question": "A timesheet approver wants to quickly find and validate the timesheets of the previous period. Which menu is used?", "options": ["Timesheets ‣ Reporting ‣ by Employee", "Timesheets ‣ Configuration ‣ Settings", "Project ‣ Reporting ‣ Tasks Analysis", "Timesheets ‣ To Validate (e.g. 'Last Period')"], "answer": 3, "explanation": "Menu To Validate (với các mục như Last Period, All Timesheets) liệt kê timesheet chờ duyệt để người duyệt bấm Validate. Các menu Reporting chỉ dùng để phân tích.", "ref": "https://www.odoo.com/documentation/18.0/applications/services/timesheets.html"}, {"set": 6, "subject": "HR", "question": "A company wants employees to be able to update their own data (e.g. private address) from their profile without HR intervention. Which Employees setting should be enabled?", "options": ["Employee Editing", "Advanced Presence Control", "Skills Management", "Remote Work"], "answer": 0, "explanation": "Employee Editing (trong Employees ‣ Configuration ‣ Settings) cho phép nhân viên tự cập nhật dữ liệu của mình. Advanced Presence Control liên quan đến cách xác định trạng thái có mặt.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/employees.html"}, {"set": 6, "subject": "HR", "question": "In the Appraisals app, a manager tracks an employee's goal 'Obtain the PMP certification'. Which progress values can be selected on a goal?", "options": ["Any percentage between 0 and 100", "0%, 25%, 50%, 75%, 100%", "Not Started, In Progress, Done", "1 to 5 stars"], "answer": 1, "explanation": "Trường Progress của goal trong Appraisals là selection với các mức 0%, 25%, 50%, 75% và 100%. Không thể nhập phần trăm tùy ý.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/appraisals.html"}, {"set": 6, "subject": "HR", "question": "During an appraisal, a manager is writing their feedback and does not want the employee to read it before it is finished. What should the manager do?", "options": ["Cancel the appraisal and recreate it later", "Remove the employee from the appraisal's followers", "Switch off the toggle of the manager's feedback so that it shows 'Not Visible to Employee'", "Move the feedback into the private notes of the employee form"], "answer": 2, "explanation": "Phần feedback của manager có toggle hiển thị; tắt nó để feedback ở trạng thái 'Not Visible to Employee' cho đến khi bật lại. Gỡ follower không ẩn nội dung feedback trên form.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/appraisals.html"}, {"set": 6, "subject": "HR", "question": "Extra hours recorded in Attendances must not be counted until the employee's manager has checked them. Which setting should be used?", "options": ["Extra Hours Validation: Automatically Approved", "Tolerance Time In Favor Of Company", "Automatic Check-Out", "Extra Hours Validation: Approved by Manager"], "answer": 3, "explanation": "Thiết lập Extra Hours Validation có hai giá trị Automatically Approved và Approved by Manager; chọn Approved by Manager để giờ làm thêm phải được quản lý duyệt. Tolerance chỉ bỏ qua các khoảng thời gian nhỏ.", "ref": "https://www.odoo.com/documentation/18.0/applications/hr/attendances.html"}, {"set": 6, "subject": "Studio", "question": "When creating a new model with Studio, which suggested feature adds start/end date fields and lets you visualize the records in a Gantt chart?", "options": ["Date range & Gantt", "Date & Calendar", "Pipeline stages", "Custom Sorting"], "answer": 0, "explanation": "Tùy chọn Date range & Gantt tạo trường ngày bắt đầu/kết thúc và Gantt view. Date & Calendar chỉ thêm một trường ngày và Calendar view.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 6, "subject": "Studio", "question": "In a multi-company database, records of a new Studio model must each belong to one company and be restricted to users of that company. Which suggested feature should be selected when creating the model?", "options": ["Contact details", "Company", "User assignment", "Archiving"], "answer": 1, "explanation": "Tùy chọn Company thêm trường company và các quy tắc truy cập (record rule) đa công ty tương ứng. User assignment chỉ thêm người phụ trách.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/models_modules_apps.html"}, {"set": 6, "subject": "Studio", "question": "In Studio, an administrator wants to edit the XML of a view directly, or use 'Restore Default View' to discard all Studio changes on it. What is required for these buttons to appear in the view's sidebar?", "options": ["The view must first be exported with Studio's Export", "The user must be in the 'Technical Features' group of the Studio app only", "Developer mode must be activated", "Nothing: they are always visible in the Studio sidebar"], "answer": 2, "explanation": "Các nút More, XML, Default Values và Restore Default View trong sidebar của view editor chỉ hiện khi bật developer mode. Export không liên quan.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/views.html"}, {"set": 6, "subject": "Studio", "question": "You export your Studio customizations to install them in a new database, and the records of your custom 'Equipment Type' model must be exported too. What should be done in the Studio export wizard?", "options": ["Nothing: all records of all custom models are always exported", "Export the records separately with Import/Export; Studio export cannot contain data", "Enable 'Include Demo Data' only", "Enable 'Include Data' and select the model(s) whose records must be exported"], "answer": 3, "explanation": "Wizard export của Studio có tùy chọn Include Data để chọn thêm model và bản ghi cần xuất kèm customizations. Include Demo Data chỉ đánh dấu dữ liệu là demo, không thay thế việc chọn dữ liệu.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio.html"}, {"set": 6, "subject": "Studio", "question": "On an approval rule, the sales director must be informed (without having to approve) each time the step is approved or rejected. Which field should be used?", "options": ["Users to Notify", "Approvers", "Exclusive Approval", "Approval Group"], "answer": 0, "explanation": "Users to Notify nhận thông báo (internal note) khi bước được duyệt hoặc từ chối mà không cần tham gia phê duyệt. Approvers/Approval Group là những người có quyền duyệt.", "ref": "https://www.odoo.com/documentation/18.0/applications/studio/approval_rules.html"}];
// Đề 1–3: đầy đủ như đề thật; Đề 4–6: rút gọn một nửa (số câu, thời gian, điểm đạt)
const FORMATS = [
  {key:"full", name:"Đề đầy đủ", sets:[1,2,3], minutes:90, note:"Đúng thể lệ đề thật."},
  {key:"half", name:"Đề rút gọn", sets:[4,5,6], minutes:45, note:"Một nửa số câu, thời gian và số điểm cần đạt."}
];
const fmtOf = n => FORMATS.find(f=>f.sets.includes(n)) || FORMATS[0];
const durOf = n => fmtOf(n).minutes*60; // giây
const PASS = 0.70;
const SUBJECT_ORDER = ["Website","eCommerce","Survey","Marketing","CRM","Sales","Purchase","Project","Timesheets","Accounting","Inventory","Manufacturing","HR","Spreadsheet","Point of Sale","Studio"];
const KEYS = "ABCD";
const app = document.getElementById("app");
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60), x = s%60; return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"); };
const num = n => (Math.round(n*10)/10).toLocaleString("vi-VN");
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const setQs = n => QBANK.map((q,i)=>({...q,id:i})).filter(q=>q.set===n);
// Khóa ổn định cho từng câu (băm nội dung câu hỏi) để lịch sử vẫn mở lại đúng câu dù thứ tự QBANK thay đổi
const qkey = q => { let h = 5381; for(const ch of q.question) h = (h*33 ^ ch.codePointAt(0)) >>> 0; return h.toString(36); };
const KIDX = new Map(QBANK.map((q,i)=>[qkey(q), i]));
const dtfmt = t => new Date(t).toLocaleString("vi-VN", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});

let S = null;      // trạng thái bài thi đang làm
let tick = null;

/* ================= START ================= */
function renderStart(){
  clearInterval(tick);
  const saved = store.get("o18_active");
  const opt = store.get("o18_opts") || {shufQ:true, shufO:true};
  const subs = SUBJECT_ORDER.filter(s => QBANK.some(q=>q.subject===s));
  let html = `<div class="wrap start">
    <div class="hero">
      <span class="label">Đề thi thử · Odoo 18.0</span>
      <h1>Odoo 18 Functional Certification — luyện thi</h1>
      <p>Mô phỏng đúng thể lệ kỳ thi chứng chỉ chức năng Odoo 18: 125 câu, 1,5 giờ, có điểm trừ khi trả lời sai. Thêm 3 đề rút gọn 45 phút để luyện nhanh. Câu hỏi bằng tiếng Anh như đề thật; sau khi nộp bài bạn sẽ thấy thống kê theo phân hệ và lời giải thích từng câu bằng tiếng Việt.</p>
    </div>
    <div class="rules">
${FORMATS.map(f=>{ const n=setQs(f.sets[0]).length; return `<div><span class="label">${f.name}</span><b>${n} câu · ${f.minutes}′</b><span class="label" style="text-transform:none;letter-spacing:0">Đạt từ ${num(n*PASS)} điểm</span></div>`; }).join("")}
      <div><span class="label">Trả lời đúng</span><b class="plus">+1</b></div>
      <div><span class="label">Trả lời sai</span><b class="minus">−0,5</b></div>
      <div><span class="label">Bỏ trống</span><b>0</b></div>
      <div><span class="label">Điểm đạt</span><b>≥ 70%</b></div>
    </div>`;
  if(saved && saved.end > Date.now()){
    const a = Object.keys(saved.ans).length;
    html += `<div class="resume"><div><b>Bạn đang làm dở Đề ${saved.set}</b> · đã trả lời ${a}/${saved.order.length} câu · còn ${fmt((saved.end-Date.now())/1000)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="discard">Bỏ bài này</button><button class="btn primary" id="resume">Làm tiếp</button></div></div>`;
  } else if(saved){ finish(saved, true); return; }
  html += `<div class="opts">
      <label><input type="checkbox" id="shufQ" ${opt.shufQ?"checked":""}> Xáo trộn thứ tự câu hỏi</label>
      <label><input type="checkbox" id="shufO" ${opt.shufO?"checked":""}> Xáo trộn thứ tự đáp án</label>
      <button class="btn" id="histbtn" style="margin-left:auto">Lịch sử làm bài (${(store.get("o18_hist")||[]).length})</button>
    </div>`;
  for(const f of FORMATS){
  html += `<div class="sec"><div><h2 style="font-size:22px">${f.name}</h2><span style="color:var(--muted);font-size:14px">${f.note}</span></div><div class="sets">`;
  for(const n of f.sets){
    const qs = setQs(n);
    const h = (store.get("o18_hist")||[]).filter(r=>r.set===n);
    const best = h.length ? h.reduce((a,b)=>b.pct>a.pct?b:a) : null;
    html += `<div class="set">
      <span class="label">Bộ đề</span><h2>Đề số ${n}</h2>
      <div class="meta"><span>${qs.length} câu</span><span>${f.minutes} phút</span><span>Đạt ≥ ${num(qs.length*PASS)} điểm</span><span>${new Set(qs.map(q=>q.subject)).size} phân hệ</span></div>
      <div class="hist">${best ? `Đã thi ${h.length} lần · tốt nhất <span class="${best.pct>=PASS*100?"pass":"fail"}">${num(best.pct)}%</span>` : "Chưa thi lần nào"}</div>
      <button class="btn primary" data-start="${n}" ${qs.length?"":"disabled"}>Bắt đầu Đề ${n}</button>
    </div>`;
  }
  html += `</div></div>`;
  }
  html += `
    <div class="sec"><span class="label">Phạm vi kiến thức (theo đề thật)</span><div class="subjects">${subs.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div></div>
    <p class="foot">Đề luyện tập tự soạn dựa trên tài liệu Odoo 18.0 (odoo.com/documentation/18.0) và khóa eLearning; không phải đề thi chính thức và không liên kết với Odoo S.A. Tiến độ bài làm chỉ được lưu trong trình duyệt này.</p>
  </div>`;
  app.innerHTML = html;
  const saveOpt = () => store.set("o18_opts",{shufQ:document.getElementById("shufQ").checked, shufO:document.getElementById("shufO").checked});
  app.querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=saveOpt);
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{ saveOpt(); startExam(+b.dataset.start); });
  const r = document.getElementById("resume"); if(r) r.onclick=()=>{ S = saved; renderExam(); };
  const d = document.getElementById("discard"); if(d) d.onclick=()=>{ store.del("o18_active"); renderStart(); };
  document.getElementById("histbtn").onclick = () => renderHistory();
}

function startExam(n){
  const opt = store.get("o18_opts") || {shufQ:true, shufO:true};
  let qs = setQs(n);
  if(opt.shufQ) qs = shuffle(qs);
  S = { set:n, start:Date.now(), end:Date.now()+durOf(n)*1000,
        order: qs.map(q=>q.id),
        perm: Object.fromEntries(qs.map(q=>[q.id, opt.shufO ? shuffle([0,1,2,3]) : [0,1,2,3]])),
        ans:{}, flags:{}, cur:0 };
  save(); renderExam();
}
const save = () => S && store.set("o18_active", S);

/* ================= EXAM ================= */
function renderExam(){
  app.innerHTML = `
  <div class="bar"><div class="wrap">
    <div class="title">Odoo 18 Certification · Đề ${S.set} · ${fmtOf(S.set).name}</div>
    <div class="timer" id="timer" aria-live="off">${fmt(durOf(S.set))}</div>
    <button class="btn primary" id="submit">Nộp bài</button>
  </div><div class="progress"><i id="prog"></i></div></div>
  <div class="wrap exam">
    <div class="qcard" id="qcard"></div>
    <aside class="rail">
      <div class="counts">
        <div><b id="cA">0</b><span>Đã trả lời</span></div>
        <div><b id="cU">0</b><span>Chưa trả lời</span></div>
        <div><b id="cF">0</b><span>Đánh dấu</span></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i style="background:var(--accent);border-color:var(--accent)"></i>Đã trả lời</span><span><i></i>Chưa trả lời</span><span><i style="background:var(--warn);border-color:var(--warn);border-radius:50%"></i>Xem lại</span></div>
      <div class="kbd">Phím tắt: A–D chọn · ← → chuyển câu · F đánh dấu · Del xóa</div>
    </aside>
  </div>`;
  document.getElementById("submit").onclick = confirmSubmit;
  const grid = document.getElementById("grid");
  grid.innerHTML = S.order.map((_,i)=>`<button data-i="${i}" aria-label="Câu ${i+1}">${i+1}</button>`).join("");
  grid.onclick = e => { const b = e.target.closest("button"); if(b){ S.cur=+b.dataset.i; save(); drawQ(); } };
  drawQ();
  clearInterval(tick); tick = setInterval(updTimer, 500); updTimer();
}
function updTimer(){
  const left = (S.end - Date.now())/1000;
  const t = document.getElementById("timer"); if(!t) return;
  t.textContent = fmt(left); t.classList.toggle("low", left < 300);
  if(left <= 0){ clearInterval(tick); finish(S, true); }
}
function drawQ(){
  const id = S.order[S.cur], q = QBANK[id], p = S.perm[id], a = S.ans[id];
  document.getElementById("qcard").innerHTML = `
    <div class="qhead"><span class="label">Câu ${S.cur+1} / ${S.order.length}</span>
      <button class="btn flagbtn ${S.flags[id]?"on":""}" id="flag">${S.flags[id]?"Đã đánh dấu":"Đánh dấu xem lại"}</button></div>
    <p class="qtext">${esc(q.question)}</p>
    <div class="choices" role="radiogroup">${p.map((o,k)=>`
      <label class="choice ${a===o?"sel":""}"><input type="radio" name="c" id="c${k}" value="${o}" ${a===o?"checked":""}>
      <span class="key">${KEYS[k]}</span><span>${esc(q.options[o])}</span></label>`).join("")}</div>
    <div class="qnav">
      <div class="grp"><button class="btn" id="prev" ${S.cur===0?"disabled":""}>← Câu trước</button>
        <button class="btn" id="clear" ${a===undefined?"disabled":""}>Xóa lựa chọn</button></div>
